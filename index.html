,"Lejos, casi nada."],[60,"Más cerca, se nota."],[100,"Muy cerca del choque, fuertísima."]]},{"t":"Gracias, amiga onda.","s":"oido"},{"t":"Dicho de otro modo:","s":"oido"},{"t":"Las masas aceleradas producen ondas en el espacio-tiempo, detectadas en 2015.","s":"oido"}]},{"id":"tiempograv","t":"Gravedad y tiempo","res":"Cerca de una gran masa, el tiempo va más lento.","g":[{"t":"Gravedad y tiempo"},{"t":"Estás de pie, muy tranquilo.","s":"@tiempog"},{"t":"Hola, amigo tiempo. ¿Vas igual en mis pies y en mi cabeza?","s":"@tiempog"},{"t":"No, amigo. En tus pies voy un poquito más lento.","s":"@tiempog"},{"t":"Cerca de un hoyo negro, una hora podrían ser años aquí.","s":"@hoyo"},{"tipo":"barra","b":"tiempog","o":"Te acercas a la masa.","pasos":[[20,"Lejos, tu reloj va casi normal."],[70,"Cerca, más lento."],[100,"Muy cerca, muchísimo más lento."]]},{"t":"Gracias, amigo tiempo.","s":"@hoyo"},{"t":"Dicho de otro modo:","s":"@hoyo"},{"t":"La gravedad hace que el tiempo pase más lento cerca de grandes masas.","s":"@hoyo"}]},{"id":"cmb","t":"El eco del Big Bang","res":"Aún hay luz muy vieja llegando de todas partes.","g":[{"t":"El eco del Big Bang"},{"t":"Una luz muy antigua te llega, de todos lados.","s":"@expansion"},{"t":"Hola, amiga luz. ¿De cuándo eres?","s":"@expansion"},{"t":"De casi el principio, amigo. Me he estirado muchísimo.","s":"@expansion"},{"t":"Una parte de mí estaba en la estática de las teles antiguas.","s":"ic:television-simple"},{"t":"Gracias, amiga luz.","s":"ic:television-simple"},{"t":"Dicho de otro modo:","s":"ic:television-simple"},{"t":"La radiación de fondo es luz del universo temprano, estirada por la expansión.","s":"ic:television-simple"}]},{"id":"inflacion","t":"La inflación cósmica","res":"Muy al inicio, el universo creció de golpe.","g":[{"t":"La inflación cósmica"},{"t":"Inflas un globo en menos de un parpadeo.","s":"@expansion"},{"t":"Hola, amigo universo. ¿Así creciste?","s":"@expansion"},{"t":"Es lo que se piensa, amigo: muy al inicio, de golpe.","s":"@expansion"},{"t":"Y mis arrugas chiquitas dieron las galaxias.","s":"@curva"},{"t":"Todavía se busca confirmarlo mejor.","s":"@curva"},{"t":"Gracias, amigo universo.","s":"@curva"},{"t":"Dicho de otro modo:","s":"@curva"},{"t":"La inflación propone una expansión muy rápida al inicio, y explica por qué el universo es tan parejo.","s":"@curva"}]},{"id":"energiaoscura","t":"Energía oscura","res":"Algo hace que el universo se expanda cada vez más rápido.","g":[{"t":"Energía oscura"},{"t":"Lanzas una pelota, y sube cada vez más rápido.","s":"@tiro"},{"t":"Eso sería muy raro. Pero el universo hace algo así.","s":"@tiro"},{"t":"Hola, amiga energía oscura. ¿Quién eres?","s":"@expansion"},{"t":"Nadie sabe, amigo. Seré cerca de dos tercios de todo.","s":"@expansion"},{"t":"Se notó midiendo estrellas que explotan muy lejos.","s":"@expansion"},{"t":"Gracias, amiga.","s":"@expansion"},{"t":"Dicho de otro modo:","s":"@expansion"},{"t":"La energía oscura acelera la expansión del universo, y su naturaleza es desconocida.","s":"@expansion"}]},{"id":"futuro","t":"El futuro del universo","res":"Muy, muy lejos en el futuro, las estrellas se irán apagando.","g":[{"t":"El futuro del universo"},{"t":"Viajas muy lejos en el futuro.","s":"@futuro"},{"t":"Hola, amigo Sol. ¿Qué te pasará?","s":"@futuro"},{"t":"En unos cinco mil millones de años, me haré enorme, y me apagaré lento.","s":"@futuro"},{"t":"Las galaxias seguirán alejándose, y el cielo se verá más vacío.","s":"@expansion"},{"t":"Falta muchísimo tiempo.","s":"@expansion"},{"tipo":"barra","b":"futuro","o":"Avanza el tiempo.","pasos":[[14,"Hoy, muchas estrellas."],[50,"Más adelante, menos."],[100,"Al final, casi todas apagadas."]]},{"t":"Gracias, amigo Sol.","s":"@expansion"},{"t":"Dicho de otro modo:","s":"@expansion"},{"t":"Con el tiempo, las estrellas agotan su combustible, y el universo se vuelve más frío y vacío.","s":"@expansion"}]},{"id":"exoplanetas","t":"Planetas de otras estrellas","res":"Se detectan por cómo baja un poquito la luz cuando pasan enfrente.","g":[{"t":"Planetas de otras estrellas"},{"t":"Ves una estrella, y su luz baja un poquito.","s":"@transito=50"},{"t":"Hola, amigo planeta. ¿Fuiste tú?","s":"@transito=50"},{"t":"Sí, amigo. Pasé enfrente, como una mosca frente a un foco.","s":"@transito=50"},{"t":"También muevo un poquito a mi estrella.","s":"atrae"},{"t":"Y algunos de nosotros podríamos tener agua líquida.","s":"atrae"},{"tipo":"barra","b":"transito","o":"Un planeta pasa frente a su estrella.","pasos":[[10,"Aún no llega: toda la luz."],[50,"Enfrente, baja un poquito."],[90,"Ya pasó, y regresa."]]},{"t":"Gracias, amigo planeta.","s":"atrae"},{"t":"Dicho de otro modo:","s":"atrae"},{"t":"Los exoplanetas se detectan por el tránsito y por el movimiento de su estrella.","s":"atrae"}]},{"id":"neutrones","t":"Estrellas de neutrones","res":"Una cucharadita pesaría miles de millones de toneladas.","g":[{"t":"Estrellas de neutrones"},{"t":"Una estrella grande explota, y su centro se aprieta.","s":"@hoyo"},{"t":"Hola, amiga estrella de neutrones. ¿Qué tan chica eres?","s":"@hoyo"},{"t":"Unos veinte kilómetros, amigo, con más masa que el Sol.","s":"@hoyo"},{"t":"Una cucharadita de mí pesaría miles de millones de toneladas.","s":"ic:fork-knife"},{"t":"Y algunas giramos cientos de veces por segundo.","s":"@patin"},{"t":"Gracias, amiga.","s":"@patin"},{"t":"Dicho de otro modo:","s":"@patin"},{"t":"Una estrella de neutrones es el resto denso de una supernova, y si gira rápido es un púlsar.","s":"@patin"}]},{"id":"galaxias","t":"Galaxias","res":"Son enormes grupos de estrellas que giran juntas.","g":[{"t":"Galaxias"},{"t":"Miras al cielo en un lugar muy oscuro.","s":"@escala=8"},{"t":"Hola, amiga Vía Láctea. ¿Cuántas son ustedes?","s":"@escala=8"},{"t":"Miles de millones de estrellas, amigo, y el Sol es una.","s":"@escala=8"},{"t":"Una vuelta tarda más de doscientos millones de años.","s":"astro"},{"t":"Tu vecina Andrómeda se ve a simple vista.","s":"ic:sparkle"},{"t":"Gracias, amiga.","s":"ic:sparkle"},{"t":"Dicho de otro modo:","s":"ic:sparkle"},{"t":"Una galaxia es un gran grupo de estrellas unidas por gravedad, y hay miles de millones.","s":"ic:sparkle"}]},{"id":"fermi","t":"¿Estamos solos?","res":"Con tantos planetas, sorprende que no hayamos encontrado a nadie.","g":[{"t":"¿Estamos solos?"},{"t":"Miras al cielo, lleno de planetas.","s":"@transito"},{"t":"Hola, amigo Fermi. ¿Dónde están todos?","s":"@transito"},{"t":"Esa es la pregunta, amigo.","s":"@transito"},{"t":"Puede ser como un bosque en silencio.","s":"ic:tree"},{"t":"Y las distancias son gigantes: un mensaje tardaría miles de años.","s":"pasado"},{"t":"Gracias, amigo Fermi.","s":"pasado"},{"t":"Dicho de otro modo:","s":"pasado"},{"t":"La paradoja de Fermi contrasta los muchos planetas con la falta de señales.","s":"pasado"}]},{"id":"cuerdas","t":"Teoría de cuerdas","res":"Es la idea de que todo está hecho de cuerdas diminutas vibrando.","g":[{"t":"Teoría de cuerdas"},{"t":"Tocas una cuerda, y da distintas notas.","s":"@armonico"},{"t":"Hola, amiga cuerda. ¿Tú eres todo?","s":"@armonico"},{"t":"Es una idea, amigo: cada partícula sería una nota mía.","s":"@armonico"},{"t":"Necesitaría más dimensiones de las que ves.","s":"@armonico"},{"t":"Todavía no se ha comprobado.","s":"@armonico"},{"t":"Gracias, amiga cuerda.","s":"@armonico"},{"t":"Dicho de otro modo:","s":"@armonico"},{"t":"La teoría de cuerdas busca unir gravedad y cuántica, y aún es una hipótesis.","s":"@armonico"}]},{"id":"tiempo","t":"¿Qué es el tiempo?","res":"Las leyes casi no distinguen pasado de futuro, pero el desorden sí.","g":[{"t":"¿Qué es el tiempo?"},{"t":"Ves un video de una bola rebotando, al revés, y se ve normal.","s":"@choque"},{"t":"Ves un vaso roto, al revés, y se ve raro.","s":"vaso"},{"t":"Hola, amigo tiempo. ¿Por qué?","s":"vaso"},{"t":"Por el desorden, amigo. Casi todas las leyes funcionan igual hacia atrás.","s":"vaso"},{"t":"Un café con leche nunca se separa.","s":"ic:coffee"},{"t":"Gracias, amigo tiempo.","s":"ic:coffee"},{"t":"Dicho de otro modo:","s":"ic:coffee"},{"t":"La dirección del tiempo se relaciona con el aumento de la entropía, y sigue siendo un misterio.","s":"ic:coffee"}]},{"id":"caos","t":"El efecto mariposa","res":"En algunos sistemas, una diferencia mínima lo cambia todo.","g":[{"t":"El efecto mariposa"},{"t":"Sueltas dos bolitas, casi en el mismo lugar.","s":"@caos"},{"t":"Empiezan juntas, y acaban muy lejos.","s":"@caos"},{"t":"Hola, amigo clima. ¿Tú también?","s":"@caos"},{"t":"Sí, amigo. Por eso no me predicen bien más allá de unos días.","s":"@caos"},{"t":"No es magia: sigo las reglas, solo soy delicado.","s":"@caos"},{"tipo":"barra","b":"caos","o":"Pasan más pasos.","pasos":[[5,"Al inicio, casi iguales."],[15,"Luego, se separan."],[30,"Y acaban muy distintas."]]},{"t":"Gracias, amigo clima.","s":"@caos"},{"t":"Dicho de otro modo:","s":"@caos"},{"t":"En los sistemas caóticos, una diferencia mínima al inicio cambia mucho el resultado.","s":"@caos"}]},{"id":"gravcuantica","t":"El gran problema","res":"La relatividad y la cuántica no encajan del todo.","g":[{"t":"El gran problema"},{"t":"Hola, amiga relatividad. Tú explicas lo muy grande.","s":"@curva"},{"t":"Hola, amiga cuántica. Tú, lo muy chico.","s":"@rendija"},{"t":"¿Se llevan bien?","s":"@rendija"},{"t":"Funcionamos muy bien, amigo, pero no encajamos.","s":"@rendija"},{"t":"Dentro de un hoyo negro hacen falta las dos.","s":"@hoyo"},{"t":"Gracias, amigas.","s":"@hoyo"},{"t":"Dicho de otro modo:","s":"@hoyo"},{"t":"Falta una teoría que una gravedad y cuántica, para los hoyos negros y el inicio del universo.","s":"@hoyo"}]},{"id":"oscura2","t":"Materia oscura 2: buscarla","res":"La buscan con detectores muy profundos y mirando cómo se dobla la luz.","g":[{"t":"Materia oscura 2: buscarla"},{"t":"Miras una ciudad por una ventana de vidrio ondulado.","s":"@curva"},{"t":"Las formas chuecas te dicen cómo es el vidrio.","s":"@curva"},{"t":"Hola, amiga luz. ¿Tú te doblas por la materia oscura?","s":"@curva"},{"t":"Sí, amigo, y con eso hacen su mapa.","s":"@curva"},{"t":"Bajo tierra, hay detectores esperando un choque.","s":"ic:mountains"},{"t":"Hasta hoy, nadie la ha visto directamente.","s":"ic:mountains"},{"t":"Gracias, amiga luz.","s":"ic:mountains"},{"t":"Dicho de otro modo:","s":"ic:mountains"},{"t":"La materia oscura se mapea por cómo dobla la luz, y se busca con detectores subterráneos.","s":"ic:mountains"}]},{"id":"wormhole","t":"Agujeros de gusano","res":"Una idea matemática de un atajo en el espacio, jamás observada.","g":[{"t":"Agujeros de gusano"},{"t":"Doblas una hoja, y la atraviesas con un lápiz.","s":"@curva"},{"t":"Sin dar la vuelta.","s":"@curva"},{"t":"Hola, amigo agujero de gusano. ¿Tú eres así?","s":"@curva"},{"t":"Tal vez, amigo. Soy una posibilidad en las ecuaciones, y nadie me ha visto.","s":"@curva"},{"t":"Podría ni siquiera existir.","s":"@curva"},{"t":"Gracias, amigo.","s":"@curva"},{"t":"Dicho de otro modo:","s":"@curva"},{"t":"Un agujero de gusano es un atajo permitido por la relatividad, sin evidencia hasta hoy.","s":"@curva"}]}],"mat":"f","et":"C2"},{"id":"qA1","et":"A1","mat":"q","nom":"La química de tu casa","lec":[{"id":"q_estadio","t":"El átomo por dentro","res":"Casi todo el átomo es espacio vacío.","g":[{"t":"El átomo por dentro"},{"t":"Estás en medio de un estadio.","s":"p:estadio;i:hand-palm .5 .5 .16"},{"t":"En la mano traes un grano de arroz, y lo dejas en el pasto.","s":"p:estadio;i:hand-palm .5 .5 .16"},{"t":"Ese grano es el núcleo de un átomo.","s":"p:estadio;i:hand-palm .5 .5 .16"},{"t":"Caminas hasta las gradas, y ahí están los fanáticos, corriendo de un lado a otro.","s":"p:estadio;e .85 .22 feliz .11;e .15 .3 feliz .11;e .7 .88 feliz .11;e .24 .8 feliz .11"},{"t":"Hola, amigo. ¿Quién eres?","s":"p:estadio;e .84 .5 feliz .24;i:person .66 .5 .3"},{"t":"Hola, amigo. Soy un electrón, y aquí corro todo el día.","s":"p:estadio;e .84 .5 feliz .24;i:person .66 .5 .3"},{"t":"¿No quieres bajar a la cancha?","s":"p:estadio;e .84 .5 feliz .24;i:person .66 .5 .3"},{"t":"No, amigo. Aquí es mi lugar.","s":"p:estadio;e .84 .5 feliz .24;i:person .66 .5 .3"},{"t":"Miras hacia abajo, y el grano casi ni se ve.","s":"p:estadio;fl .78 .5 .54 .5"},{"t":"Entre ustedes dos no hay nada. Así de vacío es un átomo.","s":"p:estadio;fl .78 .5 .54 .5"},{"t":"Tu mano también está hecha así.","s":"ic:hand-palm"},{"t":"Gracias, amigo electrón.","s":"ic:hand-palm"},{"t":"Dicho de otro modo:","s":"ic:hand-palm"},{"t":"Un átomo tiene un núcleo muy pequeño, con protones y neutrones.","s":"ic:hand-palm"},{"t":"Los electrones se mueven lejos de él, y los mantiene ahí la atracción de sus cargas.","s":"ic:hand-palm"}]},{"id":"q_todo_igual","t":"De qué está hecho todo","res":"Todo lo que tocas está hecho de átomos.","g":[{"t":"De qué está hecho todo"},{"t":"Levantas una piedra del suelo.","s":"ic:hand-grabbing"},{"t":"La partes a la mitad, y otra vez, y otra.","s":"ic:hand-grabbing"},{"t":"Al final, queda un pedacito muy chiquito.","s":"p:nada;i:mountains .28 .52 .4 #9AA2AB;Átomo .68 .6 feliz .26"},{"t":"Hola, amigo. ¿Quién eres?","s":"p:nada;i:mountains .28 .52 .4 #9AA2AB;Átomo .68 .6 feliz .26"},{"t":"Soy un átomo, amigo. Yo formo la piedra.","s":"p:nada;i:mountains .28 .52 .4 #9AA2AB;Átomo .68 .6 feliz .26"},{"t":"Ahora haces lo mismo con una hoja, y te saluda otro átomo.","s":"ic:leaf"},{"t":"Con tu mano, igual.","s":"ic:hand-palm"},{"t":"Gracias, amigos átomos.","s":"ic:hand-palm"},{"t":"Dicho de otro modo:","s":"ic:hand-palm"},{"t":"Todo lo que existe a tu alrededor está hecho de átomos.","s":"ic:hand-palm"}]},{"id":"q_agua_tres","t":"El agua de tres formas","res":"El agua cambia de forma, pero sigue siendo agua.","g":[{"t":"El agua de tres formas"},{"t":"Traes un hielo en la mano.","s":"p:nada;i:snowflake .28 .5 .42;Agua .7 .55 tranquilo .26"},{"t":"Hola, amiga agua. Qué fría estás.","s":"p:nada;i:snowflake .28 .5 .42;Agua .7 .55 tranquilo .26"},{"t":"Es que estoy quietecita, amigo.","s":"p:nada;i:snowflake .28 .5 .42;Agua .7 .55 tranquilo .26"},{"t":"Se te derrite, y anda resbalando entre tus dedos.","s":"ic:drop"},{"t":"La pones en una olla, y sale volando como vapor.","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"t":"Sigo siendo yo, amigo, te dice desde arriba.","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"t":"Gracias, amiga agua.","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"t":"Dicho de otro modo:","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"t":"Hielo, agua y vapor son la misma molécula; solo cambia qué tan rápido se mueve.","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"tipo":"barra","b":"estadosT","o":"Tienes agua en una olla y la calientas poco a poco.","pasos":[[-10,"Aquí está congelada. Las bolitas casi no se mueven."],[40,"Ahora ya es líquida. Las bolitas se resbalan unas con otras."],[99,"Casi hierve. Se mueven muy rápido."],[115,"Ya es vapor. Cada bolita se fue por su lado."]]}]},{"id":"q_sal_agua","t":"La sal que desaparece","res":"La sal no se va: se queda repartida en el agua.","g":[{"t":"La sal que desaparece"},{"t":"Tienes un vaso de agua, y le echas una cucharada de sal.","s":"ic:drop"},{"t":"La mueves, y ya no la ves.","s":"ic:drop"},{"t":"Amiga sal, ¿a dónde te fuiste?","s":"p:nada;i:drop .28 .55 .5;Sal .7 .55 feliz .3"},{"t":"Aquí sigo, amigo. Pruébame.","s":"p:nada;i:drop .28 .55 .5;Sal .7 .55 feliz .3"},{"t":"Tomas un trago, y está salado.","s":"p:nada;i:drop .28 .55 .5;Sal .7 .55 feliz .3"},{"t":"Luego le echas sal a una sopa, y toda la sopa sabe a sal.","s":"ic:cooking-pot"},{"t":"Gracias, amiga sal.","s":"ic:cooking-pot"},{"t":"Dicho de otro modo:","s":"ic:cooking-pot"},{"t":"Disolver es repartir algo en pedacitos que no se ven.","s":"ic:cooking-pot"},{"tipo":"barra","b":"disuelve","o":"Ves un vaso de agua. Le vas echando sal con una cucharita.","pasos":[[5,"Con cinco cucharaditas, la sal desaparece."],[15,"Con quince, el agua ya casi no acepta más."],[20,"Con veinte, la sal se queda en el fondo."]]}]},{"id":"q_azucar_cafe","t":"Azúcar en el café","res":"Lo caliente disuelve más rápido.","g":[{"t":"Azúcar en el café"},{"t":"Tienes un café caliente, y le echas azúcar.","s":"ic:coffee"},{"t":"Se va rápido.","s":"ic:coffee"},{"t":"Ahora le echas azúcar a un vaso con hielos, y se queda en el fondo.","s":"p:cocina;i:snowflake .28 .62 .26;Azúcar .68 .64 triste .24"},{"t":"Amiga azúcar, ¿qué pasa?","s":"p:cocina;i:snowflake .28 .62 .26;Azúcar .68 .64 triste .24"},{"t":"Es que aquí todos están quietos, amigo.","s":"p:cocina;i:snowflake .28 .62 .26;Azúcar .68 .64 triste .24"},{"t":"En lo caliente, todos se mueven y me ayudan a irme.","s":"agita"},{"t":"Gracias, amiga azúcar.","s":"agita"},{"t":"Dicho de otro modo:","s":"agita"},{"t":"En lo caliente las moléculas se mueven más rápido, y disuelven antes.","s":"agita"}]},{"id":"q_clavo","t":"Un clavo oxidado","res":"El hierro se junta con el oxígeno, y sale óxido.","g":[{"t":"Un clavo oxidado"},{"t":"Ves un clavo tirado en el patio, bajo la lluvia.","s":"p:patio;x:clavo .36 .7 .34"},{"t":"Llega el oxígeno, y saluda al hierro del clavo.","s":"p:patio;x:clavo .36 .7 .34;O .68 .66 feliz .24"},{"t":"Hola, amigo. ¿Me puedo quedar?","s":"p:patio;x:clavo .36 .7 .34;O .68 .66 feliz .24"},{"t":"Pasan los días, y salen manchas cafés.","s":"p:patio;x:clavo .36 .7 .34;O .68 .66 feliz .24"},{"t":"A la cadena de una bici le pasa igual.","s":"ic:bicycle"},{"t":"Gracias por explicarnos, amigo oxígeno.","s":"ic:bicycle"},{"t":"Dicho de otro modo:","s":"ic:bicycle"},{"t":"El óxido es hierro unido con oxígeno, y el agua lo acelera.","s":"ic:bicycle"},{"tipo":"barra","b":"oxido","o":"Ves un clavo en el patio, con lluvia y aire.","pasos":[[3,"Los primeros días, sigue limpio."],[20,"A las pocas semanas, le salen manchas cafés."],[50,"Después de un tiempo, está cubierto de óxido."]]}]},{"id":"q_manzana","t":"La manzana café","res":"El aire cambia la manzana cortada.","g":[{"t":"La manzana café"},{"t":"Partes una manzana, y dejas una mitad en la mesa.","s":"p:cocina;x:manzana .36 .62 .32"},{"t":"Hola, amiga manzana, le dice el oxígeno. Qué bueno que abriste.","s":"p:cocina;x:manzana .36 .62 .32;O .7 .64 feliz .24"},{"t":"Al rato, ya está café.","s":"p:cocina;x:manzana .36 .62 .32;O .7 .64 feliz .24"},{"t":"Con un aguacate, pasa lo mismo.","s":"ic:knife"},{"t":"Le pones limón, y el oxígeno tarda más.","s":"ic:orange-slice"},{"t":"Gracias, amigo oxígeno.","s":"ic:orange-slice"},{"t":"Dicho de otro modo:","s":"ic:orange-slice"},{"t":"El oxígeno reacciona con lo de adentro de la fruta, y eso le cambia el color.","s":"ic:orange-slice"}]},{"id":"q_huevo","t":"El huevo que se cocina","res":"El calor cambia las proteínas para siempre.","g":[{"t":"El huevo que se cocina"},{"t":"Rompes un huevo en el sartén.","s":"ic:egg-crack"},{"t":"La clara está transparente y resbalosa.","s":"ic:egg-crack"},{"t":"Hola, amiga proteína. ¿Qué te está pasando?","s":"p:nada;i:egg-crack .28 .55 .44 #BCA67A;Proteína .7 .56 feliz .28"},{"t":"Con el calor me desenredo, amigo, y me abrazo con las otras.","s":"p:nada;i:egg-crack .28 .55 .44 #BCA67A;Proteína .7 .56 feliz .28"},{"t":"Ya no hay regreso, y por eso se pone blanca.","s":"p:nada;i:egg-crack .28 .55 .44 #BCA67A;Proteína .7 .56 feliz .28"},{"t":"A la carne en la parrilla le pasa igual.","s":"ic:hamburger"},{"t":"Gracias, amiga proteína.","s":"ic:hamburger"},{"t":"Dicho de otro modo:","s":"ic:hamburger"},{"t":"El calor cambia la forma de las proteínas, y esas ya no regresan a como estaban.","s":"ic:hamburger"}]},{"id":"q_pan_sube","t":"Por qué sube el pan","res":"La levadura suelta gas, y el gas infla la masa.","g":[{"t":"Por qué sube el pan"},{"t":"Tienes una bolita de masa, y la dejas tapada.","s":"ic:bread"},{"t":"Adentro hay unas amigas chiquitas, comiendo azúcar.","s":"p:cocina;i:bread .36 .66 .3;Levadura .72 .66 feliz .22"},{"t":"Hola, amigas levaduras. ¿Qué hacen?","s":"p:cocina;i:bread .36 .66 .3;Levadura .72 .66 feliz .22"},{"t":"Te estamos inflando el pan, amigo. Provecho.","s":"p:cocina;i:bread .36 .66 .3;Levadura .72 .66 feliz .22"},{"t":"Al comer, sueltan burbujas de gas.","s":"mol:CO2"},{"t":"La espuma de la cerveza viene de lo mismo.","s":"ic:beer-bottle"},{"t":"Gracias, amigas.","s":"ic:beer-bottle"},{"t":"Dicho de otro modo:","s":"ic:beer-bottle"},{"t":"Las levaduras convierten azúcar en gas, y ese gas infla la masa.","s":"ic:beer-bottle"},{"tipo":"barra","b":"pan","o":"Ves una bolita de masa con levadura, tapada en un lugar tibio.","pasos":[[15,"Al principio, casi no cambia."],[45,"A la media hora, ya creció."],[85,"Después de más de una hora, tiene el doble de tamaño."]]}]},{"id":"q_jabon_grasa","t":"Cómo limpia el jabón","res":"El jabón agarra la grasa por un lado y el agua por el otro.","g":[{"t":"Cómo limpia el jabón"},{"t":"Traes las manos llenas de aceite.","s":"ic:hand-soap"},{"t":"Las pones en el agua, y el aceite ni se mueve.","s":"ic:hand-soap"},{"t":"Hola, amigo jabón. ¿Me ayudas?","s":"p:nada;Grasa .22 .55 neutro .24;Jabón .5 .55 feliz .26;Agua .8 .55 neutro .24"},{"t":"Claro, amigo. Yo me llevo con los dos.","s":"p:nada;Grasa .22 .55 neutro .24;Jabón .5 .55 feliz .26;Agua .8 .55 neutro .24"},{"t":"Con una mano agarra la grasa, y con la otra, el agua.","s":"p:nada;Grasa .22 .55 neutro .24;Jabón .5 .55 feliz .26;Agua .8 .55 neutro .24"},{"t":"Con un sartén grasoso hace lo mismo.","s":"ic:cooking-pot"},{"t":"Gracias, amigo jabón.","s":"ic:cooking-pot"},{"t":"Dicho de otro modo:","s":"ic:cooking-pot"},{"t":"El jabón une la grasa con el agua, y así el agua se la lleva.","s":"ic:cooking-pot"},{"tipo":"barra","b":"jabon","o":"Traes una gota de grasa en la mano. Le vas poniendo jabón.","pasos":[[4,"Con poquito, la mancha sigue ahí."],[14,"Con más, el jabón la va rodeando."],[28,"Con suficiente, la grasa se suelta y el agua se la lleva."]]}]},{"id":"q_vinagre_bicarb","t":"Vinagre y bicarbonato","res":"Al juntarse hacen gas, y por eso burbujean.","g":[{"t":"Vinagre y bicarbonato"},{"t":"Tienes un vaso con bicarbonato, y le echas vinagre.","s":"ic:jar"},{"t":"Empieza a hacer espuma.","s":"ic:jar"},{"t":"Hola, amigos. ¿Qué se traen?","s":"p:cocina;Vinagre .32 .6 feliz .22;Bicarb .68 .6 feliz .22"},{"t":"Nos caímos muy bien, amigo.","s":"p:cocina;Vinagre .32 .6 feliz .22;Bicarb .68 .6 feliz .22"},{"t":"Y de su plática sale un gas nuevo, en burbujas.","s":"mol:CO2"},{"t":"En un pastel, el polvo para hornear hace igual, y lo deja esponjoso.","s":"ic:cookie"},{"t":"Gracias, amigos.","s":"ic:cookie"},{"t":"Dicho de otro modo:","s":"ic:cookie"},{"t":"Un ácido y una base reaccionan, y aquí sale gas: CO₂.","v":"Un ácido y una base reaccionan, y aquí sale gas: ce o dos.","s":"ic:cookie"},{"tipo":"barra","b":"burbujas","o":"Ves una botella con bicarbonato y un globo en la boca. Le vas echando vinagre.","pasos":[[2,"Con poquito vinagre, salen pocas burbujas."],[6,"Con más vinagre, el globo se empieza a inflar."],[10,"Llega un punto en que se acaba el bicarbonato, y el globo ya no crece."]]}]},{"id":"q_limon","t":"Por qué el limón es agrio","res":"Lo agrio viene de los ácidos.","g":[{"t":"Por qué el limón es agrio"},{"t":"Muerdes un limón, y se te arruga la cara.","s":"ic:orange-slice"},{"t":"Hola, amigo limón. ¿Qué me hiciste?","s":"p:nada;i:orange-slice .28 .55 .42 #E3B23C;Ácido .7 .55 feliz .28"},{"t":"Te dejé una piecita en la lengua, amigo. Soy ácido.","s":"p:nada;i:orange-slice .28 .55 .42 #E3B23C;Ácido .7 .55 feliz .28"},{"t":"Luego pruebas vinagre.","s":"ic:drop"},{"t":"Yo soy igual, amigo, te dice.","s":"ic:drop"},{"t":"Gracias, amigos.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"Los ácidos sueltan una partícula pequeña, y tu lengua la nota como agrio.","s":"ic:drop"}]},{"id":"q_escala_ph","t":"Una regla para lo ácido","res":"El pH dice qué tan ácida o básica es una cosa.","g":[{"t":"Una regla para lo ácido"},{"t":"Te encuentras a tres amigos: el limón, el agua y el jabón.","s":"p:nada;Limón .18 .55 feliz .22;Agua .5 .55 tranquilo .22;Jabón .82 .55 feliz .22"},{"t":"Les pones una regla al lado.","s":"p:nada;Limón .18 .55 feliz .22;Agua .5 .55 tranquilo .22;Jabón .82 .55 feliz .22"},{"t":"Yo quedo abajo, dice el limón. Soy ácido.","s":"@ph=0"},{"t":"Yo quedo en medio, dice el agua. Me llevo con todos.","s":"@ph=5"},{"t":"Y yo arriba, dice el jabón. Soy básico.","s":"@ph=8"},{"t":"Gracias, amigos.","s":"@ph=8"},{"t":"Dicho de otro modo:","s":"@ph=8"},{"t":"El pH va del 0 al 14: abajo es ácido, 7 es neutro, y arriba es básico.","v":"El pe hache va del 0 al 14: abajo es ácido, 7 es neutro, y arriba es básico.","s":"@ph=8"},{"tipo":"barra","b":"ph","o":"Metes un medidor en varias cosas de tu cocina.","pasos":[[0,"El limón es muy ácido. Por eso te hace arrugar la cara."],[5,"El agua pura queda justo en medio."],[8,"El agua con jabón ya está del otro lado. Se siente resbalosa."],[10,"El cloro de limpieza está hasta el fondo. Por eso irrita la piel."]]}]},{"id":"q_vela","t":"Lo que hace una vela","res":"Una vela quema su cera, no solo el hilo.","g":[{"t":"Lo que hace una vela"},{"t":"Ves una vela encendida en un cuarto oscuro.","s":"ic:fire"},{"t":"Hola, amigo hilo. ¿Tú eres el que se quema?","s":"p:nada;i:fire .5 .24 .32 #E08A2E;Hilo .5 .62 tranquilo .24"},{"t":"No tanto, amigo. Yo solo subo la cera.","s":"p:nada;i:fire .5 .24 .32 #E08A2E;Hilo .5 .62 tranquilo .24"},{"t":"La cera se derrite, sube, se vuelve gas, y ese gas arde.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Si le soplas, ves un humito blanco.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Le acercas un cerillo, y se vuelve a prender.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Gracias, amigo hilo.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Dicho de otro modo:","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Lo que arde en una vela es el vapor de su cera.","s":"rx:CH4+2O2>CO2+2H2O"}]},{"id":"q_fuego_tres","t":"Lo que necesita el fuego","res":"El fuego necesita algo que quemar, oxígeno y calor.","g":[{"t":"Lo que necesita el fuego"},{"t":"Estás junto a una fogata.","s":"p:nada;i:campfire .5 .32 .46 #E08A2E;i:tree .15 .75 .18;i:wind .5 .8 .18;i:thermometer .85 .75 .18"},{"t":"Hola, amigo fuego. ¿Qué necesitas para seguir?","s":"p:nada;i:campfire .5 .32 .46 #E08A2E;i:tree .15 .75 .18;i:wind .5 .8 .18;i:thermometer .85 .75 .18"},{"t":"Tres cosas, amigo: leña, aire y calor.","s":"p:nada;i:campfire .5 .32 .46 #E08A2E;i:tree .15 .75 .18;i:wind .5 .8 .18;i:thermometer .85 .75 .18"},{"t":"Le pones una cobija encima, y le quitas el aire.","s":"@llama=10"},{"t":"Se apaga.","s":"@llama=10"},{"t":"A otra le echas agua, y le quitas el calor.","s":"ic:drop"},{"t":"También se apaga.","s":"ic:drop"},{"t":"Gracias, amigo fuego.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"El fuego necesita combustible, oxígeno y calor; sin uno de ellos, se apaga.","s":"ic:drop"},{"tipo":"barra","b":"llama","o":"Ves una vela encendida. Vas cambiando cuánto oxígeno hay a su alrededor.","pasos":[[12,"Con muy poco oxígeno, se apaga."],[21,"Con el aire normal, arde tranquila."],[30,"Con más oxígeno, arde con mucha fuerza."]]}]},{"id":"q_no_mezclar","t":"Lo que no se mezcla al limpiar","res":"Cloro y amoníaco juntos sueltan gases peligrosos.","g":[{"t":"Lo que no se mezcla al limpiar"},{"t":"Limpias el baño, con cloro en una mano y otro limpiador en la otra.","s":"ic:broom"},{"t":"Hola, amigo. Por favor, no nos juntes, te dice el cloro.","s":"p:nada;Cl .3 .55 tranquilo .3;Amoníaco .72 .55 tranquilo .24;fl .47 .25 .36 .25;fl .55 .25 .66 .25"},{"t":"Juntos soltamos un gas que te hace daño.","s":"p:nada;Cl .3 .55 tranquilo .3;Amoníaco .72 .55 tranquilo .24;fl .47 .25 .36 .25;fl .55 .25 .66 .25"},{"t":"Con el vinagre, igual.","s":"p:nada;Cl .3 .55 tranquilo .3;Amoníaco .72 .55 tranquilo .24;fl .47 .25 .36 .25;fl .55 .25 .66 .25"},{"t":"Úsanos uno a la vez, con la ventana abierta.","s":"ic:wind"},{"t":"Y si huele fuerte, sal de ahí.","s":"ic:wind"},{"t":"Gracias por avisar, amigos.","s":"ic:wind"},{"t":"Dicho de otro modo:","s":"ic:wind"},{"t":"Mezclar cloro con otros limpiadores puede soltar gases tóxicos.","s":"ic:wind"}]},{"id":"q_caramelo","t":"El azúcar que se vuelve caramelo","res":"Con calor, el azúcar se rompe y hace sabores nuevos.","g":[{"t":"El azúcar que se vuelve caramelo"},{"t":"Ves azúcar en un sartén, muy blanquita.","s":"ic:cooking-pot"},{"t":"Se derrite, y parece agua.","s":"ic:cooking-pot"},{"t":"Amiga azúcar, ya te estás poniendo dorada.","s":"p:cocina;Azúcar .5 .62 feliz .3;i:fire .5 .22 .16 #E08A2E"},{"t":"Es que me estoy volviendo otra cosa, amigo.","s":"p:cocina;Azúcar .5 .62 feliz .3;i:fire .5 .22 .16 #E08A2E"},{"t":"Se rompe en muchas moléculas, con olor y sabor nuevos.","s":"mol:glucosa"},{"t":"Eso mismo es lo de arriba de un flan.","s":"ic:ice-cream"},{"t":"Gracias, amiga azúcar.","s":"ic:ice-cream"},{"t":"Dicho de otro modo:","s":"ic:ice-cream"},{"t":"Con calor, el azúcar se rompe y forma muchas sustancias: eso es el caramelo.","s":"ic:ice-cream"}]},{"id":"q_tortilla","t":"Lo dorado de la comida","res":"Lo dorado es una reacción entre azúcares y proteínas.","g":[{"t":"Lo dorado de la comida"},{"t":"Ves una tortilla en el comal, con manchitas doradas.","s":"ic:bread"},{"t":"Huele a casa.","s":"ic:bread"},{"t":"Hola, amigos. ¿Ustedes hicieron eso?","s":"p:cocina;Azúcar .3 .6 feliz .22;Proteína .7 .6 feliz .22;i:fire .5 .22 .22 #E08A2E"},{"t":"Sí, amigo. Con el calor platicamos, y sale este sabor.","s":"p:cocina;Azúcar .3 .6 feliz .22;Proteína .7 .6 feliz .22;i:fire .5 .22 .22 #E08A2E"},{"t":"En la carne asada hacen lo mismo.","s":"ic:hamburger"},{"t":"Y también en el café tostado.","s":"ic:coffee"},{"t":"Gracias, amigos.","s":"ic:coffee"},{"t":"Dicho de otro modo:","s":"ic:coffee"},{"t":"Con calor, los azúcares y las proteínas reaccionan: de ahí sale lo dorado y su sabor.","s":"ic:coffee"}]},{"id":"q_yogur","t":"Leche que se vuelve yogur","res":"Unas bacterias vuelven ácida la leche y la espesan.","g":[{"t":"Leche que se vuelve yogur"},{"t":"Tienes un vaso de leche tibia, y le pones una cucharada de yogur.","s":"p:cocina;x:vaso .32 .6 .36"},{"t":"Hola, amigas bacterias. ¿Qué vienen a hacer?","s":"p:cocina;x:vaso .32 .6 .36;Bacteria .72 .64 feliz .22"},{"t":"Con permiso, amigo. Venimos a comer.","s":"p:cocina;x:vaso .32 .6 .36;Bacteria .72 .64 feliz .22"},{"t":"Se comen el azúcar, y sueltan un ácido.","s":"p:cocina;x:vaso .32 .6 .36;Bacteria .72 .64 feliz .22"},{"t":"Y la leche se espesa.","s":"p:cocina;x:vaso .32 .6 .36;Bacteria .72 .64 feliz .22"},{"t":"Unas gotas de limón en leche hacen algo parecido.","s":"ic:orange-slice"},{"t":"Gracias, amigas.","s":"ic:orange-slice"},{"t":"Dicho de otro modo:","s":"ic:orange-slice"},{"t":"El ácido hace que las proteínas de la leche se junten, y por eso se espesa.","s":"ic:orange-slice"}]},{"id":"q_sal_hielo","t":"Sal sobre el hielo","res":"La sal hace que el hielo se derrita a menos de cero grados.","g":[{"t":"Sal sobre el hielo"},{"t":"Ves una banqueta congelada, en invierno.","s":"ic:snowflake"},{"t":"Llega la sal, y se mete entre las moléculas de agua.","s":"p:nada;Sal .5 .55 feliz .24;Agua .18 .55 sorpresa .2;Agua .82 .55 sorpresa .2"},{"t":"Hola, amigas. ¿Me hacen un lugarcito?","s":"p:nada;Sal .5 .55 feliz .24;Agua .18 .55 sorpresa .2;Agua .82 .55 sorpresa .2"},{"t":"Y ya no se pueden agarrar, y el hielo se derrite.","s":"p:nada;Sal .5 .55 feliz .24;Agua .18 .55 sorpresa .2;Agua .82 .55 sorpresa .2"},{"t":"Por eso la nieve de garrafa lleva hielo con sal alrededor.","s":"ic:ice-cream"},{"t":"Gracias, amiga sal.","s":"ic:ice-cream"},{"t":"Dicho de otro modo:","s":"ic:ice-cream"},{"t":"La sal hace que el agua se congele a menos de cero grados.","s":"ic:ice-cream"}]},{"id":"q_cebolla","t":"Por qué lloras con la cebolla","res":"Al cortarla suelta un gas que irrita tus ojos.","g":[{"t":"Por qué lloras con la cebolla"},{"t":"Estás picando una cebolla, y te arden los ojos.","s":"p:cocina;Cebolla .5 .62 triste .3;i:knife .2 .64 .2"},{"t":"Amiga dar.","s":"p:cocina;Hg .5 .62 feliz .26;i:drop .2 .7 .14;i:drop .8 .7 .14"},{"t":"Antes me usaban en los termómetros.","s":"ic:thermometer"},{"t":"Una cosa, amigo: mejor no me toques, te puedo hacer daño.","s":"p:nada;Hg .5 .55 tranquilo .34;i:hand-palm .15 .55 .22"},{"t":"Gracias por avisar, amigo mercurio.","s":"p:nada;Hg .5 .55 tranquilo .34;i:hand-palm .15 .55 .22"},{"t":"Dicho de otro modo:","s":"p:nada;Hg .5 .55 tranquilo .34;i:hand-palm .15 .55 .22"},{"t":"El mercurio es el único metal líquido a temperatura normal, y es tóxico.","s":"p:nada;Hg .5 .55 tranquilo .34;i:hand-palm .15 .55 .22"}]},{"id":"q_plomo","t":"Plomo, el pesado","res":"El plomo es pesado, blando y dañino para el cuerpo.","g":[{"t":"Plomo, el pesado"},{"t":"Te encuentras a un amigo pesado, que se sienta a tu lado.","s":"p:nada;Pb .62 .6 tranquilo .4;i:person .22 .58 .4"},{"t":"Hola, amigo plomo. Qué pesado estás.","s":"p:nada;Pb .62 .6 tranquilo .4;i:person .22 .58 .4"},{"t":"Sí, amigo. Y te voy a pedir algo.","s":"p:nada;Pb .62 .6 tranquilo .4;i:person .22 .58 .4"},{"t":"No me dejes entrar a tu cuerpo. Le hago daño a tu cerebro.","s":"p:cuerpo;Pb .5 .32 triste .2"},{"t":"Por eso ya no me ponen en la pintura.","s":"p:cuerpo;Pb .5 .32 triste .2"},{"t":"Pero en el dentista te cuido de los rayos X, en ese chaleco.","s":"p:nada;Pb .5 .55 feliz .3;i:shield .18 .55 .3"},{"t":"Gracias, amigo plomo.","s":"p:nada;Pb .5 .55 feliz .3;i:shield .18 .55 .3"},{"t":"Dicho de otro modo:","s":"p:nada;Pb .5 .55 feliz .3;i:shield .18 .55 .3"},{"t":"El plomo es un metal denso y tóxico que se acumula en el cuerpo, y frena la radiación.","s":"p:nada;Pb .5 .55 feliz .3;i:shield .18 .55 .3"}]},{"id":"q_uranio","t":"Uranio, el gigante","res":"El núcleo del uranio se puede partir y soltar muchísima energía.","g":[{"t":"Uranio, el gigante"},{"t":"Te encuentras a un amigo gigante, cargando muchísimas cosas.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Camina tambaleándose.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Hola, amigo uranio. ¿Estás bien?","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Más o menos, amigo. Traigo demasiado encima.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Le llega un neutrón, y se parte en dos.","s":"p:nada;U .32 .55 sorpresa .24;U .68 .55 sorpresa .24;i:sparkle .5 .25 .3 #E0A92E"},{"t":"Y al partirse suelta muchísima energía.","s":"p:nada;U .32 .55 sorpresa .24;U .68 .55 sorpresa .24;i:sparkle .5 .25 .3 #E0A92E"},{"t":"En una planta nuclear, ese calor hace electricidad.","s":"ic:nuclear-plant"},{"t":"Gracias, amigo uranio.","s":"ic:nuclear-plant"},{"t":"Dicho de otro modo:","s":"ic:nuclear-plant"},{"t":"El núcleo del uranio es grande e inestable, y al partirse libera energía: es la fisión.","s":"ic:nuclear-plant"}]},{"id":"q_neon","t":"Neón, el del letrero","res":"El neón brilla con color cuando pasa la electricidad.","g":[{"t":"Neón, el del letrero"},{"t":"Ves un letrero rojo, en una calle de noche.","s":"p:noche;Ne .5 .62 feliz .3;i:lightning .5 .2 .22 #E0A92E"},{"t":"Hola, amigo neón. ¿Por qué brillas tanto?","s":"p:noche;Ne .5 .62 feliz .3;i:lightning .5 .2 .22 #E0A92E"},{"t":"Me pasa la electricidad, amigo, y me da mucho gusto.","s":"p:noche;Ne .5 .62 feliz .3;i:lightning .5 .2 .22 #E0A92E"},{"t":"¿Y tus amigos?","s":"el:Ne,He"},{"t":"Yo no me junto mucho. Igual que el helio, no me falta nada.","s":"el:Ne,He"},{"t":"Gracias, amigo neón.","s":"el:Ne,He"},{"t":"Dicho de otro modo:","s":"el:Ne,He"},{"t":"La electricidad sube los electrones del neón, y al bajar sueltan luz roja.","s":"el:Ne,He"}]},{"id":"q_litio","t":"Litio, el viajero","res":"El litio es el metal más ligero y guarda energía en baterías.","g":[{"t":"Litio, el viajero"},{"t":"Ves un autobús, viajando entre dos ciudades.","s":"p:nada;i:bus .5 .5 .7;Li .5 .22 feliz .18"},{"t":"Hola, amigo litio. ¿A dónde vas?","s":"p:nada;i:bus .5 .5 .7;Li .5 .22 feliz .18"},{"t":"Voy y vengo, amigo. Trabajo en tu celular.","s":"p:nada;i:bus .5 .5 .7;Li .5 .22 feliz .18"},{"t":"Cargas tu teléfono, y se va para un lado.","s":"ic:device-mobile"},{"t":"Lo usas, y se regresa.","s":"ic:device-mobile"},{"t":"Gracias, amigo litio.","s":"ic:device-mobile"},{"t":"Dicho de otro modo:","s":"ic:device-mobile"},{"t":"El litio es el metal más ligero, y sus iones viajan de un lado a otro en las baterías.","s":"ic:device-mobile"}]},{"id":"q_yodo","t":"Yodo, el de tu sal","res":"El yodo es un elemento que necesita tu cuerpo.","g":[{"t":"Yodo, el de tu sal"},{"t":"Le pones sal a tu comida.","s":"p:cocina;i:fork-knife .35 .66 .28;I .68 .66 feliz .24"},{"t":"Hola, amigo, te dice una vocecita. Soy el yodo.","s":"p:cocina;i:fork-knife .35 .66 .28;I .68 .66 feliz .24"},{"t":"Hola, amigo yodo. ¿Qué haces en la sal?","s":"p:cocina;i:fork-knife .35 .66 .28;I .68 .66 feliz .24"},{"t":"Me pusieron aquí para ir a tu cuello, a una glándula que me necesita.","s":"p:cuerpo;I .5 .26 feliz .18"},{"t":"Con poquito tengo, amigo.","s":"p:cuerpo;I .5 .26 feliz .18"},{"t":"Antes también me usaban para curar heridas.","s":"p:cuerpo;I .5 .26 feliz .18"},{"t":"Gracias, amigo yodo.","s":"p:cuerpo;I .5 .26 feliz .18"},{"t":"Dicho de otro modo:","s":"p:cuerpo;I .5 .26 feliz .18"},{"t":"La tiroides usa yodo para hacer hormonas, y por eso se agrega a la sal.","s":"p:cuerpo;I .5 .26 feliz .18"}]},{"id":"q_fosforo","t":"Fósforo, el de los cerillos","res":"El fósforo está en tus huesos y en tu ADN.","g":[{"t":"Fósforo, el de los cerillos"},{"t":"Raspas un cerillo en su cajita, y prende.","s":"p:nada;i:fire .28 .5 .36 #E08A2E;P .7 .55 feliz .3"},{"t":"Hola, amigo fósforo. ¿Tú lo prendiste?","s":"p:nada;i:fire .28 .5 .36 #E08A2E;P .7 .55 feliz .3"},{"t":"Sí, amigo. Pero lo mío es otra cosa.","s":"p:nada;i:fire .28 .5 .36 #E08A2E;P .7 .55 feliz .3"},{"t":"Te lleva a tu ADN.","v":"Te lleva a tu a de ene.","s":"p:nada;i:dna .35 .5 .7;P .75 .6 feliz .24"},{"t":"Yo sostengo esta escalera, te dice.","s":"p:nada;i:dna .35 .5 .7;P .75 .6 feliz .24"},{"t":"Y también ando en tus huesos.","s":"ic:bone"},{"t":"Gracias, amigo fósforo.","s":"ic:bone"},{"t":"Dicho de otro modo:","s":"ic:bone"},{"t":"El fósforo forma parte del ADN, de los huesos, y de la molécula que guarda energía en tus células.","v":"El fósforo forma parte del a de ene, de los huesos, y de la molécula que guarda energía en tus células.","s":"ic:bone"}]},{"id":"q_tierras_raras","t":"Los imanes de tu celular","res":"Unos elementos poco conocidos hacen los imanes más fuertes.","g":[{"t":"Los imanes de tu celular"},{"t":"Ves un vecino del que casi nadie habla.","s":"p:edificio;Nd .5 .6 feliz .24"},{"t":"Hola, amigo. ¿Quién eres?","s":"p:edificio;Nd .5 .6 feliz .24"},{"t":"Soy el neodimio, amigo. Traigo tu celular vibrando.","s":"p:edificio;Nd .5 .6 feliz .24"},{"t":"Tu teléfono vibra, y ahí está su imancito.","s":"p:nada;i:device-mobile .35 .5 .6;Nd .72 .6 feliz .24"},{"t":"Luego lo ves en una turbina de viento, en grande.","s":"ic:wind"},{"t":"Gracias, amigo neodimio.","s":"ic:wind"},{"t":"Dicho de otro modo:","s":"ic:wind"},{"t":"El neodimio y sus vecinos forman los imanes más fuertes que usan los aparatos.","s":"ic:wind"}]}]},{"id":"qB1","et":"B1","mat":"q","nom":"Átomos y enlaces","lec":[{"id":"q_tres_piezas","t":"Las tres piezas del átomo","res":"Protones, neutrones y electrones forman cada átomo.","g":[{"t":"Las tres piezas del átomo"},{"t":"Abres un átomo como una nuez.","s":"@isotopos"},{"t":"En el centro hay dos tipos de amigos, muy juntitos.","s":"@isotopos"},{"t":"Hola, ¿quiénes son?","s":"@isotopos"},{"t":"Yo soy un protón, y traigo carga positiva.","s":"@isotopos"},{"t":"Yo soy un neutrón, y no traigo carga.","s":"@isotopos"},{"t":"Y allá lejos, corriendo, los electrones.","s":"p:estadio;e .84 .5 feliz .22;fl .78 .5 .54 .5"},{"t":"Si lo pesas, casi todo el peso está en el centro.","s":"ic:scales"},{"t":"Gracias, amigos.","s":"ic:scales"},{"t":"Dicho de otro modo:","s":"ic:scales"},{"t":"El núcleo tiene protones y neutrones, y casi toda la masa.","s":"ic:scales"},{"t":"Los electrones son mucho más ligeros, y tienen carga negativa.","s":"ic:scales"}]},{"id":"q_cuenta_protones","t":"Los protones dan el nombre","res":"El número de protones decide qué elemento es.","g":[{"t":"Los protones dan el nombre"},{"t":"Te encuentras a un átomo con un solo protón.","s":"@protones=1"},{"t":"Hola, amigo. ¿Cómo te llamas?","s":"@protones=1"},{"t":"Hidrógeno, amigo.","s":"@protones=1"},{"t":"Le regalas otro protón, y sonríe distinto.","s":"@protones=2"},{"t":"Ahora soy helio.","s":"@protones=2"},{"t":"Con seis es carbono, y con ocho, oxígeno.","s":"el:C,O"},{"t":"Gracias, amigos.","s":"el:C,O"},{"t":"Dicho de otro modo:","s":"el:C,O"},{"t":"El número de protones se llama número atómico, y define qué elemento es.","s":"el:C,O"},{"tipo":"barra","b":"protones","o":"Vas agregando protones al centro de un átomo, uno por uno.","pasos":[[1,"Con uno, es hidrógeno."],[2,"Con dos, ya es helio. Es otro elemento."],[6,"Con seis, es carbono, como el de un lápiz."],[8,"Con ocho, es oxígeno, el que respiras."],[20,"Con veinte, es calcio, como el de tus huesos."]]}]},{"id":"q_capas","t":"Las capas de electrones","res":"Los electrones se acomodan en capas alrededor del núcleo.","g":[{"t":"Las capas de electrones"},{"t":"Entras a un estadio con varias filas de gradas.","s":"z:Na"},{"t":"Los electrones llenan primero la fila de abajo.","s":"z:Na"},{"t":"Hola, amigos electrones. ¿Por qué no se sientan juntos?","s":"z:Na"},{"t":"En cada fila cabemos solo unos cuantos, amigo.","s":"z:Na"},{"t":"Cuando la última fila se llena, el átomo se pone muy tranquilo.","s":"z:Ne"},{"t":"Si sobra uno, quiere irse.","s":"z:Na"},{"t":"Gracias, amigos.","s":"z:Na"},{"t":"Dicho de otro modo:","s":"z:Na"},{"t":"Los electrones ocupan capas, y los de la última capa deciden cómo reacciona el átomo.","s":"z:Na"}]},{"id":"q_isotopo","t":"Primos del mismo elemento","res":"Los isótopos son el mismo elemento con diferente peso.","g":[{"t":"Primos del mismo elemento"},{"t":"Te encuentras a dos primos carbono, muy parecidos.","s":"@isotopos=6"},{"t":"Los dos tienen seis protones.","s":"@isotopos=6"},{"t":"Pero uno trae dos neutrones de más.","s":"@isotopos=8"},{"t":"Hola, primos. ¿Son iguales?","s":"@isotopos=8"},{"t":"Casi, amigo. Yo nomás peso un poquito más.","s":"@isotopos=8"},{"t":"Y gracias al pesado, se calcula la edad de un hueso antiguo.","s":"ic:bone"},{"t":"Gracias, primos.","s":"ic:bone"},{"t":"Dicho de otro modo:","s":"ic:bone"},{"t":"Los isótopos tienen los mismos protones, pero distinto número de neutrones.","s":"ic:bone"},{"tipo":"barra","b":"isotopos","o":"Ves un átomo de carbono. Le vas poniendo más neutrones.","pasos":[[6,"Con seis, es el carbono de casi todo."],[7,"Con siete, es igual, solo pesa un poquito más."],[8,"Con ocho, se vuelve inestable, y con el tiempo se rompe."]]}]},{"id":"q_filas","t":"Las filas de la tabla","res":"Cada fila de la tabla es una capa nueva de electrones.","g":[{"t":"Las filas de la tabla"},{"t":"Caminas por un pasillo del edificio de los elementos.","s":"tabla:Li,Be,B,C,N,O,F,Ne"},{"t":"En cada puerta, el vecino trae un electrón más que el anterior.","s":"tabla:Li,Be,B,C,N,O,F,Ne"},{"t":"Hola, amigo neón. ¿Tú eres el último?","s":"tabla:Li,Be,B,C,N,O,F,Ne"},{"t":"Sí, amigo. Conmigo se llena la capa.","s":"tabla:Li,Be,B,C,N,O,F,Ne"},{"t":"Bajas un piso, y el sodio empieza una capa nueva.","s":"tabla:Na"},{"t":"Gracias, amigos.","s":"tabla:Na"},{"t":"Dicho de otro modo:","s":"tabla:Na"},{"t":"Cada fila de la tabla periódica corresponde a una capa nueva de electrones.","s":"tabla:Na"}]},{"id":"q_columnas","t":"Las columnas de la tabla","res":"Los elementos de una misma columna se portan parecido.","g":[{"t":"Las columnas de la tabla"},{"t":"Conoces a una familia que vive en el mismo lado del edificio, un piso sobre otro.","s":"tabla:Li,Na,K,Rb,Cs"},{"t":"Hola, amigos. Se parecen mucho.","s":"tabla:Li,Na,K,Rb,Cs"},{"t":"Sí, amigo. Tenemos los mismos electrones en la última capa.","s":"tabla:Li,Na,K,Rb,Cs"},{"t":"Del otro lado vive la familia del cloro.","s":"tabla:F,Cl,Br,I"},{"t":"A todos nos falta uno, te dicen.","s":"tabla:F,Cl,Br,I"},{"t":"Gracias, familias.","s":"tabla:F,Cl,Br,I"},{"t":"Dicho de otro modo:","s":"tabla:F,Cl,Br,I"},{"t":"Los elementos de una columna tienen los mismos electrones externos, y reaccionan parecido.","s":"tabla:F,Cl,Br,I"}]},{"id":"q_nobles","t":"Los gases tranquilos","res":"Los gases nobles tienen su capa llena y no reaccionan.","g":[{"t":"Los gases tranquilos"},{"t":"Llegas al último pasillo del edificio, muy callado.","s":"tabla:He,Ne,Ar,Kr,Xe,Rn"},{"t":"Hola, amigos. ¿No salen a jugar?","s":"tabla:He,Ne,Ar,Kr,Xe,Rn"},{"t":"No, amigo. Estamos muy a gusto, no nos falta nada.","s":"tabla:He,Ne,Ar,Kr,Xe,Rn"},{"t":"Por eso ponían argón en los focos antiguos.","s":"ic:lightbulb"},{"t":"No le hago nada al hilo, te dice, y le ayudo a durar.","s":"ic:lightbulb"},{"t":"Gracias, amigos.","s":"ic:lightbulb"},{"t":"Dicho de otro modo:","s":"ic:lightbulb"},{"t":"Los gases nobles tienen su última capa llena, y por eso casi no reaccionan.","s":"ic:lightbulb"}]},{"id":"q_alcalinos","t":"La familia que regala","res":"Los alcalinos sueltan un electrón con mucha facilidad.","g":[{"t":"La familia que regala"},{"t":"Conoces a una familia muy generosa, con un electrón de sobra.","s":"tabla:Li,Na,K,Rb,Cs"},{"t":"Hola, amigos. ¿Quieren algo?","s":"tabla:Li,Na,K,Rb,Cs"},{"t":"No, amigo. Toma, te regalamos un electrón.","s":"tabla:Li,Na,K,Rb,Cs"},{"t":"Si caen al agua, brincan de la emoción.","s":"p:cocina;i:drop .5 .66 .36;Na .5 .32 sorpresa .22"},{"t":"Y entre más abajo viven, más fuerte reaccionan.","s":"el:K,Cs"},{"t":"Gracias, amigos.","s":"el:K,Cs"},{"t":"Dicho de otro modo:","s":"el:K,Cs"},{"t":"Los metales alcalinos tienen un electrón externo, que sueltan muy fácil.","s":"el:K,Cs"}]},{"id":"q_halogenos","t":"La familia que busca","res":"Los halógenos agarran un electrón con muchas ganas.","g":[{"t":"La familia que busca"},{"t":"Conoces a una familia a la que le falta una sola pieza.","s":"tabla:F,Cl,Br,I"},{"t":"Hola, amigos. ¿Qué buscan?","s":"tabla:F,Cl,Br,I"},{"t":"Un electrón, amigo. Solo uno.","s":"tabla:F,Cl,Br,I"},{"t":"Se encuentran con los que regalan, y todos contentos.","s":"p:nada;Na .3 .55 feliz .3;Cl .7 .55 feliz .3;e .54 .3 feliz .12;fl .38 .3 .62 .3"},{"t":"Tu amigo el flúor, el de la pasta, es de esta familia.","s":"ic:tooth"},{"t":"Gracias, amigos.","s":"ic:tooth"},{"t":"Dicho de otro modo:","s":"ic:tooth"},{"t":"Los halógenos ganan un electrón con facilidad, y forman sales con los metales.","s":"ic:tooth"}]},{"id":"q_tamano","t":"Tamaños de átomo","res":"Hacia la derecha el átomo se encoge; hacia abajo, crece.","g":[{"t":"Tamaños de átomo"},{"t":"Recorres un pasillo, midiendo a cada vecino.","s":"@radio=0"},{"t":"Oye, amigo flúor, ¿por qué eres más chiquito que el litio?","s":"@radio=6"},{"t":"Porque traigo más protones, amigo, y aprietan a mis electrones.","s":"@radio=6"},{"t":"Bajas al último piso, y te saluda el cesio, grandote.","s":"z:Cs"},{"t":"Yo traigo muchas capas, te dice.","s":"z:Cs"},{"t":"Gracias, amigos.","s":"z:Cs"},{"t":"Dicho de otro modo:","s":"z:Cs"},{"t":"Más protones en la misma capa encogen al átomo; más capas lo hacen crecer.","s":"z:Cs"},{"tipo":"barra","b":"radio","o":"Avanzas por una fila de la tabla periódica. Mira el tamaño del átomo.","pasos":[[0,"El litio es grande."],[3,"El carbono ya es más chico."],[6,"El flúor es chiquito: su núcleo jala más fuerte a los electrones."]]}]},{"id":"q_ionico","t":"El enlace de regalar","res":"En el enlace iónico, un átomo le da un electrón a otro.","g":[{"t":"El enlace de regalar"},{"t":"Te encuentras a dos amigos: a uno le sobra un dulce, y al otro le falta uno.","s":"p:nada;Na .3 .55 feliz .3;Cl .7 .55 feliz .3;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"Toma, amigo, dice el sodio.","s":"p:nada;Na .3 .55 feliz .3;Cl .7 .55 feliz .3;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"Gracias, amigo, dice el cloro.","s":"p:nada;Na .3 .55 feliz .3;Cl .7 .55 feliz .3;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"Y como ya quedaron con cargas opuestas, se atraen.","s":"p:nada;Na .4 .55 abrazo .28;Cl .62 .55 abrazo .28"},{"t":"Muchos juntos forman un cristal de sal, muy ordenado.","s":"red:nacl"},{"t":"Gracias, amigos.","s":"red:nacl"},{"t":"Dicho de otro modo:","s":"red:nacl"},{"t":"En el enlace iónico un átomo cede electrones a otro, y las cargas opuestas los mantienen unidos.","s":"red:nacl"}]},{"id":"q_covalente","t":"El enlace de compartir","res":"En el enlace covalente, los átomos comparten electrones.","g":[{"t":"El enlace de compartir"},{"t":"Te encuentras a dos amigos con una sola cobija.","s":"mol:H2"},{"t":"La comparten, y los dos se tapan.","s":"mol:H2"},{"t":"Hola, amigos hidrógeno. ¿Así se quedan?","s":"mol:H2"},{"t":"Sí, amigo. Con esta cobija estamos bien.","s":"mol:H2"},{"t":"El oxígeno comparte con dos hidrógenos, y eso es el agua.","s":"mol:H2O"},{"t":"Y en el CO₂ comparten doble.","v":"Y en el ce o dos comparten doble.","s":"mol:CO2"},{"t":"Gracias, amigos.","s":"mol:CO2"},{"t":"Dicho de otro modo:","s":"mol:CO2"},{"t":"En el enlace covalente, los átomos comparten electrones.","s":"mol:CO2"}]},{"id":"q_metalico","t":"El enlace de los metales","res":"En un metal, los electrones andan libres entre todos los átomos.","g":[{"t":"El enlace de los metales"},{"t":"Ves una alberca llena de pelotas grandes, muy juntas.","s":"red:metal"},{"t":"Alrededor nadan pelotitas sueltas.","s":"red:metal"},{"t":"Hola, amigos electrones. ¿De quién son?","s":"red:metal"},{"t":"De todos, amigo. Aquí andamos libres.","s":"red:metal"},{"t":"Por eso la electricidad pasa fácil por un cable.","s":"ic:plug"},{"t":"Y por eso puedes doblar el metal sin romperlo.","s":"ic:hammer"},{"t":"Gracias, amigos.","s":"ic:hammer"},{"t":"Dicho de otro modo:","s":"ic:hammer"},{"t":"En el enlace metálico, los electrones se mueven libres entre los átomos.","s":"ic:hammer"}]},{"id":"q_polaridad","t":"Compartir chueco","res":"Cuando un átomo jala más los electrones, la molécula queda con un lado cargado.","g":[{"t":"Compartir chueco"},{"t":"Te encuentras a dos amigos jalando la misma cobija.","s":"@polar=3"},{"t":"Uno es más fuerte, y le queda más cerca.","s":"@polar=3"},{"t":"En el agua, el oxígeno jala más que el hidrógeno.","s":"mol:H2O"},{"t":"Perdón, amigos, te dice. Es que soy muy fuerte.","s":"mol:H2O"},{"t":"Un lado queda negativo, y otro positivo.","s":"mol:H2O"},{"t":"Gracias, amiga agua.","s":"mol:H2O"},{"t":"Dicho de otro modo:","s":"mol:H2O"},{"t":"Cuando los electrones se comparten de forma desigual, el enlace es polar.","s":"mol:H2O"},{"tipo":"barra","b":"polar","o":"Ves dos átomos jalando los mismos electrones, como en una cuerda.","pasos":[[0,"Dos hidrógenos jalan igual, y los comparten parejo."],[3,"En el agua, el oxígeno jala más."],[5,"El cloro jala tanto al sodio, que casi se queda con el electrón."]]}]},{"id":"q_agua_rara","t":"Por qué el agua es tan especial","res":"Las moléculas de agua se atraen entre ellas.","g":[{"t":"Por qué el agua es tan especial"},{"t":"Ves una gota de agua en una hoja, redondita.","s":"mol:H2O"},{"t":"Hola, amigas moléculas. ¿Por qué tan juntas?","s":"mol:H2O"},{"t":"Es que nos jalamos unas a otras, amigo.","s":"mol:H2O"},{"t":"Un insecto camina sobre un charco, y no se hunde.","s":"ic:bug"},{"t":"Lo cargamos entre todas, te dicen.","s":"ic:bug"},{"t":"Gracias, amigas.","s":"ic:bug"},{"t":"Dicho de otro modo:","s":"ic:bug"},{"t":"Las moléculas de agua se atraen por puentes de hidrógeno, y eso crea tensión superficial.","s":"ic:bug"}]},{"id":"q_hielo_flota","t":"Por qué flota el hielo","res":"Al congelarse, el agua se acomoda dejando huecos.","g":[{"t":"Por qué flota el hielo"},{"t":"Ves un vaso de agua con hielos, flotando arriba.","s":"red:hielo"},{"t":"Hola, amigo hielo. ¿Por qué no te hundes?","s":"red:hielo"},{"t":"Porque me acomodo dejando huequitos, amigo.","s":"red:hielo"},{"t":"Por eso en un lago el hielo se queda arriba, y los peces viven abajo.","s":"ic:fish"},{"t":"Y por eso una botella en el congelador puede reventar.","s":"ic:beer-bottle"},{"t":"Gracias, amigo hielo.","s":"ic:beer-bottle"},{"t":"Dicho de otro modo:","s":"ic:beer-bottle"},{"t":"Al congelarse, el agua forma una red con huecos, y queda menos densa que el líquido.","s":"ic:beer-bottle"}]},{"id":"q_diamante_grafito","t":"Diamante y lápiz","res":"El mismo carbono, acomodado distinto, es otra cosa.","g":[{"t":"Diamante y lápiz"},{"t":"Traes un diamante en la mano, durísimo.","s":"red:diamante"},{"t":"Hola, amigo carbono. ¿Tú eres esto?","s":"red:diamante"},{"t":"Sí, amigo. Aquí estoy agarrado por todos lados.","s":"red:diamante"},{"t":"Ahora miras la punta de un lápiz.","s":"red:grafito"},{"t":"Aquí también soy yo, amigo, pero en capas que se resbalan.","s":"red:grafito"},{"t":"Por eso deja marca en el papel.","s":"ic:pencil"},{"t":"Gracias, amigo carbono.","s":"ic:pencil"},{"t":"Dicho de otro modo:","s":"ic:pencil"},{"t":"Diamante y grafito son carbono puro; cambia solo cómo se unen sus átomos.","s":"ic:pencil"}]},{"id":"q_grafeno","t":"Una sola capa de carbono","res":"El grafeno es una capa de carbono de un átomo de grueso.","g":[{"t":"Una sola capa de carbono"},{"t":"A la punta de un lápiz le quitas una sola capa.","s":"red:grafito"},{"t":"Es tan delgada que tiene un átomo de grueso.","s":"red:grafito"},{"t":"Hola, amigo. ¿Quién eres?","s":"red:grafito"},{"t":"Soy el grafeno, amigo. Muy delgadito, pero muy fuerte.","s":"red:grafito"},{"t":"Y la electricidad me cruza muy fácil.","s":"ic:plug"},{"t":"Gracias, amigo grafeno.","s":"ic:plug"},{"t":"Dicho de otro modo:","s":"ic:plug"},{"t":"El grafeno es una capa de carbono de un átomo de grosor, muy resistente y conductora.","s":"ic:plug"}]},{"id":"q_formula","t":"Cómo leer una fórmula","res":"Una fórmula dice qué átomos tiene una molécula y cuántos.","g":[{"t":"Cómo leer una fórmula"},{"t":"Te dan una receta muy corta: H₂O.","v":"Te dan una receta muy corta: hache dos o.","s":"mol:H2O"},{"t":"Dos de hidrógeno y uno de oxígeno, te dice la amiga agua.","s":"mol:H2O"},{"t":"Ahora, CO₂: uno de carbono y dos de oxígeno.","v":"Ahora, ce o dos: uno de carbono y dos de oxígeno.","s":"mol:CO2"},{"t":"Y CH₄: uno de carbono y cuatro de hidrógeno.","v":"Y ce hache cuatro: uno de carbono y cuatro de hidrógeno.","s":"mol:CH4"},{"t":"Gracias, amigas moléculas.","s":"mol:CH4"},{"t":"Dicho de otro modo:","s":"mol:CH4"},{"t":"La fórmula química indica qué elementos tiene una molécula, y cuántos átomos de cada uno.","s":"mol:CH4"}]},{"id":"q_mol_unidad","t":"El mol, una docena gigante","res":"Un mol es una cantidad enorme de piezas.","g":[{"t":"El mol, una docena gigante"},{"t":"Tienes una docena de huevos: siempre son doce.","s":"ic:egg"},{"t":"Un mol es igual, pero con un número enorme.","s":"@moles"},{"t":"Hola, amiga agua. ¿Cuántas son ustedes en un traguito?","s":"@moles"},{"t":"Más que granos de arena en todas las playas, amigo.","s":"@moles"},{"t":"Y eso es apenas un mol.","s":"@moles"},{"t":"Gracias, amiga agua.","s":"@moles"},{"t":"Dicho de otro modo:","s":"@moles"},{"t":"Un mol son unos seis por diez a la veintitrés partículas, y sirve para contar átomos.","s":"@moles"},{"tipo":"barra","b":"moles","o":"Vas sirviendo agua en un vaso, gramo por gramo.","pasos":[[18,"Con dieciocho gramos, un traguito, ya tienes un mol."],[54,"Con tres veces más, son tres moles."],[90,"Con cinco moles, sigue siendo menos de medio vaso."]]}]},{"id":"q_formas","t":"Las moléculas tienen forma","res":"La forma de una molécula cambia cómo se porta.","g":[{"t":"Las moléculas tienen forma"},{"t":"Te encuentras al CO₂, muy derechito.","v":"Te encuentras al ce o dos, muy derechito.","s":"mol:CO2"},{"t":"Y a la molécula de agua, como un bumerán.","s":"mol:H2O"},{"t":"Hola, amiga agua. ¿Por qué estás doblada?","s":"mol:H2O"},{"t":"Así soy, amigo. Y por eso tengo un lado positivo y otro negativo.","s":"mol:H2O"},{"t":"Una llave también depende de su forma.","s":"ic:hand-palm"},{"t":"Con las medicinas, igual.","s":"ic:hand-palm"},{"t":"Gracias, amiga agua.","s":"ic:hand-palm"},{"t":"Dicho de otro modo:","s":"ic:hand-palm"},{"t":"La geometría de una molécula influye en sus propiedades y en cómo reacciona.","s":"ic:hand-palm"}]},{"id":"q_parecido","t":"Lo parecido disuelve a lo parecido","res":"El agua se mezcla con lo que tiene carga; el aceite con lo que no.","g":[{"t":"Lo parecido disuelve a lo parecido"},{"t":"Ves un vaso con agua y un chorrito de aceite.","s":"ic:drop"},{"t":"El aceite se queda arriba.","s":"ic:drop"},{"t":"Amigos, ¿no se quieren mezclar?","s":"ic:drop"},{"t":"Es que somos muy distintos, amigo, te dice el agua.","s":"ic:drop"},{"t":"Por eso la pintura de aceite no se limpia con agua, sino con solvente.","s":"ic:paint-brush"},{"t":"Gracias, amigos.","s":"ic:paint-brush"},{"t":"Dicho de otro modo:","s":"ic:paint-brush"},{"t":"Las sustancias polares se mezclan con polares, y las no polares con no polares.","s":"ic:paint-brush"}]},{"id":"q_iones","t":"Átomos con carga","res":"Un ion es un átomo que ganó o perdió electrones.","g":[{"t":"Átomos con carga"},{"t":"Te encuentras a un átomo que regaló un electrón.","s":"z:Na"},{"t":"Ahora soy positivo, amigo, te dice.","s":"z:Na"},{"t":"Y a otro que lo recibió.","s":"z:Cl"},{"t":"Yo soy negativo, amigo.","s":"z:Cl"},{"t":"Tus nervios mandan sus mensajes moviendo a estos amigos.","s":"ic:brain"},{"t":"Gracias, amigos iones.","s":"ic:brain"},{"t":"Dicho de otro modo:","s":"ic:brain"},{"t":"Un ion es un átomo con carga, porque ganó o perdió electrones.","s":"ic:brain"}]},{"id":"q_sales","t":"No toda sal es de mesa","res":"Una sal es cualquier unión de iones positivos y negativos.","g":[{"t":"No toda sal es de mesa"},{"t":"Tomas el salero de tu mesa.","s":"red:nacl"},{"t":"Hola, amiga sal. ¿Eres la única?","s":"red:nacl"},{"t":"No, amigo. Somos muchísimas.","s":"red:nacl"},{"t":"El abono de las plantas también es una sal.","s":"ic:plant"},{"t":"Y el gis, y el mármol.","s":"mol:CaCO3"},{"t":"Gracias, amiga sal.","s":"mol:CaCO3"},{"t":"Dicho de otro modo:","s":"mol:CaCO3"},{"t":"Una sal se forma con iones positivos y negativos, ordenados en una red.","s":"mol:CaCO3"}]},{"id":"q_cristales","t":"Cristales","res":"En un cristal, los átomos se acomodan en orden repetido.","g":[{"t":"Cristales"},{"t":"Ves un grano de sal, visto con una lupa: es un cubito.","s":"red:nacl"},{"t":"Hola, amigos átomos. ¿Por qué tan ordenados?","s":"red:nacl"},{"t":"Así nos acomodamos mejor, amigo.","s":"red:nacl"},{"t":"Un copo de nieve también tiene orden: sus seis puntas salen del agua.","s":"ic:snowflake"},{"t":"Y si se forma despacio, crece más.","s":"@cristal=95"},{"t":"Gracias, amigos.","s":"@cristal=95"},{"t":"Dicho de otro modo:","s":"@cristal=95"},{"t":"Un cristal tiene sus átomos en un patrón que se repite.","s":"@cristal=95"},{"tipo":"barra","b":"cristal","o":"Ves una roca derretida que se va enfriando.","pasos":[[10,"Si se enfría rápido, sus cristales son diminutos."],[50,"Más despacio, salen medianos."],[95,"Muy despacio, salen grandes, como en un geoda."]]}]},{"id":"q_amorfo","t":"Lo que no tiene orden","res":"Un sólido amorfo tiene sus átomos desordenados.","g":[{"t":"Lo que no tiene orden"},{"t":"Ves un salón, con todas las sillas en fila: eso es un cristal.","s":"@cristal"},{"t":"Y el mismo salón, con las sillas revueltas: eso es el vidrio.","s":"ic:wine"},{"t":"Hola, amigo vidrio. ¿Por qué tan revuelto?","s":"ic:wine"},{"t":"Me enfrié muy rápido, amigo. No me dio tiempo.","s":"ic:wine"},{"t":"Por eso, al romperme, no salgo parejo.","s":"ic:hammer"},{"t":"Gracias, amigo vidrio.","s":"ic:hammer"},{"t":"Dicho de otro modo:","s":"ic:hammer"},{"t":"Un sólido amorfo no tiene un orden repetido, como el vidrio.","s":"ic:hammer"}]},{"id":"q_densidad_q","t":"Pesado para su tamaño","res":"La densidad dice cuánto pesa algo para su tamaño.","g":[{"t":"Pesado para su tamaño"},{"t":"Ves dos cajas iguales: una de plumas, y otra de plomo.","s":"@densidad=5"},{"t":"La de plomo casi no la levantas.","s":"@densidad=5"},{"t":"Hola, amigo osmio. ¿Es cierto que eres el más denso?","s":"el:Os"},{"t":"Sí, amigo. Un refresco de dos litros de mí pesaría unos 45 kilos.","s":"el:Os"},{"t":"Gracias, amigo osmio.","s":"el:Os"},{"t":"Dicho de otro modo:","s":"el:Os"},{"t":"La densidad es la masa por cada unidad de volumen.","s":"el:Os"},{"tipo":"barra","b":"densidad","o":"Tienes un kilo de varios metales. Mira el tamaño de cada cubo.","pasos":[[0,"Un kilo de litio es un cubo grande."],[3,"Un kilo de hierro ya es bastante más chico."],[6,"Un kilo de tungsteno es un cubito."],[8,"El osmio es el más denso de todos."]]}]},{"id":"q_calor_metal","t":"Metales que se derriten","res":"Cada metal se derrite a su propia temperatura.","g":[{"t":"Metales que se derriten"},{"t":"Traes un cubo de galio en la mano, derritiéndose.","s":"@fundir=40"},{"t":"Hola, amigo galio. ¿Tan poquito calor?","s":"@fundir=40"},{"t":"Sí, amigo. Con tu mano me basta.","s":"@fundir=40"},{"t":"Mi amigo el tungsteno aguanta más de tres mil grados.","s":"el:Ga,W"},{"t":"Gracias, amigos.","s":"el:Ga,W"},{"t":"Dicho de otro modo:","s":"el:Ga,W"},{"t":"El punto de fusión depende de qué tan fuerte se unen los átomos del metal.","s":"el:Ga,W"},{"tipo":"barra","b":"fundir","o":"Ves un horno con varios metales adentro. Vas subiendo el calor.","pasos":[[40,"El mercurio y el galio ya están líquidos."],[700,"El aluminio también se derritió."],[1600,"Ahora el hierro y el cobre."],[3450,"Hasta aquí aguanta el último: el tungsteno."]]}]},{"id":"q_nacen_estrellas","t":"Dónde nacieron los elementos","res":"Casi todos los átomos de tu cuerpo se hicieron en estrellas.","g":[{"t":"Dónde nacieron los elementos"},{"t":"Allá, en lo profundo del espacio, hay una estrella enorme.","s":"ic:sun"},{"t":"Hola, amiga estrella. ¿Qué cocinas?","s":"ic:sun"},{"t":"Aprieto hidrógeno, y hago helio, carbono y oxígeno.","s":"ic:sun"},{"t":"Al final exploto, y lanzo todo al espacio.","s":"ic:sun"},{"t":"El hierro de tu sangre y el calcio de tus huesos vienen de ahí.","s":"el:Fe,Ca"},{"t":"Gracias, amiga estrella.","s":"el:Fe,Ca"},{"t":"Dicho de otro modo:","s":"el:Fe,Ca"},{"t":"Las estrellas forman casi todos los elementos, por fusión nuclear.","s":"el:Fe,Ca"}]},{"id":"q_oro_estrellas","t":"De dónde salió el oro","res":"El oro se forma en choques de estrellas muy densas.","g":[{"t":"De dónde salió el oro"},{"t":"Le preguntas a tu amigo el oro de dónde viene.","s":"el:Au"},{"t":"De muy lejos, amigo.","s":"el:Au"},{"t":"Dos estrellas muy pesadas chocaron, y ahí nací.","s":"ic:sparkle"},{"t":"Luego viajé por el espacio, hasta que se formó la Tierra.","s":"ic:sparkle"},{"t":"Y mira: ya estoy en tu mano.","s":"ic:sparkle"},{"t":"Gracias, amigo oro.","s":"ic:sparkle"},{"t":"Dicho de otro modo:","s":"ic:sparkle"},{"t":"Muchos elementos pesados, como el oro, se forman en choques de estrellas de neutrones.","s":"ic:sparkle"}]},{"id":"q_recorrido","t":"Un paseo por la tabla","res":"La tabla entera cabe en un solo recorrido.","g":[{"t":"Un paseo por la tabla"},{"t":"Entras al edificio de los 118 vecinos.","s":"tabla:H,He"},{"t":"Primero te saludan los gases ligeritos.","s":"tabla:H,He"},{"t":"En medio, los metales que ya conoces.","s":"tabla:Fe,Cu,Ag,Au"},{"t":"Más adelante, los pesados que se rompen solos.","s":"tabla:U"},{"t":"Al final, los que hicimos en laboratorio, que duran menos de un segundo.","s":"tabla:Og"},{"t":"Gracias, vecinos.","s":"tabla:Og"},{"t":"Dicho de otro modo:","s":"tabla:Og"},{"t":"La tabla va de los elementos más ligeros a los más pesados, y hay 118 conocidos.","s":"tabla:Og"},{"tipo":"barra","b":"recorre","o":"Caminas por la tabla periódica, casilla por casilla.","pasos":[[1,"Empiezas en el hidrógeno, el más ligero."],[26,"Aquí está el hierro."],[79,"Más adelante, el oro."],[118,"Y al final, uno hecho en laboratorio, que dura casi nada."]]}]},{"id":"q_brillo_metal","t":"Por qué brillan los metales","res":"Los electrones libres de un metal rebotan la luz.","g":[{"t":"Por qué brillan los metales"},{"t":"Ves una cuchara limpia frente a una ventana.","s":"red:metal"},{"t":"Hola, amiga cuchara. ¿Cómo brillas?","s":"red:metal"},{"t":"Mis electrones rebotan la luz, amigo.","s":"red:metal"},{"t":"Una moneda vieja está opaca, pero la frotas y brilla otra vez.","s":"ic:coin"},{"t":"Abajo seguía igual, te dice.","s":"ic:coin"},{"t":"Gracias, amigas.","s":"ic:coin"},{"t":"Dicho de otro modo:","s":"ic:coin"},{"t":"Los electrones libres de un metal absorben y reemiten la luz, y por eso brilla.","s":"ic:coin"}]},{"id":"q_agua_universal","t":"El agua lo disuelve casi todo","res":"Las cargas del agua separan muchas sustancias.","g":[{"t":"El agua lo disuelve casi todo"},{"t":"Tu amiga el agua llega a un cristal de sal.","s":"mol:H2O"},{"t":"Con permiso, amigos, dice, y los separa con cuidado.","s":"red:nacl"},{"t":"Hola, amiga agua. ¿Cómo lo haces?","s":"red:nacl"},{"t":"Con mi lado positivo y mi lado negativo, amigo.","s":"red:nacl"},{"t":"Por eso la lluvia va disolviendo minerales de las rocas.","s":"ic:drop"},{"t":"Gracias, amiga agua.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"Por ser polar, el agua rodea los iones y los separa: es un gran disolvente.","s":"ic:drop"}]}]},{"id":"qB2","et":"B2","mat":"q","nom":"Reacciones","lec":[{"id":"q_reaccion","t":"Qué es una reacción","res":"En una reacción los átomos se acomodan de otra forma.","g":[{"t":"Qué es una reacción"},{"t":"Armas un carrito con piezas, y luego con las mismas haces una casita.","s":"rx:2H2+O2>2H2O"},{"t":"Las piezas son las mismas, pero es otra cosa.","s":"rx:2H2+O2>2H2O"},{"t":"Hola, amigos hidrógeno y oxígeno. ¿Qué hacen?","s":"rx:2H2+O2>2H2O"},{"t":"Nos estamos reacomodando, amigo. Mira: ya somos agua.","s":"rx:2H2+O2>2H2O"},{"t":"Gracias, amigos.","s":"rx:2H2+O2>2H2O"},{"t":"Dicho de otro modo:","s":"rx:2H2+O2>2H2O"},{"t":"En una reacción química, los átomos se separan y se unen de otra forma, y salen sustancias nuevas.","s":"rx:2H2+O2>2H2O"}]},{"id":"q_nada_se_pierde","t":"Nada se pierde","res":"En una reacción, los átomos no aparecen ni desaparecen.","g":[{"t":"Nada se pierde"},{"t":"Quemas una hoja de papel, y queda muy poca ceniza.","s":"ic:fire"},{"t":"Amiga hoja, ¿a dónde te fuiste?","s":"ic:fire"},{"t":"Aquí sigo, amigo, volando por el aire.","s":"ic:fire"},{"t":"Si atraparas todo y lo pesaras, sumaría igual.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Gracias, amiga hoja.","s":"ic:scales"},{"t":"Dicho de otro modo:","s":"ic:scales"},{"t":"La masa se conserva: los átomos solo cambian de lugar.","s":"ic:scales"}]},{"id":"q_balance","t":"Las recetas de la química","res":"Una ecuación química es una receta balanceada.","g":[{"t":"Las recetas de la química"},{"t":"Te dan una receta: dos panes y un jamón hacen una torta.","s":"rx:2H2+O2>2H2O"},{"t":"Hola, amigos. ¿Ustedes también tienen receta?","s":"rx:2H2+O2>2H2O"},{"t":"Sí, amigo. Dos hidrógenos y un oxígeno hacen agua.","s":"rx:2H2+O2>2H2O"},{"t":"Al gas de tu estufa le tocan dos oxígenos.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Y cuentas lo mismo de cada lado.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Gracias, amigos.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Dicho de otro modo:","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Una ecuación balanceada tiene los mismos átomos a cada lado.","s":"rx:CH4+2O2>CO2+2H2O"}]},{"id":"q_combustion","t":"Qué es quemar","res":"Quemar es una reacción rápida con oxígeno que suelta calor.","g":[{"t":"Qué es quemar"},{"t":"Estás junto a una fogata, en la noche.","s":"ic:campfire"},{"t":"Hola, amigo oxígeno. ¿Tú le ayudas?","s":"ic:campfire"},{"t":"Sí, amigo. Me junto con la madera, y soltamos calor y luz.","s":"ic:campfire"},{"t":"En tu estufa pasa igual, con gas.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Salen CO₂ y vapor de agua.","v":"Salen ce o dos y vapor de agua.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Gracias, amigo oxígeno.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Dicho de otro modo:","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"La combustión es una reacción rápida con oxígeno, que libera energía.","s":"rx:CH4+2O2>CO2+2H2O"}]},{"id":"q_dar_quitar_calor","t":"Reacciones calientes y frías","res":"Unas reacciones sueltan calor y otras lo absorben.","g":[{"t":"Reacciones calientes y frías"},{"t":"Tienes un calentador de mano, y lo aprietas.","s":"ic:fire"},{"t":"Hola, amigo. ¿Me das calor?","s":"ic:fire"},{"t":"Sí, amigo. Al reaccionar, te lo regalo.","s":"ic:fire"},{"t":"Ahora, una bolsa fría de primeros auxilios.","s":"ic:snowflake"},{"t":"Yo te lo pido prestado, amigo, por eso me siento fría.","s":"ic:snowflake"},{"t":"Gracias, amigos.","s":"ic:snowflake"},{"t":"Dicho de otro modo:","s":"ic:snowflake"},{"t":"Las reacciones exotérmicas liberan calor, y las endotérmicas lo absorben.","s":"ic:snowflake"}]},{"id":"q_rapidez","t":"Calor y rapidez","res":"Con más calor, una reacción va más rápido.","g":[{"t":"Calor y rapidez"},{"t":"Ves un pan en la mesa, y en unos días le sale moho.","s":"@velT=25"},{"t":"Y el mismo pan en el refri, que tarda mucho más.","s":"ic:snowflake"},{"t":"Hola, amigas moléculas. ¿Por qué tan lentas con frío?","s":"ic:snowflake"},{"t":"Con frío nos movemos despacito, amigo, y chocamos menos.","s":"ic:snowflake"},{"t":"Gracias, amigas.","s":"ic:snowflake"},{"t":"Dicho de otro modo:","s":"ic:snowflake"},{"t":"Con más temperatura, las moléculas chocan más y con más fuerza, y la reacción se acelera.","s":"ic:snowflake"},{"tipo":"barra","b":"velT","o":"Ves dos tipos de bolitas chocando en un frasco. Lo vas calentando.","pasos":[[5,"Con frío, se mueven despacio y casi no reaccionan."],[25,"A temperatura normal, chocan más."],[55,"Con calor, chocan muchísimo más, y hay más chispazos."]]}]},{"id":"q_mas_choques","t":"Más cantidad, más rápido","res":"Con más moléculas, hay más choques y la reacción acelera.","g":[{"t":"Más cantidad, más rápido"},{"t":"Entras a un cuarto con dos personas, que casi no se topan.","s":"@velC=4"},{"t":"Ahora, el mismo cuarto lleno de gente.","s":"@velC=40"},{"t":"Le soplas a una brasa, y se prende.","s":"ic:wind"},{"t":"Gracias, amigo aire, le dice la brasa. Me trajiste más oxígeno.","s":"ic:wind"},{"t":"Gracias, amigos.","s":"ic:wind"},{"t":"Dicho de otro modo:","s":"ic:wind"},{"t":"Con mayor concentración hay más choques, y la reacción va más rápido.","s":"ic:wind"},{"tipo":"barra","b":"velC","o":"Ves un frasco. Le vas metiendo más y más bolitas.","pasos":[[6,"Con pocas, casi no se encuentran."],[20,"Con más, ya chocan seguido."],[40,"Con muchas, los choques no paran."]]}]},{"id":"q_superficie","t":"Polvo contra trozo","res":"Entre más partido, más rápido reacciona.","g":[{"t":"Polvo contra trozo"},{"t":"Ves un tronco que no quiere prender.","s":"@trozos=1"},{"t":"Lo partes en astillas, y prende rápido.","s":"@trozos=6"},{"t":"Hola, amigas astillas. ¿Por qué ustedes sí?","s":"@trozos=6"},{"t":"Porque el oxígeno nos toca por todos lados, amigo.","s":"@trozos=6"},{"t":"Una pastilla efervescente molida se va en un momento.","s":"ic:pill"},{"t":"Gracias, amigas.","s":"ic:pill"},{"t":"Dicho de otro modo:","s":"ic:pill"},{"t":"Con más superficie expuesta, una reacción ocurre más rápido.","s":"ic:pill"},{"tipo":"barra","b":"trozos","o":"Ves un cubo de azúcar. Lo vas partiendo en trozos.","pasos":[[1,"Entero, solo el agua de afuera lo toca."],[3,"En veintisiete pedacitos, hay más orilla para el agua."],[10,"En mil, es como polvo, y se disuelve de inmediato."]]}]},{"id":"q_catalizador","t":"El ayudante","res":"Un catalizador acelera una reacción sin gastarse.","g":[{"t":"El ayudante"},{"t":"Quieres cruzar una montaña, y un amigo te abre un túnel.","s":"@catal=90"},{"t":"Llegas al mismo lugar, pero mucho más fácil.","s":"@catal=90"},{"t":"Hola, amigo. ¿Quién eres?","s":"@catal=90"},{"t":"Soy un catalizador, amigo. Yo ayudo, y me quedo igual.","s":"@catal=90"},{"t":"Trabajo en el escape de los carros.","s":"ic:car"},{"t":"Y tu cuerpo tiene miles como yo.","s":"ic:dna"},{"t":"Gracias, amigo catalizador.","s":"ic:dna"},{"t":"Dicho de otro modo:","s":"ic:dna"},{"t":"Un catalizador baja la energía que se necesita para reaccionar, y no se consume.","s":"ic:dna"},{"tipo":"barra","b":"catal","o":"Ves una bolita que tiene que subir una montaña para reaccionar.","pasos":[[5,"Con la montaña alta, casi nunca pasa."],[50,"Un catalizador baja la montaña."],[95,"Con la montaña bajita, pasa todo el tiempo."]]}]},{"id":"q_acido_base","t":"Ácidos y bases","res":"Los ácidos sueltan una piecita que las bases agarran.","g":[{"t":"Ácidos y bases"},{"t":"Te encuentras a un amigo con una pelotita, que la quiere soltar.","s":"@ph=0"},{"t":"Y a otro amigo, que la quiere atrapar.","s":"@ph=0"},{"t":"Hola, amigo limón. ¿Tú sueltas?","s":"p:nada;Limón .3 .55 feliz .26;Jabón .7 .55 feliz .26;fl .42 .3 .58 .3"},{"t":"Sí, amigo. Soy ácido.","s":"p:nada;Limón .3 .55 feliz .26;Jabón .7 .55 feliz .26;fl .42 .3 .58 .3"},{"t":"Y yo la atrapo, dice el jabón. Soy base.","s":"p:nada;Limón .3 .55 feliz .26;Jabón .7 .55 feliz .26;fl .42 .3 .58 .3"},{"t":"Gracias, amigos.","s":"p:nada;Limón .3 .55 feliz .26;Jabón .7 .55 feliz .26;fl .42 .3 .58 .3"},{"t":"Dicho de otro modo:","s":"p:nada;Limón .3 .55 feliz .26;Jabón .7 .55 feliz .26;fl .42 .3 .58 .3"},{"t":"Un ácido cede protones, y una base los acepta.","s":"p:nada;Limón .3 .55 feliz .26;Jabón .7 .55 feliz .26;fl .42 .3 .58 .3"}]},{"id":"q_neutraliza","t":"Se cancelan","res":"Un ácido y una base se cancelan y queda agua con sal.","g":[{"t":"Se cancelan"},{"t":"Tienes un vaso con ácido, y le echas base poquito a poco.","s":"@titula=25"},{"t":"Casi no pasa nada.","s":"@titula=25"},{"t":"Y de repente, se cancelan.","s":"@titula=50"},{"t":"Te arde el estómago, y tomas un antiácido.","s":"ic:pill"},{"t":"Hola, amigo. Vengo a calmarte ese ácido.","s":"ic:pill"},{"t":"Gracias, amigo antiácido.","s":"ic:pill"},{"t":"Dicho de otro modo:","s":"ic:pill"},{"t":"Un ácido y una base forman agua y una sal: es la neutralización.","s":"ic:pill"},{"tipo":"barra","b":"titula","o":"Ves un vaso con ácido. Le vas echando base, muy poco a poco.","pasos":[[25,"Al principio, casi no cambia."],[50,"Justo aquí, se cancelan, y queda neutro."],[75,"Con una gotita de más, ya se fue al otro lado."]]}]},{"id":"q_oxidar","t":"Dar y recibir electrones","res":"Oxidarse es perder electrones; alguien más los gana.","g":[{"t":"Dar y recibir electrones"},{"t":"Ahí están el hierro y el oxígeno, bajo la lluvia.","s":"p:patio;Fe .36 .66 feliz .24;O .66 .66 feliz .24;e .5 .42 feliz .1;fl .42 .36 .58 .36"},{"t":"Toma, amigo, dice el hierro. Te doy mis electrones.","s":"p:patio;Fe .36 .66 feliz .24;O .66 .66 feliz .24;e .5 .42 feliz .1;fl .42 .36 .58 .36"},{"t":"Gracias, amigo, dice el oxígeno.","s":"p:patio;Fe .36 .66 feliz .24;O .66 .66 feliz .24;e .5 .42 feliz .1;fl .42 .36 .58 .36"},{"t":"En una pila pasa igual, pero por un cable.","s":"ic:battery-full"},{"t":"Siempre que uno da, otro recibe.","s":"ic:battery-full"},{"t":"Gracias, amigos.","s":"ic:battery-full"},{"t":"Dicho de otro modo:","s":"ic:battery-full"},{"t":"Oxidarse es perder electrones, y reducirse es ganarlos: siempre ocurren juntas.","s":"ic:battery-full"}]},{"id":"q_pila_dentro","t":"Cómo funciona una pila","res":"Una pila separa quien da electrones de quien los recibe.","g":[{"t":"Cómo funciona una pila"},{"t":"Te encuentras a dos amigos en cuartos separados.","s":"@celdas"},{"t":"Uno quiere regalar electrones, y el otro los quiere.","s":"@celdas"},{"t":"La única forma es por un cable.","s":"@celdas"},{"t":"Y al pasar, prenden el foco.","s":"p:nada;Zn .22 .62 feliz .2;Cu .78 .62 feliz .2;e .5 .28 feliz .12;i:lightbulb .5 .62 .2 #E0A92E"},{"t":"Gracias, amigos.","s":"p:nada;Zn .22 .62 feliz .2;Cu .78 .62 feliz .2;e .5 .28 feliz .12;i:lightbulb .5 .62 .2 #E0A92E"},{"t":"Dicho de otro modo:","s":"p:nada;Zn .22 .62 feliz .2;Cu .78 .62 feliz .2;e .5 .28 feliz .12;i:lightbulb .5 .62 .2 #E0A92E"},{"t":"Una pila separa la oxidación y la reducción, y los electrones pasan por un circuito.","s":"p:nada;Zn .22 .62 feliz .2;Cu .78 .62 feliz .2;e .5 .28 feliz .12;i:lightbulb .5 .62 .2 #E0A92E"},{"tipo":"barra","b":"celdas","o":"Ves un foco conectado a pilas. Vas agregando una por una.","pasos":[[1,"Con una, apenas prende."],[3,"Con tres, ya se ve bien."],[6,"Con seis, brilla fuerte."]]}]},{"id":"q_recargable","t":"Lo que hace recargable a una batería","res":"Al cargarla, la reacción se regresa.","g":[{"t":"Lo que hace recargable a una batería"},{"t":"Estás usando tu celular.","s":"ic:device-mobile"},{"t":"Hola, amigo litio. ¿A dónde vas?","s":"ic:device-mobile"},{"t":"De aquí para allá, amigo, dándote energía.","s":"ic:device-mobile"},{"t":"Lo conectas, y te dice: ahora me regreso.","s":"el:Li"},{"t":"Una pila normal no aguanta ese regreso.","s":"ic:car-battery"},{"t":"Gracias, amigo litio.","s":"ic:car-battery"},{"t":"Dicho de otro modo:","s":"ic:car-battery"},{"t":"Una batería recargable usa una reacción que se puede invertir con electricidad.","s":"ic:car-battery"}]},{"id":"q_electrolisis_q","t":"Partir el agua","res":"Con electricidad se puede romper el agua en dos gases.","g":[{"t":"Partir el agua"},{"t":"Tienes dos cables metidos en agua, y los conectas a una pila.","s":"@electrolisis=6"},{"t":"Hola, amiga agua. ¿Qué te pasa?","s":"@electrolisis=6"},{"t":"Me estás separando, amigo, en hidrógeno y oxígeno.","s":"@electrolisis=6"},{"t":"De un lado salen unas burbujas, y del otro, el doble.","s":"rx:2H2O>2H2+O2"},{"t":"Algunos cohetes usan esos dos gases como combustible.","s":"ic:rocket"},{"t":"Gracias, amiga agua.","s":"ic:rocket"},{"t":"Dicho de otro modo:","s":"ic:rocket"},{"t":"La electrólisis usa electricidad para separar una sustancia: el agua da hidrógeno y oxígeno.","s":"ic:rocket"},{"tipo":"barra","b":"electrolisis","o":"Ves dos cables metidos en agua con un poco de sal. Vas subiendo el voltaje.","pasos":[[1,"Con muy poco voltaje, no pasa nada."],[4,"Con más, salen burbujas de los dos cables."],[11,"De un lado sale el doble de gas que del otro: es el hidrógeno."]]}]},{"id":"q_bano_metal","t":"Vestir un metal con otro","res":"Con electricidad se le pone una capa de metal a otro.","g":[{"t":"Vestir un metal con otro"},{"t":"Ves un anillo barato, que parece de oro.","s":"el:Cr,Au"},{"t":"Hola, amigo oro. ¿Eres todo el anillo?","s":"el:Cr,Au"},{"t":"No, amigo. Solo soy su camisita.","s":"el:Cr,Au"},{"t":"Me pegaron con electricidad.","s":"el:Cr,Au"},{"t":"A la defensa de un carro le ponen cromo igual.","s":"ic:car"},{"t":"Gracias, amigo oro.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"La galvanoplastia usa electricidad para cubrir un objeto con una capa fina de metal.","s":"ic:car"}]},{"id":"q_de_ida_y_vuelta","t":"Reacciones de ida y vuelta","res":"Algunas reacciones van para los dos lados.","g":[{"t":"Reacciones de ida y vuelta"},{"t":"Tienes dos cuartos con una puerta, y la gente pasando entre ellos.","s":"@equilibrio"},{"t":"Al rato, pasan igual para los dos lados.","s":"@equilibrio"},{"t":"Hola, amigos. ¿No se cansan?","s":"@equilibrio"},{"t":"No, amigo. Vamos y venimos, pero siempre somos los mismos en cada cuarto.","s":"@equilibrio"},{"t":"En un refresco cerrado, el gas hace lo mismo.","s":"ic:beer-bottle"},{"t":"Gracias, amigos.","s":"ic:beer-bottle"},{"t":"Dicho de otro modo:","s":"ic:beer-bottle"},{"t":"En el equilibrio químico, la reacción ocurre en los dos sentidos a la misma velocidad.","s":"ic:beer-bottle"},{"tipo":"barra","b":"equilibrio","o":"Ves dos tanques conectados. Le echas más a uno.","pasos":[[10,"Lo que agregas pasa al otro tanque."],[35,"Los dos suben parejo."],[60,"Por más que agregues, se vuelven a repartir."]]}]},{"id":"q_la_contra","t":"El equilibrio responde","res":"Si cambias un equilibrio, se mueve para compensar.","g":[{"t":"El equilibrio responde"},{"t":"Metes más gente en uno de los cuartos.","s":"@equilibrio"},{"t":"Con permiso, amigos, dicen, y se pasan al otro.","s":"@equilibrio"},{"t":"Destapas un refresco, y le quitas la presión.","s":"ic:beer-bottle"},{"t":"Ya voy, amigo, dice el gas, y se suelta.","s":"ic:beer-bottle"},{"t":"Gracias, amigos.","s":"ic:beer-bottle"},{"t":"Dicho de otro modo:","s":"ic:beer-bottle"},{
