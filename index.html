<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F3F6EE"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icono-192.png"><title>Modo Susurro</title><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Modo Susurro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500&display=swap">
<style>
/* Diseño: una frase a la vez, iconos en vez de texto y controles casi invisibles arriba. Claro por defecto; oscuro suave a elección. */
:root{
  color-scheme:light;
  --papel:#E9EFE4; --hoja:#F2F5EC; --linea:#BFCDBB;
  --tinta:#26352F; --suave:#5A6A62; --azul:#2B4A92; --sobre-azul:#F5F7FC;
  --bien:#1B6E47; --bien-fondo:#D5E8D9; --tibio:rgba(214,178,110,.13);
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --texto:"Atkinson Hyperlegible",Verdana,sans-serif;
  --lento:1.5s;
}
:root[data-tema=oscuro]{
  color-scheme:dark;
  --papel:#1F2723; --hoja:#2A342F; --linea:#47554D;
  --tinta:#D5DDD3; --suave:#9BA99F; --azul:#A5BAE6; --sobre-azul:#17201C;
  --bien:#86CDA5; --bien-fondo:#27402F; --tibio:rgba(170,120,50,.07);
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;touch-action:none;background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:1.05rem;overflow:hidden;transition:background-color .5s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
svg{display:block;fill:currentColor}
#tibio{position:fixed;inset:0;background:var(--tibio);opacity:0;pointer-events:none;transition:opacity 180s linear}
#tibio.on{opacity:1}
#escena{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding-block:3.5rem 2rem;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
#marco{width:100%;max-width:44rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1rem;opacity:0;transition:opacity var(--lento) ease}
#marco.ve{opacity:1}
#marco:not(.ve){pointer-events:none}
#controles{position:fixed;z-index:3;top:env(safe-area-inset-top,0px);right:max(8px,env(safe-area-inset-right,0px));left:max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:flex-end;gap:.15rem;pointer-events:none}
#controles button{pointer-events:auto;width:2.9rem;height:2.9rem;display:grid;place-items:center;color:var(--suave);opacity:.75}
#controles svg{width:1.5rem;height:1.5rem}
#brillo-zona{position:fixed;z-index:3;left:0;top:0;bottom:0;width:calc(3.1rem + env(safe-area-inset-left,0px));padding-left:env(safe-area-inset-left,0px);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding-block:.6rem .9rem;color:var(--suave)}
#brillo-zona span{width:1.45rem;height:1.45rem;opacity:.6;display:block}
#brillo-zona #br-bajo{width:1.1rem;height:1.1rem;opacity:.35}
#brillo-velo{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}
.obs{font-family:var(--display);font-weight:500;font-size:1.05rem;line-height:1.25;color:var(--azul);margin:0;text-wrap:balance}
.toca{display:flex;align-items:center;gap:.5rem;color:var(--azul);height:2.1rem}
.mano{width:1.9rem;height:1.9rem;display:block}
.luzita{width:.7rem;height:.7rem;border-radius:50%;background:var(--azul);animation:parpadea 1.1s ease-in-out infinite}
@keyframes parpadea{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
#pista{position:fixed;left:0;right:0;bottom:calc(.9rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));color:var(--suave);font-size:.92rem;opacity:0;transition:opacity 1s;pointer-events:none}
#pista.ve{opacity:1}
.frase{font-family:var(--display);font-weight:500;font-size:clamp(2rem,8.5vmin,3.6rem);line-height:1.15;letter-spacing:-.015em;text-wrap:balance;margin:0}
.chica{color:var(--suave);font-size:1.1rem;margin:0;font-variant-numeric:tabular-nums}
.dato{font-family:var(--display);font-weight:500;font-size:clamp(2.4rem,11vmin,4.4rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vis{display:block;width:100%;height:clamp(11rem,36vh,19rem)}
.lado{display:flex;flex-direction:column;align-items:center;gap:.6rem;min-width:0;width:100%}
.linea{width:min(100%,14rem);height:.2rem;border-radius:1rem;background:var(--linea);overflow:hidden}
.linea i{display:block;height:100%;background:var(--azul);border-radius:1rem}
.ayuda{font-size:.92rem;transition:opacity .6s}
#b-r.sr{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3.25rem;background:transparent;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:.3rem;background:var(--linea);border-radius:1rem}
input[type=range]::-moz-range-track{height:.3rem;background:var(--linea);border-radius:1rem}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2.1rem;height:2.1rem;margin-top:-.9rem;border-radius:50%;background:var(--azul);border:4px solid var(--hoja)}
input[type=range]::-moz-range-thumb{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);border:4px solid var(--hoja)}
.primario{min-height:3.5rem;padding:.5rem 2.5rem;border-radius:2rem;background:var(--azul);color:var(--sobre-azul);font-weight:700;font-size:1.1rem;text-align:center}
.quieto{min-height:2.75rem;padding:.3rem 1rem;color:var(--azul);text-align:center}
.hoja{touch-action:pan-y;position:fixed;left:0;right:0;bottom:0;background:var(--hoja);border-radius:1.2rem 1.2rem 0 0;padding-top:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-height:92%;overflow:auto;z-index:5}
.hoja-in{width:100%;max-width:42rem;margin-inline:auto;display:flex;flex-direction:column;gap:.8rem;padding-right:2.5rem}
.ctl-t{display:flex;justify-content:space-between;color:var(--suave);font-size:.95rem}
.ajuste{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.ajuste>span{color:var(--suave);font-size:.95rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{min-height:2.75rem;min-width:2.75rem;padding:.25rem .9rem;border-radius:2rem;background:var(--papel);font-size:.95rem;text-align:center}
#aviso-mano,#aviso-marco{position:fixed;pointer-events:none;opacity:0}
#aviso-marco{inset:0;z-index:5;box-shadow:inset 0 0 2.2rem .4rem #e0b45c}
#aviso-marco.va{animation:marcoB 3.2s ease-in-out 1 both}
#aviso-mano{left:50%;top:50%;width:min(38vmin,12rem);height:min(38vmin,12rem);margin:calc(min(38vmin,12rem)/-2);z-index:6;color:var(--azul)}
#aviso-mano svg{width:100%;height:100%;fill:currentColor}
#aviso-mano.va{animation:manoD 1.6s ease-in-out 2 both}
@keyframes marcoB{0%,100%{opacity:0}25%{opacity:.28}50%{opacity:0}75%{opacity:.28}}
@keyframes manoD{0%{opacity:0;transform:translateX(-16vmin)}20%{opacity:.55}75%{opacity:.55}100%{opacity:0;transform:translateX(16vmin)}}
@media (prefers-reduced-motion:reduce){#aviso-mano.va{animation:manoQ 3.2s ease-in-out 1 both}@keyframes manoQ{0%,100%{opacity:0}50%{opacity:.5}}}
#controles,#br-alto,#br-bajo{transition:opacity .6s}
body.limpio #controles{opacity:0}
body.limpio #controles button{pointer-events:none}
body.limpio #brillo-zona span{opacity:0!important;transition:opacity .6s}
body.limpio.ajusta-brillo #brillo-zona span{opacity:.6!important}
.menu-ini.raiz{display:flex!important;flex-direction:column!important;align-items:center}
.menu-ini.raiz .mi small{display:block;margin:0}
.mi.inicia{font-size:clamp(2rem,10vmin,3rem);min-height:4rem}
.elegir{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.mat-et{flex-basis:100%;font-size:.8rem;color:var(--suave);margin-top:.25rem}
.chip[aria-pressed=true]{background:var(--azul);color:var(--sobre-azul)}
.lista{display:grid;grid-template-columns:1fr;gap:.1rem}
.fila{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:3rem;padding:.3rem .2rem;width:100%}
.fila .check{width:1.2rem;height:1.2rem;color:var(--bien);flex:none}
.nota{color:var(--suave);font-size:.92rem;margin:0}
.menu-ini{display:flex;flex-direction:column;align-items:center;gap:.15rem;width:100%}
.mi{min-height:3.1rem;min-width:13rem;padding:.3rem 1rem;font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,5.5vmin,2.1rem);line-height:1.15;text-align:center;border-radius:1rem;color:var(--tinta)}
.mi[disabled]{opacity:.4;cursor:default}
.niveles-sel{justify-content:center}
.niveles-sel .chip:not([aria-pressed=true]){background:var(--hoja)}
.mi small{display:block;font-family:var(--texto);font-weight:400;font-size:.9rem;color:var(--suave)}
.cierra{position:absolute;top:.35rem;right:max(.5rem,env(safe-area-inset-right,0px));width:2.75rem;height:2.75rem;display:grid;place-items:center;color:var(--suave);z-index:1}
.cierra svg{width:1.3rem;height:1.3rem}
.fila[disabled]{color:var(--suave);cursor:default}
.puntos{display:flex;gap:.4rem;padding-block:.15rem .35rem}
.puntos i{width:.6rem;height:.6rem;border-radius:50%;background:var(--linea)}
.puntos i.h{background:var(--bien)}
.puntos i.a{background:var(--azul)}
@media (orientation:landscape) and (max-height:560px){
  #escena{padding-block:.75rem;padding-right:max(3.75rem,env(safe-area-inset-right,0px));padding-left:max(3.75rem,env(safe-area-inset-left,0px))}
  #controles{bottom:0;left:auto;flex-direction:column;justify-content:flex-start}
  #marco{gap:.35rem}
  .menu-ini{gap:0}
  .raiz{display:grid;grid-template-columns:1fr 1fr;justify-items:center;gap:.2rem 1rem}
  .mi{min-height:2.55rem;font-size:clamp(1.25rem,6.5vmin,1.6rem);padding-block:.1rem}
  .mi small{display:inline;margin-left:.5rem;font-size:.8rem}
  .frase{font-size:clamp(1.8rem,11vmin,3rem)}
  #marco.con-vis{flex-direction:row;max-width:none;gap:1.5rem;height:100%}
  .con-vis .vis{flex:1.15 1 0;width:auto;min-width:0;height:100%}
  .con-vis .lado{flex:1 1 0}
  .con-vis .frase{font-size:clamp(1.5rem,8.5vmin,2.3rem)}
  .obs{font-size:.92rem}
  .lado{gap:.25rem}
  .toca{height:1.7rem}
  .mano{width:1.5rem;height:1.5rem}
  .dato{font-size:clamp(2rem,12vmin,3.2rem)}
  input[type=range]{height:2.75rem}
  .lista{grid-template-columns:1fr 1fr;column-gap:1.5rem}
  .hoja{right:3.5rem;left:max(0px,env(safe-area-inset-left,0px));border-radius:1.2rem 1.2rem 0 0;padding-top:.6rem}
  .hoja-in{gap:.45rem}
}
@media (prefers-reduced-motion:reduce){:root{--lento:.01s}#tibio,body{transition:none}}
</style>

<div id="tibio"></div>
<div id="escena"><div id="marco" class="ve"></div></div>
<div id="controles">
  <button id="b-menu" aria-label="Niveles y lecciones"></button>
  <button id="b-pausa" aria-label="Pausar"></button>
  <button id="b-tema" aria-label="Cambiar entre modo claro y oscuro"></button>
  <button id="b-ajustes" aria-label="Configuración"></button>
  <button id="b-completa" aria-label="Pantalla completa" hidden></button>
</div>
<div id="brillo-zona" aria-hidden="true"><span id="br-alto"></span><span id="br-bajo"></span></div>
<div id="brillo-velo"></div>
<div id="aviso-marco" aria-hidden="true"></div><div id="aviso-mano" aria-hidden="true"></div>
<div id="pista"><span>← atrás</span><span>panel</span><span>sigue →</span></div>

<div id="s-ajustes" class="hoja" hidden><button class="cierra" aria-label="Cerrar"></button><div class="hoja-in">
  <div>
    <div class="ctl-t"><label for="ritmo">Ritmo</label><span id="ritmo-v"></span></div>
    <input type="range" id="ritmo" min="0.7" max="1.4" step="0.05" value="1">
  </div>
    <div>
    <div class="ctl-t"><label for="lluvia">Volumen de la lluvia</label><span id="lluvia-v"></span></div>
    <input type="range" id="lluvia" min="0" max="1" step="0.02" value="0">
  </div>
  <div id="c-voz" hidden><div class="ctl-t"><span>Voz sin internet</span><span id="voz-v"></span></div><button class="chip" id="b-voz" style="margin-top:.35rem">Descargar toda la voz</button></div>
  <p class="nota" id="av-audio" hidden>Este navegador no reproduce la voz; verás solo el texto.</p>
</div></div>

<div id="s-menu" class="hoja" hidden><button class="cierra" aria-label="Cerrar"></button><div class="hoja-in">
  <div class="chips" id="niveles"></div>
  <p class="chica" id="n-nombre"></p>
  <div class="lista" id="lecs"></div>
    <button class="fila" id="a-inicio"><span>Volver al inicio</span></button>

<script>
"use strict";
const NIVELES=[{"id":"A1","nom":"Lo cotidiano","lec":[{"id":"medir","t":"Medir","res":"Medir es decir cuánto, con números.","g":[{"t":"Medir"},{"t":"Un amigo te dice: está lejos.","s":"ic:hand-palm"},{"t":"Hola, amigo. ¿Lejos como la tienda, o como la Luna?","s":"ic:hand-palm"},{"t":"No sé, amigo. Se me olvidó medir.","s":"ic:hand-palm"},{"t":"Por eso tenemos tres amigos: el metro, el segundo y el kilogramo.","s":"tres"},{"t":"Yo digo qué tan largo es algo, dice el metro.","s":"tres"},{"t":"Yo digo cuánto tarda, dice el segundo.","s":"tres"},{"t":"Y yo digo cuánta cosa hay, dice el kilogramo.","s":"tres"},{"t":"Una puerta mide unos dos metros.","s":"ic:door"},{"t":"Y un litro de leche pesa como un kilo.","s":"ic:drop-half"},{"t":"Gracias, amigos.","s":"ic:drop-half"},{"t":"Dicho de otro modo:","s":"ic:drop-half"},{"t":"Medir es comparar con una unidad. Las básicas son metro, segundo y kilogramo.","s":"ic:drop-half"},{"tipo":"barra","b":"escala","o":"Empiezas muy chiquito, y vas creciendo.","pasos":[[0,"Eres del tamaño de un átomo."],[4,"Ya eres una persona."],[6,"Ahora, del tamaño de la Tierra."],[9,"Y al final, todo el universo que se puede ver."]]}]},{"id":"moverse","t":"Moverse","res":"Velocidad es cuánto camino recorres, en cuánto tiempo.","g":[{"t":"Moverse"},{"t":"Vas en tu bici, muy a gusto.","s":"p:nada;i:bicycle .3 .6 .42;Velocidad .72 .56 feliz .26"},{"t":"Hola, amiga velocidad. ¿Tú qué eres?","s":"p:nada;i:bicycle .3 .6 .42;Velocidad .72 .56 feliz .26"},{"t":"Soy cuánto camino recorres, en cuánto tiempo.","s":"p:nada;i:bicycle .3 .6 .42;Velocidad .72 .56 feliz .26"},{"t":"Un carro a cien kilómetros por hora recorre cien en una hora.","s":"vdt"},{"t":"Caminando, recorres unos cinco.","s":"vdt"},{"tipo":"barra","b":"viaje","o":"Vas de Chihuahua a Juárez. Eliges cómo.","pasos":[[25,"Caminando, tardarías días."],[60,"En carro, unas horas."],[92,"En avión de los rápidos, poquito."]]},{"t":"Y acostado en tu cama también te mueves, porque la Tierra gira y te lleva.","s":"giro"},{"t":"Cuando pisas el pedal, aceleras. Al frenar y al dar vuelta, también.","s":"acelera"},{"t":"Gracias, amiga velocidad.","s":"acelera"},{"t":"Dicho de otro modo:","s":"acelera"},{"t":"La velocidad es la distancia entre el tiempo. Acelerar es cambiar esa velocidad.","s":"acelera"}]},{"id":"inercia","t":"Inercia","res":"Las cosas siguen como van, hasta que algo las cambia.","g":[{"t":"Inercia"},{"t":"Vas de pie en un camión, y frena de golpe.","s":"frenazo"},{"t":"Tu cuerpo se va para adelante.","s":"frenazo"},{"t":"Oye, cuerpo, ¿quién te empujó?","s":"frenazo"},{"t":"Nadie, amigo. Yo iba muy a gusto, y quería seguir.","s":"frenazo"},{"t":"Jalas rápido un mantel, y los platos casi no se mueven.","s":"p:cocina;Plato .5 .62 tranquilo .28"},{"t":"Queríamos seguir quietos, amigo.","s":"p:cocina;Plato .5 .62 tranquilo .28"},{"tipo":"barra","b":"inercia","o":"Lanzas un disco por distintos pisos.","pasos":[[0,"En alfombra, frena pronto."],[2,"En hielo, sigue mucho más."],[3,"Sin fricción, no se detiene."]]},{"t":"Por eso sirve el cinturón: frena tu cuerpo junto con el carro.","s":"frenazo"},{"t":"Gracias, amigos.","s":"frenazo"},{"t":"Dicho de otro modo:","s":"frenazo"},{"t":"La inercia es la tendencia a seguir igual: quieto o en movimiento, hasta que una fuerza lo cambie.","s":"frenazo"}]},{"id":"fuerza","t":"Fuerza","res":"Más fuerza, arranca más rápido. Más masa, arranca más lento.","g":[{"t":"Fuerza"},{"t":"Empujas un carrito del súper vacío, y arranca fácil.","s":"carrito"},{"t":"Lo llenas, y con el mismo empujón, arranca lento.","s":"carritos"},{"t":"Oye, carrito, ¿qué te pasa?","s":"carritos"},{"t":"Traigo más masa, amigo. Me cuesta más.","s":"carritos"},{"t":"Pateas un balón, y sale volando.","s":"ic:soccer-ball"},{"t":"Pateas una piedra grande, y te duele el pie.","s":"ic:soccer-ball"},{"tipo":"barra","b":"fuerza","o":"Empujas distintas cosas, con la misma fuerza.","pasos":[[0,"Una mochila sale disparada."],[3,"Una persona, mucho menos."],[5,"Un carro casi no se mueve."]]},{"t":"Empujas una pared, y sientes que te empuja también.","s":"pared"},{"t":"Así somos, amigo, te dice. Las fuerzas vienen en pareja.","s":"pared"},{"t":"Por eso vuela un cohete: lanza gas hacia abajo, y el gas lo empuja hacia arriba.","s":"cohete"},{"t":"Gracias, amigos.","s":"cohete"},{"t":"Dicho de otro modo:","s":"cohete"},{"t":"La aceleración depende de la fuerza y de la masa. Y toda fuerza tiene su pareja opuesta.","s":"cohete"}]},{"id":"caida","t":"Caída libre","res":"Sin aire, todo cae igual de rápido.","g":[{"t":"Caída libre"},{"t":"Sueltas una mancuerna y una pluma, y gana la mancuerna.","s":"aire"},{"t":"Amiga pluma, ¿por qué tan lenta?","s":"aire"},{"t":"Es que me frena el aire, amigo.","s":"aire"},{"t":"Sin aire, las dos llegan juntas.","s":"igual"},{"t":"Un astronauta lo hizo en la Luna, con un martillo y una pluma.","s":"igual"},{"t":"Una hoja de papel cae despacito.","s":"aire"},{"t":"La haces bolita, y cae rápido. Es la misma hoja.","s":"igual"},{"t":"Gracias, amiga pluma.","s":"igual"},{"t":"Dicho de otro modo:","s":"igual"},{"t":"En el vacío, todo cae con la misma aceleración. Lo que cambia las cosas es el aire.","s":"igual"},{"tipo":"barra","b":"caida","o":"Sueltas una pelota, desde cada vez más alto.","pasos":[[15,"Desde una silla, casi nada."],[50,"Desde una casa, un rato."],[100,"Desde un edificio, más de cuatro segundos."]]}]},{"id":"peso","t":"Masa y peso","res":"Tu masa no cambia. Tu peso depende de dónde estés.","g":[{"t":"Masa y peso"},{"t":"Traes una mochila de diez kilos.","s":"materia"},{"t":"Hola, amiga mochila. ¿Cuánta cosa traes?","s":"materia"},{"t":"Eso es mi masa, amigo. Y no cambia, aunque viajes.","s":"materia"},{"t":"Te vas a la Luna, y se siente como de menos de dos kilos.","s":"p:nada;i:moon .28 .4 .46;Mochila .7 .6 feliz .28"},{"t":"Es que aquí me jalan menos, amigo. Eso es mi peso.","s":"p:nada;i:moon .28 .4 .46;Mochila .7 .6 feliz .28"},{"tipo":"barra","b":"peso","o":"Te llevas tu báscula a otros mundos.","pasos":[[0,"En la Luna, marcas poquito."],[2,"En la Tierra, tu peso normal."],[3,"En Júpiter, casi el triple."],[4,"Y en el Sol, muchísimo."]]},{"t":"Allá arriba, los astronautas flotan porque van cayendo alrededor de la Tierra.","s":"astro"},{"t":"Gracias, amiga mochila.","s":"astro"},{"t":"Dicho de otro modo:","s":"astro"},{"t":"La masa es la cantidad de materia. El peso es la fuerza con que un planeta la jala.","s":"astro"}]},{"id":"energia","t":"Energía","res":"La energía no se gasta: cambia de forma.","g":[{"t":"Energía"},{"t":"Subes una pelota a lo alto, y la sueltas.","s":"alto"},{"t":"Hola, amiga energía. ¿Dónde estabas?","s":"alto"},{"t":"Guardada arriba, amigo. Ahora soy movimiento.","s":"alto"},{"t":"Y cuando frena, me vuelvo calor.","s":"calienta"},{"t":"Te frotas las manos, y se calientan.","s":"calienta"},{"t":"La comida también me guarda, y por eso puedes correr.","s":"ic:bread"},{"tipo":"barra","b":"energia","o":"Tu carro frena a distintas velocidades.","pasos":[[30,"A treinta, frena en poco camino."],[60,"Al doble de velocidad, necesita cuatro veces más camino."],[120,"A ciento veinte, dieciséis veces más."]]},{"t":"Gracias, amiga energía.","s":"ic:bread"},{"t":"Dicho de otro modo:","s":"ic:bread"},{"t":"La energía no se crea ni se destruye: solo cambia de forma.","s":"ic:bread"}]},{"id":"calor","t":"Calor","res":"Temperatura es qué tan rápido se mueven las partículas.","g":[{"t":"Calor"},{"t":"Te asomas muy adentro de una gota de agua.","s":"agita"},{"t":"Hola, amigas partículas. ¿Nunca se quedan quietas?","s":"agita"},{"t":"Nunca, amigo. Con frío despacio, y con calor muy rápido.","s":"agita"},{"tipo":"barra","b":"calor","o":"Calientas el agua, y te asomas adentro.","pasos":[[-20,"En el hielo, apenas tiemblan."],[50,"En el agua, se resbalan."],[120,"En el vapor, salen volando."]]},{"t":"Dejas una cuchara en la sopa, y el calor sube hasta tu mano.","s":"cuchara"},{"t":"Y tu cobija no te da calor: lo das tú, y ella lo guarda.","s":"cobija"},{"t":"Gracias, amigas.","s":"cobija"},{"t":"Dicho de otro modo:","s":"cobija"},{"t":"La temperatura mide qué tan rápido se mueven las partículas. El calor pasa de lo caliente a lo frío.","s":"cobija"}]},{"id":"sonido","t":"Sonido","res":"El sonido es algo que vibra y empuja el aire hasta tu oído.","g":[{"t":"Sonido"},{"t":"Pones los dedos en tu garganta, y tarareas.","s":"cuerda"},{"t":"Se siente temblar.","s":"cuerda"},{"t":"Hola, amigo sonido. ¿Eres tú?","s":"cuerda"},{"t":"Sí, amigo. Soy algo que vibra.","s":"cuerda"},{"t":"Empujo el aire, y el aire empuja tu oído.","s":"oido"},{"t":"Si vibro despacio, sueno como un tambor. Si vibro rápido, como un silbato.","s":"agudo"},{"tipo":"barra","b":"sonido","o":"Vas subiendo una nota.","pasos":[[0,"Aquí vibra despacio, y suena grave."],[33,"Aquí vibra el doble: la misma nota, más arriba."],[100,"Y aquí, ocho veces más rápido."]]},{"t":"En el espacio no hay aire, y por eso no me oyes.","s":"vacio"},{"t":"Gracias, amigo sonido.","s":"vacio"},{"t":"Dicho de otro modo:","s":"vacio"},{"t":"El sonido es una vibración que viaja por el aire. Más vibraciones por segundo suenan más agudo.","s":"vacio"}]},{"id":"luz","t":"Luz","res":"La luz es lo más rápido que hay, y cada color es una onda distinta.","g":[{"t":"Luz"},{"t":"Prendes un foco en tu cuarto, y te llega de inmediato.","s":"vueltas"},{"t":"Hola, amiga luz. ¿Qué tan rápido vas?","s":"vueltas"},{"t":"Le doy siete vueltas a la Tierra en un segundo, amigo.","s":"vueltas"},{"tipo":"barra","b":"luz","o":"Pasas por todos los colores de la luz.","pasos":[[360,"Aquí es ultravioleta, y no lo ves."],[470,"Ahora azul."],[530,"Verde."],[650,"Rojo."],[780,"Y aquí ya es infrarroja."]]},{"t":"Y yo blanca, soy una mezcla de colores.","s":"mezcla"},{"t":"En el arcoíris, las gotas me separan.","s":"mezcla"},{"t":"El cielo se ve azul porque el aire rebota más mi azul.","s":"cielo"},{"t":"Gracias, amiga luz.","s":"cielo"},{"t":"Dicho de otro modo:","s":"cielo"},{"t":"La luz viaja como una onda, a unos 300 mil kilómetros por segundo. Cada color es una onda distinta.","s":"cielo"}]},{"id":"gravedad","t":"Caída 2: la gravedad","res":"La gravedad es el jalón que une a todo lo que tiene masa.","g":[{"t":"Caída 2: la gravedad"},{"t":"Sueltas una piedra, y cae.","s":"jalon"},{"t":"Hola, amiga gravedad. ¿Tú la jalaste?","s":"jalon"},{"t":"Sí, amigo. Yo jalo todo hacia el centro de la Tierra.","s":"jalon"},{"t":"Por eso en Australia nadie se cae al espacio.","s":"giro"},{"t":"Lanzas una pelota hacia arriba, la freno, y te la regreso.","s":"@caida"},{"tipo":"barra","b":"caida","o":"Sueltas una pelota, desde cada vez más alto.","pasos":[[15,"Desde una silla, casi nada."],[50,"Desde una casa, un rato."],[100,"Desde un edificio, más de cuatro segundos."]]},{"t":"Gracias, amiga gravedad.","s":"@caida"},{"t":"Dicho de otro modo:","s":"@caida"},{"t":"La gravedad es la atracción entre todo lo que tiene masa. Más masa, más atracción.","s":"@caida"}]},{"id":"friccion","t":"Fuerza 2: la fricción","res":"La fricción es el roce que frena las cosas, y también nos permite caminar.","g":[{"t":"Fuerza 2: la fricción"},{"t":"Empujas una caja por el piso, y cuesta.","s":"friccion"},{"t":"Hola, amiga fricción. ¿Tú la estás frenando?","s":"friccion"},{"t":"Sí, amigo. Soy el roce entre las dos cosas.","s":"friccion"},{"t":"En hielo, casi no estoy, y te resbalas.","s":"@inercia=2"},{"t":"Pero sin mí, tampoco podrías caminar.","s":"ic:sneaker"},{"t":"Unos tenis nuevos me usan para agarrarse del piso.","s":"ic:sneaker"},{"tipo":"barra","b":"inercia","o":"Lanzas un disco por distintos pisos.","pasos":[[0,"En alfombra, frena pronto."],[2,"En hielo, sigue mucho más."],[3,"Sin fricción, no se detiene."]]},{"t":"Gracias, amiga fricción.","s":"ic:sneaker"},{"t":"Dicho de otro modo:","s":"ic:sneaker"},{"t":"La fricción es la fuerza entre dos superficies que se rozan.","s":"ic:sneaker"}]},{"id":"palanca","t":"Palancas","res":"Con un brazo más largo, levantas lo mismo con mucha menos fuerza.","g":[{"t":"Palancas"},{"t":"Vas a un sube y baja: de un lado un niño, y del otro un adulto.","s":"@palanca"},{"t":"Si el niño se sienta más lejos, levanta al adulto.","s":"@palanca"},{"t":"Hola, amiga palanca. ¿Cómo lo haces?","s":"@palanca"},{"t":"Con un brazo más largo, amigo, se necesita menos fuerza.","s":"@palanca"},{"t":"Por eso empujas la puerta lejos de las bisagras.","s":"ic:door"},{"tipo":"barra","b":"palanca","o":"Levantas una piedra con un palo más largo.","pasos":[[1,"Con uno corto, mucha fuerza."],[3,"Con tres metros, mucho menos."],[6,"Con seis, muy poquita."]]},{"t":"Gracias, amiga palanca.","s":"ic:door"},{"t":"Dicho de otro modo:","s":"ic:door"},{"t":"Una palanca multiplica la fuerza: el brazo largo se mueve más, y empuja menos.","s":"ic:door"}]},{"id":"energia2","t":"Energía 2: de dónde viene","res":"Casi toda la energía que usamos empezó como luz del Sol.","g":[{"t":"Energía 2: de dónde viene"},{"t":"Te comes un taco, y te dan ganas de correr.","s":"radia"},{"t":"Hola, amiga energía. ¿De dónde vienes?","s":"radia"},{"t":"Del Sol, amigo.","s":"radia"},{"t":"Una planta me guardó, una vaca se la comió, y ahora estoy en ti.","s":"ic:leaf"},{"t":"La gasolina también: es luz del Sol antigua, guardada bajo tierra.","s":"ic:gas-pump"},{"t":"Y el viento, porque el Sol calienta el aire.","s":"ic:wind"},{"t":"Gracias, amiga energía.","s":"ic:wind"},{"t":"Dicho de otro modo:","s":"ic:wind"},{"t":"Casi toda la energía que usamos viene del Sol, guardada en plantas, combustibles y viento.","s":"ic:wind"}]},{"id":"calor2","t":"Calor 2: derretir y hervir","res":"Al calentar algo, llega un punto en que cambia de sólido a líquido, o a gas.","g":[{"t":"Calor 2: derretir y hervir"},{"t":"Sacas un hielo del congelador, y se derrite.","s":"@calor=-10"},{"t":"Hola, amigas partículas. ¿Ya se soltaron?","s":"@calor=-10"},{"t":"Sí, amigo. Con tanto calor, ya no nos agarramos.","s":"@calor=-10"},{"t":"Pones una olla al fuego, y hierve.","s":"olla"},{"t":"Mientras hierve, el agua no se calienta más.","s":"olla"},{"t":"Toda la energía se usa en escapar, te dice.","s":"olla"},{"tipo":"barra","b":"calor","o":"Calientas el agua, y te asomas adentro.","pasos":[[-20,"En el hielo, apenas tiemblan."],[50,"En el agua, se resbalan."],[120,"En el vapor, salen volando."]]},{"t":"Al revés, el vapor se enfría, y salen gotitas en tu espejo.","s":"ic:shower"},{"t":"Gracias, amigas.","s":"ic:shower"},{"t":"Dicho de otro modo:","s":"ic:shower"},{"t":"Al cambiar de estado, la energía separa las partículas, y la temperatura se mantiene.","s":"ic:shower"}]},{"id":"luz2","t":"Luz 2: sombras","res":"La luz va en línea recta, y lo que le estorba hace sombra.","g":[{"t":"Luz 2: sombras"},{"t":"Pones tu mano frente a una lámpara.","s":"@sombra"},{"t":"Hola, amiga sombra. ¿De dónde saliste?","s":"@sombra"},{"t":"La luz va derechito, amigo, y tu mano le estorba.","s":"@sombra"},{"t":"Si acercas la mano a la lámpara, crezco.","s":"@sombra"},{"t":"Al mediodía soy cortita, y en la tarde, larguísima.","s":"ic:sun"},{"tipo":"barra","b":"sombra","o":"El Sol se va bajando.","pasos":[[10,"Al mediodía, tu sombra es corta."],[60,"En la tarde, más larga."],[100,"Casi de noche, larguísima."]]},{"t":"Gracias, amiga sombra.","s":"ic:sun"},{"t":"Dicho de otro modo:","s":"ic:sun"},{"t":"La luz viaja en línea recta, y un objeto que la bloquea forma una sombra.","s":"ic:sun"}]},{"id":"sonido2","t":"Sonido 2: la música","res":"Una nota es una vibración, y las octavas duplican la frecuencia.","g":[{"t":"Sonido 2: la música"},{"t":"Tocas una cuerda de guitarra.","s":"cuerda"},{"t":"Hola, amiga cuerda. ¿Qué nota eres?","s":"cuerda"},{"t":"La que salga de vibrar parejito, amigo.","s":"cuerda"},{"t":"Si me aprietas con el dedo, me acortas, y la nota sube.","s":"cuerda"},{"t":"Si vibro el doble de rápido, es la misma nota, más arriba.","s":"agudo"},{"tipo":"barra","b":"sonido","o":"Vas subiendo una nota.","pasos":[[0,"Aquí vibra despacio, y suena grave."],[33,"Aquí vibra el doble: la misma nota, más arriba."],[100,"Y aquí, ocho veces más rápido."]]},{"t":"Gracias, amiga cuerda.","s":"agudo"},{"t":"Dicho de otro modo:","s":"agudo"},{"t":"Una nota es una vibración regular. Duplicar la frecuencia sube una octava.","s":"agudo"}]},{"id":"diaynoche","t":"Día y noche","res":"Es de día de un lado de la Tierra, porque gira frente al Sol.","g":[{"t":"Día y noche"},{"t":"Te paras frente a una lámpara, y giras sobre ti.","s":"giro"},{"t":"A veces te da en la cara, y a veces en la espalda.","s":"giro"},{"t":"Hola, amiga Tierra. ¿Eso haces?","s":"giro"},{"t":"Sí, amigo. Doy una vuelta cada día.","s":"giro"},{"t":"Cuando aquí es de noche, en Japón es de día.","s":"giro"},{"t":"Gracias, amiga Tierra.","s":"giro"},{"t":"Dicho de otro modo:","s":"giro"},{"t":"La Tierra gira sobre su eje: el lado que mira al Sol tiene día, y el otro, noche.","s":"giro"}]},{"id":"estaciones","t":"Las estaciones","res":"Hay verano e invierno porque la Tierra está inclinada.","g":[{"t":"Las estaciones"},{"t":"Apuntas una linterna directo al piso, y hace un círculo fuerte.","s":"@estaciones=7"},{"t":"Eso es el verano, te dice la Tierra.","s":"@estaciones=7"},{"t":"La pones de ladito, y la luz se reparte.","s":"@estaciones=1"},{"t":"Y eso es el invierno.","s":"@estaciones=1"},{"t":"Amiga Tierra, ¿estás más cerca del Sol en verano?","s":"@estaciones=1"},{"t":"No, amigo. Es que estoy inclinada, como un trompo.","s":"@estaciones=1"},{"tipo":"barra","b":"estaciones","o":"Pasa un año aquí en el norte.","pasos":[[1,"En invierno, el Sol da de lado."],[4,"Llega la primavera."],[7,"En verano, da más directo."],[10,"Y sigue el otoño."]]},{"t":"Gracias, amiga Tierra.","s":"@estaciones=1"},{"t":"Dicho de otro modo:","s":"@estaciones=1"},{"t":"Las estaciones se deben a la inclinación de la Tierra, no a su distancia al Sol.","s":"@estaciones=1"}]},{"id":"fases","t":"Fases de la Luna","res":"La Luna cambia de forma porque vemos distintas partes iluminadas.","g":[{"t":"Fases de la Luna"},{"t":"Pones una pelota blanca junto a una lámpara, y caminas a su alrededor.","s":"@fases"},{"t":"A veces la ves entera, y a veces una rebanadita.","s":"@fases"},{"t":"Hola, amiga Luna. ¿Tú cambias de forma?","s":"@fases"},{"t":"No, amigo. Siempre tengo una mitad iluminada. Lo que cambia es lo que ves.","s":"@fases"},{"tipo":"barra","b":"fases","o":"Pasan los días de un mes.","pasos":[[1,"Luna nueva: no se ve."],[7,"Cuarto creciente."],[15,"Luna llena."],[22,"Cuarto menguante."]]},{"t":"Gracias, amiga Luna.","s":"@fases"},{"t":"Dicho de otro modo:","s":"@fases"},{"t":"Las fases dependen de la posición de la Luna, y el ciclo tarda casi un mes.","s":"@fases"}]},{"id":"aire","t":"El aire existe","res":"El aire no se ve, pero es materia y ocupa lugar.","g":[{"t":"El aire existe"},{"t":"Inflas un globo, y se pone firme.","s":"ic:wind"},{"t":"Hola, amigo aire. ¿Estás ahí adentro?","s":"ic:wind"},{"t":"Sí, amigo, empujando las paredes.","s":"ic:wind"},{"t":"Metes un vaso boca abajo al agua, y el agua no sube.","s":"ic:drop"},{"t":"Te dije, amigo. Aquí estoy.","s":"ic:drop"},{"t":"Y arriba de ti tengo muchos kilómetros, empujándote por todos lados.","s":"agita"},{"t":"Gracias, amigo aire.","s":"agita"},{"t":"Dicho de otro modo:","s":"agita"},{"t":"El aire es materia: una mezcla de gases que ocupa lugar y tiene peso.","s":"agita"}]},{"id":"viento","t":"El viento","res":"El viento es aire que se mueve de donde hay más presión a donde hay menos.","g":[{"t":"El viento"},{"t":"Estás en la playa, de día, y te llega una brisa.","s":"p:playa;i:wind .5 .3 .3"},{"t":"Hola, amigo viento. ¿De dónde vienes?","s":"p:playa;i:wind .5 .3 .3"},{"t":"Del mar, amigo. La tierra se calentó, ese aire subió, y yo vine a su lugar.","s":"p:playa;i:wind .5 .3 .3"},{"t":"Abres una puerta en invierno, y entro por abajo.","s":"ic:door"},{"tipo":"barra","b":"viento","o":"Hay más diferencia de calor.","pasos":[[3,"Con poca, una brisa."],[10,"Con más, viento."],[20,"Con mucha, viento fuerte."]]},{"t":"Gracias, amigo viento.","s":"ic:door"},{"t":"Dicho de otro modo:","s":"ic:door"},{"t":"El Sol calienta de forma desigual, y el aire se mueve de donde hay más presión a donde hay menos.","s":"ic:door"}]},{"id":"espejos","t":"Espejos","res":"La luz rebota en un espejo con el mismo ángulo con el que llega.","g":[{"t":"Espejos"},{"t":"Te ves en un espejo, muy clarito.","s":"@espejo"},{"t":"Hola, amigo espejo. ¿Cómo me muestras?","s":"@espejo"},{"t":"Como una pelota contra una pared, amigo: la luz llega inclinada, y sale igual.","s":"@espejo"},{"t":"El espejo de un carro te deja ver atrás.","s":"ic:car"},{"t":"Un charco quieto también. Si se agita, el reflejo se rompe.","s":"ic:drop"},{"tipo":"barra","b":"espejo","o":"Cambias el ángulo de la luz.","pasos":[[20,"Entra poco inclinada, y sale igual."],[45,"Más inclinada, también."],[75,"Muy inclinada, y sale igual."]]},{"t":"Gracias, amigo espejo.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"En la reflexión, la luz rebota con el mismo ángulo con el que llega.","s":"ic:drop"}]},{"id":"popote","t":"El popote doblado","res":"La luz cambia de dirección al pasar del agua al aire.","g":[{"t":"El popote doblado"},{"t":"Metes un popote en un vaso con agua, y parece doblado.","s":"ic:drop"},{"t":"Amigo popote, ¿te rompiste?","s":"ic:drop"},{"t":"No, amigo. Es la luz, que va más lenta en el agua.","s":"ic:drop"},{"t":"Al cambiar de velocidad, cambia de dirección.","s":"mezcla"},{"t":"Por eso una alberca se ve menos honda de lo que es.","s":"mezcla"},{"t":"Y por eso funcionan las lentes.","s":"@lente"},{"t":"Gracias, amigo popote.","s":"@lente"},{"t":"Dicho de otro modo:","s":"@lente"},{"t":"La refracción es el cambio de dirección de la luz al pasar de un material a otro.","s":"@lente"}]},{"id":"eco","t":"El eco","res":"El eco es tu sonido que rebota en una pared lejana y regresa.","g":[{"t":"El eco"},{"t":"Gritas frente a una montaña: ¡hola!","s":"@eco"},{"t":"Hola, te contesta.","s":"@eco"},{"t":"Amigo eco, ¿eres tú?","s":"@eco"},{"t":"Soy tu voz, amigo. Rebotó y regresó.","s":"@eco"},{"t":"Los murciélagos hacen ruiditos, y me escuchan para no chocar.","s":"ic:bug"},{"tipo":"barra","b":"eco","o":"Alejas la pared.","pasos":[[34,"Cerca, el eco regresa muy rápido."],[170,"Más lejos, un segundo."],[340,"Muy lejos, dos segundos."]]},{"t":"Gracias, amigo eco.","s":"ic:bug"},{"t":"Dicho de otro modo:","s":"ic:bug"},{"t":"El eco es un sonido reflejado. El sonido viaja a unos 340 metros por segundo.","s":"ic:bug"}]},{"id":"rueda","t":"La rueda","res":"Rodar evita casi toda la fricción de arrastrar algo.","g":[{"t":"La rueda"},{"t":"Arrastras una caja por el piso, y cuesta.","s":"friccion"},{"t":"Le pones ruedas, y se mueve con un dedo.","s":"carrito"},{"t":"Hola, amiga rueda. ¿Qué hiciste?","s":"carrito"},{"t":"No me resbalo, amigo. Solo voy apoyando un punto tras otro.","s":"carrito"},{"t":"Con una maleta con rueditas, igual.","s":"ic:suitcase-rolling"},{"t":"Gracias, amiga rueda.","s":"ic:suitcase-rolling"},{"t":"Dicho de otro modo:","s":"ic:suitcase-rolling"},{"t":"Al rodar, casi no hay deslizamiento, y la fricción baja muchísimo.","s":"ic:suitcase-rolling"}]},{"id":"equilibrio","t":"Equilibrio","res":"Algo se mantiene en equilibrio si su centro de masa queda sobre su apoyo.","g":[{"t":"Equilibrio"},{"t":"Pones un lápiz sobre tu dedo, y lo apoyas en su mitad.","s":"@palanca"},{"t":"No se cae.","s":"@palanca"},{"t":"Amigo lápiz, ¿cómo le haces?","s":"@palanca"},{"t":"Mi peso se reparte igual a los dos lados, amigo.","s":"@palanca"},{"t":"Cargas una mochila pesada, y te inclinas sin pensarlo.","s":"ic:backpack"},{"t":"Dicho de otro modo:","s":"ic:backpack"},{"t":"El centro de masa debe quedar sobre el apoyo. Por eso los camiones altos se voltean más fácil.","s":"ic:backpack"}]},{"id":"resortes","t":"Resortes","res":"Un resorte se estira más mientras más lo jalas, y regresa a su forma.","g":[{"t":"Resortes"},{"t":"Jalas un resorte, y se estira.","s":"@resorte"},{"t":"Hola, amigo resorte. ¿Te dolió?","s":"@resorte"},{"t":"No, amigo. Guardo la energía, y te la regreso.","s":"@resorte"},{"t":"Tu colchón me usa, para aguantarte.","s":"ic:bed"},{"t":"Con más peso, me estiro más.","s":"ic:bed"},{"tipo":"barra","b":"resorte","o":"Cuelgas más peso.","pasos":[[1,"Con un kilo, poquito."],[5,"Con cinco, más."],[10,"Con diez, el doble que con cinco."]]},{"t":"Gracias, amigo resorte.","s":"ic:bed"},{"t":"Dicho de otro modo:","s":"ic:bed"},{"t":"Un resorte se estira en proporción a la fuerza, y guarda energía elástica.","s":"ic:bed"}]},{"id":"pendulos","t":"Péndulos","res":"Un péndulo tarda lo mismo en ir y venir, sin importar qué tanto abra.","g":[{"t":"Péndulos"},{"t":"Te subes a un columpio, y vas y vienes.","s":"@pendulo"},{"t":"Hola, amigo columpio. ¿Tardas más si voy más alto?","s":"@pendulo"},{"t":"Casi igual, amigo. Solo cambia si mis cadenas son más largas.","s":"@pendulo"},{"t":"Eso lo notó Galileo, mirando una lámpara.","s":"@pendulo"},{"tipo":"barra","b":"pendulo","o":"Le alargas el hilo.","pasos":[[0.25,"Corto, va rápido."],[1,"Con un metro, unos dos segundos."],[2,"Más largo, más lento."]]},{"t":"Gracias, amigo columpio.","s":"@pendulo"},{"t":"Dicho de otro modo:","s":"@pendulo"},{"t":"El periodo de un péndulo depende de su largo, y casi no de lo que se abre.","s":"@pendulo"}]},{"id":"densidad","t":"Densidad","res":"Densidad es cuánta masa hay en cierto espacio.","g":[{"t":"Densidad"},{"t":"Cargas una bolsa de plumas, y otra de arena, del mismo tamaño.","s":"materia"},{"t":"La de arena pesa muchísimo.","s":"materia"},{"t":"Amiga arena, ¿por qué pesas más?","s":"materia"},{"t":"Tengo más masa en el mismo espacio, amigo.","s":"materia"},{"t":"Por eso el aceite flota sobre el agua, y el corcho también.","s":"@flota"},{"tipo":"barra","b":"flota","o":"Pruebas distintos materiales en el agua.","pasos":[[0.2,"Un corcho flota sin problema."],[0.7,"La madera también."],[1.1,"Casi como el agua, apenas se hunde."],[2.5,"Y una piedra se va al fondo."]]},{"t":"Gracias, amiga arena.","s":"@flota"},{"t":"Dicho de otro modo:","s":"@flota"},{"t":"La densidad es la masa por unidad de volumen. Lo menos denso flota sobre lo más denso.","s":"@flota"}]},{"id":"eclipses","t":"Eclipses","res":"Un eclipse es cuando la Luna o la Tierra hacen sombra sobre la otra.","g":[{"t":"Eclipses"},{"t":"Sales al patio, y el Sol se va tapando.","s":"@eclipse=35"},{"t":"Hola, amiga Luna. ¿Tú te pusiste en medio?","s":"@eclipse=35"},{"t":"Sí, amigo. Soy chica, pero estoy cerca, como tu dedo frente a una lámpara.","s":"@eclipse=35"},{"t":"Otras veces, la Tierra me hace sombra, y me veo rojiza.","s":"@eclipse=35"},{"t":"Pero nunca veas el Sol directo, sin protección especial.","s":"@eclipse=35"},{"tipo":"barra","b":"eclipse","o":"La Luna pasa frente al Sol.","pasos":[[20,"Empieza a taparlo."],[50,"Lo tapa completo."],[80,"Y se va."]]},{"t":"Gracias, amiga Luna.","s":"@eclipse=35"},{"t":"Dicho de otro modo:","s":"@eclipse=35"},{"t":"En un eclipse de Sol, la Luna lo tapa. En uno de Luna, la Tierra le hace sombra.","s":"@eclipse=35"}]},{"id":"evaporar","t":"Soplarle a la sopa","res":"Las partículas más rápidas escapan, y lo que queda se enfría.","g":[{"t":"Soplarle a la sopa"},{"t":"Tienes una sopa caliente, y le soplas.","s":"agita"},{"t":"Hola, amigas partículas. ¿A dónde van?","s":"agita"},{"t":"Las más rápidas nos escapamos, amigo, y nos llevamos el calor.","s":"agita"},{"t":"Al soplar, nos abres paso.","s":"agita"},{"t":"Tu sudor hace igual, y te enfría.","s":"ic:person-simple-run"},{"t":"Gracias, amigas.","s":"ic:person-simple-run"},{"t":"Dicho de otro modo:","s":"ic:person-simple-run"},{"t":"En la evaporación escapan las partículas más rápidas, y el líquido se enfría.","s":"ic:person-simple-run"}]},{"id":"aislantes","t":"Termos y aislantes","res":"Un aislante hace muy lento el paso del calor.","g":[{"t":"Termos y aislantes"},{"t":"Traes un termo con café caliente.","s":"cobija"},{"t":"Hola, amigo termo. ¿Cómo lo cuidas?","s":"cobija"},{"t":"Tengo vacío en mis paredes, amigo, y casi no dejo pasar el calor.","s":"cobija"},{"t":"Una hielera hace igual, pero con lo frío.","s":"cobija"},{"t":"Tu suéter atrapa aire quieto, y por eso abriga.","s":"ic:t-shirt"},{"t":"Gracias, amigo termo.","s":"ic:t-shirt"},{"t":"Dicho de otro modo:","s":"ic:t-shirt"},{"t":"Un aislante no detiene el calor, solo hace lento su paso.","s":"ic:t-shirt"}]},{"id":"luna","t":"Por qué no cae la Luna","res":"La Luna sí cae, pero avanza tan rápido que nunca llega.","g":[{"t":"Por qué no cae la Luna"},{"t":"Miras la Luna, allá arriba.","s":"astro"},{"t":"Hola, amiga Luna. ¿Por qué no te caes?","s":"astro"},{"t":"Sí me caigo, amigo. Pero también avanzo de lado.","s":"astro"},{"t":"Y me paso de largo, una y otra vez.","s":"orbita_n"},{"t":"Una piedra lanzada muy fuerte haría algo parecido.","s":"mas_lejos"},{"t":"Gracias, amiga Luna.","s":"mas_lejos"},{"t":"Dicho de otro modo:","s":"mas_lejos"},{"t":"Una órbita es una caída continua: la gravedad curva el camino de lo que avanza de lado.","s":"mas_lejos"}]}],"mat":"f","et":"A1"},{"id":"A2","nom":"Mecánica con números","lec":[{"id":"orbitas","t":"Órbitas","res":"Una órbita es caer, sin llegar nunca al suelo.","g":[{"t":"Órbitas"},{"t":"Lanzas una piedra, y cae.","s":"piedra"},{"t":"La lanzas más fuerte, y cae más lejos.","s":"mas_lejos"},{"t":"Ahora estás en una montaña altísima, con un cañón gigante.","s":"orbita_n"},{"t":"Hola, amiga bala. ¿Hasta dónde llegas?","s":"orbita_n"},{"t":"Si voy muy rápido, amigo, el suelo se curva antes de que yo caiga.","s":"orbita_n"},{"t":"Y sigo cayendo, sin llegar nunca.","s":"orbita_n"},{"t":"La Luna lleva miles de millones de años así.","s":"astro"},{"tipo":"barra","b":"orbita","o":"Vas subiendo un satélite.","pasos":[[0,"Muy bajito, da la vuelta en hora y media."],[50,"Más arriba, tarda varias horas."],[100,"Muy alto, tarda un día entero."]]},{"t":"Gracias, amiga bala.","s":"astro"},{"t":"Dicho de otro modo:","s":"astro"},{"t":"Una órbita es una caída continua alrededor de un planeta. Más lejos, la vuelta tarda más.","s":"astro"}]},{"id":"tiro","t":"Tiro parabólico","res":"Lo que lanzas avanza y cae al mismo tiempo, y dibuja una curva.","g":[{"t":"Tiro parabólico"},{"t":"Lanzas una pelota hacia adelante.","s":"@tiro"},{"t":"Hola, amiga pelota. ¿Por qué haces esa curva?","s":"@tiro"},{"t":"Es que hago dos cosas a la vez, amigo: avanzo y caigo.","s":"@tiro"},{"t":"El chorro de una manguera hace lo mismo, gotita por gotita.","s":"@tiro"},{"tipo":"barra","b":"tiro","o":"Lanzas una pelota, con la misma fuerza, en otro ángulo.","pasos":[[15,"Muy bajo, toca el suelo pronto."],[45,"A cuarenta y cinco, llega lo más lejos."],[80,"Muy alto, solo sube y baja."]]},{"t":"Gracias, amiga pelota.","s":"@tiro"},{"t":"Dicho de otro modo:","s":"@tiro"},{"t":"Un tiro combina avance y caída. Sin aire, llega más lejos a 45 grados.","s":"@tiro"}]},{"id":"trabajo","t":"Trabajo y potencia","res":"Potencia es qué tan rápido usas la energía.","g":[{"t":"Trabajo y potencia"},{"t":"Subes una escalera con una mochila.","s":"@trabajo"},{"t":"Hola, amigo trabajo. ¿Cuesta igual subir despacio?","s":"@trabajo"},{"t":"Sí, amigo. La energía es la misma.","s":"@trabajo"},{"t":"Entonces, ¿por qué cansa más correr?","s":"@trabajo"},{"t":"Porque la usas más rápido, y eso es la potencia.","s":"@trabajo"},{"t":"Un foco de más watts usa más energía cada segundo.","s":"ic:lightbulb"},{"tipo":"barra","b":"trabajo","o":"Subes cinco pisos, cada vez más rápido.","pasos":[[10,"Despacio, poca potencia."],[50,"Más rápido, más potencia."],[100,"Corriendo, muchísima."]]},{"t":"Gracias, amigo trabajo.","s":"ic:lightbulb"},{"t":"Dicho de otro modo:","s":"ic:lightbulb"},{"t":"El trabajo es la energía usada, y la potencia es qué tan rápido se usa. Se mide en watts.","s":"ic:lightbulb"}]},{"id":"choques","t":"Momento y choques","res":"Lo que pesa más y va más rápido, es más difícil de detener.","g":[{"t":"Momento y choques"},{"t":"Una bicicleta y un camión vienen a la misma velocidad.","s":"@choque"},{"t":"Hola, amigo camión. ¿Cuesta más detenerte?","s":"@choque"},{"t":"Muchísimo, amigo. Traigo más momento.","s":"@choque"},{"t":"Una bola de boliche le pega a un pino, y casi ni se frena.","s":"ic:bowling-ball"},{"t":"Una canica le pega a otra igual, se queda, y la otra sale.","s":"ic:bowling-ball"},{"t":"Le di todo mi movimiento, amigo.","s":"ic:bowling-ball"},{"tipo":"barra","b":"choque","o":"Una bola le pega a una chiquita.","pasos":[[1,"Si son iguales, sale a la misma velocidad."],[5,"Con una pesada, sale más rápido."],[20,"Con una muy pesada, casi al doble."]]},{"t":"Gracias, amigos.","s":"ic:bowling-ball"},{"t":"Dicho de otro modo:","s":"ic:bowling-ball"},{"t":"El momento es masa por velocidad. En un choque, el momento total se conserva.","s":"ic:bowling-ball"}]},{"id":"presion","t":"Presión","res":"La misma fuerza, en menos espacio, presiona mucho más.","g":[{"t":"Presión"},{"t":"Caminas en la nieve con tenis, y te hundes.","s":"@presion=1"},{"t":"Te pones esquís, y ya no.","s":"@presion=0"},{"t":"Hola, amiga presión. ¿Qué cambió?","s":"@presion=0"},{"t":"Tu peso es igual, amigo, pero repartido en más espacio.","s":"@presion=0"},{"t":"Por eso corta un cuchillo: su filo es muy delgadito.","s":"ic:knife"},{"tipo":"barra","b":"presion","o":"Una persona se para en distintas cosas.","pasos":[[0,"Con esquís, la presión se reparte."],[2,"En un pie, mucho más."],[3,"En un tacón, muchísima."]]},{"t":"Gracias, amiga presión.","s":"ic:knife"},{"t":"Dicho de otro modo:","s":"ic:knife"},{"t":"La presión es fuerza entre área: menos espacio, más presión.","s":"ic:knife"}]},{"id":"flotar","t":"Flotar","res":"Lo que es menos denso que el agua flota. Lo más denso se hunde.","g":[{"t":"Flotar"},{"t":"Un barco de metal flota, y un clavo chiquito se hunde.","s":"@flota"},{"t":"Hola, amiga agua. ¿Por qué?","s":"@flota"},{"t":"Yo empujo todo lo que me metes, amigo, tanto como pesa el agua que quitaste.","s":"@flota"},{"t":"Y el barco tiene mucho aire adentro.","s":"@flota"},{"t":"Te metes a la alberca, y te sientes ligero: te estoy empujando.","s":"ic:waves"},{"tipo":"barra","b":"flota","o":"Pruebas distintos materiales en el agua.","pasos":[[0.2,"Un corcho flota sin problema."],[0.7,"La madera también."],[1.1,"Casi como el agua, apenas se hunde."],[2.5,"Y una piedra se va al fondo."]]},{"t":"Gracias, amiga agua.","s":"ic:waves"},{"t":"Dicho de otro modo:","s":"ic:waves"},{"t":"El empuje es igual al peso del agua desplazada. Lo menos denso que el agua flota.","s":"ic:waves"}]},{"id":"energia3","t":"Energía 3: se conserva","res":"La energía total no cambia: lo que pierdes de altura lo ganas de velocidad.","g":[{"t":"Energía 3: se conserva"},{"t":"Te subes a una montaña rusa, y vas lento hasta arriba.","s":"@rampa=5"},{"t":"Hola, amiga energía. ¿Dónde estás?","s":"@rampa=5"},{"t":"Guardada aquí arriba, amigo. Agárrate.","s":"@rampa=5"},{"t":"Bajas rapidísimo. Ahora soy movimiento.","s":"@rampa=95"},{"t":"Por eso la siguiente subida nunca es más alta que la primera.","s":"@rampa=95"},{"t":"Y lo que se pierde en el roce, se vuelve calor.","s":"calienta"},{"tipo":"barra","b":"rampa","o":"Un carrito baja de lo alto.","pasos":[[10,"Arriba, va lento."],[50,"A medio camino, más rápido."],[100,"Abajo, lo más rápido."]]},{"t":"Gracias, amiga energía.","s":"calienta"},{"t":"Dicho de otro modo:","s":"calienta"},{"t":"La energía total se conserva: la de altura se convierte en la de movimiento, y parte en calor.","s":"calienta"}]},{"id":"ondas","t":"Ondas","res":"Una onda lleva energía sin llevarse el agua ni el aire.","g":[{"t":"Ondas"},{"t":"Tiras una piedra a un lago, y salen círculos.","s":"onda"},{"t":"Un barquito sube y baja, pero no se va.","s":"onda"},{"t":"Hola, amiga onda. ¿No te llevas el agua?","s":"onda"},{"t":"No, amigo. Solo llevo la energía.","s":"onda"},{"t":"En un estadio hacen la ola, y la gente se queda en su asiento.","s":"p:estadio;i:person .15 .3 .14;i:person .85 .7 .14"},{"tipo":"barra","b":"sonido","o":"Vas subiendo una nota.","pasos":[[0,"Aquí vibra despacio, y suena grave."],[33,"Aquí vibra el doble: la misma nota, más arriba."],[100,"Y aquí, ocho veces más rápido."]]},{"t":"Gracias, amiga onda.","s":"p:estadio;i:person .15 .3 .14;i:person .85 .7 .14"},{"t":"Dicho de otro modo:","s":"p:estadio;i:person .15 .3 .14;i:person .85 .7 .14"},{"t":"Una onda transporta energía sin transportar materia. Luz y sonido también son ondas.","s":"p:estadio;i:person .15 .3 .14;i:person .85 .7 .14"}]},{"id":"orbitas2","t":"Órbitas 2: más lejos, más lento","res":"Los planetas lejanos van más lento y tardan mucho más en dar la vuelta.","g":[{"t":"Órbitas 2: más lejos, más lento"},{"t":"Saludas a los planetas, en su camino alrededor del Sol.","s":"astro"},{"t":"Hola, amigo Mercurio. ¿Cuánto tardas?","s":"astro"},{"t":"Solo 88 días, amigo. Voy muy rápido.","s":"astro"},{"t":"Hola, amigo Neptuno. ¿Y tú?","s":"astro"},{"t":"Casi 165 años, amigo. Apenas he dado poco más de una vuelta desde que me descubrieron.","s":"astro"},{"tipo":"barra","b":"orbita","o":"Vas subiendo un satélite.","pasos":[[0,"Muy bajito, da la vuelta en hora y media."],[50,"Más arriba, tarda varias horas."],[100,"Muy alto, tarda un día entero."]]},{"t":"Gracias, amigos.","s":"astro"},{"t":"Dicho de otro modo:","s":"astro"},{"t":"Más lejos del Sol hay menos jalón, la velocidad baja y el camino es más largo.","s":"astro"}]},{"id":"mareas","t":"Mareas","res":"La Luna jala el agua del mar, y por eso sube y baja.","g":[{"t":"Mareas"},{"t":"Haces un castillo de arena en la orilla, y en unas horas el mar lo alcanza.","s":"marea"},{"t":"Hola, amiga Luna. ¿Tú lo jalaste?","s":"marea"},{"t":"Sí, amigo. Jalo más fuerte el agua que me queda cerca.","s":"marea"},{"t":"Y la Tierra gira por debajo de esas lomas de agua.","s":"marea"},{"t":"Por eso el mar sube y baja dos veces al día.","s":"marea"},{"t":"Gracias, amiga Luna.","s":"marea"},{"t":"Dicho de otro modo:","s":"marea"},{"t":"Las mareas se deben a que la Luna atrae más el agua que tiene cerca.","s":"marea"}]},{"id":"poleas","t":"Poleas y rampas","res":"Una rampa o una polea reparten el esfuerzo a lo largo de más camino.","g":[{"t":"Poleas y rampas"},{"t":"Tienes que subir una caja pesada a un camión.","s":"@palanca"},{"t":"Hola, amiga rampa. ¿Me ayudas?","s":"@palanca"},{"t":"Claro, amigo. Recorres más camino, con menos fuerza.","s":"@palanca"},{"t":"Una carretera en zigzag hace lo mismo.","s":"ic:mountains"},{"t":"No te ahorro energía, amigo. Solo te la reparto.","s":"calienta"},{"tipo":"barra","b":"palanca","o":"Levantas una piedra con un palo más largo.","pasos":[[1,"Con uno corto, mucha fuerza."],[3,"Con tres metros, mucho menos."],[6,"Con seis, muy poquita."]]},{"t":"Gracias, amiga rampa.","s":"calienta"},{"t":"Dicho de otro modo:","s":"calienta"},{"t":"Las máquinas simples cambian fuerza por distancia. La energía total es la misma.","s":"calienta"}]},{"id":"bernoulli","t":"Cómo vuelan los aviones","res":"El ala empuja el aire hacia abajo, y el aire empuja el ala hacia arriba.","g":[{"t":"Cómo vuelan los aviones"},{"t":"Vas en el carro, y sacas la mano por la ventana.","s":"ala"},{"t":"La inclinas, y sientes que sube.","s":"ala"},{"t":"Hola, amigo aire. ¿Tú me empujas?","s":"ala"},{"t":"Sí, amigo. Me empujas hacia abajo, y yo a ti hacia arriba.","s":"ala"},{"t":"Con las alas de un avión, igual. Por eso corre primero por la pista.","s":"ic:airplane"},{"t":"Gracias, amigo aire.","s":"ic:airplane"},{"t":"Dicho de otro modo:","s":"ic:airplane"},{"t":"El ala desvía el aire hacia abajo, y la reacción sostiene al avión.","s":"ic:airplane"}]},{"id":"vectores","t":"Vectores","res":"Una flecha dice cuánto y hacia dónde, y dos flechas se pueden sumar.","g":[{"t":"Vectores"},{"t":"Dos amigos jalan una caja: uno al norte, otro al este.","s":"@vector=90"},{"t":"Y la caja se va en diagonal.","s":"@vector=90"},{"t":"Hola, amiga flecha. ¿Para qué sirves?","s":"@vector=90"},{"t":"Digo cuánto y hacia dónde, amigo.","s":"@vector=90"},{"t":"Si cruzas un río nadando, la corriente te saca río abajo.","s":"ic:waves"},{"tipo":"barra","b":"vector","o":"Abres dos flechas iguales.","pasos":[[0,"Juntas, se suman."],[90,"En ángulo recto, menos."],[180,"Opuestas, se cancelan."]]},{"t":"Gracias, amiga flecha.","s":"ic:waves"},{"t":"Dicho de otro modo:","s":"ic:waves"},{"t":"Un vector tiene tamaño y dirección, y las fuerzas se suman como flechas.","s":"ic:waves"}]},{"id":"relativa","t":"Velocidad relativa","res":"La velocidad depende de quién la mida.","g":[{"t":"Velocidad relativa"},{"t":"Estás en un tren parado, junto a otro, y no sabes cuál arrancó.","s":"tren"},{"t":"Hola, amiga velocidad. ¿Cómo sé?","s":"tren"},{"t":"Depende de con qué me compares, amigo.","s":"tren"},{"t":"Dos carros de frente, a cien cada uno, es como chocar a doscientos.","s":"ic:car"},{"t":"Por eso esos choques son tan peligrosos.","s":"ic:car"},{"t":"Gracias, amiga velocidad.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"Toda velocidad se mide respecto a algo. Eso es la velocidad relativa.","s":"ic:car"}]},{"id":"aceleracion2","t":"Aceleración 2: frenar","res":"Frenar también es acelerar, y la distancia crece con la velocidad.","g":[{"t":"Aceleración 2: frenar"},{"t":"Tu carro frena fuerte.","s":"@energia"},{"t":"Y tú te vas hacia adelante.","s":"frenazo"},{"t":"Ahora te subes a un elevador: arranca, y te sientes pesado.","s":"ic:elevator"},{"t":"Al frenar arriba, más ligero.","s":"ic:elevator"},{"t":"Hola, amigo cuerpo. ¿Qué sientes?","s":"ic:elevator"},{"t":"Solo noto los cambios, amigo, no la velocidad.","s":"ic:elevator"},{"tipo":"barra","b":"energia","o":"Tu carro frena a distintas velocidades.","pasos":[[30,"A treinta, frena en poco camino."],[60,"Al doble de velocidad, necesita cuatro veces más camino."],[120,"A ciento veinte, dieciséis veces más."]]},{"t":"Gracias, amigo cuerpo.","s":"ic:elevator"},{"t":"Dicho de otro modo:","s":"ic:elevator"},{"t":"Frenar es acelerar en sentido contrario. El cuerpo siente la aceleración.","s":"ic:elevator"}]},{"id":"segunda2","t":"Fuerza 3: la fórmula en la vida real","res":"F = m × a permite calcular cuánto acelera algo.","g":[{"t":"Fuerza 3: la fórmula en la vida real"},{"t":"Empujas un carro de mil kilos con cien newtons, y casi no se mueve.","s":"fma"},{"t":"Empujas un balón de un kilo con lo mismo, y sale volando.","s":"@fuerza=0"},{"t":"Hola, amigo newton. ¿Cuánto eres tú?","s":"@fuerza=0"},{"t":"Como el peso de una manzana chica, amigo.","s":"@fuerza=0"},{"tipo":"barra","b":"fuerza","o":"Empujas distintas cosas, con la misma fuerza.","pasos":[[0,"Una mochila sale disparada."],[3,"Una persona, mucho menos."],[5,"Un carro casi no se mueve."]]},{"t":"Gracias, amigo newton.","s":"@fuerza=0"},{"t":"Dicho de otro modo:","s":"@fuerza=0"},{"t":"La fuerza es masa por aceleración, y se mide en newtons.","s":"@fuerza=0"}]},{"id":"calorias","t":"Trabajo 2: calorías","res":"Una caloría de comida es energía, y moverse usa mucha menos de lo que parece.","g":[{"t":"Trabajo 2: calorías"},{"t":"Te comes una galleta.","s":"ic:cookie"},{"t":"Hola, amiga galleta. ¿Cuánta energía traes?","s":"ic:cookie"},{"t":"Más de la que crees, amigo. Se mide en calorías.","s":"ic:cookie"},{"t":"Subir diez pisos usa menos que yo.","s":"@trabajo"},{"t":"Y casi toda esa energía se te vuelve calor. Por eso sudas.","s":"calienta"},{"tipo":"barra","b":"trabajo","o":"Subes cinco pisos, cada vez más rápido.","pasos":[[10,"Despacio, poca potencia."],[50,"Más rápido, más potencia."],[100,"Corriendo, muchísima."]]},{"t":"Gracias, amiga galleta.","s":"calienta"},{"t":"Dicho de otro modo:","s":"calienta"},{"t":"Las calorías miden energía. El cuerpo aprovecha solo una parte, y lo demás es calor.","s":"calienta"}]},{"id":"engranes","t":"Engranes y marchas","res":"Los engranes cambian fuerza por velocidad.","g":[{"t":"Engranes y marchas"},{"t":"Un engrane grande mueve a uno chico.","s":"@engrane"},{"t":"Hola, amigo chiquito. ¿Por qué tan rápido?","s":"@engrane"},{"t":"Doy más vueltas, amigo, pero con menos fuerza.","s":"@engrane"},{"t":"En una bici de subida, usas una marcha suave: pedaleas mucho, con poca fuerza.","s":"ic:bicycle"},{"tipo":"barra","b":"engrane","o":"Cambias el tamaño.","pasos":[[1,"Iguales, misma velocidad."],[3,"El chico da tres vueltas."],[6,"Mucho más chico, seis."]]},{"t":"Gracias, amigos.","s":"ic:bicycle"},{"t":"Dicho de otro modo:","s":"ic:bicycle"},{"t":"Los engranes cambian fuerza por velocidad, y en todo momento se conserva la energía.","s":"ic:bicycle"}]},{"id":"centrifuga","t":"Girar","res":"Al girar, algo debe jalarte hacia el centro o saldrías derecho.","g":[{"t":"Girar"},{"t":"Vas en un carro en curva, y te vas hacia afuera.","s":"curva"},{"t":"Amigo cuerpo, ¿te empujan?","s":"curva"},{"t":"No, amigo. Yo solo quiero seguir derecho, y el carro me jala adentro.","s":"curva"},{"t":"En la lavadora, el agua sale por los hoyitos por lo mismo.","s":"@giro"},{"tipo":"barra","b":"giro","o":"Das una vuelta cada vez más rápido.","pasos":[[15,"Despacio, casi no te jala."],[35,"Más rápido, mucho más."],[60,"Muy rápido, muchísimo."]]},{"t":"Gracias, amigo cuerpo.","s":"@giro"},{"t":"Dicho de otro modo:","s":"@giro"},{"t":"Para girar hace falta una fuerza hacia el centro. Con doble velocidad, se necesita cuatro veces más.","s":"@giro"}]},{"id":"arrastre","t":"El aire frena","res":"Mientras más rápido vas, muchísimo más te frena el aire.","g":[{"t":"El aire frena"},{"t":"Sacas la mano por la ventana, y el aire empuja.","s":"@aireres=60"},{"t":"Más rápido, y empuja muchísimo más.","s":"@aireres=140"},{"t":"Hola, amigo aire. ¿Por qué tanto?","s":"@aireres=140"},{"t":"Es que a más velocidad, me chocas más fuerte y más veces, amigo.","s":"@aireres=140"},{"t":"Por eso un ciclista de carreras se agacha.","s":"ic:bicycle"},{"tipo":"barra","b":"aireres","o":"Vas más rápido, en carro.","pasos":[[30,"A treinta, casi nada."],[80,"A ochenta, se nota."],[150,"A ciento cincuenta, empuja muchísimo."]]},{"t":"Gracias, amigo aire.","s":"ic:bicycle"},{"t":"Dicho de otro modo:","s":"ic:bicycle"},{"t":"La resistencia del aire crece con el cuadrado de la velocidad, y con el área.","s":"ic:bicycle"}]},{"id":"hidraulica","t":"Gatos hidráulicos","res":"Un líquido transmite la presión, y con poca fuerza se levanta mucho.","g":[{"t":"Gatos hidráulicos"},{"t":"Con tu brazo, levantas un carro en el taller.","s":"@prensa"},{"t":"Hola, amigo aceite. ¿Cómo le hacemos?","s":"@prensa"},{"t":"No me dejo apretar, amigo. Lo que empujas aquí, lo empujo allá, en más área.","s":"@prensa"},{"t":"En los frenos, igual: tu pie aprieta poquito, y frena toneladas.","s":"ic:car"},{"tipo":"barra","b":"prensa","o":"Haces más grande el émbolo.","pasos":[[2,"Al doble, el doble de fuerza."],[30,"Treinta veces mayor, treinta veces."],[100,"Cien veces, y levantas un carro."]]},{"t":"Gracias, amigo aceite.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"Un líquido transmite la presión. La misma presión en más área da más fuerza.","s":"ic:car"}]},{"id":"profundo","t":"Bajo el agua","res":"Mientras más bajas, más agua tienes encima y más te aprieta.","g":[{"t":"Bajo el agua"},{"t":"Bajas al fondo de la alberca, y te duelen los oídos.","s":"@profund=10"},{"t":"Hola, amiga agua. ¿Me estás apretando?","s":"@profund=10"},{"t":"Sí, amigo. Traes más de mí encima.","s":"@profund=10"},{"t":"Los peces del fondo aguantan, porque por dentro empujan igual.","s":"ic:fish"},{"t":"Cada diez metros, se suma como otra atmósfera.","s":"ic:fish"},{"tipo":"barra","b":"profund","o":"Vas bajando.","pasos":[[10,"A diez metros, el doble de presión."],[50,"A cincuenta, seis veces."],[100,"A cien, once veces."]]},{"t":"Gracias, amiga agua.","s":"ic:fish"},{"t":"Dicho de otro modo:","s":"ic:fish"},{"t":"La presión del agua crece con la profundidad: una atmósfera más cada diez metros.","s":"ic:fish"}]},{"id":"globos","t":"Globos de aire caliente","res":"El aire caliente es más ligero, y por eso sube.","g":[{"t":"Globos de aire caliente"},{"t":"Ves un globo de Cantoya, subiendo en la noche.","s":"@globo"},{"t":"Hola, amigo aire caliente. ¿Por qué subes?","s":"@globo"},{"t":"Porque mis partículas se separan, amigo, y peso menos para mi tamaño.","s":"@globo"},{"t":"El humo de una fogata sube por lo mismo.","s":"ic:campfire"},{"tipo":"barra","b":"globo","o":"Calientas el aire del globo.","pasos":[[40,"Poco caliente, levanta poquito."],[80,"Más caliente, mucho más."],[120,"Muy caliente, lo más."]]},{"t":"Gracias, amigo aire.","s":"ic:campfire"},{"t":"Dicho de otro modo:","s":"ic:campfire"},{"t":"El aire caliente es menos denso que el frío, y por eso flota en él.","s":"ic:campfire"}]},{"id":"patinador","t":"El truco del patinador","res":"Al acercar los brazos, un cuerpo que gira gira más rápido.","g":[{"t":"El truco del patinador"},{"t":"Una patinadora gira con los brazos abiertos, y los cierra.","s":"@patin=0"},{"t":"Gira mucho más rápido.","s":"@patin=100"},{"t":"Hola, amiga. ¿Quién te empujó?","s":"@patin=100"},{"t":"Nadie, amigo. Conservo mi giro, y al cerrar los brazos, me acelero.","s":"@patin=100"},{"t":"Un gato usa algo parecido, y cae de pie.","s":"ic:cat"},{"tipo":"barra","b":"patin","o":"La patinadora cierra los brazos.","pasos":[[10,"Abiertos, gira despacio."],[60,"Cerrándolos, más rápido."],[100,"Cerrados, muchísimo."]]},{"t":"Gracias, amiga.","s":"ic:cat"},{"t":"Dicho de otro modo:","s":"ic:cat"},{"t":"Se conserva el momento angular: con la masa cerca del eje, el giro es más rápido.","s":"ic:cat"}]},{"id":"bici","t":"Por qué no se cae una bici","res":"Moverse y girar el manubrio mantiene la bici debajo de ti.","g":[{"t":"Por qué no se cae una bici"},{"t":"Dejas una bici parada, y se cae.","s":"friccion"},{"t":"Vas en ella, y no se cae.","s":"sigue"},{"t":"Hola, amiga bici. ¿Por qué?","s":"sigue"},{"t":"Cuando me inclino, giro hacia ese lado, amigo, y las ruedas vuelven a quedar bajo ti.","s":"sigue"},{"t":"Una moneda rodando también se queda de pie, hasta que se detiene.","s":"ic:coin"},{"t":"Gracias, amiga bici.","s":"ic:coin"},{"t":"Dicho de otro modo:","s":"ic:coin"},{"t":"La bici se endereza al girar hacia donde se inclina: es más fácil a mayor velocidad.","s":"ic:coin"}]},{"id":"tiro2","t":"Tiro 2: el aire cambia todo","res":"En la vida real, el aire frena y acorta los tiros.","g":[{"t":"Tiro 2: el aire cambia todo"},{"t":"Pateas un balón con efecto.","s":"@tiro"},{"t":"Hola, amigo balón. ¿Por qué te curvas?","s":"@tiro"},{"t":"Voy girando, amigo, y el aire me desvía.","s":"@tiro"},{"t":"También me frena, y por eso llego menos lejos que sin aire.","s":"@aireres"},{"tipo":"barra","b":"tiro","o":"Lanzas una pelota, con la misma fuerza, en otro ángulo.","pasos":[[15,"Muy bajo, toca el suelo pronto."],[45,"A cuarenta y cinco, llega lo más lejos."],[80,"Muy alto, solo sube y baja."]]},{"t":"Gracias, amigo balón.","s":"@aireres"},{"t":"Dicho de otro modo:","s":"@aireres"},{"t":"El aire acorta los tiros, y el giro de una pelota desvía su trayectoria.","s":"@aireres"}]},{"id":"paracaidas","t":"Caída 3: el paracaídas","res":"El aire crece con la velocidad hasta igualar el peso.","g":[{"t":"Caída 3: el paracaídas"},{"t":"Saltas de un avión, y bajas a unos doscientos kilómetros por hora.","s":"terminal"},{"t":"Abres el paracaídas, y bajas a unos veinte.","s":"@aireres"},{"t":"Hola, amigo paracaídas. ¿Cómo lo haces?","s":"@aireres"},{"t":"Soy enorme, amigo, y el aire empuja mucho más.","s":"@aireres"},{"t":"Una hoja cae despacio por lo mismo.","s":"aire"},{"tipo":"barra","b":"aireres","o":"Vas más rápido, en carro.","pasos":[[30,"A treinta, casi nada."],[80,"A ochenta, se nota."],[150,"A ciento cincuenta, empuja muchísimo."]]},{"t":"Gracias, amigo paracaídas.","s":"aire"},{"t":"Dicho de otro modo:","s":"aire"},{"t":"Al caer, el aire empuja más hasta igualar el peso: es la velocidad terminal.","s":"aire"}]},{"id":"eficiencia","t":"Energía 4: lo que se pierde","res":"Ninguna máquina aprovecha toda la energía: siempre se pierde algo como calor.","g":[{"t":"Energía 4: lo que se pierde"},{"t":"Tocas un foco antiguo, y quema.","s":"ic:lightbulb"},{"t":"Hola, amigo foco. ¿Por qué tan caliente?","s":"ic:lightbulb"},{"t":"Casi toda mi energía sale como calor, amigo.","s":"ic:lightbulb"},{"t":"Un foco LED da la misma luz, con mucho menos.","s":"ic:lightbulb"},{"t":"Y un carro de gasolina aprovecha cerca de una cuarta parte.","s":"@maquina"},{"t":"Gracias, amigo foco.","s":"@maquina"},{"t":"Dicho de otro modo:","s":"@maquina"},{"t":"Ninguna máquina aprovecha toda la energía: parte siempre se pierde como calor.","s":"@maquina"}]},{"id":"momento2","t":"Choques 2: retroceso","res":"Lo que lanzas te empuja de regreso, porque el momento se conserva.","g":[{"t":"Choques 2: retroceso"},{"t":"Te subes a un patín, y lanzas una pelota. Retrocedes.","s":"@choque"},{"t":"Hola, amiga pelota. ¿Me empujaste?","s":"@choque"},{"t":"Tú a mí, y yo a ti, amigo.","s":"@choque"},{"t":"Un globo que suelta el aire sale volando por lo mismo.","s":"cohete"},{"tipo":"barra","b":"choque","o":"Una bola le pega a una chiquita.","pasos":[[1,"Si son iguales, sale a la misma velocidad."],[5,"Con una pesada, sale más rápido."],[20,"Con una muy pesada, casi al doble."]]},{"t":"Gracias, amiga pelota.","s":"cohete"},{"t":"Dicho de otro modo:","s":"cohete"},{"t":"El momento se conserva: lo que sale hacia un lado empuja hacia el otro.","s":"cohete"}]},{"id":"mareas2","t":"Mareas 2: frenando a la Tierra","res":"Las mareas frenan muy poco a poco el giro de la Tierra.","g":[{"t":"Mareas 2: frenando a la Tierra"},{"t":"Ves el mar subiendo y bajando, rozando con el fondo.","s":"marea"},{"t":"Hola, amigo mar. ¿Eso hace algo?","s":"marea"},{"t":"Sí, amigo. Le voy frenando el giro a la Tierra, muy poquito.","s":"marea"},{"t":"Hace millones de años los días eran más cortos.","s":"reloj"},{"t":"Por eso la Luna ya nos muestra siempre su misma cara.","s":"@fases"},{"t":"Gracias, amigo mar.","s":"@fases"},{"t":"Dicho de otro modo:","s":"@fases"},{"t":"La fricción de las mareas frena la Tierra y aleja la Luna, muy poco a poco.","s":"@fases"}]},{"id":"presion2","t":"Presión 2: agua en tu casa","res":"El agua sale con más presión si el tinaco está más alto.","g":[{"t":"Presión 2: agua en tu casa"},{"t":"Abres la regadera, y sale débil.","s":"@profund"},{"t":"Hola, amigo tinaco. ¿Estás muy bajo?","s":"@profund"},{"t":"Sí, amigo. Entre más alto, mi agua empuja más.","s":"@profund"},{"t":"Por eso una torre de agua es alta, para llegar a todas las casas.","s":"ic:buildings"},{"tipo":"barra","b":"profund","o":"Vas bajando.","pasos":[[10,"A diez metros, el doble de presión."],[50,"A cincuenta, seis veces."],[100,"A cien, once veces."]]},{"t":"Gracias, amigo tinaco.","s":"ic:buildings"},{"t":"Dicho de otro modo:","s":"ic:buildings"},{"t":"La presión depende de la altura del agua encima.","s":"ic:buildings"}]},{"id":"sobrevuelo","t":"Vuelo 2: los pájaros","res":"Las aves empujan el aire con las alas y aprovechan corrientes calientes.","g":[{"t":"Vuelo 2: los pájaros"},{"t":"Ves un zopilote dando vueltas, sin aletear.","s":"ala"},{"t":"Hola, amigo. ¿No te cansas?","s":"ala"},{"t":"No, amigo. Aprovecho el aire caliente que sube.","s":"ala"},{"t":"Un colibrí aletea tan rápido que se queda en un punto.","s":"@globo"},{"t":"Y hasta puede volar hacia atrás.","s":"@globo"},{"t":"Gracias, amigos.","s":"@globo"},{"t":"Dicho de otro modo:","s":"@globo"},{"t":"Las aves empujan el aire hacia abajo con las alas, y también planean en corrientes que suben.","s":"@globo"}]},{"id":"ruedas2","t":"Rozamiento 3: curvas y llantas","res":"Las llantas giran gracias a la fricción con el suelo, y sin ella derrapan.","g":[{"t":"Rozamiento 3: curvas y llantas"},{"t":"Vas en una curva, y las llantas empujan el piso de lado.","s":"curva"},{"t":"En hielo, tu carro sigue derecho.","s":"@inercia=2"},{"t":"Hola, amiga llanta. ¿Qué te faltó?","s":"@inercia=2"},{"t":"Fricción, amigo. Sin ella no puedo dar vuelta.","s":"@inercia=2"},{"t":"Por eso las lisas aguantan menos, sobre todo con agua.","s":"@inercia=2"},{"tipo":"barra","b":"inercia","o":"Lanzas un disco por distintos pisos.","pasos":[[0,"En alfombra, frena pronto."],[2,"En hielo, sigue mucho más."],[3,"Sin fricción, no se detiene."]]},{"t":"Gracias, amiga llanta.","s":"@inercia=2"},{"t":"Dicho de otro modo:","s":"@inercia=2"},{"t":"La fricción con el piso da la fuerza para girar. Sin ella, el carro sigue derecho.","s":"@inercia=2"}]},{"id":"elevador","t":"El elevador","res":"Tu peso parece cambiar cuando un elevador acelera.","g":[{"t":"El elevador"},{"t":"Te subes a una báscula, dentro de un elevador.","s":"jalon"},{"t":"Al subir de golpe marca más, y al frenar marca menos.","s":"jalon"},{"t":"Hola, amiga báscula. ¿Cuánto peso?","s":"jalon"},{"t":"Lo mismo, amigo. Lo que cambia es cuánto te empujo.","s":"jalon"},{"t":"Si cayéramos libres, marcaría cero.","s":"astro"},{"t":"Gracias, amiga báscula.","s":"astro"},{"t":"Dicho de otro modo:","s":"astro"},{"t":"La báscula mide la fuerza que te sostiene, y esta cambia cuando el elevador acelera.","s":"astro"}]}],"mat":"f","et":"A2"},{"id":"B1","nom":"Electricidad y magnetismo","lec":[{"id":"corriente","t":"Corriente","res":"El voltaje empuja, la corriente fluye y la resistencia frena.","g":[{"t":"Corriente"},{"t":"Conectas una manguera, y abres la llave.","s":"circuito"},{"t":"Hola, amigo voltaje. ¿Tú qué eres?","s":"circuito"},{"t":"Soy la presión, amigo. Yo empujo.","s":"circuito"},{"t":"Yo soy lo que pasa, dice la corriente.","s":"circuito"},{"t":"Y yo soy la manguera angosta, dice la resistencia. Yo freno.","s":"circuito"},{"t":"Una pila empuja poquito. Un contacto de la casa, mucho, y por eso es peligroso.","s":"ic:battery-full"},{"tipo":"barra","b":"voltaje","o":"Vas conectando cosas más fuertes.","pasos":[[0,"Una pila, muy poquito."],[2,"Una batería de carro, más."],[3,"Un contacto de tu casa, mucho."],[4,"Y con 220 voltios, más todavía."]]},{"t":"Gracias, amigos.","s":"ic:battery-full"},{"t":"Dicho de otro modo:","s":"ic:battery-full"},{"t":"El voltaje empuja las cargas, la corriente es su flujo, y la resistencia lo frena.","s":"ic:battery-full"}]},{"id":"carga","t":"Carga eléctrica","res":"Cargas iguales se separan. Cargas opuestas se juntan.","g":[{"t":"Carga eléctrica"},{"t":"Frotas un globo en tu pelo, y tu pelo se le pega.","s":"@carga"},{"t":"Hola, amigas cargas. ¿Se conocen?","s":"@carga"},{"t":"Sí, amigo. Las opuestas nos juntamos, y las iguales nos separamos.","s":"@carga"},{"t":"Tocas una perilla, y sientes un toque.","s":"ic:door"},{"t":"Tus zapatos me juntaron, y salté.","s":"ic:door"},{"t":"Un rayo es lo mismo, muy grande.","s":"rayo"},{"tipo":"barra","b":"carga","o":"Acercas dos cargas, poco a poco.","pasos":[[0,"Lejos, casi ni se notan."],[50,"Más cerca, mucho más fuerza."],[100,"Muy cerca, la fuerza crece muchísimo."]]},{"t":"Gracias, amigas.","s":"rayo"},{"t":"Dicho de otro modo:","s":"rayo"},{"t":"Hay carga positiva y negativa. La fuerza crece mucho al acercarlas: a la mitad de distancia, cuatro veces.","s":"rayo"}]},{"id":"imanes","t":"Imanes","res":"Un imán jala ciertos metales y siempre tiene dos polos.","g":[{"t":"Imanes"},{"t":"Pegas un imán en tu refri, sin pegamento.","s":"@iman"},{"t":"Hola, amigo imán. ¿Cómo le haces?","s":"@iman"},{"t":"Tengo dos lados, amigo: norte y sur. Los iguales se empujan, y los opuestos se jalan.","s":"@iman"},{"t":"La aguja de una brújula es mi prima, y la Tierra la jala.","s":"ic:compass"},{"t":"Y si me partes, salen dos imanes.","s":"ic:compass"},{"tipo":"barra","b":"iman","o":"Acercas un clip a un imán.","pasos":[[0,"Lejos, no pasa nada."],[50,"Más cerca, se empieza a mover."],[100,"Muy cerca, salta hasta el imán."]]},{"t":"Gracias, amigo imán.","s":"ic:compass"},{"t":"Dicho de otro modo:","s":"ic:compass"},{"t":"Un imán siempre tiene dos polos. Los iguales se repelen, y los opuestos se atraen.","s":"ic:compass"}]},{"id":"induccion","t":"Inducción","res":"Mover un imán cerca de un cable produce electricidad.","g":[{"t":"Inducción"},{"t":"Tienes un cable enrollado, y metes y sacas un imán.","s":"@induccion"},{"t":"Hola, amigo imán. ¿Qué haces?","s":"@induccion"},{"t":"Empujo cargas por el cable, amigo, pero solo si me muevo.","s":"@induccion"},{"t":"Una lámpara de manivela prende así, sin pilas.","s":"ic:flashlight"},{"t":"En una presa, el agua mueve imanes enormes, y de ahí sale tu luz.","s":"ic:drop"},{"tipo":"barra","b":"induccion","o":"Mueves el imán, cada vez más rápido.","pasos":[[0,"Quieto, no hay nada."],[40,"Despacio, una lucecita."],[100,"Rápido, el foco brilla fuerte."]]},{"t":"Gracias, amigo imán.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"Un imán en movimiento genera corriente en un cable: es la inducción.","s":"ic:drop"}]},{"id":"serie","t":"Circuitos","res":"Si conectas focos uno tras otro, se reparten el voltaje.","g":[{"t":"Circuitos"},{"t":"Prendes un apagador en tu cuarto.","s":"circuito"},{"t":"Hola, amigo apagador. ¿Qué haces?","s":"circuito"},{"t":"Abro y cierro el camino, amigo. Si se corta, no pasa la corriente.","s":"circuito"},{"t":"Pones focos en fila, y se reparten la pila.","s":"@serie"},{"t":"Si se funde uno, nos apagamos todos, te dicen.","s":"@serie"},{"t":"En tu casa, cada aparato tiene su camino.","s":"ic:house"},{"tipo":"barra","b":"serie","o":"Pones más focos en fila, con la misma pila.","pasos":[[1,"Con uno, brilla muy bien."],[2,"Con dos, brillan menos."],[6,"Con seis, casi nada."]]},{"t":"Gracias, amigos.","s":"ic:house"},{"t":"Dicho de otro modo:","s":"ic:house"},{"t":"En serie, el voltaje se reparte entre los focos y un solo corte apaga todo.","s":"ic:house"}]},{"id":"motor","t":"Motores","res":"Un motor usa electricidad e imanes para hacer girar algo.","g":[{"t":"Motores"},{"t":"Prendes un ventilador, y sus aspas giran.","s":"@motor"},{"t":"Hola, amigo motor. ¿Cómo lo haces?","s":"@motor"},{"t":"Mi cable con corriente se vuelve un imán, amigo, y se empuja con otro.","s":"@motor"},{"t":"Un carrito de juguete hace lo mismo, chiquito.","s":"ic:car"},{"t":"Si me giras tú, salgo generador.","s":"ic:car"},{"tipo":"barra","b":"motor","o":"Le das más voltaje a un motor.","pasos":[[0,"Sin voltaje, quieto."],[6,"Con seis, gira bien."],[12,"Con doce, al doble."]]},{"t":"Gracias, amigo motor.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"Un motor convierte electricidad en movimiento, usando magnetismo. Al revés, es un generador.","s":"ic:car"}]},{"id":"watts","t":"Corriente 2: el recibo de luz","res":"Lo que pagas es potencia por tiempo, los kilowatts hora.","g":[{"t":"Corriente 2: el recibo de luz"},{"t":"Te llega el recibo de la luz.","s":"ic:lightbulb,shower"},{"t":"Hola, amigo recibo. ¿Qué me cobras?","s":"ic:lightbulb,shower"},{"t":"Energía, amigo: potencia por tiempo.","s":"ic:lightbulb,shower"},{"t":"Un foco LED toda la noche casi ni se nota.","s":"@watts=0"},{"t":"Una regadera eléctrica usa cientos de veces más.","s":"@watts=4"},{"tipo":"barra","b":"watts","o":"Comparas aparatos, una hora prendidos.","pasos":[[0,"Un foco LED, casi nada."],[2,"Una tele, poquito."],[3,"Una plancha, mucho."],[4,"Una regadera eléctrica, muchísimo."]]},{"t":"Gracias, amigo recibo.","s":"@watts=4"},{"t":"Dicho de otro modo:","s":"@watts=4"},{"t":"Se cobra en kilowatts hora. Lo que más gasta es lo que calienta o enfría.","s":"@watts=4"}]},{"id":"rayos","t":"Carga 2: los rayos","res":"Un rayo es una chispa gigante entre las nubes y el suelo.","g":[{"t":"Carga 2: los rayos"},{"t":"Ves una tormenta desde tu ventana.","s":"rayo"},{"t":"Hola, amigo rayo. ¿De dónde saliste?","s":"rayo"},{"t":"El hielo chocó en las nubes, amigo, y se separaron las cargas.","s":"rayo"},{"t":"Cuando hay demasiadas, salto.","s":"rayo"},{"t":"El trueno es el aire, calentado de golpe.","s":"oido"},{"t":"Y dentro de un carro, estás protegido.","s":"ic:car"},{"t":"Gracias, amigo rayo.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"Un rayo es una descarga entre cargas separadas. Un pararrayos le da un camino seguro.","s":"ic:car"}]},{"id":"campo","t":"Imanes 2: la Tierra es un imán","res":"La Tierra tiene un campo magnético que nos protege y orienta las brújulas.","g":[{"t":"Imanes 2: la Tierra es un imán"},{"t":"Sacas una brújula, y apunta al norte.","s":"@iman"},{"t":"Hola, amiga Tierra. ¿Tú la jalas?","s":"@iman"},{"t":"Sí, amigo. Tengo hierro líquido moviéndose adentro.","s":"@iman"},{"t":"Las auroras son partículas del Sol, que chocan con el aire cerca de los polos.","s":"ic:sparkle"},{"t":"Las aves también me sienten para viajar.","s":"ic:bird"},{"t":"Gracias, amiga Tierra.","s":"ic:bird"},{"t":"Dicho de otro modo:","s":"ic:bird"},{"t":"El núcleo de la Tierra genera un campo magnético, que nos protege de partículas del Sol.","s":"ic:bird"}]},{"id":"radio","t":"Ondas de radio","res":"Radio, wifi y luz son lo mismo: ondas, de distinto tamaño.","g":[{"t":"Ondas de radio"},{"t":"Mandas un mensaje, y sale por el aire.","s":"ic:device-mobile"},{"t":"Hola, amiga onda. ¿Quién eres?","s":"ic:device-mobile"},{"t":"Prima de la luz, amigo, solo que más larga.","s":"ic:device-mobile"},{"t":"En el microondas agito el agua de la comida.","s":"agita"},{"t":"Y los rayos X son mis primos cortitos.","s":"ic:bone"},{"tipo":"barra","b":"luz","o":"Pasas por todos los colores de la luz.","pasos":[[360,"Aquí es ultravioleta, y no lo ves."],[470,"Ahora azul."],[530,"Verde."],[650,"Rojo."],[780,"Y aquí ya es infrarroja."]]},{"t":"Gracias, amiga onda.","s":"ic:bone"},{"t":"Dicho de otro modo:","s":"ic:bone"},{"t":"Radio, microondas, luz y rayos X son la misma familia: ondas electromagnéticas de distinto tamaño.","s":"ic:bone"}]},{"id":"chips","t":"Cómo piensa un chip","res":"Un chip tiene miles de millones de interruptores que se prenden y se apagan.","g":[{"t":"Cómo piensa un chip"},{"t":"Te asomas dentro de tu celular.","s":"ic:cpu"},{"t":"Hola, amigos transistores. ¿Qué hacen?","s":"ic:cpu"},{"t":"Nos prendemos y nos apagamos, amigo.","s":"ic:cpu"},{"t":"Con eso guardamos números: ceros y unos.","s":"potencias"},{"t":"Una foto tuya son millones de nosotros
