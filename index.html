"t":"Cuando se altera un equilibrio, se desplaza para contrarrestar el cambio.","s":"ic:beer-bottle"}]},{"id":"q_buffer_q","t":"La sangre que no cambia","res":"Unas sustancias evitan que cambie el pH de tu sangre.","g":[{"t":"La sangre que no cambia"},{"t":"Tu sangre sigue corriendo, mientras comes y duermes.","s":"ic:heart"},{"t":"Hola, amiga sangre. ¿Cómo te mantienes igual?","s":"ic:heart"},{"t":"Tengo amigas que agarran lo que sobra, amigo.","s":"ic:heart"},{"t":"Un vaso de agua sola cambia con unas gotas de ácido.","s":"@buffer"},{"t":"Yo casi no me muevo.","s":"@buffer"},{"t":"Gracias, amiga sangre.","s":"@buffer"},{"t":"Dicho de otro modo:","s":"@buffer"},{"t":"Una disolución amortiguadora mantiene el pH casi fijo, como en tu sangre.","v":"Una disolución amortiguadora mantiene el pe hache casi fijo, como en tu sangre.","s":"@buffer"},{"tipo":"barra","b":"buffer","o":"Ves dos vasos: agua, y sangre. Les vas echando gotas de ácido.","pasos":[[1,"Con una gota, el agua ya cambió mucho."],[5,"La sangre casi no se mueve."],[10,"Tu cuerpo tiene sustancias que protegen la sangre del cambio."]]}]},{"id":"q_dilucion_q","t":"Diluir","res":"Agregar agua reparte lo disuelto en más espacio.","g":[{"t":"Diluir"},{"t":"Tienes un jarabe de sabor, muy fuerte, y le pones agua.","s":"@dilucion=0"},{"t":"Hola, amigo sabor. ¿Te fuiste?","s":"@dilucion=60"},{"t":"No, amigo. Aquí estoy, repartido en más agua.","s":"@dilucion=60"},{"t":"A un café cargado le pasa igual.","s":"ic:coffee"},{"t":"Por eso importa la cantidad en cada medicina.","s":"ic:coffee"},{"t":"Gracias, amigo sabor.","s":"ic:coffee"},{"t":"Dicho de otro modo:","s":"ic:coffee"},{"t":"Al diluir, la misma cantidad de sustancia ocupa más volumen, y baja la concentración.","s":"ic:coffee"},{"tipo":"barra","b":"dilucion","o":"Ves un vaso de jugo muy concentrado. Le vas echando agua.","pasos":[[0,"Al inicio, el color es fuerte."],[40,"Con agua, se ve más claro y sabe menos."],[100,"Con mucha agua, casi no se nota."]]}]},{"id":"q_cueva","t":"Estalactitas","res":"El agua disuelve piedra y la vuelve a dejar gota a gota.","g":[{"t":"Estalactitas"},{"t":"Entras a una cueva, y del techo cuelgan puntas de piedra.","s":"ic:drop"},{"t":"Cae una gota, y te saluda.","s":"ic:drop"},{"t":"Hola, amigo. Traigo un poquito de piedra disuelta.","s":"ic:drop"},{"t":"Y dejo un poquito aquí, cada vez.","s":"mol:CaCO3"},{"t":"El sarro de tu regadera es igual.","s":"ic:shower"},{"t":"Gracias, amiga gota.","s":"ic:shower"},{"t":"Dicho de otro modo:","s":"ic:shower"},{"t":"El agua disuelve carbonato de calcio y lo vuelve a depositar, formando estalactitas.","s":"ic:shower"}]},{"id":"q_gas_globo","t":"Los gases y el calor","res":"Un gas caliente ocupa más espacio.","g":[{"t":"Los gases y el calor"},{"t":"Ves un globo afuera, en una noche fría, medio desinflado.","s":"@globo"},{"t":"Hola, amigo globo. ¿Estás bien?","s":"@globo"},{"t":"Tengo frío, amigo. Mis moléculas casi no empujan.","s":"@globo"},{"t":"Lo metes a la casa, y se vuelve a inflar.","s":"@globo"},{"t":"Una llanta en un día caliente, igual.","s":"ic:car"},{"t":"Gracias, amigo globo.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"Al calentar un gas, sus moléculas se mueven más y empujan más.","s":"ic:car"}]},{"id":"q_lluvia_acida","t":"Lluvia ácida","res":"Los gases de las fábricas pueden volver ácida la lluvia.","g":[{"t":"Lluvia ácida"},{"t":"Ves una chimenea, quemando carbón.","s":"ic:factory"},{"t":"Suelta un gas con azufre, y sube hasta las nubes.","s":"ic:factory"},{"t":"Hola, amiga lluvia. ¿Qué te pasó?","s":"ic:cloud-rain"},{"t":"Me volví ácida, amigo, sin querer.","s":"ic:cloud-rain"},{"t":"Con los años, una estatua pierde su cara.","s":"ic:buildings"},{"t":"Con combustibles más limpios, esto ha bajado.","s":"ic:buildings"},{"t":"Gracias, amiga lluvia.","s":"ic:buildings"},{"t":"Dicho de otro modo:","s":"ic:buildings"},{"t":"Los óxidos de azufre y nitrógeno reaccionan con el agua del aire, y forman ácidos.","s":"ic:buildings"}]},{"id":"q_ozono","t":"La capa de ozono","res":"El ozono de arriba nos protege de los rayos del Sol.","g":[{"t":"La capa de ozono"},{"t":"Ves una sombrilla enorme, muy arriba en el cielo.","s":"mol:O3,O2"},{"t":"Hola, amigo ozono. ¿Tú nos cuidas?","s":"mol:O3,O2"},{"t":"Sí, amigo. Detengo gran parte de los rayos que queman.","s":"mol:O3,O2"},{"t":"Unos gases de refrigeradores antiguos me hicieron un hoyo.","s":"ic:sun"},{"t":"El mundo los prohibió, y me estoy recuperando.","s":"ic:sun"},{"t":"Gracias, amigo ozono.","s":"ic:sun"},{"t":"Dicho de otro modo:","s":"ic:sun"},{"t":"La capa de ozono absorbe radiación ultravioleta, y se protegió prohibiendo ciertos gases.","s":"ic:sun"}]},{"id":"q_invernadero","t":"El CO₂ y el calor","res":"Algunos gases dejan entrar el calor y le cuesta salir.","g":[{"t":"El CO₂ y el calor"},{"t":"Tu carro está al sol, con las ventanas cerradas.","s":"ic:car"},{"t":"Hola, amigo CO₂. ¿Tú haces eso con la Tierra?","v":"Hola, amigo ce o dos. ¿Tú haces eso con la Tierra?","s":"mol:CO2"},{"t":"Algo parecido, amigo. Guardo parte del calor.","s":"mol:CO2"},{"t":"Sin mí, se congelarían.","s":"mol:CO2"},{"t":"Pero con mucho de mí, se calienta de más.","s":"mol:CO2"},{"t":"Gracias, amigo CO₂.","v":"Gracias, amigo ce o dos.","s":"mol:CO2"},{"t":"Dicho de otro modo:","s":"mol:CO2"},{"t":"Los gases de efecto invernadero retienen calor en la atmósfera.","s":"mol:CO2"},{"tipo":"barra","b":"co2","o":"Miras el aire a través de los años, y cuentas el CO₂.","pasos":[[0,"Hacia 1850, había alrededor de 285 partes por millón."],[2,"Hacia 1980, ya eran unas 340."],[4,"Hacia 2020, unas 414."]]}]},{"id":"q_fotosintesis","t":"Cómo comen las plantas","res":"Las plantas hacen azúcar con CO₂, agua y luz.","g":[{"t":"Cómo comen las plantas"},{"t":"Hay una hoja al sol.","s":"ic:leaf"},{"t":"Hola, amiga hoja. ¿Qué estás comiendo?","s":"ic:leaf"},{"t":"Aire, agua y luz, amigo.","s":"ic:leaf"},{"t":"Con eso hago azúcar, y te regalo oxígeno.","s":"rx:6CO2+6H2O>glucosa+6O2"},{"t":"Casi toda la madera de un árbol vino del aire.","s":"ic:tree"},{"t":"Gracias, amiga hoja.","s":"ic:tree"},{"t":"Dicho de otro modo:","s":"ic:tree"},{"t":"En la fotosíntesis, las plantas usan luz para hacer glucosa con CO₂ y agua, y liberan oxígeno.","v":"En la fotosíntesis, las plantas usan luz para hacer glucosa con ce o dos y agua, y liberan oxígeno.","s":"ic:tree"}]},{"id":"q_respirar","t":"Tu cuerpo también quema","res":"Tu cuerpo usa oxígeno para sacar energía de la comida.","g":[{"t":"Tu cuerpo también quema"},{"t":"Te comes un pan, y su azúcar llega a tus células.","s":"ic:bread"},{"t":"Hola, amigo oxígeno. ¿Qué haces con ella?","s":"ic:bread"},{"t":"Nos juntamos, amigo, y sale energía, sin flama.","s":"ic:bread"},{"t":"Tu aliento en un día frío es lo que queda de ese pan.","s":"mol:CO2"},{"t":"Gracias, amigo oxígeno.","s":"mol:CO2"},{"t":"Dicho de otro modo:","s":"mol:CO2"},{"t":"La respiración celular usa oxígeno para sacar energía de la glucosa, y libera CO₂ y agua.","v":"La respiración celular usa oxígeno para sacar energía de la glucosa, y libera ce o dos y agua.","s":"mol:CO2"}]},{"id":"q_fermentar","t":"Fermentar","res":"Sin oxígeno, las levaduras vuelven el azúcar alcohol y gas.","g":[{"t":"Fermentar"},{"t":"Ves jugo de uva en un barril cerrado.","s":"ic:beer-bottle"},{"t":"Hola, amigas levaduras. ¿Qué hacen aquí?","s":"ic:beer-bottle"},{"t":"Comemos azúcar, amigo, sin oxígeno.","s":"ic:beer-bottle"},{"t":"Y soltamos alcohol y gas.","s":"mol:C2H5OH,CO2"},{"t":"En el pan, el alcohol se va en el horno, y las burbujas se quedan.","s":"ic:bread"},{"t":"Gracias, amigas.","s":"ic:bread"},{"t":"Dicho de otro modo:","s":"ic:bread"},{"t":"En la fermentación, las levaduras convierten azúcar en alcohol y CO₂, sin oxígeno.","v":"En la fermentación, las levaduras convierten azúcar en alcohol y ce o dos, sin oxígeno.","s":"ic:bread"}]},{"id":"q_fuegos","t":"Colores de los fuegos artificiales","res":"Cada metal le da su color a la llama.","g":[{"t":"Colores de los fuegos artificiales"},{"t":"Ves fuegos artificiales en la noche, rojos y verdes.","s":"@flama"},{"t":"Hola, amigos. ¿Quién pone el color?","s":"@flama=4"},{"t":"Yo el rojo, dice el estroncio. Yo el verde, dice el bario.","s":"@flama=4"},{"t":"Mis electrones suben con el calor, y al bajar sueltan luz.","s":"@flama=4"},{"t":"Gracias, amigos.","s":"@flama=4"},{"t":"Dicho de otro modo:","s":"@flama=4"},{"t":"Cada elemento emite luz de colores propios cuando sus electrones regresan a un nivel bajo.","s":"@flama=4"},{"tipo":"barra","b":"flama","o":"Echas una pizca de distintas sales a una llama.","pasos":[[1,"Con sodio, la llama se pone amarilla."],[3,"Con calcio, naranja."],[4,"Con estroncio, roja, como en los fuegos artificiales."],[6,"Con cobre, verde azulada."]]}]},{"id":"q_horno_hierro","t":"Cómo se saca el hierro","res":"En el horno, el carbono le quita el oxígeno a la piedra.","g":[{"t":"Cómo se saca el hierro"},{"t":"Ves una piedra rojiza, en una mina.","s":"ic:mountains"},{"t":"Hola, amigo hierro. ¿Estás ahí adentro?","s":"ic:mountains"},{"t":"Sí, amigo, abrazado con el oxígeno.","s":"ic:mountains"},{"t":"En el horno llega el carbono, y se lleva al oxígeno.","s":"el:Fe,C"},{"t":"Sale CO₂, y queda hierro líquido.","v":"Sale ce o dos, y queda hierro líquido.","s":"el:Fe,C"},{"t":"Gracias, amigos.","s":"el:Fe,C"},{"t":"Dicho de otro modo:","s":"el:Fe,C"},{"t":"En el alto horno, el carbono reduce el óxido de hierro, y se obtiene el metal.","s":"el:Fe,C"}]},{"id":"q_cemento","t":"Cómo endurece el cemento","res":"El cemento reacciona con agua y se vuelve piedra.","g":[{"t":"Cómo endurece el cemento"},{"t":"Tienes un polvo gris en una bolsa, y le echas agua.","s":"ic:mountains"},{"t":"Un día después, es duro como roca.","s":"ic:mountains"},{"t":"Amigo cemento, ¿te secaste?","s":"ic:mountains"},{"t":"No, amigo. Reaccioné con el agua.","s":"ic:mountains"},{"t":"Y sigo endureciéndome por años.","s":"ic:buildings"},{"t":"Gracias, amigo cemento.","s":"ic:buildings"},{"t":"Dicho de otro modo:","s":"ic:buildings"},{"t":"El cemento fragua por una reacción con el agua, llamada hidratación.","s":"ic:buildings"}]},{"id":"q_agua_dura","t":"Agua dura y sarro","res":"Algunas aguas traen minerales que dejan piedra.","g":[{"t":"Agua dura y sarro"},{"t":"Miras tu regadera, con manchas blancas.","s":"ic:shower"},{"t":"Hola, amigo sarro. ¿De dónde saliste?","s":"ic:shower"},{"t":"Venía disuelto en el agua, amigo. Me quedé al secarse.","s":"ic:shower"},{"t":"Con un poco de vinagre, me aflojo.","s":"mol:CaCO3"},{"t":"Gracias, amigo sarro.","s":"mol:CaCO3"},{"t":"Dicho de otro modo:","s":"mol:CaCO3"},{"t":"El agua dura trae iones de calcio y magnesio, que forman sarro; los ácidos lo disuelven.","s":"mol:CaCO3"}]},{"id":"q_sal_de_mar","t":"Por qué el mar es salado","res":"Los ríos llevan sales al mar y el agua se evapora sin ellas.","g":[{"t":"Por qué el mar es salado"},{"t":"Ves un río bajando de las montañas.","s":"ic:waves"},{"t":"Hola, amigo río. ¿Qué llevas?","s":"ic:waves"},{"t":"Un poquito de piedra disuelta, para el mar.","s":"ic:waves"},{"t":"El sol calienta el mar, y sube el agua solita.","s":"ic:sun"},{"t":"Y yo me quedo, dice la sal.","s":"red:nacl"},{"t":"Gracias, amigos.","s":"red:nacl"},{"t":"Dicho de otro modo:","s":"red:nacl"},{"t":"Los ríos llevan sales al mar, y al evaporarse el agua, las sales se quedan.","s":"red:nacl"}]}]},{"id":"qC1","et":"C1","mat":"q","nom":"La vida y los materiales","lec":[{"id":"q_cuatro_manos","t":"El carbono, el gran constructor","res":"Con sus cuatro enlaces, el carbono arma millones de moléculas.","g":[{"t":"El carbono, el gran constructor"},{"t":"Te encuentras a tu amigo el carbono, con sus cuatro manos.","s":"p:nada;C .5 .52 feliz .4"},{"t":"Hola, amigo carbono. ¿Qué construyes hoy?","s":"p:nada;C .5 .52 feliz .4"},{"t":"Cadenas, ramas y anillos, amigo. Lo que quieras.","s":"p:nada;C .5 .52 feliz .4"},{"t":"Mira, un anillo de seis.","s":"mol:C6H6"},{"t":"Cambio una pieza, y ya es otra sustancia.","s":"mol:C6H6"},{"t":"Gracias, amigo carbono.","s":"mol:C6H6"},{"t":"Dicho de otro modo:","s":"mol:C6H6"},{"t":"El carbono forma cuatro enlaces y largas cadenas, y por eso existen millones de compuestos orgánicos.","s":"mol:C6H6"}]},{"id":"q_cadenas","t":"Cadenas de carbono","res":"Entre más larga la cadena, más pesada y menos gas.","g":[{"t":"Cadenas de carbono"},{"t":"Prendes el gas de tu estufa.","s":"mol:CH4"},{"t":"Hola, amigo. ¿Cuántos carbonos eres?","s":"mol:CH4"},{"t":"Uno solo, amigo, y cuatro hidrógenos.","s":"mol:CH4"},{"t":"Le agregas carbonos, y se vuelve líquida: es gasolina.","s":"@cadena=8"},{"t":"Con muchos, es la cera de una vela.","s":"ic:fire"},{"t":"Gracias, amigos.","s":"ic:fire"},{"t":"Dicho de otro modo:","s":"ic:fire"},{"t":"Las cadenas largas de hidrocarburos se atraen más, y por eso pasan de gas a líquido y a sólido.","s":"ic:fire"},{"tipo":"barra","b":"cadena","o":"Ves una cadena de carbonos. Le vas agregando eslabones.","pasos":[[1,"Con uno, es gas de la estufa."],[8,"Con ocho, es líquida, como la gasolina."],[16,"Con dieciséis, es más espesa, como el diésel."],[28,"Con muchos, ya es sólida, como la cera de una vela."]]}]},{"id":"q_petroleo","t":"De dónde sale el petróleo","res":"El petróleo son restos de seres antiguos, cocidos bajo tierra.","g":[{"t":"De dónde sale el petróleo"},{"t":"Es el mar, hace millones de años.","s":"ic:fish"},{"t":"Seres diminutos caen al fondo, y los cubre el lodo.","s":"ic:fish"},{"t":"Hola, amiga gasolina. ¿Tú vienes de ahí?","s":"ic:gas-pump"},{"t":"Sí, amigo. Soy energía de un sol muy antiguo.","s":"ic:gas-pump"},{"t":"Gracias, amiga gasolina.","s":"ic:gas-pump"},{"t":"Dicho de otro modo:","s":"ic:gas-pump"},{"t":"El petróleo se forma de restos de organismos, con presión y calor durante millones de años.","s":"ic:gas-pump"}]},{"id":"q_refineria","t":"Separar el petróleo","res":"Al calentar el petróleo, cada parte sube a su altura.","g":[{"t":"Separar el petróleo"},{"t":"Ves una torre muy alta, muy caliente abajo.","s":"ic:factory"},{"t":"Le metes petróleo, y cada amigo se va a su piso.","s":"ic:factory"},{"t":"Yo subo hasta arriba, dice la gasolina. Peso poquito.","s":"@cadena=8"},{"t":"Yo me quedo abajo, dice el asfalto.","s":"@cadena=28"},{"t":"Gracias, amigos.","s":"@cadena=28"},{"t":"Dicho de otro modo:","s":"@cadena=28"},{"t":"La destilación separa el petróleo según el punto de ebullición de cada parte.","s":"@cadena=28"}]},{"id":"q_alcohol","t":"Qué es un alcohol","res":"Un alcohol es una cadena con oxígeno e hidrógeno en la punta.","g":[{"t":"Qué es un alcohol"},{"t":"Ves una cadena corta, con un adorno en la punta.","s":"mol:C2H5OH"},{"t":"Hola, amigo alcohol. ¿Qué es eso?","s":"mol:C2H5OH"},{"t":"Un oxígeno con un hidrógeno, amigo. Por eso soy alcohol.","s":"mol:C2H5OH"},{"t":"Por eso estoy en el gel de manos, quitando microbios.","s":"ic:hand-soap"},{"t":"Mi primo el metanol se parece, pero ese es venenoso.","s":"mol:CH3OH"},{"t":"Gracias, amigo alcohol.","s":"mol:CH3OH"},{"t":"Dicho de otro modo:","s":"mol:CH3OH"},{"t":"Los alcoholes tienen un grupo OH unido a carbono, y un cambio pequeño cambia mucho sus efectos.","v":"Los alcoholes tienen un grupo o hache unido a carbono, y un cambio pequeño cambia mucho sus efectos.","s":"mol:CH3OH"}]},{"id":"q_vinagre_q","t":"Qué hay en el vinagre","res":"El vinagre es un ácido orgánico: alcohol que se oxidó.","g":[{"t":"Qué hay en el vinagre"},{"t":"Ves una botella de vino abierta, por semanas, que ya sabe agria.","s":"ic:wine"},{"t":"Hola, amigo. ¿Quién eres ahora?","s":"mol:CH3COOH"},{"t":"Soy el ácido acético, amigo. Antes era alcohol.","s":"mol:CH3COOH"},{"t":"Unas bacterias me pasaron oxígeno.","s":"mol:CH3COOH"},{"t":"Mi amigo el de las hormigas se parece a mí.","s":"ic:bug"},{"t":"Gracias, amigo.","s":"ic:bug"},{"t":"Dicho de otro modo:","s":"ic:bug"},{"t":"Las bacterias oxidan el alcohol del vino, y forman ácido acético: el vinagre.","s":"ic:bug"}]},{"id":"q_aromas","t":"El olor de las frutas","res":"Muchos aromas son ésteres, hechos de un ácido y un alcohol.","g":[{"t":"El olor de las frutas"},{"t":"Hueles un plátano maduro.","s":"ic:orange"},{"t":"Hola, amigo aroma. ¿Quién eres?","s":"ic:orange"},{"t":"Soy un éster, amigo. Mis papás son un alcohol y un ácido.","s":"ic:orange"},{"t":"En un dulce de plátano suelo estar, hecho en fábrica.","s":"ic:ice-cream"},{"t":"Gracias, amigo aroma.","s":"ic:ice-cream"},{"t":"Dicho de otro modo:","s":"ic:ice-cream"},{"t":"Muchos olores de fruta son ésteres, que se forman al unir un ácido y un alcohol.","s":"ic:ice-cream"}]},{"id":"q_azucares","t":"Los azúcares","res":"Los azúcares son anillos de carbono que dan energía.","g":[{"t":"Los azúcares"},{"t":"Ves un anillo con seis puntas.","s":"mol:glucosa"},{"t":"Hola, amiga glucosa. ¿Tú qué haces?","s":"mol:glucosa"},{"t":"Soy la gasolina de tus células, amigo.","s":"mol:glucosa"},{"t":"Una cucharada de azúcar somos dos anillos unidos.","s":"ic:cookie"},{"t":"Y el pan tiene cadenas largas de nosotras.","s":"ic:bread"},{"t":"Gracias, amiga glucosa.","s":"ic:bread"},{"t":"Dicho de otro modo:","s":"ic:bread"},{"t":"Los azúcares son carbohidratos: desde anillos simples hasta cadenas largas como el almidón.","s":"ic:bread"}]},{"id":"q_celulosa","t":"Almidón y madera","res":"Con los mismos azúcares se hace comida y madera.","g":[{"t":"Almidón y madera"},{"t":"Ves un pan en la boca, que después de masticarlo sabe dulce.","s":"ic:bread"},{"t":"Hola, amigo almidón. ¿Eras azúcar?","s":"ic:bread"},{"t":"Sí, amigo, una cadena de ella.","s":"ic:bread"},{"t":"Hola, amiga madera. ¿Tú también?","s":"ic:tree"},{"t":"Yo también, amigo, pero unida de otro modo. A ti no te alimento.","s":"ic:tree"},{"t":"Gracias, amigos.","s":"ic:tree"},{"t":"Dicho de otro modo:","s":"ic:tree"},{"t":"Almidón y celulosa son cadenas de glucosa; cambia cómo se unen, y por eso digerimos solo una.","s":"ic:tree"}]},{"id":"q_grasas","t":"Las grasas","res":"Las grasas son largas cadenas, sólidas o líquidas.","g":[{"t":"Las grasas"},{"t":"Le untas mantequilla a un pan.","s":"@cadena=18"},{"t":"Hola, amiga mantequilla. ¿Por qué tan firme?","s":"@cadena=18"},{"t":"Mis cadenas son rectas, y me acomodo bien.","s":"@cadena=18"},{"t":"Hola, amigo aceite. ¿Y tú?","s":"ic:drop"},{"t":"Yo tengo dobleces, amigo, y no me acomodo.","s":"ic:drop"},{"t":"Gracias, amigos.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"Las grasas saturadas tienen cadenas rectas; las insaturadas, dobleces, y suelen ser líquidas.","s":"ic:drop"}]},{"id":"q_micela","t":"El truco del jabón","res":"El jabón encierra la grasa en bolitas dentro del agua.","g":[{"t":"El truco del jabón"},{"t":"Ves una gota de grasa, y muchos amigos jabón alrededor.","s":"@jabon"},{"t":"Hola, amigos. ¿Qué hacen?","s":"@jabon"},{"t":"Metemos la cola en la grasa, y dejamos la cabeza en el agua.","s":"@jabon"},{"t":"Y la rodean, hasta hacer una bolita.","s":"@jabon"},{"t":"Con tu champú, igual.","s":"ic:shower"},{"t":"Gracias, amigos jabón.","s":"ic:shower"},{"t":"Dicho de otro modo:","s":"ic:shower"},{"t":"Las moléculas de jabón forman micelas, que atrapan la grasa dentro del agua.","s":"ic:shower"},{"tipo":"barra","b":"jabon","o":"Traes una gota de grasa en la mano. Le vas poniendo jabón.","pasos":[[4,"Con poquito, la mancha sigue ahí."],[14,"Con más, el jabón la va rodeando."],[28,"Con suficiente, la grasa se suelta y el agua se la lleva."]]}]},{"id":"q_aminoacidos","t":"Las piezas de la proteína","res":"Las proteínas se arman con 20 tipos de piezas.","g":[{"t":"Las piezas de la proteína"},{"t":"Ves un collar de cuentas, con 20 colores.","s":"mol:glicina"},{"t":"Hola, amiga cuenta. ¿Quién eres?","s":"mol:glicina"},{"t":"Soy un aminoácido, amigo. Con nosotras se arma todo.","s":"mol:glicina"},{"t":"Comes carne, y tu cuerpo la desarma en cuentas.","s":"ic:hamburger"},{"t":"Y con ellas arma sus propios collares.","s":"ic:hamburger"},{"t":"Gracias, amiga.","s":"ic:hamburger"},{"t":"Dicho de otro modo:","s":"ic:hamburger"},{"t":"Las proteínas son cadenas de aminoácidos; el cuerpo usa 20 tipos principales.","s":"ic:hamburger"}]},{"id":"q_proteinas","t":"Qué hacen las proteínas","res":"La forma de cada proteína decide su trabajo.","g":[{"t":"Qué hacen las proteínas"},{"t":"Ves un collar que se dobla solo, hasta hacer una bola.","s":"ic:hand-palm"},{"t":"Hola, amiga proteína. ¿Por qué te doblas?","s":"ic:hand-palm"},{"t":"Así sé hacer mi trabajo, amigo.","s":"ic:hand-palm"},{"t":"Yo contraigo tu músculo, dice una.","s":"ic:person-simple-run"},{"t":"Yo cargo oxígeno, dice otra.","s":"ic:heart"},{"t":"Gracias, amigas.","s":"ic:heart"},{"t":"Dicho de otro modo:","s":"ic:heart"},{"t":"La secuencia de una proteína define su forma, y su forma define su función.","s":"ic:heart"}]},{"id":"q_enzimas","t":"Enzimas, los ayudantes del cuerpo","res":"Las enzimas aceleran las reacciones de tu cuerpo.","g":[{"t":"Enzimas, los ayudantes del cuerpo"},{"t":"Traes unas tijeritas, que solo cortan un tipo de papel.","s":"@enzima"},{"t":"Hola, amiga enzima. ¿Eso haces?","s":"@enzima"},{"t":"Sí, amigo. En tu boca, por ejemplo, empiezo a romper el pan.","s":"@enzima"},{"t":"Sin nosotras, digerir duraría muchísimo.","s":"@enzima"},{"t":"Pero con mucho calor, me deformo.","s":"@enzima"},{"t":"Gracias, amiga enzima.","s":"@enzima"},{"t":"Dicho de otro modo:","s":"@enzima"},{"t":"Las enzimas son proteínas catalizadoras, muy específicas, sensibles a la temperatura.","s":"@enzima"},{"tipo":"barra","b":"enzima","o":"Ves una enzima de tu cuerpo trabajando. Le vas subiendo la temperatura.","pasos":[[10,"Con frío, trabaja lento."],[37,"A la temperatura de tu cuerpo, va en su mejor momento."],[60,"Con mucho calor, se deforma y deja de trabajar."]]}]},{"id":"q_adn","t":"ADN, el libro de instrucciones","res":"El ADN guarda la receta de tus proteínas con 4 letras.","g":[{"t":"ADN, el libro de instrucciones"},{"t":"Ves una escalera muy larga, retorcida.","s":"ic:dna"},{"t":"Hola, amigo ADN. ¿Qué dicen tus peldaños?","v":"Hola, amigo a de ene. ¿Qué dicen tus peldaños?","s":"ic:dna"},{"t":"Son cuatro letras, amigo, y forman la receta de tus proteínas.","s":"ic:dna"},{"t":"Una célula de tu mano me trae, casi dos metros, muy enrollado.","s":"ic:hand-palm"},{"t":"Gracias, amigo ADN.","v":"Gracias, amigo a de ene.","s":"ic:hand-palm"},{"t":"Dicho de otro modo:","s":"ic:hand-palm"},{"t":"El ADN guarda instrucciones en el orden de cuatro bases, para fabricar proteínas.","v":"El a de ene guarda instrucciones en el orden de cuatro bases, para fabricar proteínas.","s":"ic:hand-palm"}]},{"id":"q_vitaminas","t":"Las vitaminas","res":"Las vitaminas son moléculas que ayudan a tus enzimas.","g":[{"t":"Las vitaminas"},{"t":"Te encuentras a un marinero antiguo, meses en el mar, con las encías lastimadas.","s":"ic:orange"},{"t":"Hola, amiga vitamina C. ¿Le ayudas?","s":"ic:orange"},{"t":"Sí, amigo. Con unos limones se recupera.","s":"ic:orange"},{"t":"Y tu piel me hace a mí, con el sol, dice la vitamina D.","s":"ic:sun"},{"t":"Gracias, amigas.","s":"ic:sun"},{"t":"Dicho de otro modo:","s":"ic:sun"},{"t":"Las vitaminas son moléculas que el cuerpo necesita en poca cantidad, muchas para ayudar a enzimas.","s":"ic:sun"}]},{"id":"q_medicina","t":"Cómo funciona una medicina","res":"Una medicina encaja en una proteína y cambia lo que hace.","g":[{"t":"Cómo funciona una medicina"},{"t":"Te tomas una pastilla, y viaja por tu sangre.","s":"ic:pill"},{"t":"Hola, amiga pastilla. ¿A dónde vas?","s":"ic:pill"},{"t":"A buscar una proteína donde encajo, amigo, como llave en cerradura.","s":"ic:pill"},{"t":"La aspirina viene de una idea sacada de la corteza del sauce.","s":"ic:tree"},{"t":"Gracias, amiga pastilla.","s":"ic:tree"},{"t":"Dicho de otro modo:","s":"ic:tree"},{"t":"Muchos medicamentos se unen a proteínas específicas, y activan o bloquean su función.","s":"ic:tree"}]},{"id":"q_antibioticos","t":"Antibióticos","res":"Los antibióticos atacan partes que tienen las bacterias.","g":[{"t":"Antibióticos"},{"t":"Ves una bacteria, con una pared alrededor.","s":"ic:bug"},{"t":"Hola, amiga penicilina. ¿Qué le haces?","s":"ic:bug"},{"t":"Le estorbo para construirla, amigo, y ya no aguanta.","s":"ic:bug"},{"t":"Tus células no tienen esa pared.","s":"ic:bug"},{"t":"Una gripa la causa un virus, y conmigo no le pasa nada.","s":"ic:virus"},{"t":"Gracias, amiga penicilina.","s":"ic:virus"},{"t":"Dicho de otro modo:","s":"ic:virus"},{"t":"Los antibióticos atacan estructuras de las bacterias, y no funcionan contra los virus.","s":"ic:virus"}]},{"id":"q_cafeina","t":"La cafeína","res":"La cafeína toma el lugar de la molécula que te da sueño.","g":[{"t":"La cafeína"},{"t":"Llevas todo el día despierto.","s":"ic:coffee"},{"t":"En tu cerebro, una molécula de cansancio busca su lugar.","s":"ic:coffee"},{"t":"Hola, amiga cafeína. ¿Qué haces?","s":"ic:coffee"},{"t":"Me siento en su silla, amigo, y no te avisa del sueño.","s":"ic:coffee"},{"t":"Por eso, de noche, mejor no me tomes.","s":"ic:coffee"},{"t":"Gracias, amiga cafeína.","s":"ic:coffee"},{"t":"Dicho de otro modo:","s":"ic:coffee"},{"t":"La cafeína bloquea los receptores de adenosina, la molécula que indica cansancio.","s":"ic:coffee"}]},{"id":"q_colores","t":"De dónde sale el color","res":"Una molécula tiene color según la luz que absorbe.","g":[{"t":"De dónde sale el color"},{"t":"Ves una camiseta azul, al sol.","s":"ic:paint-brush"},{"t":"Hola, amigo tinte. ¿Por qué azul?","s":"ic:paint-brush"},{"t":"La luz trae todos los colores, amigo. Me como los demás, y te dejo el azul.","s":"ic:paint-brush"},{"t":"La zanahoria deja el naranja.","s":"ic:carrot"},{"t":"Gracias, amigos.","s":"ic:carrot"},{"t":"Dicho de otro modo:","s":"ic:carrot"},{"t":"Una sustancia absorbe parte de la luz, y vemos los colores que refleja.","s":"ic:carrot"}]},{"id":"q_polimeros","t":"Los polímeros","res":"Un polímero es una cadena de piezas iguales repetidas.","g":[{"t":"Los polímeros"},{"t":"Unes clips, uno tras otro, en una cadena larguísima.","s":"@polimero"},{"t":"Hola, amiga cadena. ¿Quién eres?","s":"@polimero"},{"t":"Soy un polímero, amigo. Una bolsa de plástico, por ejemplo.","s":"@polimero"},{"t":"El algodón y tu ADN también son cadenas.","v":"El algodón y tu a de ene también son cadenas.","s":"ic:leaf"},{"t":"Gracias, amiga.","s":"ic:leaf"},{"t":"Dicho de otro modo:","s":"ic:leaf"},{"t":"Un polímero es una molécula muy larga, hecha de unidades repetidas.","s":"ic:leaf"},{"tipo":"barra","b":"polimero","o":"Vas uniendo eslabones iguales, uno tras otro.","pasos":[[3,"Con pocos, es un gas."],[15,"Con más, es un líquido."],[45,"Con más todavía, parece cera."],[200,"Con cientos, ya es plástico."]]}]},{"id":"q_plasticos","t":"Distintos plásticos","res":"Cambiar una pieza cambia todo el plástico.","g":[{"t":"Distintos plásticos"},{"t":"Ves una botella de refresco, y un tubo de agua.","s":"ic:beer-bottle"},{"t":"Hola, amigos. Se ven muy distintos.","s":"ic:beer-bottle"},{"t":"Empezamos casi iguales, amigo.","s":"ic:beer-bottle"},{"t":"Cambias un átomo, y cambia todo.","s":"mol:C2H4"},{"t":"Por eso nos separan por números al reciclar.","s":"ic:recycle"},{"t":"Gracias, amigos.","s":"ic:recycle"},{"t":"Dicho de otro modo:","s":"ic:recycle"},{"t":"Las propiedades de un plástico dependen de la unidad que se repite y de cómo se ordena.","s":"ic:recycle"}]},{"id":"q_reciclar","t":"Reciclar plástico","res":"Reciclar funde o desarma las cadenas, y cada vuelta las debilita.","g":[{"t":"Reciclar plástico"},{"t":"Tienes una botella en un contenedor, y la muelen y funden.","s":"ic:recycle"},{"t":"Hola, amiga chamarra. ¿Tú eras botella?","s":"ic:t-shirt"},{"t":"Sí, amigo. Soy la misma cadena, con otra forma.","s":"ic:t-shirt"},{"t":"Cada vuelta, me hago un poco más corta.","s":"ic:t-shirt"},{"t":"Gracias, amiga chamarra.","s":"ic:t-shirt"},{"t":"Dicho de otro modo:","s":"ic:t-shirt"},{"t":"El reciclaje mecánico funde el plástico, pero cada ciclo acorta sus cadenas.","s":"ic:t-shirt"}]},{"id":"q_caucho","t":"Hule y llantas","res":"El azufre amarra las cadenas de hule y lo vuelve fuerte.","g":[{"t":"Hule y llantas"},{"t":"Ves un árbol que suelta un líquido blanco: es hule.","s":"ic:tree"},{"t":"Hola, amigo azufre. ¿Qué vas a hacer?","s":"el:S"},{"t":"Voy a amarrar sus cadenas, amigo.","s":"el:S"},{"t":"Y con eso, ya es una llanta.","s":"ic:car"},{"t":"Gracias, amigo azufre.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"La vulcanización une las cadenas de caucho con azufre, y lo hace resistente.","s":"ic:car"}]},{"id":"q_nailon","t":"Nailon, seda de fábrica","res":"El nailon es una cadena artificial muy fuerte.","g":[{"t":"Nailon, seda de fábrica"},{"t":"Ves una media, delgadita y resistente.","s":"ic:needle"},{"t":"Hola, amigo nailon. ¿De dónde saliste?","s":"ic:needle"},{"t":"De un laboratorio, amigo. Fui de los primeros hilos de fábrica.","s":"ic:needle"},{"t":"En un hilo de pescar aguanto un buen pez.","s":"ic:fish"},{"t":"Gracias, amigo nailon.","s":"ic:fish"},{"t":"Dicho de otro modo:","s":"ic:fish"},{"t":"El nailon es un polímero sintético, y sus cadenas se atraen fuerte entre sí.","s":"ic:fish"}]},{"id":"q_aleaciones","t":"Las mezclas de metal","res":"Mezclar metales los vuelve más duros.","g":[{"t":"Las mezclas de metal"},{"t":"Ves una fila de pelotas iguales, que se resbalan fácil.","s":"red:metal"},{"t":"Ahora le metes unas de otro tamaño, y estorban.","s":"red:metal"},{"t":"Hola, amigos. ¿Juntos son más duros?","s":"p:nada;Cu .38 .55 abrazo .28;Sn .62 .55 abrazo .28"},{"t":"Sí, amigo. Somos el bronce.","s":"p:nada;Cu .38 .55 abrazo .28;Sn .62 .55 abrazo .28"},{"t":"Por eso, un anillo de oro lleva otro metal.","s":"el:Au,Cu"},{"t":"Gracias, amigos.","s":"el:Au,Cu"},{"t":"Dicho de otro modo:","s":"el:Au,Cu"},{"t":"En una aleación, átomos distintos dificultan que las capas se deslicen, y el metal se endurece.","s":"el:Au,Cu"}]},{"id":"q_acero_q","t":"Acero","res":"Una pizca de carbono convierte el hierro en acero.","g":[{"t":"Acero"},{"t":"Ves una barra de hierro, casi pura, que se dobla fácil.","s":"@acero=0.02"},{"t":"Con permiso, amigo hierro, dice el carbono. Me siento aquí.","s":"@acero=0.02"},{"t":"Y la barra se pone dura.","s":"@acero=1"},{"t":"Con cromo, tampoco se oxida.","s":"ic:knife"},{"t":"Gracias, amigos.","s":"ic:knife"},{"t":"Dicho de otro modo:","s":"ic:knife"},{"t":"El acero es hierro con poco carbono; más carbono lo hace más duro y más frágil.","s":"ic:knife"},{"tipo":"barra","b":"acero","o":"Ves hierro derretido. Le vas agregando una pizca de carbono.","pasos":[[0.02,"Casi sin carbono, es blando y se dobla."],[0.2,"Con una pizca, es acero suave, como una varilla."],[1,"Con un poco más, es acero duro, como un cuchillo."],[3.5,"Con mucho, se vuelve quebradizo, como un sartén de hierro colado."]]}]},{"id":"q_ceramica","t":"Cerámica","res":"La cerámica es dura y aguanta el calor, pero se quiebra.","g":[{"t":"Cerámica"},{"t":"Ves una taza, que se cae al piso y se rompe.","s":"ic:coffee"},{"t":"Amiga taza, ¿por qué te quiebras?","s":"ic:coffee"},{"t":"Mis átomos están muy amarrados, amigo, y no se pueden resbalar.","s":"ic:coffee"},{"t":"Pero aguanto muchísimo calor, como en las naves espaciales.","s":"ic:rocket"},{"t":"Gracias, amiga taza.","s":"ic:rocket"},{"t":"Dicho de otro modo:","s":"ic:rocket"},{"t":"Las cerámicas tienen enlaces muy fuertes: son duras y resisten el calor, pero son frágiles.","s":"ic:rocket"}]},{"id":"q_semiconductor","t":"Los chips","res":"El silicio deja pasar electricidad según lo que le agregues.","g":[{"t":"Los chips"},{"t":"Ves una llave de agua, que abres o cierras.","s":"el:Si"},{"t":"Hola, amigo silicio. ¿Tú eres así?","s":"el:Si"},{"t":"Sí, amigo. Solito casi no dejo pasar.","s":"el:Si"},{"t":"Con una pizca de mis amigos, ya dejo.","s":"el:P,B"},{"t":"En un chip hay miles de millones de llaves como yo.","s":"ic:cpu"},{"t":"Gracias, amigo silicio.","s":"ic:cpu"},{"t":"Dicho de otro modo:","s":"ic:cpu"},{"t":"El dopaje agrega átomos al silicio, y permite controlar el paso de corriente.","s":"ic:cpu"}]},{"id":"q_abono","t":"El pan que sale del aire","res":"Un proceso saca nitrógeno del aire para hacer abono.","g":[{"t":"El pan que sale del aire"},{"t":"Te encuentras a tus amigos nitrógeno, abrazados en el aire.","s":"mol:N2"},{"t":"Hola, amigos. ¿Sueltan el abrazo?","s":"mol:N2"},{"t":"Muy difícil, amigo. Solo con mucha presión.","s":"mol:N2"},{"t":"En la fábrica, los unen con hidrógeno, y sale amoníaco.","s":"mol:NH3"},{"t":"Con ese abono, un campo de maíz da mucha más comida.","s":"ic:plant"},{"t":"Gracias, amigos.","s":"ic:plant"},{"t":"Dicho de otro modo:","s":"ic:plant"},{"t":"El proceso Haber-Bosch fabrica amoníaco con nitrógeno del aire, base de muchos fertilizantes.","s":"ic:plant"}]},{"id":"q_bateria_litio","t":"Baterías de litio","res":"En una batería, el litio viaja entre dos materiales.","g":[{"t":"Baterías de litio"},{"t":"Te encuentras a tu amigo el litio, en su autobús.","s":"p:nada;i:bus .5 .5 .7;Li .5 .22 feliz .18"},{"t":"Hola, amigo litio. ¿Por qué duras menos con los años?","s":"p:nada;i:bus .5 .5 .7;Li .5 .22 feliz .18"},{"t":"Porque algunos de mis amigos se atoran en el camino, amigo.","s":"p:nada;i:bus .5 .5 .7;Li .5 .22 feliz .18"},{"t":"En los carros eléctricos hacemos lo mismo, en grande.","s":"ic:car"},{"t":"Gracias, amigo litio.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"En una batería de litio, los iones se mueven entre dos electrodos, y se degradan con los ciclos.","s":"ic:car"}]},{"id":"q_fibra_carbono","t":"Fibra de carbono","res":"Hilos de carbono muy finos hacen piezas fuertes y ligeras.","g":[{"t":"Fibra de carbono"},{"t":"Ves un hilo más delgado que un cabello, de puro carbono.","s":"red:grafito"},{"t":"Hola, amiga fibra. ¿Qué haces?","s":"red:grafito"},{"t":"Me junto con muchas, y me pegan con plástico.","s":"red:grafito"},{"t":"Una bici así se levanta con un dedo.","s":"ic:bicycle"},{"t":"Y en los aviones nuevos también ayudo.","s":"ic:airplane"},{"t":"Gracias, amiga fibra.","s":"ic:airplane"},{"t":"Dicho de otro modo:","s":"ic:airplane"},{"t":"La fibra de carbono combina hilos de carbono y resina: es fuerte y muy ligera.","s":"ic:airplane"}]},{"id":"q_combustibles","t":"Combustibles de plantas","res":"Algunas plantas se pueden convertir en combustible.","g":[{"t":"Combustibles de plantas"},{"t":"Tienes un campo de caña, y fermentas su azúcar.","s":"ic:plant"},{"t":"Hola, amigo alcohol. ¿Tú mueves carros?","s":"mol:C2H5OH"},{"t":"Sí, amigo. Suelto CO₂, pero la planta ya lo había tomado del aire.","v":"Sí, amigo. Suelto ce o dos, pero la planta ya lo había tomado del aire.","s":"mol:C2H5OH"},{"t":"Gracias, amigo alcohol.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"Los biocombustibles vienen de plantas, y su CO₂ se compensa en parte con el que ellas absorbieron.","v":"Los biocombustibles vienen de plantas, y su ce o dos se compensa en parte con el que ellas absorbieron.","s":"ic:car"}]}]},{"id":"qC2","et":"C2","mat":"q","nom":"Química avanzada","lec":[{"id":"q_porque_ocurre","t":"Por qué ocurren las reacciones","res":"Todo tiende a soltar energía y a repartirse.","g":[{"t":"Por qué ocurren las reacciones"},{"t":"Ves una piedra en lo alto de una loma, y con un empujoncito baja sola.","s":"ic:mountains"},{"t":"Hola, amiga piedra. ¿Subes sola?","s":"ic:mountains"},{"t":"Nunca, amigo. Solo bajo.","s":"ic:mountains"},{"t":"Una gota de tinta en agua se reparte solita.","s":"@entropia=70"},{"t":"Gracias, amigas.","s":"@entropia=70"},{"t":"Dicho de otro modo:","s":"@entropia=70"},{"t":"Las reacciones tienden a liberar energía y a aumentar el desorden: la entalpía y la entropía.","s":"@entropia=70"}]},{"id":"q_entalpia","t":"Entalpía, la energía de los enlaces","res":"Romper enlaces cuesta energía; formarlos la suelta.","g":[{"t":"Entalpía, la energía de los enlaces"},{"t":"Ves dos imanes pegados, que para separarlos cuesta trabajo.","s":"mol:O2"},{"t":"Y cuando se juntan, sueltan esa fuerza.","s":"mol:O2"},{"t":"Hola, amiga flama. ¿De dónde sacas tanto calor?","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Los enlaces nuevos sueltan más de lo que costó romper los viejos, amigo.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Gracias, amiga flama.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Dicho de otro modo:","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"La entalpía de reacción es la diferencia de energía entre romper enlaces y formar otros.","s":"rx:CH4+2O2>CO2+2H2O"}]},{"id":"q_entropia_q","t":"Entropía, el desorden","res":"Las cosas tienden a repartirse de todas las formas posibles.","g":[{"t":"Entropía, el desorden"},{"t":"Tienes una caja de canicas, separadas por color, y la sacudes.","s":"@entropia=100"},{"t":"Hola, amigas canicas. ¿Por qué ya no se separan?","s":"@entropia=100"},{"t":"Hay muchas más formas de estar revueltas, amigo.","s":"@entropia=100"},{"t":"La leche en tu café hace lo mismo.","s":"ic:coffee"},{"t":"Gracias, amigas.","s":"ic:coffee"},{"t":"Dicho de otro modo:","s":"ic:coffee"},{"t":"La entropía mide de cuántas formas se puede acomodar un sistema, y tiende a aumentar.","s":"ic:coffee"},{"tipo":"barra","b":"entropia","o":"Ves dos gases en una caja, separados. Quitas la pared.","pasos":[[10,"Al inicio, cada uno sigue en su lado."],[50,"Poco a poco, se van mezclando."],[100,"Al final, están revueltos, y ya no se separan solos."]]}]},{"id":"q_gibbs_q","t":"Energía libre, la que decide","res":"La energía libre combina energía y desorden para decir qué pasa solo.","g":[{"t":"Energía libre, la que decide"},{"t":"Traes un hielo en la mano.","s":"@gibbs"},{"t":"Hola, amigo hielo. ¿Por qué te derrites?","s":"@gibbs"},{"t":"Con calor gana el desorden, amigo.","s":"@gibbs"},{"t":"En el congelador, gana la energía.","s":"ic:snowflake"},{"t":"Gracias, amigo hielo.","s":"ic:snowflake"},{"t":"Dicho de otro modo:","s":"ic:snowflake"},{"t":"La energía libre de Gibbs combina entalpía, temperatura y entropía: si baja, el proceso es espontáneo.","s":"ic:snowflake"},{"tipo":"barra","b":"gibbs","o":"Ves un cubo de hielo en cuartos a distintas temperaturas.","pasos":[[-30,"Con mucho frío, sigue siendo hielo."],[0,"En cero grados, las dos cosas pasan igual."],[30,"Con calor, se derrite solo."]]}]},{"id":"q_cinetica","t":"Puede pasar, pero tarda","res":"Que algo pueda pasar no significa que pase rápido.","g":[{"t":"Puede pasar, pero tarda"},{"t":"Traes un diamante en la mano.","s":"ic:diamond"},{"t":"Amigo diamante, ¿es cierto que preferirías ser grafito?","s":"ic:diamond"},{"t":"Algún día, amigo. Tardaría muchísimo más que tu vida.","s":"ic:diamond"},{"t":"Una hoja podría quemarse en el aire, pero sin chispa no empieza.","s":"ic:note-pencil"},{"t":"Gracias, amigos.","s":"ic:note-pencil"},{"t":"Dicho de otro modo:","s":"ic:note-pencil"},{"t":"La termodinámica dice si algo puede ocurrir; la cinética dice qué tan rápido.","s":"ic:note-pencil"}]},{"id":"q_arrhenius","t":"La montaña de la reacción","res":"Las moléculas necesitan chocar con suficiente energía.","g":[{"t":"La montaña de la reacción"},{"t":"Ves muchas pelotas rodando hacia una loma, y solo las rápidas pasan.","s":"@catal"},{"t":"Hola, amigas. ¿Cómo pasan más?","s":"@catal"},{"t":"Con más calor, amigo, o con una loma más bajita.","s":"@catal"},{"t":"Gracias, amigas.","s":"@catal"},{"t":"Dicho de otro modo:","s":"@catal"},{"t":"La energía de activación es la barrera de una reacción; se supera con calor o con catalizadores.","s":"@catal"},{"tipo":"barra","b":"catal","o":"Ves una bolita que tiene que subir una montaña para reaccionar.","pasos":[[5,"Con la montaña alta, casi nunca pasa."],[50,"Un catalizador baja la montaña."],[95,"Con la montaña bajita, pasa todo el tiempo."]]}]},{"id":"q_mecanismo","t":"Los pasos ocultos","res":"Una reacción suele ocurrir en varios pasos pequeños.","g":[{"t":"Los pasos ocultos"},{"t":"Subes una escalera, paso a paso.","s":"rx:2H2+O2>2H2O"},{"t":"Hola, amigos. ¿Reaccionan de un brinco?","s":"rx:2H2+O2>2H2O"},{"t":"No, amigo, en varios pasitos. Tú solo ves el principio y el fin.","s":"rx:2H2+O2>2H2O"},{"t":"Y todos vamos al ritmo del paso más lento, como en un puente angosto.","s":"ic:car"},{"t":"Gracias, amigos.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"Un mecanismo describe los pasos de una reacción, y el más lento marca la velocidad.","s":"ic:car"}]},{"id":"q_orbitales","t":"Orbitales, las nubes de electrones","res":"Un electrón no gira en un círculo: ocupa una nube.","g":[{"t":"Orbitales, las nubes de electrones"},{"t":"Ves un ventilador rápido, que parece un disco.","s":"@orbital"},{"t":"Hola, amigo electrón. ¿Dónde estás?","s":"@orbital"},{"t":"Difícil decirlo, amigo. Soy como una nube.","s":"@orbital"},{"t":"Donde hay más puntos, es más fácil encontrarme.","s":"@orbital"},{"t":"Gracias, amigo electrón.","s":"@orbital"},{"t":"Dicho de otro modo:","s":"@orbital"},{"t":"Un orbital es la región donde es probable encontrar a un electrón.","s":"@orbital"},{"tipo":"barra","b":"orbital","o":"Le tomas mil fotos a un electrón. Cada punto es una foto.","pasos":[[0,"Cerca del núcleo, forman una esfera."],[1,"Más lejos, una esfera más grande."],[2,"En este nivel, forman dos lóbulos."],[3,"Y aquí, cuatro lóbulos."]]}]},{"id":"q_configuracion","t":"Cómo se llenan los electrones","res":"Los electrones llenan primero los lugares de menos energía.","g":[{"t":"Cómo se llenan los electrones"},{"t":"Ves un edificio sin elevador, donde la gente ocupa primero los pisos de abajo.","s":"z:Fe"},{"t":"Hola, amigos electrones. ¿Cuántos caben por cuarto?","s":"z:Fe"},{"t":"Dos, amigo, y girando al revés uno del otro.","s":"z:Fe"},{"t":"Gracias, amigos.","s":"z:Fe"},{"t":"Dicho de otro modo:","s":"z:Fe"},{"t":"Los electrones ocupan primero los orbitales de menor energía, con un máximo de dos por orbital.","s":"z:Fe"}]},{"id":"q_hibridos","t":"Orbitales que se mezclan","res":"Los átomos mezclan sus orbitales para enlazarse mejor.","g":[{"t":"Orbitales que se mezclan"},{"t":"Ves dos pinturas distintas, y al mezclarlas salen cuatro partes iguales.","s":"mol:CH4"},{"t":"Hola, amigo carbono. ¿Eso haces?","s":"mol:CH4"},{"t":"Sí, amigo. Por eso mis cuatro manos son iguales.","s":"mol:CH4"},{"t":"Si hago un enlace doble, mezclo tres, y dejo uno aparte.","s":"mol:C2H4"},{"t":"Gracias, amigo carbono.","s":"mol:C2H4"},{"t":"Dicho de otro modo:","s":"mol:C2H4"},{"t":"La hibridación combina orbitales de un átomo, para explicar la forma de sus enlaces.","s":"mol:C2H4"}]},{"id":"q_sigma_pi","t":"Dos tipos de enlace","res":"Un enlace doble tiene una parte fuerte y otra más expuesta.","g":[{"t":"Dos tipos de enlace"},{"t":"Te encuentras a dos amigos de la mano, que pueden girar sin soltarse.","s":"mol:C2H6"},{"t":"Ahora se dan las dos manos, y ya no pueden girar.","s":"mol:C2H4"},{"t":"Y esa segunda mano se suelta más fácil, te dicen.","s":"mol:C2H4"},{"t":"Gracias, amigos.","s":"mol:C2H4"},{"t":"Dicho de otro modo:","s":"mol:C2H4"},{"t":"Un enlace doble tiene un enlace sigma y uno pi; el pi es más débil y más reactivo.","s":"mol:C2H4"}]},{"id":"q_resonancia","t":"Electrones repartidos","res":"En algunas moléculas, los electrones se reparten entre muchos átomos.","g":[{"t":"Electrones repartidos"},{"t":"Te encuentras a seis amigos en círculo, pasándose una pelota.","s":"mol:C6H6"},{"t":"Hola, amigos del benceno. ¿De quién es?","s":"mol:C6H6"},{"t":"De todos, amigo. Por eso estamos tan tranquilos.","s":"mol:C6H6"},{"t":"El color de la zanahoria sale de electrones repartidos también.","s":"ic:carrot"},{"t":"Gracias, amigos.","s":"ic:carrot"},{"t":"Dicho de otro modo:","s":"ic:carrot"},{"t":"En la deslocalización, los electrones se reparten entre varios átomos, y la molécula gana estabilidad.","s":"ic:carrot"}]},{"id":"q_quiralidad","t":"Moléculas zurdas y diestras","res":"Una molécula y su reflejo pueden actuar muy distinto.","g":[{"t":"Moléculas zurdas y diestras"},{"t":"Juntas tus dos manos: iguales, pero no se enciman.","s":"ic:hand-palm"},{"t":"Hola, amigas moléculas. ¿Ustedes también?","s":"ic:hand-palm"},{"t":"Sí, amigo. Somos reflejo una de la otra.","s":"ic:hand-palm"},{"t":"Una huele a naranja, y su reflejo huele a otra cosa.","s":"ic:orange"},{"t":"Por eso las medicinas se revisan con cuidado.","s":"ic:pill"},{"t":"Gracias, amigas.","s":"ic:pill"},{"t":"Dicho de otro modo:","s":"ic:pill"},{"t":"Las moléculas quirales son imágenes en espejo, y pueden tener efectos distintos.","s":"ic:pill"}]},{"id":"q_espectro_q","t":"La huella de cada átomo","res":"Cada elemento absorbe y suelta luz de colores exactos.","g":[{"t":"La huella de cada átomo"},{"t":"Ves un arcoíris muy fino, con rayas de colores.","s":"@flama"},{"t":"Hola, amigos. ¿Qué son esas rayas?","s":"@flama"},{"t":"Es nuestra huella, amigo. Cada quien tiene la suya.","s":"@flama"},{"t":"Así hallaron al helio en el Sol, antes que en la Tierra.","s":"ic:sun"},{"t":"Gracias, amigos.","s":"ic:sun"},{"t":"Dicho de otro modo:","s":"ic:sun"},{"t":"Cada elemento tiene un espectro único, y eso permite identificarlo a distancia.","s":"ic:sun"}]},{"id":"q_rmn","t":"Ver moléculas con imanes","res":"Con imanes potentes se puede saber cómo es una molécula.","g":[{"t":"Ver moléculas con imanes"},{"t":"Hay brújulas diminutas en tus átomos, alineadas por un imán enorme.","s":"ic:magnet"},{"t":"Hola, amiguitas. ¿Qué hacen?","s":"ic:magnet"},{"t":"Nos dan un empujón con radio, y al regresar avisamos dónde estamos.","s":"ic:magnet"},{"t":"Una resonancia en el hospital usa esa idea.","s":"ic:heartbeat"},{"t":"Gracias, amiguitas.","s":"ic:heartbeat"},{"t":"Dicho de otro modo:","s":"ic:heartbeat"},{"t":"La resonancia magnética usa imanes y ondas de radio para estudiar núcleos atómicos.","s":"ic:heartbeat"}]},{"id":"q_cromatografia","t":"Separar mezclas","res":"Cada sustancia avanza a su ritmo y así se separan.","g":[{"t":"Separar mezclas"},{"t":"Ves una mancha de plumón negro, en una servilleta con agua.","s":"ic:pencil"},{"t":"Salen colores.","s":"ic:pencil"},{"t":"Hola, amigas tintas. ¿Estaban juntas?","s":"ic:pencil"},{"t":"Sí, amigo, pero cada una camina a su paso.","s":"ic:pencil"},{"t":"En un laboratorio, así separan una muestra.","s":"ic:flask"},{"t":"Gracias, amigas.","s":"ic:flask"},{"t":"Dicho de otro modo:","s":"ic:flask"},{"t":"La cromatografía separa una mezcla según qué tan rápido avanza cada componente.","s":"ic:flask"}]},{"id":"q_masas","t":"Pesar moléculas","res":"Se puede saber qué molécula es por su peso exacto.","g":[{"t":"Pesar moléculas"},{"t":"Ves pelotas de distinto peso, y un ventilador de lado.","s":"ic:scales"},{"t":"Las ligeras se desvían mucho, y las pesadas, poco.","s":"ic:scales"},{"t":"Hola, amigas moléculas. ¿Así las reconocen?","s":"ic:scales"},{"t":"Sí, amigo, por nuestro peso exacto.","s":"ic:scales"},{"t":"Con una gota de sangre se saben muchas cosas.","s":"ic:drop"},{"t":"Gracias, amigas.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"La espectrometría de masas identifica moléculas por su masa y su carga.","s":"ic:drop"}]},{"id":"q_catalisis_q","t":"Catalizadores de superficie","res":"Muchos catalizadores agarran las moléculas en su superficie.","g":[{"t":"Catalizadores de superficie"},{"t":"Ves una mesa, donde las piezas se juntan mejor.","s":"el:Pt,Rh"},{"t":"Hola, amigo platino. ¿Esa mesa eres tú?","s":"el:Pt,Rh"},{"t":"Sí, amigo. Aquí se pegan, se aflojan, y reaccionan.","s":"el:Pt,Rh"},{"t":"Luego se van, y yo me quedo igual.","s":"ic:car"},{"t":"Gracias, amigo platino.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"En la catálisis de superficie, las moléculas se adsorben en un metal, reaccionan y se liberan.","s":"ic:car"}]},{"id":"q_potencial","t":"Quién quiere electrones","res":"Cada metal tiene más o menos ganas de soltar electrones.","g":[{"t":"Quién quiere electrones"},{"t":"Empieza un juego de quién suelta electrones.","s":"p:nada;Zn .3 .55 feliz .28;Cu .7 .55 feliz .28;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"Yo los suelto fácil, dice el zinc.","s":"p:nada;Zn .3 .55 feliz .28;Cu .7 .55 feliz .28;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"Yo los recibo, dice el cobre.","s":"p:nada;Zn .3 .55 feliz .28;Cu .7 .55 feliz .28;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"Juntos dan más o menos un voltio.","s":"p:nada;Zn .3 .55 feliz .28;Cu .7 .55 feliz .28;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"Gracias, amigos.","s":"p:nada;Zn .3 .55 feliz .28;Cu .7 .55 feliz .28;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"Dicho de otro modo:","s":"p:nada;Zn .3 .55 feliz .28;Cu .7 .55 feliz .28;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"t":"La diferencia de potencial entre dos metales determina el voltaje de una celda.","s":"p:nada;Zn .3 .55 feliz .28;Cu .7 .55 feliz .28;e .5 .28 feliz .12;fl .38 .3 .62 .3"},{"tipo":"barra","b":"celdas","o":"Ves un foco conectado a pilas. Vas agregando una por una.","pasos":[[1,"Con una, apenas prende."],[3,"Con tres, ya se ve bien."],[6,"Con seis, brilla fuerte."]]}]},{"id":"q_corrosion","t":"Cómo se protege el metal","res":"Un metal más reactivo se sacrifica para proteger al otro.","g":[{"t":"Cómo se protege el metal"},{"t":"Ves un barco de acero en el mar.","s":"ic:boat"},{"t":"Hola, amigo zinc. ¿Qué haces pegado al barco?","s":"ic:boat"},{"t":"Me gasto en su lugar, amigo. Lo cuido.","s":"ic:boat"},{"t":"Una tubería bajo tierra también lleva amigos así.","s":"ic:boat"},{"t":"Gracias, amigo zinc.","s":"ic:boat"},{"t":"Dicho de otro modo:","s":"ic:boat"},{"t":"La protección catódica sacrifica un metal más reactivo para proteger el acero.","s":"ic:boat"}]},{"id":"q_cuantica","t":"La química es física cuántica","res":"Los enlaces se pueden calcular desde las reglas cuánticas.","g":[{"t":"La química es física cuántica"},{"t":"Ves dos ondas en un estanque, que al coincidir crecen.","s":"@orbital"},{"t":"Hola, amigos hidrógeno. ¿Así se unen?","s":"mol:H2"},{"t":"Sí, amigo. Nuestras ondas se suman en medio, y eso es un enlace.","s":"mol:H2"},{"t":"Con computadoras, ya se calcula sin hacer el experimento.","s":"ic:cpu"},{"t":"Gracias, amigos.","s":"ic:cpu"},{"t":"Dicho de otro modo:","s":"ic:cpu"},{"t":"La química cuántica describe los enlaces como combinaciones de ondas de electrones.","s":"ic:cpu"}]},{"id":"q_semivida_q","t":"Átomos que se rompen","res":"Un átomo radiactivo se rompe tarde o temprano, sin aviso.","g":[{"t":"Átomos que se rompen"},{"t":"Hay palomitas en una olla, y no sabes cuál va a brincar.","s":"@semivida"},{"t":"Hola, amigos átomos. ¿Cuándo se rompen?","s":"@semivida"},{"t":"Quién sabe, amigo. Pero sabemos cuántos, más o menos.","s":"@semivida"},{"t":"En un hueso antiguo, la mitad de mi amigo el carbono catorce se va cada 5730 años.","s":"ic:bone"},{"t":"Gracias, amigos.","s":"ic:bone"},{"t":"Dicho de otro modo:","s":"ic:bone"},{"t":"La semivida es el tiempo en que se desintegra la mitad de los núcleos de una muestra.","s":"ic:bone"},{"tipo":"barra","b":"semivida","o":"Ves muchos átomos juntos, y mira cuántos quedan con el tiempo.","pasos":[[0,"Al inicio, están todos."],[1,"Después de una semivida, queda la mitad."],[3,"Después de tres, queda una octava parte."]]}]},{"id":"q_fision_q","t":"Partir el núcleo","res":"Al romper un núcleo pesado, se suelta muchísima energía.","g":[{"t":"Partir el núcleo"},{"t":"Te encuentras a tu amigo el uranio, muy cargado.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Le llega un neutrón, y se parte.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Salen más neutrones, y siguen otros.","s":"p:nada;U .32 .55 sorpresa .24;U .68 .55 sorpresa .24;i:sparkle .5 .25 .3 #E0A92E"},{"t":"Una planta nuclear controla esa cadena, para hacer vapor.","s":"ic:nuclear-plant"},{"t":"Gracias, amigo uranio.","s":"ic:nuclear-plant"},{"t":"Dicho de otro modo:","s":"ic:nuclear-plant"},{"t":"En la fisión, un núcleo pesado se divide y libera energía y neutrones, en reacción en cadena.","s":"ic:nuclear-plant"}]},{"id":"q_nuevos","t":"Elementos hechos por el hombre","res":"Los elementos más pesados solo se crean chocando átomos.","g":[{"t":"Elementos hechos por el hombre"},{"t":"Ves dos pelotas lanzadas muy rápido, que a veces se quedan pegadas.","s":"tabla:Tc,Pu,Og"},{"t":"Hola, amigo oganesón. ¿Así naciste?","s":"tabla:Tc,Pu,Og"},{"t":"Sí, amigo. Y me voy en menos de un segundo.","s":"tabla:Tc,Pu,Og"},{"t":"Mi vecino el americio está en algunos detectores de humo.","s":"ic:fire-extinguisher"},{"t":"Gracias, amigos.","s":"ic:fire-extinguisher"},{"t":"Dicho de otro modo:","s":"ic:fire-extinguisher"},{"t":"Los elementos superpesados se crean chocando núcleos en aceleradores, y duran muy poco.","s":"ic:fire-extinguisher"}]},{"id":"q_verde","t":"Química verde","res":"Se puede hacer química con menos desperdicio.","g":[{"t":"Química verde"},{"t":"Cocinas sin dejar basura, usando cada ingrediente.","s":"ic:recycle"},{"t":"Hola, amiga fábrica. ¿Tú también?","s":"ic:factory"},{"t":"Lo estoy intentando, amigo. Antes tiraba mucho más de lo que hacía.","s":"ic:factory"},{"t":"Gracias, amiga fábrica.","s":"ic:factory"},{"t":"Dicho de otro modo:","s":"ic:factory"},{"t":"La química verde busca procesos con menos residuos y menos sustancias peligrosas.","s":"ic:factory"}]},{"id":"q_cristales_liq","t":"Cristales líquidos","res":"Algunas moléculas fluyen y a la vez se acomodan en orden.","g":[{"t":"Cristales líquidos"},{"t":"Ves palitos flotando en agua, todos apuntando al mismo lado.","s":"ic:television-simple"},{"t":"Hola, amigos palitos. ¿Son líquido?","s":"ic:television-simple"},{"t":"Sí, amigo, pero ordenado. Con electricidad, giramos.","s":"ic:television-simple"},{"t":"En una pantalla de calculadora, dejamos pasar la luz, o la tapamos.","s":"ic:device-mobile"},{"t":"Gracias, amigos.","s":"ic:device-mobile"},{"t":"Dicho de otro modo:","s":"ic:device-mobile"},{"t":"Un cristal líquido fluye como líquido, con moléculas ordenadas como en un cristal.","s":"ic:device-mobile"}]},{"id":"q_esponjas","t":"Esponjas de átomos","res":"Hay materiales con huecos diminutos que atrapan gases.","g":[{"t":"Esponjas de átomos"},{"t":"Ves una esponja, con huecos del tamaño de una molécula.","s":"red:metal"},{"t":"Un puñado tendría por dentro la superficie de una cancha.","s":"red:metal"},{"t":"Hola, amigo CO₂. ¿Te vas a quedar ahí?","v":"Hola, amigo ce o dos. ¿Te vas a quedar ahí?","s":"mol:CO2"},{"t":"Sí, amigo. Me atrapa de la chimenea.","s":"mol:CO2"},{"t":"Gracias, amiga esponja.","s":"mol:CO2"},{"t":"Dicho de otro modo:","s":"mol:CO2"},{"t":"Los materiales porosos tienen una superficie interna enorme, y se estudian para capturar gases.","s":"mol:CO2"}]},{"id":"q_superconductor","t":"Electrones sin freno","res":"Algunos materiales, muy fríos, conducen sin resistencia.","g":[{"t":"Electrones sin freno"},{"t":"Ves un cable muy frío.","s":"@super=90"},{"t":"Hola, amigos electrones. ¿Ya no chocan?","s":"@super=90"},{"t":"Ya no, amigo. Pasamos sin parar.","s":"@super=90"},{"t":"Algunos trenes flotan así, sobre imanes.","s":"ic:train"},{"t":"Gracias, amigos.","s":"ic:train"},{"t":"Dicho de otro modo:","s":"ic:train"},{"t":"Un superconductor, por debajo de cierta temperatura, conduce sin resistencia.","s":"ic:train"}]},{"id":"q_click","t":"Química que encaja","res":"Hay reacciones que unen piezas como un broche.","g":[{"t":"Química que encaja"},{"t":"Ves un cinturón con su broche, que hace clic y no se suelta.","s":"ic:paperclip"},{"t":"Hola, amigas moléculas. ¿Ustedes también?","s":"ic:paperclip"},{"t":"Sí, amigo: rápidas y sin desperdicio.","s":"ic:paperclip"},{"t":"Con estos broches se arman medicinas.","s":"ic:pill"},{"t":"Por esto dieron un Premio Nobel, en 2022.","s":"ic:pill"},{"t":"Gracias, amigas.","s":"ic:pill"},{"t":"Dicho de otro modo:","s":"ic:pill"},{"t":"La química click une moléculas de forma rápida, selectiva y con pocos residuos.","s":"ic:pill"}]},{"id":"q_plegado","t":"La proteína que se dobla","res":"Saber la forma de una proteína ayuda a diseñar medicinas.","g":[{"t":"La proteína que se dobla"},{"t":"Ves una cinta larga, que cae y se dobla sola, siempre igual.","s":"mol:glicina"},{"t":"Hola, amiga proteína. ¿Cómo sabes doblarte?","s":"mol:glicina"},{"t":"Lo sé, amigo, pero es dificilísimo predecirlo.","s":"mol:glicina"},{"t":"Una computadora aprendió a calcularlo en minutos.","s":"ic:cpu"},{"t":"Por esto se dio otro Premio Nobel, en 2024.","s":"ic:cpu"},{"t":"Gracias, amiga proteína.","s":"ic:cpu"},{"t":"Dicho de otro modo:","s":"ic:cpu"},{"t":"Predecir el plegamiento de proteínas ayuda a entender enfermedades y diseñar medicinas.","s":"ic:cpu"}]},{"id":"q_vida_origen","t":"Química antes de la vida","res":"Las piezas de la vida se forman también sin seres vivos.","g":[{"t":"Química antes de la vida"},{"t":"Es la Tierra, muy joven, con rayos y mares calientes.","s":"ic:cloud-lightning"},{"t":"En un frasco, se copiaron esas condiciones.","s":"ic:cloud-lightning"},{"t":"Hola, amiga. ¿Saliste de ahí?","s":"mol:glicina"},{"t":"Sí, amigo, sin nada vivo.","s":"mol:glicina"},{"t":"Algunos meteoritos también me traen.","s":"ic:planet"},{"t":"Cómo nos volvimos vida, sigue siendo un misterio.","s":"ic:planet"},{"t":"Gracias, amiga.","s":"ic:planet"},{"t":"Dicho de otro modo:","s":"ic:planet"},{"t":"Las moléculas de la vida se pueden formar sin seres vivos; el origen de la vida sigue sin resolverse.","s":"ic:planet"}]},{"id":"q_limites","t":"Lo que falta por saber","res":"La química todavía tiene grandes preguntas abiertas.","g":[{"t":"Lo que falta por saber"},{"t":"Llegas al final de la tabla, y podría haber más casillas.","s":"tabla:Og"},{"t":"Hola, amiga hoja. ¿Nos enseñas a hacer azúcar con luz?","s":"ic:leaf"},{"t":"Lo están intentando, amigo.","s":"ic:leaf"},{"t":"Si lo logran, habría combustible con puro sol.","s":"ic:plant"},{"t":"Sigue habiendo mucho por descubrir.","s":"ic:plant"},{"t":"Gracias, amiga hoja.","s":"ic:plant"},{"t":"Dicho de otro modo:","s":"ic:plant"},{"t":"Quedan retos abiertos, como nuevos elementos y la fotosíntesis artificial.","s":"ic:plant"}]}]}];

const AUDIOS=JSON.parse($("audios-datos")?.textContent||"{}");
const audio=new Audio();audio.preservesPitch=true;let audioRoto=false;
function decir(txt){
  return new Promise(res=>{
    const dur=(900+txt.length*95)*fac(),esc=window.__PRUEBA||1;
    const b=(AUDIOS.dora||{})[txt];
    if(!b||audioRoto)return setTimeout(res,dur*esc);
    /* Cada frase maneja solo sus propios avisos: una frase vieja ya no puede borrar los de la actual. */
    let hecho=false,t=0;
    const fin=()=>{if(hecho)return;hecho=true;clearTimeout(t);if(audio.onended===fin){audio.onended=audio.onerror=audio.onloadedmetadata=null}res()};
    t=setTimeout(fin,(dur*2+2000)*esc);
    audio.onended=fin;
    audio.onerror=()=>{audioRoto=true;$("av-audio").hidden=false;fin()};
    /* Conociendo lo que dura el audio, sigue aunque el celular lo interrumpa. */
    audio.onloadedmetadata=()=>{if(!hecho&&isFinite(audio.duration)&&audio.duration>0){clearTimeout(t);t=setTimeout(fin,(audio.duration/P.ritmo*1000+1500)*esc)}};
    audio.src="data:audio/ogg;codecs=opus;base64,"+b;audio.playbackRate=P.ritmo;
    const pr=audio.play();
    if(pr&&pr.catch)pr.catch(e=>{if(e&&e.name==="AbortError")return;audioRoto=true;$("av-audio").hidden=false;setTimeout(fin,dur*esc)});
  });
}
function callar(){audio.onended=audio.onerror=audio.onloadedmetadata=null;audio.pause()}

let ac=null,gan=null,oyendo=0,enCampana=false,proxCampana=0;
/* Campanita suave, como un cuenco: siempre la misma, para que el cerebro la reconozca. */
function campanita(){try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
  const t0=ac.currentTime,base=.09+.2*P.lluvia;
  [[432,1,3.2],[864,.32,2.1],[1296,.1,1.2]].forEach(([fr,a,d])=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=fr;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(base*a,t0+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+d+.05);
  });
}catch(e){}}
/* Lluvia sola, sonidito, la frase, y otra vez lluvia. */
async function momentoCampana(mio){
  const esc=window.__PRUEBA||1;
  enCampana=true;fondo();
  try{
    await desvanecer(900);if(mio!==gen)return;
    aparecer(`<canvas class="vis" id="vis"></canvas><div class="lado"></div>`);marco.classList.add("con-vis");
    animar($("vis"),(g,W,H,t,dt,S)=>ES.ic(g,W,H,t,dt,S,"cloud-rain"));
    await espera(10000);if(mio!==gen)return;latido();
    campanita();await espera(1600);if(mio!==gen)return;
    aparecer(`<canvas class="vis" id="vis"></canvas><div class="lado">${htmlFrase({t:FRASE_CAMPANA})}</div>`);marco.classList.add("con-vis");
    animar($("vis"),(g,W,H,t,dt,S)=>ES.ic(g,W,H,t,dt,S,"bell"));
    await espera(350);await decir(FRASE_CAMPANA);if(mio!==gen)return;latido();
    await espera(10000);if(mio!==gen)return;latido();
  }finally{enCampana=false;fondo()}
}
function fondo(){try{
  if((P.lluvia>0||enCampana)&&!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(!ac)return;
  if(!gan){
    /* Lluvia: ruido blanco filtrado, con un fondo grave, y un limitador para que no sature aunque suene fuerte. */
    const n=ac.sampleRate*6,b=ac.createBuffer(2,n,ac.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);let u=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;u=(u+.02*w)/1.02;d[i]=w*.55+u*2.2}
      for(let i=0;i<4000;i++){const k=i/4000;d[i]=d[i]*k+d[n-4000+i]*(1-k)}}
    const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.loopEnd=(n-4000)/ac.sampleRate;
    const hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=180;
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=7000;
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-6;lim.ratio.value=12;
    gan=ac.createGain();gan.gain.value=0;s.connect(hp).connect(lp).connect(gan).connect(lim).connect(ac.destination);s.start();
  }
  ac.resume();
  const volL=P.lluvia>0?P.lluvia:(enCampana?.4:0),on=volL>0&&(estado==="corre"||performance.now()<oyendo);
  gan.gain.cancelScheduledValues(ac.currentTime);gan.gain.setValueAtTime(gan.gain.value,ac.currentTime);
  gan.gain.linearRampToValueAtTime(on?Math.pow(volL,1.4)*1.5:0,ac.currentTime+(on?(enCampana?1.5:.8):(enCampana===false&&P.lluvia===0?3:1.5)));
}catch(e){}}

async function correrSeguro(rapido){
  const mio=++gen;if(estado!=="corre"){panel(true)}estado="corre";pinta();pantalla(true);fondo();$("tibio").classList.add("on");

    if(f.tipo==="barra")await barra(f,mio);

      const esc=f.s,nb=esc&&esc[0]==="@"?esc.slice(1).split("=")[0]:null,valFijo=esc&&esc[0]==="@"&&esc.includes("=")?+esc.split("=")[1]:null,arg=esc&&esc.includes(":")?esc.slice(esc.indexOf(":")+1):null,nom=esc&&(arg!==null?esc.slice(0,esc.indexOf(":")):esc),fn=nb&&ESB[nb]?((g,W,H,t,dt,S)=>{const X=BARRAS[nb];ESB[nb](g,W,H,t,dt,S,valFijo!==null?valFijo:X.fijo!==undefined?X.fijo:(X.auto[0]+X.auto[1])/2,X)}):(arg!==null&&ES[nom]?((g,W,H,t,dt,S)=>ES[nom](g,W,H,t,dt,S,arg)):(esc&&ES[esc]));
      aparecer(fn?`<canvas class="vis" id="vis"></canvas><div class="lado">${htmlFrase(f)}</div>`:htmlFrase(f));

/* Aviso de que se puede tocar: una mano grande que desliza y un brillo tenue en el marco, dos veces, y se va. */
function avisoToque(on){const a=$("aviso-mano"),b=$("aviso-marco");[a,b].forEach(x=>x.classList.remove("va"));if(on){a.innerHTML=ICON["hand-swipe-right"];void a.offsetWidth;a.classList.add("va");b.classList.add("va")}}
/* Si no deslizas, la escena avanza sola despacio y la lección continúa. */
function barra(f,mio){
  return new Promise(res=>{
    const B=BARRAS[f.b];
    const clave=L.id+":"+idx,previo=memo.k===clave?memo.v:null;
    aparecer(`<canvas class="vis" id="vis"></canvas><div class="lado"><p class="obs" id="b-o" style="transition:opacity .22s">${f.o||""}</p><div class="dato" id="b-g"></div><p class="chica" id="b-c"></p><div class="linea"><i id="b-l"></i></div></div><input class="sr" type="range" id="b-r" tabindex="0" aria-label="Valor" min="${B.min}" max="${B.max}" step="${B.step}" value="${previo===null?B.auto[0]:previo}">`);
    marco.classList.add("con-vis");
    const r=$("b-r"),c=$("vis");
    const pintaB=()=>{const x=B.calc(+r.value);$("b-g").textContent=x.big;$("b-c").textContent=x.small;$("b-l").style.width=((+r.value-B.min)/(B.max-B.min)*100)+"%";sonidoBarra(f.b,+r.value)};
    pintaB();
    const red=animar(c,(g,W,H,t,dt,S)=>ESB[f.b](g,W,H,t,dt,S,+r.value,B));
    /* Guiada: si no tocas, avanza por tramos y Dora narra cada uno. Si tocas, se calla y mandas tú. */
    const pasos=f.pasos||[];let k_=0,fase="intro",turno=0,meta=0,desde=0,tIni=0,hasta=0,tocado=false,ultimo=0,va=+r.value,antes=performance.now();
    const ocultaMano=()=>avisoToque(false);
    const obs=$("b-o");
    const ponObs=x=>{if(obs&&x){obs.style.opacity=0;setTimeout(()=>{obs.textContent=x;obs.style.opacity=1},220)}};
    const hablar=(x,sig)=>{const yo=++turno;ponObs(x);decir(x||"").then(()=>{if(yo===turno&&mio===gen)sig()})};
    const mover=()=>{
      /* siguiente tramo por encima de donde está la barrita */
      while(k_<pasos.length&&pasos[k_][0]<=va+1e-6&&k_<pasos.length-1&&pasos[k_+1][0]<=va+1e-6)k_++;
      if(k_>=pasos.length){fase="fin";hasta=performance.now()+1500*fac()*(window.__PRUEBA||1);return}
      desde=va;meta=pasos[k_][0];tIni=performance.now();fase="mueve";latido();
    };
    hablar(f.o||"",()=>{fase="espera";hasta=performance.now()+4000*fac()*(window.__PRUEBA||1);avisoToque(true)});
    r.addEventListener("input",()=>{latido();ocultaMano();if(fase!=="libre"){turno++;callar();fase="libre"}tocado=true;ultimo=performance.now();va=+r.value;memo={k:clave,v:va};pintaB();red()});
    const t=()=>{try{
      if(mio!==gen)return res();
      const a=performance.now(),k=fac()*(window.__PRUEBA||1),dtt=a-antes;antes=a;
      /* Si el celular no avisó que soltaste el dedo, a los 8 segundos sin moverse se da por suelto. */
      if(gesto&&a-gesto.t>8000){gesto=null;callarTono()}
      if(gesto)ultimo=a;
      if(fase==="libre"){
        if(a-ultimo>4000*k){
          if(pasos.length){while(k_<pasos.length&&pasos[k_][0]<=va)k_++;mover()}
          else fase="solo";
        }
      }else if(fase==="espera"){
        if(a>hasta){ocultaMano();if(pasos.length)mover();else fase="solo"}
      }else if(fase==="mueve"){
        const q=Math.min(1,(a-tIni)/(2600*k)),e=q*q*(3-2*q);va=desde+(meta-desde)*e;r.value=va;memo={k:clave,v:va};pintaB();
        if(q>=1){fase="habla";const x=pasos[k_][1];k_++;hablar(x,()=>{fase="reposa";hasta=performance.now()+1000*k})}
      }else if(fase==="reposa"){
        if(a>hasta)mover();
      }else if(fase==="solo"){
        /* Barrita sin narración: sube despacio hasta el final. */
        va=Math.min(B.auto[1],va+(B.auto[1]-B.auto[0])*dtt/(18000*k));r.value=va;memo={k:clave,v:va};pintaB();
        if(va>=B.auto[1]){fase="fin";hasta=a+2200*k}
      }else if(fase==="fin"){
        if(a>hasta)return res();
      }
      requestAnimationFrame(t);
    }catch(e){console.error(e);res()}};
    requestAnimationFrame(t);
  });
}

function sigues(mio){
  return new Promise(res=>{
    aparecer(`<p class="frase">¿Sigues ahí?</p><button class="quieto" id="aqui">Aquí sigo</button>`);
    let hecho=false,lim=0;
    const fin=v=>{if(hecho)return;hecho=true;clearTimeout(lim);esperaSigues=null;audio.volume=1;res(v)};
    esperaSigues=fin;$("aqui").onclick=ev=>{ev.stopPropagation();fin(true)};
    audio.volume=.55;decir("¿Sigues ahí?");
    const vigila=()=>{if(mio!==gen)fin(false);else if(!hecho)setTimeout(vigila,500)};vigila();
    lim=setTimeout(()=>fin(false),60000*(window.__PRUEBA||1));
  });
}
function dormido(){
  gen++;callar();estado="dormido";if(chk&&chk.id){P.pos[chk.id]=chk.i;P.ult=chk.id}else P.hist=chk;guardar();subir();fondo();pantalla(false);pinta();
  marco.classList.remove("ve");
  setTimeout(()=>{if(estado==="dormido")marco.innerHTML=""},2000);
}
function terminar(){
  if(L.hist){
    const c=L.cap+1;
    if(c<HIST.length){L=HIST[c];idx=0;correr(false)}
    else{P.hist=null;guardar();estado="dormido";fondo();pantalla(false);pinta();marco.classList.remove("ve")}
    return;
  }
  /* Al acabar una lección pasa sola a la siguiente, sin despedidas ni botones. */
  P.hechas[L.id]=1;delete P.pos[L.id];sigMemo=elegirSig();
  if(sigMemo){P.ult=sigMemo;guardar();abrir(sigMemo,false,true)}
  else{guardar();pantalla(false);portada()}
}
let sigMemo=null;
const sigLec=()=>sigMemo;
const alAzar=a=>a[Math.floor(Math.random()*a.length)];
function elegirSig(){
  const m=P.modo;if(!m)return ORDEN[ORDEN.indexOf(L.id)+1]||null;
  if(!m.azar)return m.pool[m.pool.indexOf(L.id)+1]||null;
  const c=m.pool.filter(id=>id!==L.id),nuevas=c.filter(id=>!P.hechas[id]);
  return c.length?alAzar(nuevas.length?nuevas:c):null;
}
function abrirModo(pool,azar){
  P.modo={pool,azar};
  const nuevas=pool.filter(id=>!P.hechas[id]);
  const id=azar?alAzar(nuevas.length?nuevas:pool):(nuevas[0]||pool[0]);
  abrir(id,true);
  if(P.pista){$("pista").classList.add("ve");setTimeout(()=>$("pista").classList.remove("ve"),9000)}
}
let cuentaRec=0,metaRec=3+Math.floor(Math.random()*2);
function framesRecuerdo(){
  if(P.recuerdos===false)return[];
  if(++cuentaRec<metaRec)return[];
  cuentaRec=0;metaRec=3+Math.floor(Math.random()*2);
  P.recI=(P.recI||0)+1;
  const r=RECUERDOS[(P.recI*5)%RECUERDOS.length];/* el salto de 5 recorre los 12 sin que se junten los parecidos */
  return r.slice(1).map(t=>({t,s:"ic:"+r[0]}));
}
function abrir(id,cont,auto){
  if(!auto)autoCompleta();
  const previa=LECS[ORDEN[ORDEN.indexOf(id)-1]],pos=cont?(P.pos[id]||0):0;
  /* Sin preguntas, lo que ayuda a recordar es volver a oír la idea de la vez pasada. */
  const rec=previa&&P.hechas[previa.id]&&!pos&&LECS[id].niv===previa.niv&&!(P.modo&&P.modo.azar);
  L=rec?Object.assign({},LECS[id],{pre:2,g:[{t:"La vez pasada:"},{t:previa.res},...LECS[id].g]}):LECS[id];
  if(auto){const fr=framesRecuerdo();if(fr.length)L=Object.assign({},L,{pre:(L.pre||0)+fr.length,g:[...fr,...L.g]})}
  idx=pos?Math.min(pos,L.g.length-1):0;P.ult=id;guardar();reanudar=false;cerrar();
  if(!auto){tCheck=performance.now();chk={id,i:pos}}
  correr(!auto)}

/* ───── Navegación: derecha sigue, izquierda regresa ───── */
function ir(d){
  callar();
  if(estado==="inicio")return;
    if(L.hist&&idx+d<0&&L.cap>0){L=HIST[L.cap-1];idx=L.g.length-1;correr(true);return}
  idx=Math.max(0,idx+d);
  if(idx>=L.g.length){gen++;terminar();return}
  correr(true);
  if(P.pista){P.pista=false;guardar();$("pista").classList.remove("ve")}
}
function pausar(){pausaOculta=false;if(estado!=="corre")return;gen++;callar();estado="pausa";pantalla(false);fondo();pinta();panel(true,true)}
function seguir(){tCheck=performance.now();correr(true);panel(true)}
/* Panel: se oculta a los 3 segundos; un toque en el centro lo regresa. */
let tPanel=0,panelVisible=true;
function panel(ver,fijo){
  clearTimeout(tPanel);panelVisible=ver;document.body.classList.toggle("limpio",!ver);
  if(ver&&!fijo)tPanel=setTimeout(()=>{if(estado==="corre"&&!hojaAbierta())panel(false)},3000);
}
$("controles").addEventListener("click",()=>{if(estado==="corre"&&!hojaAbierta())panel(true)},true);
document.addEventListener("click",ev=>{
  /* composedPath sigue siendo válido aunque el botón tocado se redibuje durante el clic */
  if(ev.composedPath().some(n=>n.matches&&n.matches(".hoja,#controles button,[data-quieto],button,input")))return;
  /* La orilla izquierda ajusta el brillo al deslizar; un toque simple cuenta como regresar. */
  if(ev.composedPath().some(n=>n.id==="brillo-zona")&&brilloMovido){brilloMovido=false;return}
  if(arrastrado){arrastrado=false;return}
  if(hojaAbierta()){cerrar();return}
  if(esperaSigues){esperaSigues(true);return}
  if(estado==="dormido"){portada();return}
  const x=ev.clientX/innerWidth;
  if(x>1/3&&x<2/3){panel(!panelVisible||estado==="pausa",estado==="pausa");return}
  ir(x<=1/3?-1:1);
});
const hojaAbierta=()=>!$("s-ajustes").hidden||!$("s-menu").hidden;
let reanudar=false;
function cerrar(){const a=hojaAbierta();$("s-ajustes").hidden=true;$("s-menu").hidden=true;if(a&&reanudar){reanudar=false;seguir()}else if(a&&estado==="corre")panel(true)}
function abrirHoja(h){if(estado==="corre"){pausar();reanudar=true}$(h).hidden=false;panel(true,true)}

/* ───── Controles de arriba ───── */
function pinta(){
  $("b-pausa").innerHTML=ICON[estado==="corre"?"pause":"play"];
  $("b-pausa").setAttribute("aria-label",estado==="corre"?"Pausar":"Seguir");
  $("b-pausa").style.visibility=(estado==="corre"||estado==="pausa")?"visible":"hidden";
  $("b-tema").innerHTML=ICON[P.tema==="oscuro"?"sun":"moon"];
}
$("b-menu").innerHTML=ICON["list"];$("b-ajustes").innerHTML=ICON["gear-six"];
const pintaRec=()=>{const on=P.recuerdos!==false;$("rec-v").textContent=on?"Encendidos":"Apagados";$("b-rec").textContent=on?"Apagar":"Encender";$("b-rec").setAttribute("aria-pressed",on)};pintaRec();
$("b-rec").onclick=ev=>{ev.stopPropagation();P.recuerdos=P.recuerdos===false;guardar();pintaRec()};
$("b-pausa").onclick=()=>{if(estado==="corre")pausar();else if(estado==="pausa")seguir()};
$("b-tema").onclick=()=>{P.tema=P.tema==="oscuro"?"claro":"oscuro";guardar();aplicarAjustes()};
$("b-ajustes").onclick=()=>{const a=$("s-ajustes").hidden;if(!a){cerrar();return}const r=reanudar;$("s-menu").hidden=true;reanudar=r;abrirHoja("s-ajustes")};
let nivelVisto=null;
const etq=n=>n.et||n.id;
function pintaMenu(){
  const fila=m=>NIVELES.filter(n=>n.mat===m).map(x=>`<button class="chip" data-n="${x.id}" aria-pressed="${x.id===nivelVisto}">${etq(x)}</button>`).join("");
  $("niveles").innerHTML=`<span class="mat-et">Física</span>${fila("f")}<span class="mat-et">Química</span>${fila("q")}`;
  const n=NIVELES.find(x=>x.id===nivelVisto);
  $("n-nombre").textContent=n.nom;
  $("lecs").innerHTML=n.lec.map(l=>`<button class="fila" data-l="${l.id}"><span>${l.t}</span>${P.hechas[l.id]?`<span class="check">${ICON["check-circle"]}</span>`:""}</button>`).join("");
}
$("b-menu").onclick=()=>{const a=$("s-menu").hidden;if(!a){cerrar();return}$("s-ajustes").hidden=true;nivelVisto=L.niv||"A1";pintaMenu();abrirHoja("s-menu")};
$("niveles").onclick=e=>{const b=e.target.closest("[data-n]");if(b){nivelVisto=b.dataset.n;pintaMenu()}};
$("lecs").onclick=e=>{const b=e.target.closest("[data-l]");if(b){P.modo=null;abrir(b.dataset.l,true)}};
$("a-inicio").onclick=()=>{reanudar=false;cerrar();gen++;callar();pantalla(false);portada()};
document.querySelectorAll(".cierra").forEach(b=>{b.innerHTML=ICON.x;b.onclick=()=>cerrar()});

/* ───── Pantalla completa: oculta la barra del navegador ───── */
function pintaCompleta(){const b=$("b-completa");b.hidden=!document.fullscreenEnabled;const on=!!document.fullscreenElement;b.innerHTML=ICON[on?"corners-in":"corners-out"];b.setAttribute("aria-label",on?"Salir de pantalla completa":"Pantalla completa")}
function entrarCompleta(){if(document.fullscreenEnabled&&!document.fullscreenElement){const p=raiz.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}
/* Acostado, con el celular en horizontal, entra sola al empezar. */
function autoCompleta(){if(matchMedia("(orientation:landscape)").matches&&!salioManual)entrarCompleta()}
let salioManual=false;
$("b-completa").onclick=()=>{if(document.fullscreenElement){salioManual=true;document.exitFullscreen().catch(()=>{})}else{salioManual=false;entrarCompleta()}};
document.addEventListener("fullscreenchange",pintaCompleta);
pintaCompleta();

/* ───── Configuración ───── */
function aplicarAjustes(){
  raiz.dataset.tema=P.tema;leeC();
  raiz.style.setProperty("--lento",(1.5/P.ritmo).toFixed(2)+"s");
  $("ritmo").value=P.ritmo;
  $("ritmo-v").textContent=P.ritmo<.95?"Más lento":P.ritmo>1.05?"Más rápido":"Normal";
  $("lluvia").value=P.lluvia;$("lluvia-v").textContent=P.lluvia>0?Math.round(P.lluvia*100)+"%":"Apagada";
  pinta();
}
$("ritmo").oninput=e=>{P.ritmo=+e.target.value;guardar();aplicarAjustes()};
$("ritmo").onchange=()=>{callar();decir("Velocidad")}; /* al soltar, oyes el ritmo nuevo */
$("lluvia").oninput=e=>{P.lluvia=+e.target.value;$("lluvia-v").textContent=P.lluvia>0?Math.round(P.lluvia*100)+"%":"Apagada";guardar();oyendo=performance.now()+2500;fondo();clearTimeout(window._tl);window._tl=setTimeout(fondo,2600)};
window.addEventListener("pagehide",()=>{callar();subir()});

const MATERIAS={f:"Física",q:"Química"};
const todosNiv=()=>NIVELES.map(n=>n.id);
const nivElegidos=()=>{const v=(P.sel||[]).filter(i=>NIVELES.some(n=>n.id===i));return v.length?v:todosNiv()};
const lecDe=(...ids)=>NIVELES.filter(n=>ids.includes(n.id)).flatMap(n=>n.lec.map(l=>l.id));
/* Comenzar en el inicio siempre mezcla todo; "Elegir niveles" arma una sesión solo con esos. */
function comenzar(azar,soloElegidos){
  const pool=soloElegidos?lecDe(...nivElegidos()):[...ORDEN];
  /* Si dejaste una lección a medias y sigue en tu selección, retoma ahí. */
  if(azar&&P.modo&&P.modo.azar&&P.pos[P.ult]&&pool.includes(P.ult)){P.modo={pool,azar:true};abrir(P.ult,true);return}
  abrirModo(pool,azar);
}
function portada(vista){
  gen++;callar();estado="inicio";L=LECS[P.ult]||LECS[ORDEN[0]];pinta();marco.classList.remove("con-vis");
  $("pista").classList.remove("ve");panel(true,true);
  let html;
  if(vista==="elegir"){
    if(!(P.sel&&P.sel.length))P.sel=todosNiv();
    const fila=m=>`<p class="chica">${MATERIAS[m]}</p><div class="chips niveles-sel">${NIVELES.filter(n=>n.mat===m).map(n=>`<button class="chip" data-t="${n.id}" aria-pressed="${P.sel.includes(n.id)}">${etq(n)}</button>`).join("")}</div>`;
    html=`<div class="elegir">${fila("f")}${fila("q")}</div><div class="menu-ini"><button class="mi" data-elegidos ${P.sel.length?"":"disabled"}>Comenzar</button><button class="quieto" data-orden ${P.sel.length?"":"disabled"}>En orden</button><button class="quieto" data-atras>Atrás</button></div>`;
  }else{
    html=`<div class="menu-ini raiz"><button class="mi inicia" data-azar>Comenzar</button><button class="quieto" data-elegir>Elegir niveles</button></div>`;
  }
  marco.innerHTML=html;marco.style.transitionDuration="";marco.classList.add("ve");
  marco.querySelectorAll("button").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();const d=b.dataset;
    if("azar" in d)comenzar(true);
    else if("elegidos" in d)comenzar(true,true);
    else if("orden" in d)comenzar(false,true);
    else if("elegir" in d)portada("elegir");
    else if(d.t){const i=P.sel.indexOf(d.t);if(i<0)P.sel.push(d.t);else P.sel.splice(i,1);guardar();portada("elegir")}
    else if("atras" in d)portada();
  });
}

$("br-alto").innerHTML=ICON.sun;$("br-bajo").innerHTML=ICON["sun-dim"];pintaBrillo();aplicarAjustes();portada();
