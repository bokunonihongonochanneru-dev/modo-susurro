en compartir un estado, aunque estén lejos."}]},{"id":"schrodinger","t":"El gato de Schrödinger","res":"Un ejemplo imaginado para mostrar lo raro de la superposición.","g":[{"t":"El gato de Schrödinger"},{"t":"Un átomo puede estar en dos estados a la vez.","s":"@semivida"},{"t":"Se llama superposición.","s":"@semivida"},{"t":"Schrödinger imaginó un gato en una caja.","s":"caja"},{"t":"Su vida dependería de ese átomo.","s":"caja"},{"t":"Por ejemplo, una moneda girando en el aire.","s":"@monedas"},{"t":"No es cara ni cruz, hasta caer.","s":"@monedas"},{"t":"Otro ejemplo: nadie cree que un gato real esté así.","s":"caja"},{"t":"Era una forma de mostrar lo raro de la teoría.","s":"caja"},{"t":"Un ejemplo imaginado para mostrar lo raro de la superposición."}]},{"id":"cuantica","t":"Computación cuántica","res":"Un qubit puede ser cero y uno a la vez, y eso permite ciertos cálculos enormes.","g":[{"t":"Computación cuántica"},{"t":"Un bit normal es cero, o uno.","s":"potencias"},{"t":"Un qubit puede estar en los dos a la vez.","s":"@qubits"},{"t":"Y juntos, crecen muy rápido.","s":"@qubits"},{"t":"Por ejemplo, buscar la salida de un laberinto gigante.","s":"@qubits"},{"t":"Para ciertos problemas, ayudaría muchísimo.","s":"@qubits"},{"t":"Otro ejemplo: se tienen que enfriar casi al cero absoluto.","s":"@super"},{"t":"No sirven para todo.","s":"@qubits"},{"t":"Mira agregar qubits."},{"tipo":"barra","b":"qubits","o":"Fíjate: cada qubit extra duplica las posibilidades."},{"t":"Un qubit puede ser cero y uno a la vez, y eso permite ciertos cálculos enormes."}]},{"id":"modelo","t":"El modelo estándar","res":"Toda la materia conocida sale de unas pocas partículas y fuerzas.","g":[{"t":"El modelo estándar"},{"t":"Ya vimos las piezas del átomo.","s":"@zoom"},{"t":"Con muy pocas se explica casi todo.","s":"@zoom"},{"t":"Quarks y electrones, sobre todo.","s":"@zoom"},{"t":"Por ejemplo, un LEGO con pocas piezas distintas.","s":"@zoom"},{"t":"Otro ejemplo: las fuerzas también son partículas.","s":"@carga"},{"t":"La luz lleva la fuerza eléctrica.","s":"@carga"},{"t":"Es muy exacto, pero no incluye la gravedad."},{"t":"Toda la materia conocida sale de unas pocas partículas y fuerzas."}]},{"id":"neutrinos","t":"Neutrinos","res":"Billones atraviesan tu cuerpo cada segundo, casi sin chocar.","g":[{"t":"Neutrinos"},{"t":"El Sol suelta partículas muy raras.","s":"radia"},{"t":"Casi no chocan con nada.","s":"radia"},{"t":"Billones pasan por ti cada segundo.","s":"materia"},{"t":"Por ejemplo, atraviesan la Tierra entera.","s":"giro"},{"t":"Otro ejemplo: se detectan en tanques enormes de agua, bajo tierra.","s":"olla"},{"t":"Solo uno que otro choca.","s":"olla"},{"t":"Por eso se les dice partículas fantasma."},{"t":"Billones atraviesan tu cuerpo cada segundo, casi sin chocar."}]},{"id":"higgs","t":"El bosón de Higgs","res":"Un campo en todo el espacio da masa a ciertas partículas.","g":[{"t":"El bosón de Higgs"},{"t":"Algo le da masa a las partículas.","s":"@curva"},{"t":"Es un campo que llena el espacio.","s":"@curva"},{"t":"Por ejemplo, caminar en una alberca.","s":"@viscoso"},{"t":"Hay algo que te frena, como un líquido.","s":"@viscoso"},{"t":"Solo es una imagen, no es literal.","s":"@viscoso"},{"t":"Otro ejemplo: se detectó en 2012 en un acelerador gigante.","s":"@zoom","v":"Otro ejemplo: se detectó en dos mil doce en un acelerador gigante."},{"t":"Es de los descubrimientos más grandes de estos años.","s":"@zoom"},{"t":"Un campo en todo el espacio da masa a ciertas partículas."}]},{"id":"fuerzas","t":"Las cuatro fuerzas","res":"Todo se explica por gravedad, electromagnetismo y dos fuerzas nucleares.","g":[{"t":"Las cuatro fuerzas"},{"t":"La gravedad jala masa.","s":"atrae"},{"t":"La electromagnética, cargas.","s":"@carga"},{"t":"La nuclear fuerte une al núcleo.","s":"@zoom"},{"t":"La débil deshace ciertos átomos.","s":"@semivida"},{"t":"Por ejemplo, un imán chiquito levanta un clip.","s":"@iman"},{"t":"Le gana a toda la Tierra.","s":"@iman"},{"t":"Otro ejemplo: la gravedad es la más débil, pero alcanza muy lejos.","s":"astro"},{"t":"Por eso domina en el universo.","s":"astro"},{"t":"Todo se explica por gravedad, electromagnetismo y dos fuerzas nucleares."}]},{"id":"ondasgrav","t":"Ondas gravitacionales","res":"Dos hoyos negros al chocar hacen temblar el espacio.","g":[{"t":"Ondas gravitacionales"},{"t":"La masa curva el espacio.","s":"@curva"},{"t":"Si se mueve muy fuerte, hace olas.","s":"@ondag"},{"t":"Por ejemplo, dos hoyos negros al chocar.","s":"@ondag"},{"t":"Esas olas llegaron a la Tierra en 2015.","s":"@ondag","v":"Esas olas llegaron a la Tierra en dos mil quince."},{"t":"Se midió un cambio menor al tamaño de un protón.","s":"@ondag"},{"t":"Otro ejemplo: una piedra al caer en un estanque.","s":"oido"},{"t":"Solo que aquí tiembla el espacio mismo.","s":"@ondag"},{"t":"Mira pasar la onda."},{"tipo":"barra","b":"ondag","o":"Fíjate cómo se estira y se aprieta el espacio al pasar la onda."},{"t":"Dos hoyos negros al chocar hacen temblar el espacio."}]},{"id":"tiempograv","t":"Gravedad y tiempo","res":"Cerca de una gran masa, el tiempo va más lento.","g":[{"t":"Gravedad y tiempo"},{"t":"La gravedad también estira el tiempo.","s":"@tiempog"},{"t":"Cerca de la Tierra, va más lento.","s":"@tiempog"},{"t":"Por ejemplo, tus pies envejecen más lento que tu cabeza.","s":"@tiempog"},{"t":"Una diferencia diminuta.","s":"@tiempog"},{"t":"Otro ejemplo: cerca de un hoyo negro.","s":"@hoyo"},{"t":"Una hora ahí podrían ser años aquí.","s":"@hoyo"},{"t":"Mira acercarte a la masa."},{"tipo":"barra","b":"tiempog","o":"Fíjate: más cerca de la masa, el reloj va más lento."},{"t":"Cerca de una gran masa, el tiempo va más lento."}]},{"id":"cmb","t":"El eco del Big Bang","res":"Aún hay luz muy vieja llegando de todas partes.","g":[{"t":"El eco del Big Bang"},{"t":"El universo primero fue muy caliente.","s":"@expansion"},{"t":"Al expandirse, se enfrió.","s":"@expansion"},{"t":"Quedó una luz, ahora muy estirada.","s":"@luz"},{"t":"Llega de todas partes.","s":"@luz"},{"t":"Por ejemplo, una parte de la estática de una tele antigua.","s":"@luz"},{"t":"Otro ejemplo: se ha medido hasta su mapa.","s":"@luz"},{"t":"Es como una foto de hace casi 14 mil millones de años.","v":"Es como una foto de hace casi catorce mil millones de años."},{"t":"Aún hay luz muy vieja llegando de todas partes."}]},{"id":"inflacion","t":"La inflación cósmica","res":"Muy al inicio, el universo creció de golpe.","g":[{"t":"La inflación cósmica"},{"t":"Hay una idea sobre el primer instante.","s":"@expansion"},{"t":"El universo creció muchísimo, de golpe.","s":"@expansion"},{"t":"Por ejemplo, un globo inflado en menos de un parpadeo.","s":"@expansion"},{"t":"Eso explicaría por qué se ve tan parejo.","s":"@expansion"},{"t":"Otro ejemplo: arrugas en una tela estirada.","s":"@curva"},{"t":"Esas pequeñas diferencias dieron las galaxias.","s":"@curva"},{"t":"Todavía se busca confirmarla mejor."},{"t":"Muy al inicio, el universo creció de golpe."}]},{"id":"energiaoscura","t":"Energía oscura","res":"Algo hace que el universo se expanda cada vez más rápido.","g":[{"t":"Energía oscura"},{"t":"Se esperaba que la expansión se frenara.","s":"@expansion"},{"t":"Pero va más rápido.","s":"@expansion"},{"t":"Algo la empuja.","s":"@expansion"},{"t":"Lo llamamos energía oscura.","s":"@expansion"},{"t":"Por ejemplo, lanzar una pelota y que suba más rápido cada vez.","s":"@tiro"},{"t":"Otro ejemplo: se notó midiendo estrellas que explotan muy lejos.","s":"@emc"},{"t":"Sería cerca de dos tercios de todo. No sabemos qué es."},{"t":"Algo hace que el universo se expanda cada vez más rápido."}]},{"id":"futuro","t":"El futuro del universo","res":"Muy, muy lejos en el futuro, las estrellas se irán apagando.","g":[{"t":"El futuro del universo"},{"t":"Las estrellas se terminarán su combustible.","s":"@futuro"},{"t":"Por ejemplo, el Sol, en unos cinco mil millones de años.","s":"radia"},{"t":"Se hará enorme, y luego se apagará lento.","s":"radia"},{"t":"Otro ejemplo: las galaxias se seguirán alejando.","s":"@expansion"},{"t":"El cielo se verá cada vez más vacío.","s":"@expansion"},{"t":"Falta muchísimo tiempo.","s":"@futuro"},{"t":"Mira avanzar el tiempo."},{"tipo":"barra","b":"futuro","o":"Fíjate cómo se apagan poco a poco las estrellas."},{"t":"Muy, muy lejos en el futuro, las estrellas se irán apagando."}]},{"id":"exoplanetas","t":"Planetas de otras estrellas","res":"Se detectan por cómo baja un poquito la luz cuando pasan enfrente.","g":[{"t":"Planetas de otras estrellas"},{"t":"Hay miles de planetas fuera del sistema solar.","s":"@transito"},{"t":"Casi no se pueden ver directo.","s":"@transito"},{"t":"Pero si pasan frente a su estrella, baja su luz.","s":"@transito"},{"t":"Por ejemplo, una mosca frente a un foco.","s":"@transito"},{"t":"Otro ejemplo: su estrella se mueve un poquito por su jalón.","s":"atrae"},{"t":"Algunos podrían tener agua líquida.","s":"@transito"},{"t":"Mira pasar el planeta."},{"tipo":"barra","b":"transito","o":"Fíjate: la luz baja un poquito cuando el planeta pasa enfrente."},{"t":"Se detectan por cómo baja un poquito la luz cuando pasan enfrente."}]},{"id":"neutrones","t":"Estrellas de neutrones","res":"Una cucharadita pesaría miles de millones de toneladas.","g":[{"t":"Estrellas de neutrones"},{"t":"Una estrella grande explota.","s":"@emc"},{"t":"Su centro se aprieta muchísimo.","s":"@curva"},{"t":"Queda una bola de unos veinte kilómetros.","s":"@hoyo"},{"t":"Con más masa que el Sol.","s":"@hoyo"},{"t":"Por ejemplo, una cucharadita de ella.","s":"materia"},{"t":"Pesaría miles de millones de toneladas.","s":"materia"},{"t":"Otro ejemplo: algunas giran cientos de veces por segundo.","s":"@patin"},{"t":"Se les llama púlsares.","s":"@patin"},{"t":"Una cucharadita pesaría miles de millones de toneladas."}]},{"id":"galaxias","t":"Galaxias","res":"Son enormes grupos de estrellas que giran juntas.","g":[{"t":"Galaxias"},{"t":"El Sol es una estrella entre miles de millones.","s":"@escala"},{"t":"Juntas forman la Vía Láctea.","s":"@escala"},{"t":"Giramos alrededor de su centro.","s":"astro"},{"t":"Por ejemplo, una vuelta tarda más de doscientos millones de años.","s":"astro"},{"t":"Otro ejemplo: Andrómeda, la galaxia vecina.","s":"@expansion"},{"t":"Se ve a simple vista en un cielo muy oscuro.","s":"pasado"},{"t":"Hay miles de millones de galaxias."},{"t":"Son enormes grupos de estrellas que giran juntas."}]},{"id":"fermi","t":"¿Estamos solos?","res":"Con tantos planetas, sorprende que no hayamos encontrado a nadie.","g":[{"t":"¿Estamos solos?"},{"t":"Hay miles de millones de planetas.","s":"@transito"},{"t":"¿Dónde está todo el mundo?","s":"@transito"},{"t":"A esa pregunta se le llama la paradoja de Fermi.","s":"@transito"},{"t":"Por ejemplo, un bosque enorme en silencio."},{"t":"Quizá se esconden, o nosotros no sabemos escuchar."},{"t":"Otro ejemplo: las distancias son gigantes.","s":"pasado"},{"t":"Un mensaje tardaría miles de años en ir y volver.","s":"pasado"},{"t":"Nadie sabe la respuesta. Sería un gran descubrimiento."},{"t":"Con tantos planetas, sorprende que no hayamos encontrado a nadie."}]},{"id":"cuerdas","t":"Teoría de cuerdas","res":"Es la idea de que todo está hecho de cuerdas diminutas vibrando.","g":[{"t":"Teoría de cuerdas"},{"t":"No sabemos unir gravedad y cuántica.","s":"@curva"},{"t":"Una idea son las cuerdas.","s":"@armonico"},{"t":"Cada partícula sería una cuerdita vibrando.","s":"@armonico"},{"t":"Por ejemplo, una cuerda de guitarra da distintas notas.","s":"@armonico"},{"t":"Otro ejemplo: cada nota sería una partícula.","s":"@armonico"},{"t":"Necesitaría más dimensiones que las que vemos.","s":"@armonico"},{"t":"Todavía no se ha comprobado. Es solo una hipótesis."},{"t":"Es la idea de que todo está hecho de cuerdas diminutas vibrando."}]},{"id":"tiempo","t":"¿Qué es el tiempo?","res":"Las leyes casi no distinguen pasado de futuro, pero el desorden sí.","g":[{"t":"¿Qué es el tiempo?"},{"t":"Casi todas las leyes funcionan igual hacia atrás.","s":"reloj"},{"t":"Una bola rebotando, en video al revés, se ve normal.","s":"@choque"},{"t":"Un vaso roto, en reversa, se ve raro.","s":"vaso"},{"t":"La diferencia es el desorden.","s":"@monedas"},{"t":"Por ejemplo, un café con leche nunca se separa.","s":"@monedas"},{"t":"Otro ejemplo: recuerdas el pasado, no el futuro.","s":"reloj"},{"t":"Sigue siendo uno de los grandes misterios."},{"t":"Las leyes casi no distinguen pasado de futuro, pero el desorden sí."}]},{"id":"caos","t":"El efecto mariposa","res":"En algunos sistemas, una diferencia mínima lo cambia todo.","g":[{"t":"El efecto mariposa"},{"t":"Unos sistemas son muy sensibles.","s":"@caos"},{"t":"Una diferencia mínima cambia todo el final.","s":"@caos"},{"t":"Por ejemplo, el clima.","s":"@caos"},{"t":"Por eso no se predice bien más allá de unos días.","s":"@caos"},{"t":"Otro ejemplo: un péndulo doble.","s":"@caos"},{"t":"Empieza casi igual, y acaba muy distinto.","s":"@caos"},{"t":"No es magia: sigue las reglas. Simplemente son muy delicadas."},{"t":"Mira las dos bolitas."},{"tipo":"barra","b":"caos","o":"Fíjate: las dos bolitas empiezan casi iguales, y luego se separan."},{"t":"En algunos sistemas, una diferencia mínima lo cambia todo."}]},{"id":"gravcuantica","t":"El gran problema","res":"La relatividad y la cuántica no encajan del todo.","g":[{"t":"El gran problema"},{"t":"La relatividad explica lo muy grande.","s":"@curva"},{"t":"La cuántica, lo muy chico.","s":"@rendija"},{"t":"Las dos funcionan muy bien.","s":"@rendija"},{"t":"Pero no encajan.","s":"@rendija"},{"t":"Por ejemplo, dentro de un hoyo negro.","s":"@hoyo"},{"t":"Es muy chico y muy pesado a la vez.","s":"@hoyo"},{"t":"Otro ejemplo: el primer instante del universo.","s":"@expansion"},{"t":"Faltan ideas para explicarlos. Quizá las tenga alguien nuevo."},{"t":"La relatividad y la cuántica no encajan del todo."}]},{"id":"oscura2","t":"Materia oscura 2: buscarla","res":"La buscan con detectores muy profundos y mirando cómo se dobla la luz.","g":[{"t":"Materia oscura 2: buscarla"},{"t":"Ya vimos que algo invisible sostiene las galaxias.","s":"@curva"},{"t":"Su gravedad dobla la luz que pasa cerca.","s":"@curva"},{"t":"Con eso se puede hacer un mapa de dónde está.","s":"@curva"},{"t":"Por ejemplo, ver una ciudad por una ventana de vidrio ondulado.","s":"@curva"},{"t":"Las formas chuecas te dicen cómo es el vidrio.","s":"@curva"},{"t":"Otro ejemplo: detectores muy profundos, bajo tierra.","s":"olla"},{"t":"Esperan que una de esas partículas choque por fin.","s":"olla"},{"t":"Hasta hoy, nadie la ha visto directamente."},{"t":"La buscan con detectores muy profundos y mirando cómo se dobla la luz."}]},{"id":"wormhole","t":"Agujeros de gusano","res":"Una idea matemática de un atajo en el espacio, jamás observada.","g":[{"t":"Agujeros de gusano"},{"t":"La relatividad permite una rareza.","s":"@curva"},{"t":"Un atajo entre dos lugares.","s":"@curva"},{"t":"Por ejemplo, una hoja doblada.","s":"@curva"},{"t":"Con un lápiz la atraviesas, sin dar la vuelta.","s":"@curva"},{"t":"Otro ejemplo: se ve en muchas películas.","s":"@curva"},{"t":"Nadie ha visto uno. Podrían ni siquiera existir."},{"t":"Es una posibilidad en las ecuaciones, no un hecho."},{"t":"Una idea matemática de un atajo en el espacio, jamás observada."}]}],"mat":"f","et":"C2"},{"id":"qA1","et":"A1","mat":"q","nom":"La química de tu casa","lec":[{"id":"q_estadio","t":"El átomo por dentro","res":"Casi todo el átomo es espacio vacío.","g":[{"t":"El átomo por dentro"},{"t":"Imagina que estás en medio de un estadio.","s":"p:estadio;i:hand-palm .5 .5 .16"},{"t":"En la mano traes un grano de arroz, y lo dejas en el pasto.","s":"p:estadio;i:hand-palm .5 .5 .16"},{"t":"Ese grano es el núcleo de un átomo.","s":"p:estadio;i:hand-palm .5 .5 .16"},{"t":"Caminas hasta las gradas, y ahí están los fanáticos, corriendo de un lado a otro.","s":"p:estadio;e .85 .22 feliz .11;e .15 .3 feliz .11;e .7 .88 feliz .11;e .24 .8 feliz .11"},{"t":"Hola, amigo. ¿Quién eres?","s":"p:estadio;e .84 .5 feliz .24;i:person .66 .5 .3"},{"t":"Hola, amigo. Soy un electrón, y aquí corro todo el día.","s":"p:estadio;e .84 .5 feliz .24;i:person .66 .5 .3"},{"t":"¿No quieres bajar a la cancha?","s":"p:estadio;e .84 .5 feliz .24;i:person .66 .5 .3"},{"t":"No, amigo. Aquí es mi lugar.","s":"p:estadio;e .84 .5 feliz .24;i:person .66 .5 .3"},{"t":"Miras hacia abajo, y el grano casi ni se ve.","s":"p:estadio;fl .78 .5 .54 .5"},{"t":"Entre ustedes dos no hay nada. Así de vacío es un átomo.","s":"p:estadio;fl .78 .5 .54 .5"},{"t":"Tu mano también está hecha así.","s":"ic:hand-palm"},{"t":"Gracias, amigo electrón.","s":"ic:hand-palm"},{"t":"Dicho de otro modo:","s":"ic:hand-palm"},{"t":"Un átomo tiene un núcleo muy pequeño, con protones y neutrones.","s":"ic:hand-palm"},{"t":"Los electrones se mueven lejos de él, y los mantiene ahí la atracción de sus cargas.","s":"ic:hand-palm"}]},{"id":"q_todo_igual","t":"De qué está hecho todo","res":"Todo lo que tocas está hecho de átomos.","g":[{"t":"De qué está hecho todo"},{"t":"Imagina que levantas una piedra del suelo.","s":"ic:hand-grabbing"},{"t":"La partes a la mitad, y otra vez, y otra.","s":"ic:hand-grabbing"},{"t":"Al final, queda un pedacito muy chiquito.","s":"p:nada;i:mountains .28 .52 .4 #9AA2AB;Átomo .68 .6 feliz .26"},{"t":"Hola, amigo. ¿Quién eres?","s":"p:nada;i:mountains .28 .52 .4 #9AA2AB;Átomo .68 .6 feliz .26"},{"t":"Soy un átomo, amigo. Yo formo la piedra.","s":"p:nada;i:mountains .28 .52 .4 #9AA2AB;Átomo .68 .6 feliz .26"},{"t":"Ahora haces lo mismo con una hoja, y te saluda otro átomo.","s":"ic:leaf"},{"t":"Con tu mano, igual.","s":"ic:hand-palm"},{"t":"Gracias, amigos átomos.","s":"ic:hand-palm"},{"t":"Dicho de otro modo:","s":"ic:hand-palm"},{"t":"Todo lo que existe a tu alrededor está hecho de átomos.","s":"ic:hand-palm"}]},{"id":"q_agua_tres","t":"El agua de tres formas","res":"El agua cambia de forma, pero sigue siendo agua.","g":[{"t":"El agua de tres formas"},{"t":"Imagina que traes un hielo en la mano.","s":"p:nada;i:snowflake .28 .5 .42;Agua .7 .55 tranquilo .26"},{"t":"Hola, amiga agua. Qué fría estás.","s":"p:nada;i:snowflake .28 .5 .42;Agua .7 .55 tranquilo .26"},{"t":"Es que estoy quietecita, amigo.","s":"p:nada;i:snowflake .28 .5 .42;Agua .7 .55 tranquilo .26"},{"t":"Se te derrite, y anda resbalando entre tus dedos.","s":"ic:drop"},{"t":"La pones en una olla, y sale volando como vapor.","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"t":"Sigo siendo yo, amigo, te dice desde arriba.","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"t":"Gracias, amiga agua.","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"t":"Dicho de otro modo:","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"t":"Hielo, agua y vapor son la misma molécula; solo cambia qué tan rápido se mueve.","s":"p:nada;i:cooking-pot .3 .75 .3;Agua .7 .25 feliz .2;fl .45 .6 .6 .35"},{"tipo":"barra","b":"estadosT","o":"Imagina que tienes agua en una olla y la calientas poco a poco.","pasos":[[-10,"Aquí está congelada. Las bolitas casi no se mueven."],[40,"Ahora ya es líquida. Las bolitas se resbalan unas con otras."],[99,"Casi hierve. Se mueven muy rápido."],[115,"Ya es vapor. Cada bolita se fue por su lado."]]}]},{"id":"q_sal_agua","t":"La sal que desaparece","res":"La sal no se va: se queda repartida en el agua.","g":[{"t":"La sal que desaparece"},{"t":"Imagina un vaso de agua, y le echas una cucharada de sal.","s":"ic:drop"},{"t":"La mueves, y ya no la ves.","s":"ic:drop"},{"t":"Amiga sal, ¿a dónde te fuiste?","s":"p:nada;i:drop .28 .55 .5;Sal .7 .55 feliz .3"},{"t":"Aquí sigo, amigo. Pruébame.","s":"p:nada;i:drop .28 .55 .5;Sal .7 .55 feliz .3"},{"t":"Tomas un trago, y está salado.","s":"p:nada;i:drop .28 .55 .5;Sal .7 .55 feliz .3"},{"t":"Luego le echas sal a una sopa, y toda la sopa sabe a sal.","s":"ic:cooking-pot"},{"t":"Gracias, amiga sal.","s":"ic:cooking-pot"},{"t":"Dicho de otro modo:","s":"ic:cooking-pot"},{"t":"Disolver es repartir algo en pedacitos que no se ven.","s":"ic:cooking-pot"},{"tipo":"barra","b":"disuelve","o":"Imagina un vaso de agua. Le vas echando sal con una cucharita.","pasos":[[5,"Con cinco cucharaditas, la sal desaparece."],[15,"Con quince, el agua ya casi no acepta más."],[20,"Con veinte, la sal se queda en el fondo."]]}]},{"id":"q_azucar_cafe","t":"Azúcar en el café","res":"Lo caliente disuelve más rápido.","g":[{"t":"Azúcar en el café"},{"t":"Imagina un café caliente, y le echas azúcar.","s":"ic:coffee"},{"t":"Se va rápido.","s":"ic:coffee"},{"t":"Ahora le echas azúcar a un vaso con hielos, y se queda en el fondo.","s":"p:cocina;i:snowflake .28 .62 .26;Azúcar .68 .64 triste .24"},{"t":"Amiga azúcar, ¿qué pasa?","s":"p:cocina;i:snowflake .28 .62 .26;Azúcar .68 .64 triste .24"},{"t":"Es que aquí todos están quietos, amigo.","s":"p:cocina;i:snowflake .28 .62 .26;Azúcar .68 .64 triste .24"},{"t":"En lo caliente, todos se mueven y me ayudan a irme.","s":"agita"},{"t":"Gracias, amiga azúcar.","s":"agita"},{"t":"Dicho de otro modo:","s":"agita"},{"t":"En lo caliente las moléculas se mueven más rápido, y disuelven antes.","s":"agita"}]},{"id":"q_clavo","t":"Un clavo oxidado","res":"El hierro se junta con el oxígeno, y sale óxido.","g":[{"t":"Un clavo oxidado"},{"t":"Imagina un clavo tirado en el patio, bajo la lluvia.","s":"p:patio;x:clavo .36 .7 .34"},{"t":"Llega el oxígeno, y saluda al hierro del clavo.","s":"p:patio;x:clavo .36 .7 .34;O .68 .66 feliz .24"},{"t":"Hola, amigo. ¿Me puedo quedar?","s":"p:patio;x:clavo .36 .7 .34;O .68 .66 feliz .24"},{"t":"Pasan los días, y salen manchas cafés.","s":"p:patio;x:clavo .36 .7 .34;O .68 .66 feliz .24"},{"t":"A la cadena de una bici le pasa igual.","s":"ic:bicycle"},{"t":"Gracias por explicarnos, amigo oxígeno.","s":"ic:bicycle"},{"t":"Dicho de otro modo:","s":"ic:bicycle"},{"t":"El óxido es hierro unido con oxígeno, y el agua lo acelera.","s":"ic:bicycle"},{"tipo":"barra","b":"oxido","o":"Imagina un clavo en el patio, con lluvia y aire.","pasos":[[3,"Los primeros días, sigue limpio."],[20,"A las pocas semanas, le salen manchas cafés."],[50,"Después de un tiempo, está cubierto de óxido."]]}]},{"id":"q_manzana","t":"La manzana café","res":"El aire cambia la manzana cortada.","g":[{"t":"La manzana café"},{"t":"Imagina que partes una manzana, y dejas una mitad en la mesa.","s":"p:cocina;x:manzana .36 .62 .32"},{"t":"Hola, amiga manzana, le dice el oxígeno. Qué bueno que abriste.","s":"p:cocina;x:manzana .36 .62 .32;O .7 .64 feliz .24"},{"t":"Al rato, ya está café.","s":"p:cocina;x:manzana .36 .62 .32;O .7 .64 feliz .24"},{"t":"Con un aguacate, pasa lo mismo.","s":"ic:knife"},{"t":"Le pones limón, y el oxígeno tarda más.","s":"ic:orange-slice"},{"t":"Gracias, amigo oxígeno.","s":"ic:orange-slice"},{"t":"Dicho de otro modo:","s":"ic:orange-slice"},{"t":"El oxígeno reacciona con lo de adentro de la fruta, y eso le cambia el color.","s":"ic:orange-slice"}]},{"id":"q_huevo","t":"El huevo que se cocina","res":"El calor cambia las proteínas para siempre.","g":[{"t":"El huevo que se cocina"},{"t":"Imagina que rompes un huevo en el sartén.","s":"ic:egg-crack"},{"t":"La clara está transparente y resbalosa.","s":"ic:egg-crack"},{"t":"Hola, amiga proteína. ¿Qué te está pasando?","s":"p:nada;i:egg-crack .28 .55 .44 #BCA67A;Proteína .7 .56 feliz .28"},{"t":"Con el calor me desenredo, amigo, y me abrazo con las otras.","s":"p:nada;i:egg-crack .28 .55 .44 #BCA67A;Proteína .7 .56 feliz .28"},{"t":"Ya no hay regreso, y por eso se pone blanca.","s":"p:nada;i:egg-crack .28 .55 .44 #BCA67A;Proteína .7 .56 feliz .28"},{"t":"A la carne en la parrilla le pasa igual.","s":"ic:hamburger"},{"t":"Gracias, amiga proteína.","s":"ic:hamburger"},{"t":"Dicho de otro modo:","s":"ic:hamburger"},{"t":"El calor cambia la forma de las proteínas, y esas ya no regresan a como estaban.","s":"ic:hamburger"}]},{"id":"q_pan_sube","t":"Por qué sube el pan","res":"La levadura suelta gas, y el gas infla la masa.","g":[{"t":"Por qué sube el pan"},{"t":"Imagina una bolita de masa, y la dejas tapada.","s":"ic:bread"},{"t":"Adentro hay unas amigas chiquitas, comiendo azúcar.","s":"p:cocina;i:bread .36 .66 .3;Levadura .72 .66 feliz .22"},{"t":"Hola, amigas levaduras. ¿Qué hacen?","s":"p:cocina;i:bread .36 .66 .3;Levadura .72 .66 feliz .22"},{"t":"Te estamos inflando el pan, amigo. Provecho.","s":"p:cocina;i:bread .36 .66 .3;Levadura .72 .66 feliz .22"},{"t":"Al comer, sueltan burbujas de gas.","s":"mol:CO2"},{"t":"La espuma de la cerveza viene de lo mismo.","s":"ic:beer-bottle"},{"t":"Gracias, amigas.","s":"ic:beer-bottle"},{"t":"Dicho de otro modo:","s":"ic:beer-bottle"},{"t":"Las levaduras convierten azúcar en gas, y ese gas infla la masa.","s":"ic:beer-bottle"},{"tipo":"barra","b":"pan","o":"Imagina una bolita de masa con levadura, tapada en un lugar tibio.","pasos":[[15,"Al principio, casi no cambia."],[45,"A la media hora, ya creció."],[85,"Después de más de una hora, tiene el doble de tamaño."]]}]},{"id":"q_jabon_grasa","t":"Cómo limpia el jabón","res":"El jabón agarra la grasa por un lado y el agua por el otro.","g":[{"t":"Cómo limpia el jabón"},{"t":"Imagina que traes las manos llenas de aceite.","s":"ic:hand-soap"},{"t":"Las pones en el agua, y el aceite ni se mueve.","s":"ic:hand-soap"},{"t":"Hola, amigo jabón. ¿Me ayudas?","s":"p:nada;Grasa .22 .55 neutro .24;Jabón .5 .55 feliz .26;Agua .8 .55 neutro .24"},{"t":"Claro, amigo. Yo me llevo con los dos.","s":"p:nada;Grasa .22 .55 neutro .24;Jabón .5 .55 feliz .26;Agua .8 .55 neutro .24"},{"t":"Con una mano agarra la grasa, y con la otra, el agua.","s":"p:nada;Grasa .22 .55 neutro .24;Jabón .5 .55 feliz .26;Agua .8 .55 neutro .24"},{"t":"Con un sartén grasoso hace lo mismo.","s":"ic:cooking-pot"},{"t":"Gracias, amigo jabón.","s":"ic:cooking-pot"},{"t":"Dicho de otro modo:","s":"ic:cooking-pot"},{"t":"El jabón une la grasa con el agua, y así el agua se la lleva.","s":"ic:cooking-pot"},{"tipo":"barra","b":"jabon","o":"Imagina una gota de grasa en tu mano. Le vas poniendo jabón.","pasos":[[4,"Con poquito, la mancha sigue ahí."],[14,"Con más, el jabón la va rodeando."],[28,"Con suficiente, la grasa se suelta y el agua se la lleva."]]}]},{"id":"q_vinagre_bicarb","t":"Vinagre y bicarbonato","res":"Al juntarse hacen gas, y por eso burbujean.","g":[{"t":"Vinagre y bicarbonato"},{"t":"Imagina un vaso con bicarbonato, y le echas vinagre.","s":"ic:jar"},{"t":"Empieza a hacer espuma.","s":"ic:jar"},{"t":"Hola, amigos. ¿Qué se traen?","s":"p:cocina;Vinagre .32 .6 feliz .22;Bicarb .68 .6 feliz .22"},{"t":"Nos caímos muy bien, amigo.","s":"p:cocina;Vinagre .32 .6 feliz .22;Bicarb .68 .6 feliz .22"},{"t":"Y de su plática sale un gas nuevo, en burbujas.","s":"mol:CO2"},{"t":"En un pastel, el polvo para hornear hace igual, y lo deja esponjoso.","s":"ic:cookie"},{"t":"Gracias, amigos.","s":"ic:cookie"},{"t":"Dicho de otro modo:","s":"ic:cookie"},{"t":"Un ácido y una base reaccionan, y aquí sale gas: CO₂.","v":"Un ácido y una base reaccionan, y aquí sale gas: ce o dos.","s":"ic:cookie"},{"tipo":"barra","b":"burbujas","o":"Imagina una botella con bicarbonato y un globo en la boca. Le vas echando vinagre.","pasos":[[2,"Con poquito vinagre, salen pocas burbujas."],[6,"Con más vinagre, el globo se empieza a inflar."],[10,"Llega un punto en que se acaba el bicarbonato, y el globo ya no crece."]]}]},{"id":"q_limon","t":"Por qué el limón es agrio","res":"Lo agrio viene de los ácidos.","g":[{"t":"Por qué el limón es agrio"},{"t":"Imagina que muerdes un limón, y se te arruga la cara.","s":"ic:orange-slice"},{"t":"Hola, amigo limón. ¿Qué me hiciste?","s":"p:nada;i:orange-slice .28 .55 .42 #E3B23C;Ácido .7 .55 feliz .28"},{"t":"Te dejé una piecita en la lengua, amigo. Soy ácido.","s":"p:nada;i:orange-slice .28 .55 .42 #E3B23C;Ácido .7 .55 feliz .28"},{"t":"Luego pruebas vinagre.","s":"ic:drop"},{"t":"Yo soy igual, amigo, te dice.","s":"ic:drop"},{"t":"Gracias, amigos.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"Los ácidos sueltan una partícula pequeña, y tu lengua la nota como agrio.","s":"ic:drop"}]},{"id":"q_escala_ph","t":"Una regla para lo ácido","res":"El pH dice qué tan ácida o básica es una cosa.","g":[{"t":"Una regla para lo ácido"},{"t":"Imagina a tres amigos: el limón, el agua y el jabón.","s":"p:nada;Limón .18 .55 feliz .22;Agua .5 .55 tranquilo .22;Jabón .82 .55 feliz .22"},{"t":"Les pones una regla al lado.","s":"p:nada;Limón .18 .55 feliz .22;Agua .5 .55 tranquilo .22;Jabón .82 .55 feliz .22"},{"t":"Yo quedo abajo, dice el limón. Soy ácido.","s":"@ph"},{"t":"Yo quedo en medio, dice el agua. Me llevo con todos.","s":"@ph"},{"t":"Y yo arriba, dice el jabón. Soy básico.","s":"@ph"},{"t":"Gracias, amigos.","s":"@ph"},{"t":"Dicho de otro modo:","s":"@ph"},{"t":"El pH va del 0 al 14: abajo es ácido, 7 es neutro, y arriba es básico.","v":"El pe hache va del 0 al 14: abajo es ácido, 7 es neutro, y arriba es básico.","s":"@ph"},{"tipo":"barra","b":"ph","o":"Imagina que metes un medidor en varias cosas de tu cocina.","pasos":[[0,"El limón es muy ácido. Por eso te hace arrugar la cara."],[5,"El agua pura queda justo en medio."],[8,"El agua con jabón ya está del otro lado. Se siente resbalosa."],[10,"El cloro de limpieza está hasta el fondo. Por eso irrita la piel."]]}]},{"id":"q_vela","t":"Lo que hace una vela","res":"Una vela quema su cera, no solo el hilo.","g":[{"t":"Lo que hace una vela"},{"t":"Imagina una vela encendida en un cuarto oscuro.","s":"ic:fire"},{"t":"Hola, amigo hilo. ¿Tú eres el que se quema?","s":"p:nada;i:fire .5 .24 .32 #E08A2E;Hilo .5 .62 tranquilo .24"},{"t":"No tanto, amigo. Yo solo subo la cera.","s":"p:nada;i:fire .5 .24 .32 #E08A2E;Hilo .5 .62 tranquilo .24"},{"t":"La cera se derrite, sube, se vuelve gas, y ese gas arde.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Si le soplas, ves un humito blanco.","s":"rx:CH4+2O2>CO2+2H2O"},{"t":"Le acercas un cerillo, y se vuelve a prender.","s":"rx:CH4+2O2>CO2+2H2O"  .17"},{"t":"Hola, amigo platino. ¿Tú también vas a bailar?","s":"p:fiesta;Pt .5 .55 feliz .26;H .2 .75 feliz .17;O .8 .75 feliz .17"},{"t":"No, amigo. Yo solo les ayudo a conocerse.","s":"p:fiesta;Pt .5 .55 feliz .26;H .2 .75 feliz .17;O .8 .75 feliz .17"},{"t":"Se hacen amigos, y él se queda igual.","s":"p:fiesta;H .42 .68 feliz .2;O .58 .68 feliz .2;Pt .82 .7 tranquilo .2"},{"t":"Luego lo ves en el escape de un carro, ayudando a limpiar los gases.","s":"ic:car"},{"t":"Gracias, amigo platino.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"El platino es un catalizador: acelera reacciones sin gastarse.","s":"ic:car"}]},{"id":"q_oro","t":"Oro, el tranquilo","res":"El oro casi no reacciona, por eso conserva su brillo.","g":[{"t":"Oro, el tranquilo"},{"t":"Imagina una fiesta llena de elementos.","s":"p:fiesta;O .32 .62 feliz .2;C .1 .74 feliz .14;H .55 .74 feliz .14;Fe .78 .74 feliz .14"},{"t":"El oxígeno anda saludando a todos, y a todos se les pega.","s":"p:fiesta;O .32 .62 feliz .2;C .1 .74 feliz .14;H .55 .74 feliz .14;Fe .78 .74 feliz .14"},{"t":"En una esquina, solito y muy tranquilo, está el oro.","s":"p:fiesta;O .3 .64 feliz .17;C .1 .76 feliz .13;H .48 .76 feliz .13;Au .8 .66 tranquilo .24"},{"t":"Hola, amigo oro. ¿Por qué estás aquí solito?","s":"p:fiesta;Au .75 .62 tranquilo .34;i:person .25 .68 .32"},{"t":"Hola, amigo. Es que así estoy a gusto.","s":"p:fiesta;Au .75 .62 tranquilo .34;i:person .25 .68 .32"},{"t":"¿Y el oxígeno?","s":"p:fiesta;Au .75 .62 tranquilo .34;i:person .25 .68 .32"},{"t":"Me saluda, pero no me le pego. Por eso no me oxido.","s":"p:fiesta;Au .75 .62 tranquilo .34;i:person .25 .68 .32"},{"t":"Por eso, una moneda de oro sale brillando del mar, después de siglos.","s":"p:nada;i:waves .5 .85 .26;Au .5 .48 feliz .34"},{"t":"Gracias, amigo oro.","s":"p:nada;i:waves .5 .85 .26;Au .5 .48 feliz .34"},{"t":"A ti por visitarme.","s":"p:nada;i:waves .5 .85 .26;Au .5 .48 feliz .34"},{"t":"Dicho de otro modo:","s":"p:nada;i:waves .5 .85 .26;Au .5 .48 feliz .34"},{"t":"El oro es un metal noble: le cuesta soltar sus electrones, y por eso no se oxida.","s":"p:nada;i:waves .5 .85 .26;Au .5 .48 feliz .34"}]},{"id":"q_mercurio","t":"Mercurio, el que rueda","res":"El mercurio es líquido a temperatura normal y es tóxico.","g":[{"t":"Mercurio, el que rueda"},{"t":"Imagina una gotita plateada, rodando en un plato.","s":"p:cocina;Hg .5 .62 feliz .26;i:drop .2 .7 .14;i:drop .8 .7 .14"},{"t":"Hola, amigo mercurio. ¿No que eras metal?","s":"p:cocina;Hg .5 .62 feliz .26;i:drop .2 .7 .14;i:drop .8 .7 .14"},{"t":"Sí, amigo. Pero a mí me gusta rodar.","s":"p:cocina;Hg .5 .62 feliz .26;i:drop .2 .7 .14;i:drop .8 .7 .14"},{"t":"Antes me usaban en los termómetros.","s":"ic:thermometer"},{"t":"Una cosa, amigo: mejor no me toques, te puedo hacer daño.","s":"p:nada;Hg .5 .55 tranquilo .34;i:hand-palm .15 .55 .22"},{"t":"Gracias por avisar, amigo mercurio.","s":"p:nada;Hg .5 .55 tranquilo .34;i:hand-palm .15 .55 .22"},{"t":"Dicho de otro modo:","s":"p:nada;Hg .5 .55 tranquilo .34;i:hand-palm .15 .55 .22"},{"t":"El mercurio es el único metal líquido a temperatura normal, y es tóxico.","s":"p:nada;Hg .5 .55 tranquilo .34;i:hand-palm .15 .55 .22"}]},{"id":"q_plomo","t":"Plomo, el pesado","res":"El plomo es pesado, blando y dañino para el cuerpo.","g":[{"t":"Plomo, el pesado"},{"t":"Imagina a un amigo pesado, que se sienta a tu lado.","s":"p:nada;Pb .62 .6 tranquilo .4;i:person .22 .58 .4"},{"t":"Hola, amigo plomo. Qué pesado estás.","s":"p:nada;Pb .62 .6 tranquilo .4;i:person .22 .58 .4"},{"t":"Sí, amigo. Y te voy a pedir algo.","s":"p:nada;Pb .62 .6 tranquilo .4;i:person .22 .58 .4"},{"t":"No me dejes entrar a tu cuerpo. Le hago daño a tu cerebro.","s":"p:cuerpo;Pb .5 .32 triste .2"},{"t":"Por eso ya no me ponen en la pintura.","s":"p:cuerpo;Pb .5 .32 triste .2"},{"t":"Pero en el dentista te cuido de los rayos X, en ese chaleco.","s":"p:nada;Pb .5 .55 feliz .3;i:shield .18 .55 .3"},{"t":"Gracias, amigo plomo.","s":"p:nada;Pb .5 .55 feliz .3;i:shield .18 .55 .3"},{"t":"Dicho de otro modo:","s":"p:nada;Pb .5 .55 feliz .3;i:shield .18 .55 .3"},{"t":"El plomo es un metal denso y tóxico que se acumula en el cuerpo, y frena la radiación.","s":"p:nada;Pb .5 .55 feliz .3;i:shield .18 .55 .3"}]},{"id":"q_uranio","t":"Uranio, el gigante","res":"El núcleo del uranio se puede partir y soltar muchísima energía.","g":[{"t":"Uranio, el gigante"},{"t":"Imagina a un amigo gigante, cargando muchísimas cosas.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Camina tambaleándose.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Hola, amigo uranio. ¿Estás bien?","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Más o menos, amigo. Traigo demasiado encima.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Le llega un neutrón, y se parte en dos.","s":"p:nada;U .32 .55 sorpresa .24;U .68 .55 sorpresa .24;i:sparkle .5 .25 .3 #E0A92E"},{"t":"Y al partirse suelta muchísima energía.","s":"p:nada;U .32 .55 sorpresa .24;U .68 .55 sorpresa .24;i:sparkle .5 .25 .3 #E0A92E"},{"t":"En una planta nuclear, ese calor hace electricidad.","s":"ic:nuclear-plant"},{"t":"Gracias, amigo uranio.","s":"ic:nuclear-plant"},{"t":"Dicho de otro modo:","s":"ic:nuclear-plant"},{"t":"El núcleo del uranio es grande e inestable, y al partirse libera energía: es la fisión.","s":"ic:nuclear-plant"}]},{"id":"q_neon","t":"Neón, el del letrero","res":"El neón brilla con color cuando pasa la electricidad.","g":[{"t":"Neón, el del letrero"},{"t":"Imagina un letrero rojo, en una calle de noche.","s":"p:noche;Ne .5 .62 feliz .3;i:lightning .5 .2 .22 #E0A92E"},{"t":"Hola, amigo neón. ¿Por qué brillas tanto?","s":"p:noche;Ne .5 .62 feliz .3;i:lightning .5 .2 .22 #E0A92E"},{"t":"Me pasa la electricidad, amigo, y me da mucho gusto.","s":"p:noche;Ne .5 .62 feliz .3;i:lightning .5 .2 .22 #E0A92E"},{"t":"¿Y tus amigos?","s":"el:Ne,He"},{"t":"Yo no me junto mucho. Igual que el helio, no me falta nada.","s":"el:Ne,He"},{"t":"Gracias, amigo neón.","s":"el:Ne,He"},{"t":"Dicho de ot const AUDIOS=JSON.parse($("audios-datos")?.textContent||"{}");
const audio=new Audio();audio.preservesPitch=true;let audioRoto=false;
function decir(txt){
  return new Promise(res=>{
    const dur=(900+txt.length*95)*fac(),esc=window.__PRUEBA||1;
    const b=(AUDIOS.dora||{})[txt];
    if(!b||audioRoto)return setTimeout(res,dur*esc);
    /* Cada frase maneja solo sus propios avisos: una frase vieja ya no puede borrar los de la actual. */
    let hecho=false,t=0;
    const fin=()=>{if(hecho)return;hecho=true;clearTimeout(t);if(audio.onended===fin){audio.onended=audio.onerror=audio.onloadedmetadata=null}res()};
    t=setTimeout(fin,(dur*2+2000)*esc);
    audio.onended=fin;
    audio.onerror=()=>{audioRoto=true;$("av-audio").hidden=false;fin()};
    /* Conociendo lo que dura el audio, sigue aunque el celular lo interrumpa. */
    audio.onloadedmetadata=()=>{if(!hecho&&isFinite(audio.duration)&&audio.duration>0){clearTimeout(t);t=setTimeout(fin,(audio.duration/P.ritmo*1000+1500)*esc)}};
    audio.src="data:audio/ogg;codecs=opus;base64,"+b;audio.playbackRate=P.ritmo;
    const pr=audio.play();
    if(pr&&pr.catch)pr.catch(e=>{if(e&&e.name==="AbortError")return;audioRoto=true;$("av-audio").hidden=false;setTimeout(fin,dur*esc)});
  });
}
function callar(){audio.onended=audio.onerror=audio.onloadedmetadata=null;audio.pause()}

    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=7000;
    const lim=ac.createDynamicsCompressor();lim.threshold.value=-6;lim.ratio.value=12;

let salioManual=false;
$("b-completa").onclick=()=>{if(document.fullscreenElement){salioManual=true;document.exitFullscreen().catch(()=>{})}else{salioManual=false;entrarCompleta()}};
document.addEventListener("fullscreenchange",pintaCompleta);
pintaCompleta();

/* ───── Configuración ───── */
function aplicarAjustes(){
  raiz.dataset.tema=P.tema;leeC();
  raiz.style.setProperty("--lento",(1.5/P.ritmo).toFixed(2)+"s");
  $("ritmo").value=P.ritmo;
  $("ritmo-v").textContent=P.ritmo<.95?"Más lento":P.ritmo>1.05?"Más rápido":"Normal";
  $("lluvia").value=P.lluvia;$("lluvia-v").textContent=P.lluvia>0?Math.round(P.lluvia*100)+"%":"Apagada";
  pinta();
}
$("ritmo").oninput=e=>{P.ritmo=+e.target.value;guardar();aplicarAjustes()};
$("ritmo").onchange=()=>{callar();decir("Velocidad")}; /* al soltar, oyes el ritmo nuevo */
$("lluvia").oninput=e=>{P.lluvia=+e.target.value;$("lluvia-v").textContent=P.lluvia>0?Math.round(P.lluvia*100)+"%":"Apagada";guardar();oyendo=performance.now()+2500;fondo();clearTimeout(window._tl);window._tl=setTimeout(fondo,2600)};
window.addEventListener("pagehide",()=>{callar();subir()});

const MATERIAS={f:"Física",q:"Química"};
const todosNiv=()=>NIVELES.map(n=>n.id);
const nivElegidos=()=>{const v=(P.sel||[]).filter(i=>NIVELES.some(n=>n.id===i));return v.length?v:todosNiv()};
const lecDe=(...ids)=>NIVELES.filter(n=>ids.includes(n.id)).flatMap(n=>n.lec.map(l=>l.id));
function comenzar(azar){
  const pool=lecDe(...nivElegidos());
  /* Si dejaste una lección a medias y sigue en tu selección, retoma ahí. */
  if(azar&&P.modo&&P.modo.azar&&P.pos[P.ult]&&pool.includes(P.ult)){P.modo={pool,azar:true};abrir(P.ult,true);return}
  abrirModo(pool,azar);
}
function portada(vista){
  gen++;callar();estado="inicio";L=LECS[P.ult]||LECS[ORDEN[0]];pinta();marco.classList.remove("con-vis");
  $("pista").classList.remove("ve");panel(true,true);
  let html;
  if(vista==="elegir"){
    if(!(P.sel&&P.sel.length))P.sel=todosNiv();
    const fila=m=>`<p class="chica">${MATERIAS[m]}</p><div class="chips niveles-sel">${NIVELES.filter(n=>n.mat===m).map(n=>`<button class="chip" data-t="${n.id}" aria-pressed="${P.sel.includes(n.id)}">${etq(n)}</button>`).join("")}</div>`;
    html=`<div class="elegir">${fila("f")}${fila("q")}</div><div class="menu-ini"><button class="mi" data-azar ${P.sel.length?"":"disabled"}>Comenzar</button><button class="quieto" data-orden ${P.sel.length?"":"disabled"}>En orden</button><button class="quieto" data-atras>Atrás</button></div>`;
  }else{
    const parcial=nivElegidos().length<NIVELES.length;
    html=`<div class="menu-ini raiz"><button class="mi inicia" data-azar>Comenzar${parcial?`<small>con tus niveles elegidos</small>`:""}</button><button class="quieto" data-elegir>Elegir niveles</button></div>`;
  }
  marco.innerHTML=html;marco.style.transitionDuration="";marco.classList.add("ve");
  marco.querySelectorAll("button").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();const d=b.dataset;
    if("azar" in d)comenzar(true);
    else if("orden" in d)comenzar(false);
    else if("elegir" in d)portada("elegir");
    else if(d.t){const i=P.sel.indexOf(d.t);if(i<0)P.sel.push(d.t);else P.sel.splice(i,1);guardar();portada("elegir")}
    else if("atras" in d)portada();
  });
}
/* App instalable: guarda la app y la voz en el celular para abrir rápido y sin internet. */
const instalable=(location.protocol==="https:"||location.hostname==="localhost")&&!/claude\.(ai|site)|claudeusercontent/.test(location.hostname)&&"serviceWorker" in navigator;
if(instalable){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  $("c-voz").hidden=false;
  const pinta_=()=>{let h=0;try{h=JSON.parse(localStorage.getItem("susurro-voz")||"0")}catch(e){}$("voz-v").textContent=h?"Guardada":"Se guarda al ir usándola"};pinta_();
  $("b-voz").onclick=async ev=>{ev.stopPropagation();const b=$("b-voz");b.disabled=true;let ok=0;
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
    for(const n of NIVELES){$("voz-v").textContent=`Bajando ${ok+1} de ${NIVELES.length}`;try{const r=await fetch("voz/"+n.id+".json?v="+(VOZV[n.id]||""));if(r.ok){await r.blob();ok++}}catch(e){}}
    if(ok===NIVELES.length){try{localStorage.setItem("susurro-voz","1")}catch(e){}$("voz-v").textContent="Guardada"}else $("voz-v").textContent="Faltó internet, inténtalo otra vez";b.disabled=false};
}
if(window.matchMedia&&matchMedia("(display-mode: fullscreen),(display-mode: standalone)").matches)$("b-completa").hidden=true;
$("br-alto").innerHTML=ICON.sun;$("br-bajo").innerHTML=ICON["sun-dim"];pintaBrillo();aplicarAjustes();portada();
</script>
</body></html>
