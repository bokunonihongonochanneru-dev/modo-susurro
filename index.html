.","s":"potencias"},{"t":"Y somos más chicos que un virus.","s":"@escala=1"},{"t":"Gracias, amigos.","s":"@escala=1"},{"t":"Dicho de otro modo:","s":"@escala=1"},{"t":"Un chip tiene miles de millones de transistores, que representan ceros y unos.","s":"@escala=1"}]},{"id":"ohm2","t":"Corriente 3: la ley de Ohm","res":"Con más voltaje hay más corriente, y con más resistencia hay menos.","g":[{"t":"Corriente 3: la ley de Ohm"},{"t":"Conectas un foco de carro a doce voltios.","s":"circuito"},{"t":"Hola, amiga corriente. ¿Cuánta eres?","s":"circuito"},{"t":"Depende, amigo: soy voltaje entre resistencia.","s":"circuito"},{"t":"Con resistencia de seis, somos dos amperes.","s":"circuito"},{"t":"Una extensión larga y delgada frena más, y se calienta.","s":"ic:plug"},{"tipo":"barra","b":"voltaje","o":"Vas conectando cosas más fuertes.","pasos":[[0,"Una pila, muy poquito."],[2,"Una batería de carro, más."],[3,"Un contacto de tu casa, mucho."],[4,"Y con 220 voltios, más todavía."]]},{"t":"Gracias, amiga corriente.","s":"ic:plug"},{"t":"Dicho de otro modo:","s":"ic:plug"},{"t":"La ley de Ohm dice que la corriente es igual al voltaje entre la resistencia.","s":"ic:plug"}]},{"id":"paralelo","t":"Circuitos 2: en paralelo","res":"En paralelo, cada aparato recibe todo el voltaje.","g":[{"t":"Circuitos 2: en paralelo"},{"t":"Conectas varias cosas en tu casa, y siguen igual.","s":"@paralelo"},{"t":"Hola, amigos focos. ¿No se reparten?","s":"@paralelo"},{"t":"No, amigo. Cada quien tiene su camino, y recibimos todo el voltaje.","s":"@paralelo"},{"t":"Es como una carretera con más carriles.","s":"ic:car"},{"t":"Pero en total, pasa más corriente.","s":"ic:car"},{"tipo":"barra","b":"paralelo","o":"Agregas focos en paralelo.","pasos":[[1,"Con uno, brilla bien."],[3,"Con tres, todos igual."],[6,"Con seis, igual de bien."]]},{"t":"Gracias, amigos.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"En paralelo cada aparato recibe el voltaje completo, y la corriente total se suma.","s":"ic:car"}]},{"id":"fusibles","t":"Fusibles y pastillas","res":"Un fusible corta la corriente antes de que se incendie algo.","g":[{"t":"Fusibles y pastillas"},{"t":"Conectas demasiadas cosas a una extensión, y se baja la pastilla.","s":"@fusible"},{"t":"Hola, amiga pastilla. ¿Qué pasó?","s":"@fusible"},{"t":"Ya pasaba demasiada corriente, amigo. Te cuidé de un incendio.","s":"@fusible"},{"t":"Si dos cables se tocan, es un cortocircuito.","s":"circuito"},{"tipo":"barra","b":"fusible","o":"Sube la corriente.","pasos":[[5,"Con poca, sin problema."],[14,"Casi al límite, todavía aguanta."],[20,"De más, y se abre."]]},{"t":"Gracias, amiga pastilla.","s":"circuito"},{"t":"Dicho de otro modo:","s":"circuito"},{"t":"Fusibles y pastillas abren el circuito cuando hay demasiada corriente.","s":"circuito"}]},{"id":"tierra","t":"La tierra física","res":"El tercer cable de un enchufe da un camino seguro a la corriente.","g":[{"t":"La tierra física"},{"t":"Conectas una lavadora, con tres patitas.","s":"ic:plug"},{"t":"Hola, amiga tercera patita. ¿Para qué sirves?","s":"ic:plug"},{"t":"Si algo falla, amigo, la corriente se va por mí.","s":"ic:plug"},{"t":"Y no por tu cuerpo.","s":"ic:plug"},{"t":"Un pararrayos hace lo mismo.","s":"rayo"},{"t":"Por eso no me quites.","s":"rayo"},{"t":"Gracias, amiga patita.","s":"rayo"},{"t":"Dicho de otro modo:","s":"rayo"},{"t":"La tierra física da a la corriente un camino seguro cuando hay una falla.","s":"rayo"}]},{"id":"pilas","t":"Pilas y baterías","res":"Una pila convierte reacciones químicas en corriente eléctrica.","g":[{"t":"Pilas y baterías"},{"t":"Pones una pila nueva en un control.","s":"@pila=5"},{"t":"Hola, amiga pila. ¿Qué traes?","s":"@pila=5"},{"t":"Químicos, amigo, que al reaccionar empujan electrones.","s":"@pila=5"},{"t":"La batería de tu celular se recarga, porque esa reacción se regresa.","s":"ic:device-mobile"},{"tipo":"barra","b":"pila","o":"Usas la pila.","pasos":[[10,"Al inicio, casi llena."],[50,"Después de horas, a la mitad."],[100,"Al final, se acabó."]]},{"t":"Gracias, amiga pila.","s":"ic:device-mobile"},{"t":"Dicho de otro modo:","s":"ic:device-mobile"},{"t":"Una pila convierte energía química en eléctrica. Las recargables invierten la reacción.","s":"ic:device-mobile"}]},{"id":"capacitor","t":"Capacitores","res":"Un capacitor guarda carga y la suelta de golpe.","g":[{"t":"Capacitores"},{"t":"Tomas una foto con flash.","s":"@carga"},{"t":"Hola, amigo capacitor. ¿Fuiste tú?","s":"@carga"},{"t":"Sí, amigo. Me cargo unos segundos, y suelto todo de golpe.","s":"@carga"},{"t":"Un desfibrilador me usa, para ayudar a un corazón.","s":"ic:heartbeat"},{"t":"Gracias, amigo capacitor.","s":"ic:heartbeat"},{"t":"Dicho de otro modo:","s":"ic:heartbeat"},{"t":"Un capacitor guarda cargas separadas, y las libera muy rápido.","s":"ic:heartbeat"}]},{"id":"electroiman","t":"Electroimanes","res":"Una corriente en un cable enrollado se vuelve un imán.","g":[{"t":"Electroimanes"},{"t":"Ves una grúa levantando chatarra.","s":"@electroiman"},{"t":"Hola, amigo. ¿Cómo la agarras?","s":"@electroiman"},{"t":"Soy un cable enrollado con corriente, amigo. Me apagas, y la suelto.","s":"@electroiman"},{"t":"Una bocina me usa, para empujar su tela y hacer sonido.","s":"ic:speaker-high"},{"tipo":"barra","b":"electroiman","o":"Agregas vueltas de cable.","pasos":[[50,"Con pocas, un imán débil."],[200,"Con más, mucho más fuerte."],[500,"Con muchas, levanta cosas pesadas."]]},{"t":"Gracias, amigo.","s":"ic:speaker-high"},{"t":"Dicho de otro modo:","s":"ic:speaker-high"},{"t":"Una corriente crea magnetismo, y al enrollar el cable se hace un imán que se puede apagar.","s":"ic:speaker-high"}]},{"id":"transformador","t":"Transformadores","res":"Cambian el voltaje usando imanes y dos bobinas.","g":[{"t":"Transformadores"},{"t":"Ves un bote gris en lo alto de un poste.","s":"@transformador"},{"t":"Hola, amigo. ¿Qué haces ahí?","s":"@transformador"},{"t":"Bajo la luz de las torres, amigo, a lo que usas en casa.","s":"@transformador"},{"t":"En tu cargador hay otro, de 127 a unos cinco voltios.","s":"ic:device-mobile"},{"tipo":"barra","b":"transformador","o":"Cambias sus vueltas de cable.","pasos":[[0.05,"Con pocas, sale muy poco voltaje."],[1,"Iguales, sale lo mismo."],[2,"Con el doble, sale el doble."]]},{"t":"Gracias, amigo.","s":"ic:device-mobile"},{"t":"Dicho de otro modo:","s":"ic:device-mobile"},{"t":"Un transformador usa dos bobinas, y cambia el voltaje según sus vueltas de cable.","s":"ic:device-mobile"}]},{"id":"alterna","t":"Corriente alterna","res":"En tu casa, la corriente cambia de sentido 60 veces por segundo.","g":[{"t":"Corriente alterna"},{"t":"Prendes un foco, y lo ves fijo.","s":"@alterna"},{"t":"Hola, amiga corriente. ¿Vas siempre al mismo lado?","s":"@alterna"},{"t":"No, amigo. En tu casa voy y vengo, sesenta veces por segundo.","s":"@alterna"},{"t":"Una pila empuja siempre al mismo lado: esa es directa.","s":"ic:battery-full"},{"t":"Me usan porque viajo mejor por cables largos.","s":"ic:battery-full"},{"tipo":"barra","b":"alterna","o":"Cambias el ritmo de la corriente.","pasos":[[1,"Una vez por segundo, se ve parpadear."],[30,"Treinta, ya casi no."],[60,"Sesenta, como en tu casa."]]},{"t":"Gracias, amiga corriente.","s":"ic:battery-full"},{"t":"Dicho de otro modo:","s":"ic:battery-full"},{"t":"La corriente alterna cambia de sentido, 60 veces por segundo en México.","s":"ic:battery-full"}]},{"id":"generador","t":"Generadores","res":"Un generador convierte giro en electricidad, usando imanes.","g":[{"t":"Generadores"},{"t":"Pedaleas tu bici, y se prende una lucecita.","s":"@induccion"},{"t":"Hola, amigo dinamo. ¿Tú fuiste?","s":"@induccion"},{"t":"Sí, amigo. Giro imanes junto a un cable, y sale electricidad.","s":"@induccion"},{"t":"En una planta de vapor, igual, pero enorme.","s":"@maquina"},{"tipo":"barra","b":"induccion","o":"Mueves el imán, cada vez más rápido.","pasos":[[0,"Quieto, no hay nada."],[40,"Despacio, una lucecita."],[100,"Rápido, el foco brilla fuerte."]]},{"t":"Gracias, amigo dinamo.","s":"@maquina"},{"t":"Dicho de otro modo:","s":"@maquina"},{"t":"Un generador convierte movimiento en electricidad. Casi toda la luz del mundo sale así.","s":"@maquina"}]},{"id":"hidro","t":"Presas","res":"El agua de una presa cae, gira turbinas y produce electricidad.","g":[{"t":"Presas"},{"t":"Visitas una presa, llena de agua en alto.","s":"@rampa"},{"t":"Hola, amiga agua. ¿Qué traes?","s":"@rampa"},{"t":"Energía guardada, amigo. Cuando caigo, giro las turbinas.","s":"@rampa"},{"t":"Y las turbinas giran un generador.","s":"@induccion"},{"tipo":"barra","b":"rampa","o":"Un carrito baja de lo alto.","pasos":[[10,"Arriba, va lento."],[50,"A medio camino, más rápido."],[100,"Abajo, lo más rápido."]]},{"t":"Gracias, amiga agua.","s":"@induccion"},{"t":"Dicho de otro modo:","s":"@induccion"},{"t":"Una presa convierte la energía de altura del agua en electricidad.","s":"@induccion"}]},{"id":"eolica","t":"Energía eólica","res":"Un molino convierte viento en electricidad, y crece muchísimo con la velocidad.","g":[{"t":"Energía eólica"},{"t":"Vas por la carretera, y ves molinos enormes.","s":"@eolica"},{"t":"Hola, amigo viento. ¿Tú los mueves?","s":"@eolica"},{"t":"Sí, amigo. Y si voy al doble, doy ocho veces más energía.","s":"@eolica"},{"t":"Por eso los ponen altos, donde soy más fuerte.","s":"@eolica"},{"tipo":"barra","b":"eolica","o":"Sube el viento.","pasos":[[5,"Con poco, poca energía."],[10,"Al doble, ocho veces más."],[20,"Al doble otra vez, muchísimo."]]},{"t":"Gracias, amigo viento.","s":"@eolica"},{"t":"Dicho de otro modo:","s":"@eolica"},{"t":"La energía del viento crece con el cubo de su velocidad.","s":"@eolica"}]},{"id":"panel","t":"Paneles solares","res":"La luz saca electrones en un material especial, y eso es corriente.","g":[{"t":"Paneles solares"},{"t":"Ves un panel en un techo, al sol.","s":"@solar"},{"t":"Hola, amiga luz. ¿Qué le haces?","s":"@solar"},{"t":"Le saco electrones, amigo, y se juntan en un cable.","s":"@solar"},{"t":"Rindo más si le doy de frente.","s":"@solar"},{"t":"Una calculadora con celdita hace lo mismo.","s":"ic:calculator"},{"tipo":"barra","b":"solar","o":"Se mueve el Sol en el día.","pasos":[[20,"En la mañana, da de lado."],[90,"Al mediodía, de frente."],[160,"En la tarde, de lado otra vez."]]},{"t":"Gracias, amiga luz.","s":"ic:calculator"},{"t":"Dicho de otro modo:","s":"ic:calculator"},{"t":"Un panel solar convierte luz en corriente, por el efecto fotovoltaico.","s":"ic:calculator"}]},{"id":"led","t":"Focos LED","res":"Un LED brilla cuando los electrones caen a un nivel más bajo en un material especial.","g":[{"t":"Focos LED"},{"t":"Cambias un foco antiguo por uno LED.","s":"ic:lightbulb"},{"t":"Hola, amigo LED. ¿Por qué no te calientas tanto?","s":"ic:lightbulb"},{"t":"Mis electrones saltan, amigo, y sueltan luz directamente.","s":"ic:lightbulb"},{"t":"Tu televisión tiene millones de LED o algo muy parecido.","s":"@rgb"},{"t":"Gracias, amigo LED.","s":"@rgb"},{"t":"Dicho de otro modo:","s":"@rgb"},{"t":"Un LED emite luz cuando los electrones bajan de nivel, y por eso gasta mucho menos.","s":"@rgb"}]},{"id":"diodo","t":"Semiconductores","res":"Un semiconductor conduce a veces sí y a veces no, y por eso existe la electrónica.","g":[{"t":"Semiconductores"},{"t":"El cobre conduce muy bien, y el vidrio casi nada.","s":"el:Cu,Si"},{"t":"Hola, amigo silicio. ¿Y tú?","s":"el:Cu,Si"},{"t":"Yo estoy en medio, amigo. Me pueden ordenar cuándo dejar pasar.","s":"el:Cu,Si"},{"t":"Un diodo es como una puerta con un solo sentido.","s":"ic:door"},{"t":"Y en un transistor, una corriente chica controla otra grande.","s":"ic:cpu"},{"t":"Gracias, amigo silicio.","s":"ic:cpu"},{"t":"Dicho de otro modo:","s":"ic:cpu"},{"t":"Un semiconductor conduce según se le controle, y es la base de la electrónica.","s":"ic:cpu"}]},{"id":"microondas2","t":"Ondas 3: microondas","res":"Las microondas sacuden las moléculas de agua y calientan la comida.","g":[{"t":"Ondas 3: microondas"},{"t":"Metes una sopa al microondas.","s":"agita"},{"t":"Hola, amigas moléculas de agua. ¿Qué sienten?","s":"agita"},{"t":"Nos sacude la onda, amigo, y nos calentamos.","s":"agita"},{"t":"Un plato seco casi no se calienta.","s":"ic:fork-knife"},{"t":"Y la comida congelada tarda más, porque nos movemos menos.","s":"ic:snowflake"},{"t":"Gracias, amigas.","s":"ic:snowflake"},{"t":"Dicho de otro modo:","s":"ic:snowflake"},{"t":"Las microondas agitan las moléculas de agua, y esa agitación es calor.","s":"ic:snowflake"}]},{"id":"wifi","t":"Wifi y antenas","res":"El wifi manda ceros y unos en ondas de radio, a través del aire.","g":[{"t":"Wifi y antenas"},{"t":"Tu celular se conecta al módem.","s":"ic:wifi-high"},{"t":"Hola, amigo wifi. ¿Cómo viajas?","s":"ic:wifi-high"},{"t":"Prendo y apago ondas de radio, amigo, millones de veces.","s":"ic:wifi-high"},{"t":"Las paredes gruesas me debilitan.","s":"pared"},{"t":"Por eso me gusta un lugar abierto y alto.","s":"pared"},{"t":"Gracias, amigo wifi.","s":"pared"},{"t":"Dicho de otro modo:","s":"pared"},{"t":"El wifi transmite datos en ondas de radio, y las paredes absorben parte de la señal.","s":"pared"}]},{"id":"rayosx","t":"Rayos X","res":"Son luz de muchísima energía que atraviesa la piel, pero no tanto los huesos.","g":[{"t":"Rayos X"},{"t":"Te toman una radiografía del brazo.","s":"ic:bone"},{"t":"Hola, amigos rayos X. ¿Qué vieron?","s":"ic:bone"},{"t":"Pasamos por tu piel, amigo, pero en el hueso nos detenemos más.","s":"ic:bone"},{"t":"Por eso se ve su sombra.","s":"@sombra"},{"t":"En exceso hacemos daño, por eso nos usan poco.","s":"@sombra"},{"t":"Gracias, amigos.","s":"@sombra"},{"t":"Dicho de otro modo:","s":"@sombra"},{"t":"Los rayos X son ondas de mucha energía, descubiertas por Röntgen en 1895.","s":"@sombra"}]},{"id":"laser","t":"El láser","res":"Un láser es luz ordenada: un solo color y todas las ondas juntas.","g":[{"t":"El láser"},{"t":"Prendes un foco, y su luz sale para todos lados.","s":"ic:lightbulb"},{"t":"Prendes un puntero láser, y se ve lejísimos.","s":"ic:lightbulb"},{"t":"Hola, amigo láser. ¿Por qué tan derechito?","s":"ic:lightbulb"},{"t":"Soy de un solo color, amigo, y mis ondas van al paso.","s":"ic:lightbulb"},{"t":"En la caja del súper leo los códigos de barras.","s":"ic:shopping-cart"},{"t":"Pero nunca me apuntes a los ojos.","s":"ic:shopping-cart"},{"t":"Gracias, amigo láser.","s":"ic:shopping-cart"},{"t":"Dicho de otro modo:","s":"ic:shopping-cart"},{"t":"En un láser, la luz es de un color, en una dirección, y con sus ondas en fase.","s":"ic:shopping-cart"}]},{"id":"radio2","t":"Radio 2: AM y FM","res":"La música viaja en una onda que cambia de tamaño o de ritmo.","g":[{"t":"Radio 2: AM y FM"},{"t":"Prendes el radio del carro.","s":"onda"},{"t":"Hola, amiga onda. ¿Cómo traes la música?","s":"onda"},{"t":"Encima, amigo. En AM cambio de tamaño.","s":"onda"},{"t":"Y en FM cambio de ritmo.","s":"agudo"},{"t":"La FM suena más limpia, y la AM llega más lejos de noche.","s":"agudo"},{"t":"Gracias, amiga onda.","s":"agudo"},{"t":"Dicho de otro modo:","s":"agudo"},{"t":"La radio monta el sonido en una onda: AM cambia la amplitud y FM la frecuencia.","s":"agudo"}]},{"id":"neuronas","t":"Electricidad en tu cuerpo","res":"Tus nervios mandan señales eléctricas muy pequeñas.","g":[{"t":"Electricidad en tu cuerpo"},{"t":"Tocas algo caliente, y quitas la mano sin pensar.","s":"cuchara"},{"t":"Hola, amigos nervios. ¿Fueron ustedes?","s":"cuchara"},{"t":"Sí, amigo. Mandamos señales eléctricas pequeñísimas.","s":"cuchara"},{"t":"Tu corazón también late con una chispita.","s":"ic:heartbeat"},{"t":"Por eso la corriente fuerte es peligrosa: nos confunde.","s":"ic:heartbeat"},{"t":"Gracias, amigos.","s":"ic:heartbeat"},{"t":"Dicho de otro modo:","s":"ic:heartbeat"},{"t":"Los nervios y el corazón funcionan con señales eléctricas pequeñas.","s":"ic:heartbeat"}]},{"id":"autoel","t":"Carros eléctricos","res":"Un motor eléctrico aprovecha mucho más la energía y la recupera al frenar.","g":[{"t":"Carros eléctricos"},{"t":"Te subes a un carro eléctrico, y arranca rapidísimo.","s":"@motor"},{"t":"Hola, amigo motor. ¿Qué tienes?","s":"@motor"},{"t":"Aprovecho casi toda la energía, amigo.","s":"@motor"},{"t":"Y al frenar, me vuelvo generador, y recargo la batería.","s":"@induccion"},{"t":"Mi límite es cuánta energía cabe en ella.","s":"@pila"},{"t":"Gracias, amigo motor.","s":"@pila"},{"t":"Dicho de otro modo:","s":"@pila"},{"t":"Los motores eléctricos son muy eficientes, y recuperan energía al frenar.","s":"@pila"}]}],"mat":"f","et":"B1"},{"id":"B2","nom":"Ondas y termodinámica","lec":[{"id":"entropia","t":"Entropía","res":"Lo desordenado es mucho más probable que lo ordenado.","g":[{"t":"Entropía"},{"t":"Se te cae un vaso, y se rompe.","s":"vaso"},{"t":"Hola, amigo vaso. ¿Te vas a arreglar solo?","s":"vaso"},{"t":"No, amigo. Hay muchas formas de estar roto, y muy pocas de estar entero.","s":"vaso"},{"t":"Con tu cuarto pasa igual.","s":"ic:bed"},{"t":"Una gota de tinta en agua se reparte, y nunca se vuelve a juntar.","s":"agita"},{"tipo":"barra","b":"monedas","o":"Lanzas monedas, y quieres que caigan todas igual.","pasos":[[2,"Con dos, es fácil."],[10,"Con diez, es raro."],[40,"Con cuarenta, casi no pasaría nunca."]]},{"t":"Gracias, amigo vaso.","s":"agita"},{"t":"Dicho de otro modo:","s":"agita"},{"t":"La entropía mide el desorden. Lo desordenado no es imposible de revertir, solo muy improbable.","s":"agita"}]},{"id":"interferencia","t":"Interferencia","res":"Dos ondas pueden sumarse o borrarse.","g":[{"t":"Interferencia"},{"t":"Avientas dos piedras en un charco, y las olas se encuentran.","s":"@interfer"},{"t":"Hola, amigas olas. ¿Qué hacen?","s":"@interfer"},{"t":"Si coincidimos, crecemos, amigo. Si no, nos borramos.","s":"@interfer"},{"t":"Unos audífonos con cancelación de ruido mandan la onda contraria.","s":"ic:headphones"},{"t":"Por eso oyes silencio.","s":"ic:headphones"},{"tipo":"barra","b":"interfer","o":"Mueves una onda, respecto a la otra.","pasos":[[0,"Juntas, se suman."],[180,"Desfasadas, se borran."],[360,"Y otra vez se suman."]]},{"t":"Gracias, amigas.","s":"ic:headphones"},{"t":"Dicho de otro modo:","s":"ic:headphones"},{"t":"Dos ondas se suman si coinciden, y se cancelan si están opuestas: es la interferencia.","s":"ic:headphones"}]},{"id":"lentes","t":"Lentes","res":"Una lente dobla la luz, y puede hacer las cosas más grandes o más chicas.","g":[{"t":"Lentes"},{"t":"Miras una hormiga con una lupa.","s":"@lente"},{"t":"Hola, amiga lupa. ¿Cómo la haces grande?","s":"@lente"},{"t":"Doblo la luz, amigo, con mi vidrio curvo.","s":"@lente"},{"t":"Tu ojo también tiene una lente adentro.","s":"ic:eye"},{"tipo":"barra","b":"lente","o":"Acercas un objeto a la lente.","pasos":[[15,"Lejos, la imagen es chica."],[50,"Más cerca, crece mucho."],[100,"Muy cerca, se ve grande y al derecho."]]},{"t":"Gracias, amiga lupa.","s":"ic:eye"},{"t":"Dicho de otro modo:","s":"ic:eye"},{"t":"Una lente desvía la luz, y puede formar imágenes más grandes o más chicas.","s":"ic:eye"}]},{"id":"doppler","t":"Efecto Doppler","res":"Un sonido que se acerca suena más agudo, y al alejarse, más grave.","g":[{"t":"Efecto Doppler"},{"t":"Pasa una ambulancia: al acercarse suena aguda, y al alejarse, grave.","s":"@doppler"},{"t":"Hola, amiga sirena. ¿Cambiaste tu nota?","s":"@doppler"},{"t":"No, amigo. Mis ondas se aprietan adelante, y se estiran atrás.","s":"@doppler"},{"t":"Con la luz pasa igual, y por eso sabemos que las galaxias se alejan.","s":"ic:sparkle"},{"tipo":"barra","b":"doppler","o":"Una sirena va cada vez más rápido.","pasos":[[0.1,"Despacio, casi no cambia."],[0.45,"Más rápido, suena más aguda adelante."],[0.85,"Muy rápido, las ondas se aprietan muchísimo."]]},{"t":"Gracias, amiga sirena.","s":"ic:sparkle"},{"t":"Dicho de otro modo:","s":"ic:sparkle"},{"t":"En el efecto Doppler, el movimiento de la fuente cambia la frecuencia que recibes.","s":"ic:sparkle"}]},{"id":"resonancia","t":"Resonancia","res":"Empujar al ritmo natural de algo lo hace moverse cada vez más.","g":[{"t":"Resonancia"},{"t":"Empujas a alguien en un columpio, justo en el momento correcto.","s":"@resonancia"},{"t":"Hola, amigo columpio. ¿Por qué subes tanto?","s":"@resonancia"},{"t":"Porque me empujas a mi ritmo, amigo.","s":"@resonancia"},{"t":"Una copa puede romperse con la nota justa.","s":"ic:wine"},{"t":"Y la caja de una guitarra hace grande el sonido.","s":"cuerda"},{"tipo":"barra","b":"resonancia","o":"Empujas a distintos ritmos.","pasos":[[0.4,"Muy lento, casi no se mueve."],[1,"Justo a su ritmo, se mueve muchísimo."],[2,"Muy rápido, casi nada otra vez."]]},{"t":"Gracias, amigo columpio.","s":"cuerda"},{"t":"Dicho de otro modo:","s":"cuerda"},{"t":"Todo tiene una frecuencia natural. Empujar a esa frecuencia hace crecer el movimiento: es resonancia.","s":"cuerda"}]},{"id":"maquinas","t":"Máquinas de calor","res":"Un motor convierte calor en movimiento, pero nunca todo.","g":[{"t":"Máquinas de calor"},{"t":"Hierves agua, y el vapor empuja la tapa.","s":"@maquina"},{"t":"Hola, amigo vapor. ¿Qué haces?","s":"@maquina"},{"t":"Convierto calor en movimiento, amigo.","s":"@maquina"},{"t":"Así iban las locomotoras antiguas.","s":"ic:train"},{"t":"Y en tu carro, explosiones chiquitas empujan pistones.","s":"ic:car"},{"t":"Pero siempre se pierde calor.","s":"ic:car"},{"tipo":"barra","b":"maquina","o":"Calientas más el motor.","pasos":[[150,"Con poco calor, aprovecha poco."],[500,"Más caliente, mejor."],[1000,"Muy caliente, mejor todavía, sin llegar al cien."]]},{"t":"Gracias, amigo vapor.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"Una máquina térmica convierte calor en trabajo, y nunca aprovecha el cien por ciento.","s":"ic:car"}]},{"id":"entropia2","t":"Entropía 2: el calor no regresa","res":"El calor pasa solo de lo caliente a lo frío, y nunca al revés.","g":[{"t":"Entropía 2: el calor no regresa"},{"t":"Dejas un café en la mesa, y se enfría.","s":"ic:coffee"},{"t":"Hola, amigo café. ¿Te vas a calentar solo?","s":"ic:coffee"},{"t":"Nunca, amigo. El calor pasa de mí al cuarto, y no regresa.","s":"ic:coffee"},{"t":"Un refri sí saca calor, pero gastando electricidad.","s":"ic:snowflake"},{"t":"Por eso el tiempo parece ir en un solo sentido.","s":"reloj"},{"t":"Gracias, amigo café.","s":"reloj"},{"t":"Dicho de otro modo:","s":"reloj"},{"t":"El calor fluye solo de lo caliente a lo frío, y eso marca una dirección del tiempo.","s":"reloj"}]},{"id":"invernadero","t":"Efecto invernadero","res":"Ciertos gases dejan entrar la luz del Sol, y atrapan parte del calor que sale.","g":[{"t":"Efecto invernadero"},{"t":"Dejas el carro al Sol, con las ventanas cerradas.","s":"ic:car"},{"t":"Y adentro se pone muy caliente.","s":"ic:car"},{"t":"Hola, amigos gases. ¿Ustedes hacen eso con la Tierra?","s":"cobija"},{"t":"Algo parecido, amigo. Dejamos entrar la luz, y guardamos parte del calor.","s":"cobija"},{"t":"La Luna no nos tiene, y sus noches son heladas.","s":"ic:moon"},{"t":"Gracias, amigos.","s":"ic:moon"},{"t":"Dicho de otro modo:","s":"ic:moon"},{"t":"Ciertos gases retienen calor. Sin ellos la Tierra sería helada, y con más de ellos se calienta.","s":"ic:moon"}]},{"id":"arcoiris","t":"El arcoíris","res":"Las gotas de agua separan los colores de la luz del Sol.","g":[{"t":"El arcoíris"},{"t":"Riegas con manguera en la mañana, con el Sol atrás de ti.","s":"mezcla"},{"t":"Y sale un arcoíris chiquito.","s":"mezcla"},{"t":"Hola, amigas gotas. ¿Ustedes lo hacen?","s":"mezcla"},{"t":"Sí, amigo. Cada color se dobla distinto en nosotras, y rebota de regreso.","s":"mezcla"},{"tipo":"barra","b":"luz","o":"Pasas por todos los colores de la luz.","pasos":[[360,"Aquí es ultravioleta, y no lo ves."],[470,"Ahora azul."],[530,"Verde."],[650,"Rojo."],[780,"Y aquí ya es infrarroja."]]},{"t":"Gracias, amigas.","s":"mezcla"},{"t":"Dicho de otro modo:","s":"mezcla"},{"t":"Las gotas refractan y reflejan la luz, separando sus colores. En realidad es un círculo.","s":"mezcla"}]},{"id":"atmosfera","t":"La presión del aire","res":"El aire pesa, y empuja todo lo que tiene alrededor.","g":[{"t":"La presión del aire"},{"t":"Tomas un refresco con popote.","s":"ic:beer-bottle"},{"t":"Hola, amigo aire. ¿Tú me ayudas?","s":"ic:beer-bottle"},{"t":"Sí, amigo. Quitas aire de adentro, y yo empujo el refresco hacia arriba.","s":"ic:beer-bottle"},{"t":"En un avión se te tapan los oídos, porque cambia mi presión.","s":"ic:airplane"},{"t":"Por eso en Chihuahua el agua hierve a menos de 100 grados.","s":"olla"},{"t":"Gracias, amigo aire.","s":"olla"},{"t":"Dicho de otro modo:","s":"olla"},{"t":"El peso del aire crea la presión atmosférica, que baja al subir.","s":"olla"}]},{"id":"olas2","t":"Interferencia 2: sumar y borrar","res":"Con ondas iguales al revés se puede borrar un sonido.","g":[{"t":"Interferencia 2: sumar y borrar"},{"t":"Te pones audífonos con cancelación, en un avión.","s":"@interfer"},{"t":"Hola, amigos audífonos. ¿Cómo le hacen?","s":"@interfer"},{"t":"Escuchamos el avión, amigo, y mandamos la onda al revés.","s":"@interfer"},{"t":"Los colores de una burbuja salen de lo mismo.","s":"ic:drop"},{"tipo":"barra","b":"interfer","o":"Mueves una onda, respecto a la otra.","pasos":[[0,"Juntas, se suman."],[180,"Desfasadas, se borran."],[360,"Y otra vez se suman."]]},{"t":"Gracias, amigos.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"Una onda con la forma opuesta cancela a otra: cresta contra valle.","s":"ic:drop"}]},{"id":"termo1","t":"La ley cero: lo que se iguala","res":"Dos cosas en contacto acaban a la misma temperatura.","g":[{"t":"La ley cero: lo que se iguala"},{"t":"Dejas un refresco frío sobre la mesa.","s":"ic:beer-bottle"},{"t":"Hola, amigo refresco. ¿Te calientas?","s":"ic:beer-bottle"},{"t":"Sí, amigo. Hasta quedar igual que el cuarto.","s":"ic:beer-bottle"},{"t":"Un termómetro hace lo mismo, por eso tarda un rato en medir.","s":"ic:thermometer"},{"t":"Gracias, amigo refresco.","s":"ic:thermometer"},{"t":"Dicho de otro modo:","s":"ic:thermometer"},{"t":"Dos cuerpos en contacto llegan al equilibrio térmico: la misma temperatura.","s":"ic:thermometer"}]},{"id":"termo2","t":"Termodinámica 2: la energía total","res":"El calor y el trabajo son dos formas de pasar energía.","g":[{"t":"Termodinámica 2: la energía total"},{"t":"Inflas una llanta con bomba, y la bomba se calienta.","s":"@jeringa"},{"t":"Hola, amigo aire. ¿Por qué te calentaste?","s":"@jeringa"},{"t":"Porque me apretaste, amigo, y me diste energía.","s":"@jeringa"},{"t":"Un aerosol se enfría al usarlo, porque el gas gasta su energía al salir.","s":"ic:drop"},{"tipo":"barra","b":"jeringa","o":"Aprietas una jeringa tapada.","pasos":[[10,"Al inicio, fácil."],[50,"A la mitad, el doble de presión."],[100,"Muy apretada, mucho más."]]},{"t":"Gracias, amigo aire.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"Energía se puede pasar con calor o con trabajo: es la primera ley de la termodinámica.","s":"ic:drop"}]},{"id":"gases","t":"Gases y presión","res":"Si aprietas un gas o lo calientas, su presión sube.","g":[{"t":"Gases y presión"},{"t":"Te asomas dentro de una llanta.","s":"agita"},{"t":"Hola, amigas partículas. ¿Qué hacen?","s":"agita"},{"t":"Golpeamos las paredes, amigo, y eso es la presión.","s":"agita"},{"t":"Con menos espacio, más golpes.","s":"@jeringa"},{"t":"Con más calor, golpes más fuertes.","s":"ic:sun"},{"tipo":"barra","b":"jeringa","o":"Aprietas una jeringa tapada.","pasos":[[10,"Al inicio, fácil."],[50,"A la mitad, el doble de presión."],[100,"Muy apretada, mucho más."]]},{"t":"Gracias, amigas.","s":"ic:sun"},{"t":"Dicho de otro modo:","s":"ic:sun"},{"t":"La presión de un gas sube al reducir su volumen o al aumentar su temperatura.","s":"ic:sun"}]},{"id":"olla2","t":"La olla exprés","res":"Con más presión, el agua hierve a más temperatura y la comida se cuece antes.","g":[{"t":"La olla exprés"},{"t":"Pones unos frijoles en la olla exprés.","s":"@ollapresion"},{"t":"Hola, amiga olla. ¿Por qué cocinas tan rápido?","s":"@ollapresion"},{"t":"No dejo salir el vapor, amigo, y el agua aguanta más calor.","s":"@ollapresion"},{"t":"En lo alto de una montaña pasa al revés, y cocina más lento.","s":"ic:mountains"},{"tipo":"barra","b":"ollapresion","o":"Sube la presión en la olla.","pasos":[[1,"Sin presión, hierve a cien."],[1.5,"Con más, a más temperatura."],[2,"Al doble, mucho más caliente."]]},{"t":"Gracias, amiga olla.","s":"ic:mountains"},{"t":"Dicho de otro modo:","s":"ic:mountains"},{"t":"A mayor presión, mayor punto de ebullición, y la comida se cuece antes.","s":"ic:mountains"}]},{"id":"nubes","t":"Nubes y lluvia","res":"El vapor sube, se enfría y se vuelve gotitas.","g":[{"t":"Nubes y lluvia"},{"t":"Sales en un día frío, y sale una nubecita de tu aliento.","s":"ic:cloud"},{"t":"Hola, amiga nube. ¿De qué estás hecha?","s":"ic:cloud"},{"t":"De millones de gotitas, amigo. Subí como vapor, y arriba me enfrié.","s":"ic:cloud"},{"t":"Cuando pesamos mucho, llovemos.","s":"ic:cloud-rain"},{"t":"Gracias, amiga nube.","s":"ic:cloud-rain"},{"t":"Dicho de otro modo:","s":"ic:cloud-rain"},{"t":"El vapor sube, se condensa al enfriarse, y las gotas caen como lluvia.","s":"ic:cloud-rain"}]},{"id":"clima","t":"Clima y corrientes","res":"Las diferencias de calor mueven el aire y el mar por todo el planeta.","g":[{"t":"Clima y corrientes"},{"t":"Miras el planeta desde lejos.","s":"@estaciones"},{"t":"Hola, amiga Tierra. ¿Por qué te mueves tanto por dentro?","s":"@estaciones"},{"t":"Recibo más Sol en el ecuador, amigo, y ese calor viaja a los polos.","s":"@estaciones"},{"t":"Así se forman mis vientos y corrientes.","s":"@viento"},{"t":"Y los huracanes salen del agua de mar caliente.","s":"ic:hurricane"},{"t":"Gracias, amiga Tierra.","s":"ic:hurricane"},{"t":"Dicho de otro modo:","s":"ic:hurricane"},{"t":"El calor desigual del Sol mueve el aire y el mar, y el giro de la Tierra los desvía.","s":"ic:hurricane"}]},{"id":"estacionaria","t":"Ondas estacionarias","res":"Una cuerda vibra solo en ciertas formas, y eso da sus notas.","g":[{"t":"Ondas estacionarias"},{"t":"Agitas una cuerda, amarrada de los dos lados.","s":"@armonico"},{"t":"Hola, amiga cuerda. ¿Solo vibras así?","s":"@armonico"},{"t":"Sí, amigo: en ciertas formas, y cada una da una nota.","s":"@armonico"},{"t":"Soplas en una botella, y el aire hace lo mismo.","s":"ic:beer-bottle"},{"tipo":"barra","b":"armonico","o":"Cambias la forma de vibrar.","pasos":[[1,"Entera, la nota más grave."],[2,"En dos partes, más aguda."],[4,"En cuatro, más todavía."]]},{"t":"Gracias, amiga cuerda.","s":"ic:beer-bottle"},{"t":"Dicho de otro modo:","s":"ic:beer-bottle"},{"t":"Una cuerda fija forma ondas estacionarias, y cada forma es un armónico.","s":"ic:beer-bottle"}]},{"id":"tubos","t":"Flautas y tubos","res":"Un tubo más largo da una nota más grave.","g":[{"t":"Flautas y tubos"},{"t":"Soplas una flauta.","s":"@armonico"},{"t":"Hola, amigo aire. ¿Tú suenas?","s":"@armonico"},{"t":"Sí, amigo. Vibro adentro: en tubo largo, grave, y en tubo corto, agudo.","s":"@armonico"},{"t":"Una botella con más aire suena más grave.","s":"oido"},{"t":"Tu garganta también lo hace al cantar.","s":"cuerda"},{"t":"Gracias, amigo aire.","s":"cuerda"},{"t":"Dicho de otro modo:","s":"cuerda"},{"t":"En un tubo vibra el aire, y un tubo más largo produce notas más graves.","s":"cuerda"}]},{"id":"resonancia2","t":"Resonancia 2: el puente","res":"A veces un puente o un edificio entra en resonancia.","g":[{"t":"Resonancia 2: el puente"},{"t":"Un puente famoso en Tacoma se mueve con el viento.","s":"@resonancia"},{"t":"Hola, amigo puente. ¿Qué te pasa?","s":"@resonancia"},{"t":"Empecé a ondular, amigo, hasta caerme.","s":"@resonancia"},{"t":"Con los sismos, ciertos edificios vibran más.","s":"ic:buildings"},{"t":"Por eso los diseñan para no empatar con ese ritmo.","s":"ic:buildings"},{"tipo":"barra","b":"resonancia","o":"Empujas a distintos ritmos.","pasos":[[0.4,"Muy lento, casi no se mueve."],[1,"Justo a su ritmo, se mueve muchísimo."],[2,"Muy rápido, casi nada otra vez."]]},{"t":"Gracias, amigo puente.","s":"ic:buildings"},{"t":"Dicho de otro modo:","s":"ic:buildings"},{"t":"Las estructuras tienen frecuencias naturales, y se diseñan para evitar oscilaciones peligrosas.","s":"ic:buildings"}]},{"id":"polariza","t":"Lentes polarizados","res":"Un filtro deja pasar la luz que vibra en una sola dirección.","g":[{"t":"Lentes polarizados"},{"t":"Te pones lentes polarizados frente a un charco.","s":"ic:sunglasses"},{"t":"Hola, amigos lentes. ¿Y el brillo?","s":"ic:sunglasses"},{"t":"Lo quitamos, amigo. Solo dejamos pasar luz que vibra en un sentido.","s":"ic:sunglasses"},{"t":"La luz rebotada vibra casi toda de un lado.","s":"@espejo"},{"t":"Gracias, amigos.","s":"@espejo"},{"t":"Dicho de otro modo:","s":"@espejo"},{"t":"Un polarizador solo deja pasar la luz que vibra en cierta dirección.","s":"@espejo"}]},{"id":"fibra","t":"Fibra óptica","res":"La luz rebota dentro de un hilo de vidrio sin salirse.","g":[{"t":"Fibra óptica"},{"t":"Entra tu internet por un hilo de vidrio.","s":"@fibra"},{"t":"Hola, amiga luz. ¿No te sales?","s":"@fibra"},{"t":"No, amigo. Rebotó por dentro todo el camino.","s":"@fibra"},{"t":"En un hospital, también dejo ver dentro del cuerpo.","s":"ic:heartbeat"},{"tipo":"barra","b":"fibra","o":"Cambias el ángulo de la luz.","pasos":[[20,"Con poco ángulo, se sale."],[45,"Desde aquí, ya rebota adentro."],[75,"Muy inclinada, sigue adentro."]]},{"t":"Gracias, amiga luz.","s":"ic:heartbeat"},{"t":"Dicho de otro modo:","s":"ic:heartbeat"},{"t":"En la reflexión total, la luz no sale del vidrio, y lleva datos en pulsos.","s":"ic:heartbeat"}]},{"id":"espejismo","t":"Espejismos","res":"El aire caliente dobla la luz y hace parecer que hay agua.","g":[{"t":"Espejismos"},{"t":"Vas por la carretera, y parece que hay agua adelante.","s":"ic:car"},{"t":"Hola, amigo aire caliente. ¿Hay agua?","s":"ic:car"},{"t":"No, amigo. Es cielo: yo doblé su luz hacia ti.","s":"ic:car"},{"t":"Las estrellas titilan por algo parecido.","s":"ic:star"},{"t":"Gracias, amigo aire.","s":"ic:star"},{"t":"Dicho de otro modo:","s":"ic:star"},{"t":"Un espejismo se debe a que el aire caliente desvía la luz.","s":"ic:star"}]},{"id":"telescopio","t":"Telescopios","res":"Junta mucha luz y la concentra, para ver lo que está lejos.","g":[{"t":"Telescopios"},{"t":"Apuntas un telescopio a Júpiter, como hizo Galileo.","s":"@lente"},{"t":"Hola, amigo telescopio. ¿Cómo ves tan lejos?","s":"@lente"},{"t":"Junto mucha luz, amigo. Más grande, más junto.","s":"@lente"},{"t":"El Webb tiene un espejo de unos seis metros.","s":"ic:planet"},{"t":"Y mirar lejos es mirar al pasado.","s":"pasado"},{"t":"Gracias, amigo telescopio.","s":"pasado"},{"t":"Dicho de otro modo:","s":"pasado"},{"t":"Un telescopio concentra luz con lentes o espejos, y muestra objetos lejanos y antiguos.","s":"pasado"}]},{"id":"microscopio","t":"Microscopios","res":"Dos lentes aumentan muchísimo lo pequeño.","g":[{"t":"Microscopios"},{"t":"Pones una gota de agua en un microscopio.","s":"ic:drop"},{"t":"Hola, amigos seres diminutos. ¿Vivían ahí?","s":"ic:drop"},{"t":"Sí, amigo. Siempre.","s":"ic:drop"},{"t":"Para ver un virus hacen falta electrones, porque es más chico que la onda de luz.","s":"@escala=1"},{"t":"Gracias, amigos.","s":"@escala=1"},{"t":"Dicho de otro modo:","s":"@escala=1"},{"t":"Un microscopio aumenta con varias lentes, y su límite depende del tamaño de la onda de luz.","s":"@escala=1"}]},{"id":"ojo","t":"Tu ojo","res":"El ojo enfoca la luz en el fondo, y unos lentes corrigen si no llega bien.","g":[{"t":"Tu ojo"},{"t":"Miras algo lejano, y se ve borroso.","s":"@lente"},{"t":"Hola, amigo ojo. ¿Qué pasa?","s":"@lente"},{"t":"Enfoco antes de tiempo, amigo. Eso es la miopía.","s":"@lente"},{"t":"Unos lentes doblan la luz antes de entrar.","s":"@lente"},{"t":"Y la imagen me llega de cabeza: tu cerebro la voltea.","s":"@lente"},{"tipo":"barra","b":"lente","o":"Acercas un objeto a la lente.","pasos":[[15,"Lejos, la imagen es chica."],[50,"Más cerca, crece mucho."],[100,"Muy cerca, se ve grande y al derecho."]]},{"t":"Gracias, amigo ojo.","s":"@lente"},{"t":"Dicho de otro modo:","s":"@lente"},{"t":"La córnea y el cristalino enfocan la luz en la retina, y los lentes corrigen los errores.","s":"@lente"}]},{"id":"color","t":"Mezclar luz","res":"La pantalla mezcla rojo, verde y azul para formar todos los colores.","g":[{"t":"Mezclar luz"},{"t":"Te asomas muy de cerca a una pantalla.","s":"@rgb"},{"t":"Hola, amigos puntitos. ¿De qué color son?","s":"@rgb"},{"t":"Solo rojo, verde y azul, amigo.","s":"@rgb"},{"t":"Rojo y verde juntos se ven amarillo. Los tres, blanco.","s":"@rgb=100"},{"t":"Con pintura es al revés: se va oscureciendo.","s":"ic:paint-brush"},{"tipo":"barra","b":"rgb","o":"Mezclas rojo con verde.","pasos":[[0,"Puro rojo."],[40,"Con verde, naranja."],[100,"Con todo el verde, amarillo."]]},{"t":"Gracias, amigos.","s":"ic:paint-brush"},{"t":"Dicho de otro modo:","s":"ic:paint-brush"},{"t":"Tu ojo tiene sensores para tres colores, y las pantallas mezclan esos tres.","s":"ic:paint-brush"}]},{"id":"colorcalor","t":"El color del calor","res":"Mientras más caliente está algo, su luz va de rojo a azul.","g":[{"t":"El color del calor"},{"t":"Ves un metal al rojo vivo, en una herrería.","s":"@colorT=15"},{"t":"Hola, amigo metal. ¿Qué pasa si te calientan más?","s":"@colorT=15"},{"t":"Me pongo amarillo, y luego blanco azulado.","s":"@colorT=50"},{"t":"Con las estrellas igual: las rojas son más frías que las azules.","s":"ic:star"},{"t":"Tu cuerpo da luz infrarroja, que ven las cámaras térmicas.","s":"ic:thermometer"},{"tipo":"barra","b":"colorT","o":"Calientas algo cada vez más.","pasos":[[15,"Primero, rojo."],[50,"Luego, amarillento."],[100,"Muy caliente, azulado."]]},{"t":"Gracias, amigo metal.","s":"ic:thermometer"},{"t":"Dicho de otro modo:","s":"ic:thermometer"},{"t":"Lo caliente emite luz, y su color depende de la temperatura.","s":"ic:thermometer"}]},{"id":"ceroabs","t":"El cero absoluto","res":"Hay un frío máximo: las partículas casi dejan de moverse.","g":[{"t":"El cero absoluto"},{"t":"Vas enfriando algo, más y más.","s":"agita"},{"t":"Hola, amigas partículas. ¿Hasta dónde bajan?","s":"agita"},{"t":"Hasta unos −273 grados, amigo. De ahí no se puede.","s":"agita"},{"t":"El espacio ronda los −270.","s":"ic:planet"},{"t":"Y cerca de ese límite, algunos materiales se vuelven muy raros.","s":"ic:planet"},{"t":"Gracias, amigas.","s":"ic:planet"},{"t":"Dicho de otro modo:","s":"ic:planet"},{"t":"El cero absoluto, unos −273 grados, es la temperatura más baja posible.","s":"ic:planet"}]},{"id":"tension","t":"Tensión superficial","res":"Las moléculas del agua se jalan entre sí y forman una especie de piel.","g":[{"t":"Tensión superficial"},{"t":"Ves un insecto caminando sobre el agua.","s":"ic:bug"},{"t":"Hola, amigo. ¿No te hundes?","s":"ic:bug"},{"t":"No, amigo. El agua se jala a sí misma, y forma una piel.","s":"ic:bug"},{"t":"Por eso una aguja bien puesta puede flotar.","s":"@flota"},{"t":"Y el jabón rompe esa piel.","s":"ic:hand-soap"},{"t":"Gracias, amigo.","s":"ic:hand-soap"},{"t":"Dicho de otro modo:","s":"ic:hand-soap"},{"t":"Las moléculas de agua se atraen, y en la superficie crean tensión superficial.","s":"ic:hand-soap"}]},{"id":"viscosidad","t":"Lo espeso","res":"Algunos líquidos fluyen lento porque sus moléculas rozan entre sí.","g":[{"t":"Lo espeso"},{"t":"Viertes miel y agua en dos cucharas.","s":"@viscoso=90"},{"t":"Hola, amiga miel. ¿Por qué tan lenta?","s":"@viscoso=90"},{"t":"Mis moléculas se rozan mucho, amigo. Caliente corro más.","s":"@viscoso=90"},{"t":"El aceite de motor, si es muy espeso, batalla al arrancar en frío.","s":"ic:car"},{"tipo":"barra","b":"viscoso","o":"Pruebas líquidos más espesos.","pasos":[[10,"El agua corre rápido."],[40,"El aceite, más lento."],[90,"La miel, muy despacio."]]},{"t":"Gracias, amiga miel.","s":"ic:car"},{"t":"Dicho de otro modo:","s":"ic:car"},{"t":"La viscosidad es la fricción interna de un líquido, y baja al calentarlo.","s":"ic:car"}]},{"id":"entropia3","t":"Entropía 3: el universo","res":"El desorden total del universo siempre crece.","g":[{"t":"Entropía 3: el universo"},{"t":"Comes, y creces, cada vez más ordenado.","s":"ic:bread"},{"t":"Hola, amiga entropía. ¿Yo te rompo la regla?","s":"ic:bread"},{"t":"No, amigo. Tú sueltas calor y desorden alrededor.","s":"ic:bread"},{"t":"Las plantas usan la luz del Sol, y yo crezco en otro lado.","s":"radia"},{"t":"Gracias, amiga entropía.","s":"radia"},{"t":"Dicho de otro modo:","s":"radia"},{"t":"El orden de un lugar se paga con más desorden en otro: la entropía total del universo crece.","s":"radia"}]},{"id":"refri","t":"El refri","res":"Un refri saca calor de adentro y lo tira por detrás, gastando energía.","g":[{"t":"El refri"},{"t":"Tocas la parte de atrás de tu refri, y está caliente.","s":"@jeringa"},{"t":"Hola, amigo refri. ¿Por qué?","s":"@jeringa"},{"t":"Saco el calor de adentro, amigo, y te lo tiro por detrás.","s":"@jeringa"},{"t":"Aprieto y suelto un gas para lograrlo.","s":"@jeringa"},{"t":"Por eso, dejar mi puerta abierta no enfría tu cuarto.","s":"@jeringa"},{"t":"Gracias, amigo refri.","s":"@jeringa"},{"t":"Dicho de otro modo:","s":"@jeringa"},{"t":"Un refrigerador pasa calor de lo frío a lo caliente, gastando energía.","s":"@jeringa"}]}],"mat":"f","et":"B2"},{"id":"C1","nom":"Relatividad y el átomo","lec":[{"id":"relatividad","t":"El tiempo se estira","res":"Mientras más rápido te mueves, más lento pasa tu tiempo.","g":[{"t":"El tiempo se estira"},{"t":"Tienes un hermano gemelo, y se va en una nave rapidísima.","s":"reloj"},{"t":"Años después, regresa más joven que tú.","s":"reloj"},{"t":"Hola, amigo reloj. ¿Cómo pasó?","s":"reloj"},{"t":"Para quien va muy rápido, amigo, yo avanzo más lento.","s":"reloj"},{"t":"Los satélites del GPS tienen que corregir esto.","s":"@orbita"},{"tipo":"barra","b":"gamma","o":"Tu nave va cada vez más rápido.","pasos":[[20,"Al principio, casi nada."],[60,"Más rápido, tu reloj se atrasa."],[100,"Casi a la luz, muchísimo."]]},{"t":"Gracias, amigo reloj.","s":"@orbita"},{"t":"Dicho de otro modo:","s":"@orbita"},{"t":"Como la luz va igual de rápido para todos, el tiempo se estira con la velocidad.","s":"@orbita"}]},{"id":"emc","t":"E = mc²","res":"Un poquito de masa guarda muchísima energía.","g":[{"t":"E = mc²"},{"t":"Te encuentras a la fórmula más famosa de Einstein.","s":"@emc"},{"t":"Hola, amiga fórmula. ¿Qué dices?","s":"@emc"},{"t":"Que masa y energía son lo mismo, amigo.","s":"@emc"},{"t":"Y como la luz es rapidísima, un poquito de masa guarda muchísima energía.","s":"@emc"},{"t":"El Sol convierte millones de toneladas de masa en luz cada segundo.","s":"ic:sun"},{"tipo":"barra","b":"emc","o":"Conviertes masa en energía.","pasos":[[20,"Con muy poquita, ya da mucha luz."],[50,"Con un gramo, muchos hogares."],[100,"Con un kilo, una ciudad grande."]]},{"t":"Gracias, amiga fórmula.","s":"ic:sun"},{"t":"Dicho de otro modo:","s":"ic:sun"},{"t":"E es igual a m por c al cuadrado: la energía equivale a la masa por la velocidad de la luz al cuadrado.","s":"ic:sun"}]},{"id":"atomo","t":"El átomo","res":"Un átomo tiene un centro chiquito con electrones alrededor.","g":[{"t":"El átomo"},{"t":"Regresas al estadio, con tu grano de arroz en el centro.","s":"p:estadio;e .85 .22 feliz .11;e .15 .3 feliz .11;e .7 .88 feliz .11"},{"t":"Hola, amigo núcleo. ¿Tú eres el centro?","s":"p:estadio;e .85 .22 feliz .11;e .15 .3 feliz .11;e .7 .88 feliz .11"},{"t":"Sí, amigo. Y mis electrones andan allá arriba.","s":"p:estadio;e .85 .22 feliz .11;e .15 .3 feliz .11;e .7 .88 feliz .11"},{"t":"El carbono y el oro son distintos solo por cuántos protones tienen.","s":"@atomo"},{"tipo":"barra","b":"atomo","o":"Vas agregando protones.","pasos":[[0,"Con uno, hidrógeno."],[1,"Con dos, helio."],[5,"Con seis, carbono."],[9,"Con diez, neón."]]},{"t":"Gracias, amigo núcleo.","s":"@atomo"},{"t":"Dicho de otro modo:","s":"@atomo"},{"t":"Un átomo tiene un núcleo pequeñísimo, con electrones alrededor. Los protones definen el elemento.","s":"@atomo"}]},{"id":"fotones","t":"Fotones","res":"La luz viene en paquetitos de energía, y el color decide cuánta trae cada uno.","g":[{"t":"Fotones"},{"t":"Te da el Sol en la playa, y te quema.","s":"@foton=90"},{"t":"Hola, amigo fotón. ¿Fuiste tú?","s":"@foton=90"},{"t":"Sí, amigo: el ultravioleta, que trae mucha energía.","s":"@foton=90"},{"t":"La luz roja de un foco no te quema, por más tiempo que estés.","s":"ic:lightbulb"},{"t":"Y un panel solar me usa para sacar electrones.","s":"ic:lightbulb"},{"tipo":"barra","b":"foton","o":"Cambias el color de la luz, sobre un metal.","pasos":[[15,"Luz roja: no salen electrones."],[60,"Más hacia el azul, ya alcanza."],[100,"Con violeta, salen con más fuerza."]]},{"t":"Gracias, amigo fotón.","s":"ic:lightbulb"},{"t":"Dicho de otro modo:","s":"ic:lightbulb"},{"t":"La luz viene en fotones, y cada color trae una energía distinta.","s":"ic:lightbulb"}]},{"id":"radiactividad","t":"Radiactividad","res":"Algunos átomos se deshacen solos, a un ritmo que se puede medir.","g":[{"t":"Radiactividad"},{"t":"Haces palomitas en el micro, y no sabes cuál va a tronar.","s":"@semivida"},{"t":"Hola, amigos átomos inestables. ¿Ustedes también?","s":"@semivida"},{"t":"Sí, amigo. No sabemos cuándo, pero sí cuántos, más o menos.","s":"@semivida"},{"t":"Con eso se calcula la edad de un hueso.","s":"ic:bone"},{"tipo":"barra","b":"semivida","o":"Pasa el tiempo.","pasos":[[1,"Pasa una semivida, y queda la mitad."],[2,"Otra, y queda la cuarta parte."],[4,"Otras dos, y queda muy poquito."]]},{"t":"Gracias, amigos.","s":"ic:bone"},{"t":"Dicho de otro modo:","s":"ic:bone"},{"t":"En la radiactividad, los átomos inestables se desintegran, y la semivida es cuando queda la mitad.","s":"ic:bone"}]},{"id":"relatividad2","t":"El tiempo se estira 2: nada alcanza a la luz","res":"Por más que aceleres, nada con masa alcanza la velocidad de la luz.","g":[{"t":"El tiempo se estira 2: nada alcanza a la luz"},{"t":"Vas en una nave, a la mitad de la velocidad de la luz.","s":"@sumav"},{"t":"Lanzas otra hacia adelante, también a la mitad.","s":"@sumav"},{"t":"Hola, amiga luz. ¿Te alcanzó?","s":"@sumav"},{"t":"No, amigo. Desde aquí, va al ochenta por ciento.","s":"@sumav"},{"t":"Y entre más rápido vas, más difícil es acelerar.","s":"fma"},{"tipo":"barra","b":"sumav","o":"Vas sumando velocidades muy altas.","pasos":[[20,"Al inicio, casi normal."],[60,"Luego, cuesta más."],[100,"Y nunca llegas a la luz."]]},{"t":"Gracias, amiga luz.","s":"fma"},{"t":"Dicho de otro modo:","s":"fma"},{"t":"Cerca de la luz, las velocidades no se suman normal, y acelerar requiere energía sin límite.","s":"fma"}]},{"id":"brillar","t":"El átomo 2: por qué brillan las cosas","res":"Cuando un electrón baja de nivel, suelta luz de un color exacto.","g":[{"t":"El átomo 2: por qué brillan las cosas"},{"t":"Sigues a un electrón por su escalera.","s":"@bohr"},{"t":"Hola, amigo electrón. ¿Te quedas a la mitad de un escalón?","s":"@bohr"},{"t":"No, amigo. Si recibo energía subo, y al bajar suelto luz.","s":"@bohr"},{"t":"Por eso cada letrero brilla con su propio color.","s":"p:noche;Ne .5 .62 feliz .3"},{"t":"Y los fuegos artificiales también.","s":"@flama"},{"t":"Gracias, amigo electrón.","s":"@flama"},{"t":"Dicho de otro modo:","s":"@flama"},{"t":"Los electrones ocupan niveles, y al bajar emiten luz. Cada elemento tiene sus colores.","s":"@flama"}]},{"id":"fusion","t":"Las estrellas: fusión","res":"El Sol brilla juntando hidrógeno para formar helio.","g":[{"t":"Las estrellas: fusión"},{"t":"Te acercas mucho al Sol, por dentro.","s":"ic:sun"},{"t":"Hola, amigo hidrógeno. ¿Qué pasa aquí?","s":"ic:sun"},{"t":"Hace tanto calor, amigo, que nos juntamos y nos volvemos helio.","s":"ic:sun"},{"t":"Y un poquito de masa se vuelve energía.","s":"@emc"},{"t":"El hierro y el calcio de tu cuerpo se hicieron en estrellas antiguas.","s":"el:Fe,Ca"},{"t":"Gracias, amigo hidrógeno.","s":"el:Fe,Ca"},{"t":"Dicho de otro modo:","s":"el:Fe,Ca"},{"t":"En la fusión, núcleos ligeros se unen y liberan energía. Así brillan las estrellas.","s":"el:Fe,Ca"}]},{"id":"fision","t":"Plantas nucleares","res":"Al partir un átomo muy grande se libera muchísima energía.","g":[{"t":"Plantas nucleares"},{"t":"Te encuentras al amigo uranio, casi sin aguantar.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Le llega una partícula, y se parte.","s":"p:nada;U .5 .55 nervioso .46"},{"t":"Suelto energía, amigo, y más partículas.","s":"p:nada;U .32 .55 sorpresa .24;U .68 .55 sorpresa .24;i:sparkle .5 .25 .3 #E0A92E"},{"t":"Como fichas de dominó.","s":"p:nada;U .32 .55 sorpresa .24;U .68 .55 sorpresa .24;i:sparkle .5 .25 .3 #E0A92E"},{"t":"Esa energía calienta agua, y el vapor mueve un generador.","s":"olla"},{"t":"Gracias, amigo uranio.","s":"olla"},{"t":"Dicho de otro modo:","s":"olla"},{"t":"En la fisión, un núcleo pesado se divide y libera energía, en una reacción en cadena.","s":"olla"}]},{"id":"contraccion","t":"Relatividad 3: lo que se encoge","res":"A velocidades enormes, las cosas se miden más cortas.","g":[{"t":"Relatividad 3: lo que se encoge"},{"t":"Ves pasar una nave, casi a la velocidad de la luz.","s":"@contraccion=99"},{"t":"Se ve aplastada.","s":"@contraccion=99"},{"t":"Hola, amiga nave. ¿Te encogiste?","s":"@contraccion=99"},{"t":"Yo me siento igual, amigo. Tú me mides más corta.","s":"@contraccion=99"},{"t":"Por este efecto, unas partículas llamadas muones alcanzan a llegar al suelo.","s":"reloj"},{"tipo":"barra","b":"contraccion","o":"Tu nave acelera.","pasos":[[30,"A esta velocidad, casi igual."],[80,"Más rápido, se ve más corta."],[99,"Casi a la luz, muy aplastada."]]},{"t":"Gracias, amiga nave.","s":"reloj"},{"t":"Dicho de otro modo:","s":"reloj"},{"t":"A velocidades enormes, los objetos se miden más cortos en su dirección de movimiento.","s":"reloj"}]},{"id":"simultaneo","t":"Relatividad 4: ¿al mismo tiempo?","res":"Dos cosas al mismo tiempo para ti pueden no serlo para otro.","g":[{"t":"Relatividad 4: ¿al mismo tiempo?"},{"t":"Dos rayos caen en los extremos de un tren.","s":"rayo"},{"t":"Tú, en el andén, los ves al mismo tiempo.","s":"rayo"},{"t":"Hola, amigo pasajero. ¿Tú qué viste?","s":"tren"},{"t":"Vi primero el de adelante, amigo.","s":"tren"},{"t":"Los dos tienen razón.","s":"tren"},{"t":"Solo se nota a velocidades enormes.","s":"reloj"},{"t":"Gracias, amigo.","s":"reloj"},{"t":"Dicho de otro modo:","s":"reloj"},{"t":"La simultaneidad depende de quién observa: el ahora no es igual para todos.","s":"reloj"}]},{"id":"gps","t":"Relatividad en tu celular","res":"El GPS tiene que corregir el tiempo por la velocidad y la gravedad.","g":[{"t":"Relatividad en tu celular"},{"t":"Abres el mapa de tu celular.","s":"@orbita"},{"t":"Hola, amigos satélites. ¿Sus relojes van bien?","s":"@orbita"},{"t":"Casi, amigo. Por ir rápido nos atrasamos.","s":"@orbita"},{"t":"Y por estar lejos de la Tierra, nos adelantamos.","s":"@tiempog"},{"t":"Sin corregirnos, tu mapa fallaría kilómetros por día.","s":"@orbita"},{"t":"Gracias, amigos.","s":"@orbita"},{"t":"Dicho de otro modo:","s":"@orbita"},{"t":"El GPS corrige los efectos de la relatividad, de velocidad y de gravedad.","s":"@orbita"}]},{"id":"emc2","t":"E = mc² 2: el Sol pierde peso","res":"Lo que brilla pierde masa, muy poquito.","g":[{"t":"E = mc² 2: el Sol pierde peso"},{"t":"Miras al Sol, brillando.","s":"ic:sun"},{"t":"Hola, amigo Sol. ¿Estás perdiendo peso?","s":"ic:sun"},{"t":"Sí, amigo. Millones de toneladas cada segundo, que se van como luz.","s":"ic:sun"},{"t":"Una pila cargada pesa un poquitito más, imposible de medir en casa.","s":"@pila"},{"tipo":"barra","b":"emc","o":"Conviertes masa en energía.","pasos":[[20,"Con muy poquita, ya da mucha luz."],[50,"Con un gramo, muchos hogares."],[100,"Con un kilo, una ciudad grande."]]},{"t":"Gracias, amigo Sol.","s":"@pila"},{"t":"Dicho de otro modo:","s":"@pila"},{"t":"Cualquier cuerpo que pierde energía pierde masa, aunque casi siempre es imperceptible.","s":"@pila"}]},{"id":"tabla","t":"La tabla periódica","res":"Los elementos se ordenan por cuántos protones tienen, y se parecen en familias.","g":[{"t":"La tabla periódica"},{"t":"Regresas al edificio de los elementos.","s":"tabla:"},{"t":"Hola, amigos gases nobles. ¿Siguen tranquilos?","s":"tabla:He,Ne,Ar"},{"t":"Sí, amigo. No nos falta nada.","s":"tabla:He,Ne,Ar"},{"t":"Los del otro lado siguen regalando electrones.","s":"tabla:Li,Na,K"},{"tipo":"barra","b":"atomo","o":"Vas agregando protones.","pasos":[[0,"Con uno, hidrógeno."],[1,"Con dos, helio."],[5,"Con seis, carbono."],[9,"Con diez, neón."]]},{"t":"Gracias, amigos.","s":"tabla:Li,Na,K"},{"t":"Dicho de otro modo:","s":"tabla:Li,Na,K"},{"t":"La tabla ordena los elementos por protones, y las columnas son familias con electrones externos parecidos.","s":"tabla:Li,Na,K"}]},{"id":"isotopos","t":"Isótopos","res":"Un mismo elemento puede tener distintos neutrones.","g":[{"t":"Isótopos"},{"t":"Te encuentras a dos primos carbono.","s":"@isotopos"},{"t":"Hola, primos. ¿Son iguales?","s":"@isotopos"},{"t":"Casi, amigo. Yo traigo más neutrones, y por eso me rompo con el tiempo.","s":"@isotopos"},{"t":"Y sirvo para saber edades.","s":"@datacion"},{"t":"El agua pesada lleva un hidrógeno con un neutrón extra.","s":"mol:H2O"},{"t":"Gracias, primos.","s":"mol:H2O"},{"t":"Dicho de otro modo:","s":"mol:H2O"},{"t":"Los isótopos tienen igual número de protones y distinto de neutrones.","s":"mol:H2O"}]},{"id":"moleculas","t":"Moléculas","res":"Los átomos comparten electrones y forman moléculas.","g":[{"t":"Moléculas"},{"t":"Tomas un vaso de agua.","s":"mol:H2O"},{"t":"Hola, amiga agua. ¿Qué eres?","s":"mol:H2O"},{"t":"Un oxígeno y dos hidrógenos, amigo, compartiendo electrones.","s":"mol:H2O"},{"t":"Lo que respiras son dos oxígenos juntos.","s":"mol:O2"},{"t":"Y comer es aprovechar la energía de esos enlaces.","s":"ic:bread"},{"t":"Gracias, amiga agua.","s":"ic:bread"},{"t":"Dicho de otro modo:","s":"ic:bread"},{"t":"Una molécula son átomos unidos por enlaces, que guardan energía.","s":"ic:bread"}]},{"id":"bohr","t":"Átomo 3: niveles de energía","res":"Los electrones solo pueden estar en ciertos niveles.","g":[{"t":"Átomo 3: niveles de energía"},{"t":"Subes una escalera: estás en un escalón, nunca entre dos.","s":"@bohr"},{"t":"Hola, amigo electrón. ¿A ti te pasa igual?","s":"@bohr"},{"t":"Sí, amigo. Y solo tomo luz si coincide con mi salto.","s":"@bohr"},{"t":"Por eso cada elemento tiene su código de colores.","s":"mezcla"},{"tipo":"barra","b":"bohr","o":"Tu electrón sube de nivel.","pasos":[[1,"Aquí, cerca del núcleo."],[3,"Aquí, más lejos."],[6,"Aquí, con mucha energía."]]},{"t":"Gracias, amigo electrón.","s":"mezcla"},{"t":"Dicho de otro modo:","s":"mezcla"},{"t":"Los niveles de energía de un átomo están cuantizados: solo se permiten ciertos valores.","s":"mezcla"}]},{"id":"fotoelectrico2","t":"Fotones 2: el premio de Einstein","res":"Einstein explicó por qué solo cierta luz saca electrones.","g":[{"t":"Fotones 2: el premio de Einstein"},{"t":"Una luz roja muy fuerte no saca electrones de un metal. Una azul débil, sí.","s":"@foton=15"},{"t":"Hola, amigo Einstein. ¿Por qué?","s":"@foton=15"},{"t":"Porque la luz viene en paquetes, amigo. Si son débiles, no alcanzan.","s":"@foton=15"},{"t":"Como muchos niños contra una puerta pesada.","s":"ic:users"},{"tipo":"barra","b":"foton","o":"Cambias el color de la luz, sobre un metal.","pasos":[[15,"Luz roja: no salen electrones."],[60,"Más hacia el azul, ya alcanza."],[100,"Con violeta, salen con más fuerza."]]},{"t":"Gracias, amigo Einstein.","s":"ic:users"},{"t":"Dicho de otro modo:","s":"ic:users"},{"t":"En el efecto fotoeléctrico, importa la energía de cada fotón, no cuánta luz hay.","s":"ic:users"}]},{"id":"laser2","t":"El láser 2: cómo funciona","res":"Un fotón puede provocar que otro átomo suelte otro igual.","g":[{"t":"El láser 2: cómo funciona"},{"t":"Un fotón pasa junto a un átomo emocionado.","s":"@bohr"},{"t":"Hola, amigo átomo. ¿Qué te pasa?","s":"@bohr"},{"t":"Ya me contagió, amigo, y suelto otro fotón idéntico.","s":"@bohr"},{"t":"En un láser, dos espejos los hacen ir y venir, y se multiplican.","s":"@espejo"},{"t":"Se usa hasta en cirugías de los ojos.","s":"ic:eye"},{"t":"Gracias, amigo átomo.","s":"ic:eye"},{"t":"Dicho de otro modo:","s":"ic:eye"},{"t":"En la emisión estimulada, un fotón provoca otro idéntico, y así se amplifica la luz.","s":"ic:eye"}]},{"id":"dualidad","t":"Onda y partícula","res":"La luz y los electrones se portan como onda y también como partícula.","g":[{"t":"Onda y partícula"},{"t":"Hola, amiga luz. ¿Eres onda?","s":"@interfer"},{"t":"A veces, amigo.","s":"@interfer"},{"t":"¿Y paquetito?","s":"@foton"},{"t":"También.","s":"@foton"},{"t":"Como una moneda, que según de dónde la mires, ves cara o canto.","s":"ic:coin"},{"t":"A mi amigo el electrón le pasa igual.","s":"@rendija"},{"t":"Gracias, amiga luz.","s":"@rendija"},{"t":"Dicho de otro modo:","s":"@rendija"},{"t":"Luz y partículas muestran comportamiento de onda y de partícula: es la dualidad.","s":"@rendija"}]},{"id":"datacion","t":"Fechar con carbono","res":"El carbono catorce se reduce a la mitad cada 5,730 años.","g":[{"t":"Fechar con carbono"},{"t":"Encuentras un hueso muy antiguo.","s":"@datacion"},{"t":"Hola, amigo carbono catorce. ¿Sigues ahí?","s":"@datacion"},{"t":"Queda poco, amigo. Dejé de entrar cuando murió, y me voy deshaciendo.","s":"@datacion"},{"t":"En el carbón de una fogata prehistórica, igual.","s":"ic:campfire"},{"tipo":"barra","b":"datacion","o":"Pasan los años.","pasos":[[5730,"A los 5730 años, queda la mitad."],[11460,"Al doble de años, la cuarta parte."],[28000,"Después de mucho, casi nada."]]},{"t":"Gracias, amigo.","s":"ic:campfire"},{"t":"Dicho de otro modo:","s":"ic:campfire"},{"t":"Al medir el carbono catorce restante, se calcula la edad de restos orgánicos.","s":"ic:campfire"}]},{"id":"alfabeta","t":"Tres tipos de radiación","res":"Alfa, beta y gamma atraviesan cosas de forma muy distinta.","g":[{"t":"Tres tipos de radiación"},{"t":"Te presentan a tres hermanas.","s":"@semivida"},{"t":"Yo soy alfa, amigo. Me detiene una hoja.","s":"@semivida"},{"t":"Yo soy beta, me detiene el aluminio.","s":"@semivida"},{"t":"Y yo soy gamma, necesito plomo grueso.","s":"@semivida"},{"t":"Un detector de humo usa una fuente mínima de alfa.","s":"ic:fire-extinguisher"},{"tipo":"barra","b":"semivida","o":"Pasa el tiempo.","pasos":[[1,"Pasa una semivida, y queda la mitad."],[2,"Otra, y queda la cuarta parte."],[4,"Otras dos, y queda muy poquito."]]},{"t":"Gracias, amigas.","s":"ic:fire-extinguisher"},{"t":"Dicho de otro modo:","s":"ic:fire-extinguisher"},{"t":"La radiación alfa, beta y gamma se diferencian en su poder de penetración. Lo que importa es la dosis.","s":"ic:fire-extinguisher"}]},{"id":"reactor","t":"Reactores nucleares","res":"Un reactor controla la cadena de partición de átomos.","g":[{"t":"Reactores nucleares"},{"t":"Entras a un reactor, y ves unas barras.","s":"@semivida"},{"t":"Hola, amigas barras. ¿Qué hacen?","s":"@semivida"},{"t":"Atrapamos las partículas de sobra, amigo, para que todo vaya tranquilo.","s":"@semivida"},{"t":"El calor hace vapor, y el vapor gira turbinas.","s":"@maquina"},{"t":"Y los desechos duran muchísimo, hay que guardarlos bien.","s":"@maquina"},{"t":"Gracias, amigas.","s":"@maquina"},{"t":"Dicho de otro modo:","s":"@maquina"},{"t":"Un reactor mantiene la fisión bajo control, absorbiendo neutrones con barras.","s":"@maquina"}]},{"id":"fusion2","t":"Fusión 2: una estrella en la Tierra","res":"Se intenta crear fusión en la Tierra, pero mantenerla es muy difícil.","g":[{"t":"Fusión 2: una estrella en la Tierra"},{"t":"Hola, amigos científicos. ¿Quieren hacer un Sol?","s":"@colorT"},{"t":"Sí, amigo: con millones de grados.","s":"@colorT"},{"t":"Y con imanes enormes, que sostienen el gas en forma de dona.","s":"@electroiman"},{"t":"En 2022, un experimento sacó más energía que la del láser usado.","s":"@emc"},{"t":"Falta para usarla en casa.","s":"@emc"},{"t":"Gracias, amigos.","s":"@emc"},{"t":"Dicho de otro modo:","s":"@emc"},{"t":"La fusión controlada requiere temperaturas enormes y confinamiento, y sigue siendo experimental.","s":"@emc"}]},{"id":"rayoscosmicos","t":"Rayos cósmicos","res":"Partículas veloces del espacio chocan con el aire todo el tiempo.","g":[{"t":"Rayos cósmicos"},{"t":"Estás acostado, muy tranquilo.","s":"radia"},{"t":"Hola, amiguitas. ¿Están pasando por mí?","s":"radia"},{"t":"Sí, amigo. Venimos del espacio, rapidísimo.","s":"radia"},{"t":"En un avión recibes un poquito más.","s":"ic:airplane"},{"t":"Y los astronautas, todavía más.","s":"astro"},{"t":"Gracias, amiguitas.","s":"astro"},{"t":"Dicho de otro modo:","s":"astro"},{"t":"Los rayos cósmicos son partículas de alta energía, que crean lluvias de partículas en el aire.","s":"astro"}]},{"id":"resonanciamag","t":"La resonancia magnética","res":"Un imán gigante hace girar el agua del cuerpo para ver por dentro.","g":[{"t":"La resonancia magnética"},{"t":"Entras a una máquina enorme, que hace ruido.","s":"@iman"},{"t":"Hola, amigos núcleos de hidrógeno. ¿Qué sienten?","s":"@iman"},{"t":"Nos alinean, amigo, con un imán gigante.","s":"@iman"},{"t":"Una señal de radio nos mueve, y al volver avisamos.","s":"ic:wifi-high"},{"t":"El ruido es de sus imanes vibrando, y no usa rayos X.","s":"oido"},{"t":"Gracias, amigos.","s":"oido"},{"t":"Dicho de otro modo:","s":"oido"},{"t":"La resonancia magnética usa imanes y radio, para detectar el hidrógeno del cuerpo.","s":"oido"}]},{"id":"superconductor","t":"Superconductores","res":"Algunos materiales muy fríos conducen sin nada de resistencia.","g":[{"t":"Superconductores"},{"t":"Enfrías un cable muchísimo.","s":"@super=90"},{"t":"Hola, amiga corriente. ¿Cómo vas?","s":"@super=90"},{"t":"Sin frenos, amigo. Podría dar vueltas sin apagarme.","s":"@super=90"},{"t":"Un imán puede flotar sobre él.","s":"@iman"},{"t":"Los imanes de los hospitales también lo usan.","s":"@electroiman"},{"tipo":"barra","b":"super","o":"Vas enfriando el material.","pasos":[[20,"Todavía tibio, tiene resistencia."],[60,"Más frío, todavía."],[90,"Muy frío, y desaparece."]]},{"t":"Gracias, amiga corriente.","s":"@electroiman"},{"t":"Dicho de otro modo:","s":"@electroiman"},{"t":"Un superconductor, muy frío, conduce sin resistencia.","s":"@electroiman"}]},{"id":"plasma","t":"Plasma","res":"Es gas tan caliente que sus electrones se separan.","g":[{"t":"Plasma"},{"t":"Calientas tanto un gas, que pasa algo nuevo.","s":"@calor"},{"t":"Hola, amigos átomos. ¿Y sus electrones?","s":"@calor"},{"t":"Se nos fueron, amigo. Ahora somos plasma.","s":"@calor"},{"t":"Un rayo es así.","s":"rayo"},{"t":"Y el Sol, casi entero.","s":"ic:sun"},{"t":"Gracias, amigos.","s":"ic:sun"},{"t":"Dicho de otro modo:","s":"ic:sun"},{"t":"El plasma es gas con partículas cargadas libres, y es casi toda la materia visible del universo.","s":"ic:sun"}]},{"id":"viento_solar","t":"Viento solar","res":"El Sol lanza partículas todo el tiempo, y a veces afecta a la Tierra.","g":[{"t":"Viento solar"},{"t":"Ves salir partículas del Sol.","s":"ic:sun"},{"t":"Hola, amigo viento solar. ¿A dónde vas?","s":"ic:sun"},{"t":"Por todo el sistema solar, amigo.","s":"ic:sun"},{"t":"La Tierra me desvía con su imán.","s":"@iman"},{"t":"Y si me acerco a los polos, hago auroras.","s":"ic:sparkle"},{"t":"Una tormenta mía puede afectar satélites.","s":"ic:sparkle"},{"t":"Gracias, amigo.","s":"ic:sparkle"},{"t":"Dicho de otro modo:","s":"ic:sparkle"},{"t":"El Sol emite partículas sin parar, y el campo magnético de la Tierra nos protege.","s":"ic:sparkle"}]},{"id":"estados","t":"Estados raros de la materia","res":"A temperaturas extremas, la materia se porta muy distinto.","g":[{"t":"Estados raros de la materia"},{"t":"Enfrías helio, casi al cero absoluto.","s":"agita"},{"t":"Hola, amigo helio. ¿Por qué subes por las paredes?","s":"agita"},{"t":"A este frío ya no tengo fricción, amigo.","s":"agita"},{"t":"La brea parece sólida, pero es líquida, y gotea en décadas.","s":"@viscoso"},{"t":"Gracias, amigo helio.","s":"@viscoso"},{"t":"Dicho de otro modo:","s":"@viscoso"},{"t":"Con frío extremo aparecen estados como el superfluido, sin viscosidad.","s":"@viscoso"}]},{"id":"nanotec","t":"Lo muy pequeño","res":"A escala de átomos, las cosas cambian de color y de propiedades.","g":[{"t":"Lo muy pequeño"},{"t":"Partes un pedacito de oro, en trocitos diminutos.","s":"@escala=0"},{"t":"Hola, amigo oro. ¿Te pusiste rojo?","s":"@escala=0"},{"t":"Sí, amigo. Tan chiquito, me porto distinto.","s":"@escala=0"},{"t":"En pantallas, el tamaño de cada puntito define su color.","s":"@rgb"},{"t":"Gracias, amigo oro.","s":"@rgb"},{"t":"Dicho de otro modo:","s":"@rgb"},{"t":"A escala nanométrica, las propiedades cambian con el tamaño.","s":"@rgb"}]},{"id":"transistor2","t":"Transistor 2: cada vez más chicos","res":"Los transistores se acercan al tamaño de unos pocos átomos.","g":[{"t":"Transistor 2: cada vez más chicos"},{"t":"Tienes en la mano un chip del tamaño de una uña.","s":"ic:cpu"},{"t":"Hola, amigos transistores. ¿Cuántos son?","s":"ic:cpu"},{"t":"Miles de millones, amigo, de pocas decenas de átomos.","s":"ic:cpu"},{"t":"A ese tamaño, un electrón puede cruzar sin querer.","s":"@tunel"},{"t":"Por eso cuesta hacerlos más chicos.","s":"@tunel"},{"t":"Gracias, amigos.","s":"@tunel"},{"t":"Dicho de otro modo:","s":"@tunel"},{"t":"Los transistores se acercan al límite atómico, donde el efecto túnel causa fugas.","s":"@tunel"}]},{"id":"medicina","t":"Física en hospitales","res":"Rayos, imanes y sonido ayudan a ver dentro del cuerpo.","g":[{"t":"Física en hospitales"},{"t":"Entras a un hospital, lleno de física.","s":"ic:heartbeat"},{"t":"Hola, amigos rayos X. Nosotros vemos huesos.","s":"ic:heartbeat"},{"t":"Y nosotros, los imanes, otros tejidos.","s":"@iman"},{"t":"Nosotros somos el sonido, y vemos a un bebé.","s":"@eco"},{"t":"Y la radioterapia apunta radiación al tumor, cuidando lo demás.","s":"@semivida"},{"t":"Gracias, amigos.","s":"@semivida"},{"t":"Dicho de otro modo:","s":"@semivida"},{"t":"La medicina usa rayos X, resonancia, ultrasonido y radiación para ver y tratar el cuerpo.","s":"@semivida"}]}],"mat":"f","et":"C1"},{"id":"C2","nom":"Física moderna","lec":[{"id":"incertidumbre","t":"Incertidumbre","res":"Mientras mejor sabes dónde está, menos sabes qué tan rápido va.","g":[{"t":"Incertidumbre"},{"t":"Quieres tomarle una foto a un electrón.","s":"caja"},{"t":"Hola, amigo electrón. ¿Te estás quieto?","s":"caja"},{"t":"No puedo, amigo. Entre mejor sepas dónde estoy, menos sabrás qué tan rápido voy.","s":"caja"},{"t":"No es culpa de tu cámara.","s":"caja"},{"t":"Una foto muy rápida de un carro dice dónde está, pero no a qué velocidad.","s":"ic:camera"},{"tipo":"barra","b":"incert","o":"Encierras al electrón en menos espacio.","pasos":[[20,"Con espacio, va tranquilo."],[60,"Con menos, se agita."],[100,"Muy encerrado, muchísimo."]]},{"t":"Gracias, amigo electrón.","s":"ic:camera"},{"t":"Dicho de otro modo:","s":"ic:camera"},{"t":"El principio de incertidumbre dice que posición y velocidad no se conocen a la vez con exactitud.","s":"ic:camera"}]},{"id":"rendija","t":"Doble rendija","res":"Las partículas muy pequeñas se comportan también como ondas.","g":[{"t":"Doble rendija"},{"t":"Lanzas pelotas a una pared con dos ranuras, y salen dos marcas.","s":"@rendija"},{"t":"Ahora lanzas electrones, uno por uno, y salen muchas rayas.","s":"@rendija"},{"t":"Hola, amigo electrón. ¿Por cuál ranura pasaste?","s":"@rendija"},{"t":"Como onda, amigo, por las dos.","s":"@rendija"},{"t":"Las olas de un muelle con dos entradas hacen ese mismo dibujo.","s":"ic:waves"},{"tipo":"barra","b":"rendija","o":"Llegan electrones, uno por uno.","pasos":[[10,"Al principio, puntos sueltos."],[50,"Se empiezan a ver rayas."],[100,"Ya es el dibujo de una onda."]]},{"t":"Gracias, amigo electrón.","s":"ic:waves"},{"t":"Dicho de otro modo:","s":"ic:waves"},{"t":"Los electrones muestran interferencia: se comportan como ondas al viajar, y llegan como puntos.","s":"ic:waves"}]},{"id":"curvatura","t":"Gravedad y espacio","res":"La masa curva el espacio, y las cosas siguen esa curva.","g":[{"t":"Gravedad y espacio"},{"t":"Pones una bola de boliche sobre una cama elástica, y se hunde.","s":"@curva"},{"t":"Lanzas una canica, y da vueltas alrededor.","s":"@curva"},{"t":"Hola, amigo Sol. ¿Tú haces eso?","s":"@curva"},{"t":"Sí, amigo, con el espacio. Y la Tierra me rodea.","s":"@curva"},{"t":"La luz también se dobla cerca de mí: se midió en un eclipse, en 1919.","s":"ic:sun"},{"tipo":"barra","b":"curva","o":"Pones más masa en el espacio.","pasos":[[10,"Con poca, casi plano."],[50,"Con más, se hunde."],[100,"Con muchísima, se curva mucho."]]},{"t":"Gracias, amigo Sol.","s":"ic:sun"},{"t":"Dicho de otro modo:","s":"ic:sun"},{"t":"En la relatividad general, la masa curva el espacio y el tiempo, y eso es la gravedad.","s":"ic:sun"}]},{"id":"hoyos","t":"Hoyos negros","res":"Un hoyo negro es tanta masa junta que ni la luz puede salir.","g":[{"t":"Hoyos negros"},{"t":"Lanzas una piedra hacia arriba, y regresa.","s":"@hoyo"},{"t":"Con muchísima velocidad, se escaparía de la Tierra.","s":"@hoyo"},{"t":"Hola, amigo hoyo negro. ¿Y de ti?","s":"@hoyo"},{"t":"De mí, amigo, ni la luz se escapa.","s":"@hoyo"},{"t":"Si la Tierra fuera como yo, cabría en tu mano.","s":"@hoyo"},{"t":"En el centro de nuestra galaxia hay uno de millones de soles.","s":"ic:hurricane"},{"tipo":"barra","b":"hoyo","o":"Calculas el tamaño de un hoyo negro.","pasos":[[10,"Con la masa de la Tierra, como una canica."],[40,"Con la del Sol, unos tres kilómetros."],[100,"Con millones de soles, enorme."]]},{"t":"Gracias, amigo.","s":"ic:hurricane"},{"t":"Dicho de otro modo:","s":"ic:hurricane"},{"t":"Un hoyo negro concentra tanta masa que la velocidad de escape supera la de la luz.","s":"ic:hurricane"}]},{"id":"expansion","t":"El universo se expande","res":"Las galaxias se alejan unas de otras porque el espacio crece.","g":[{"t":"El universo se expande"},{"t":"Pintas puntos en un globo, y lo inflas.","s":"@expansion"},{"t":"Todos los puntos se alejan.","s":"@expansion"},{"t":"Hola, amigas galaxias. ¿Ustedes viajan?","s":"@expansion"},{"t":"No tanto, amigo. Es el espacio el que crece.","s":"@expansion"},{"t":"Como un pan con pasas en el horno.","s":"ic:bread"},{"tipo":"barra","b":"expansion","o":"Avanza el tiempo del universo.","pasos":[[0.5,"Al inicio, todo está muy junto."],[7,"Después, las galaxias se separan."],[13.8,"Y hoy, siguen alejándose."]]},{"t":"Gracias, amigas.","s":"ic:bread"},{"t":"Dicho de otro modo:","s":"ic:bread"},{"t":"El universo se expande desde hace unos 14 mil millones de años: eso es el Big Bang.","s":"ic:bread"}]},{"id":"particulas","t":"Partículas","res":"Dentro del átomo hay piezas cada vez más pequeñas.","g":[{"t":"Partículas"},{"t":"Abres un átomo, y adentro saludan los electrones y el núcleo.","s":"@zoom=0"},{"t":"Abres el núcleo: protones y neutrones.","s":"@zoom=1"},{"t":"Abres un protón.","s":"@zoom=2"},{"t":"Hola, amigos quarks. ¿Son los últimos?","s":"@zoom=3"},{"t":"Hasta donde sabemos, amigo. Somos tres aquí.","s":"@zoom=3"},{"t":"Con pocas piezas se arma todo, como un juego de bloques.","s":"ic:cube"},{"tipo":"barra","b":"zoom","o":"Te acercas más y más.","pasos":[[0,"Primero, un átomo."],[1,"Luego su núcleo."],[2,"Luego un protón."],[3,"Y adentro, los quarks."]]},{"t":"Gracias, amigos.","s":"ic:cube"},{"t":"Dicho de otro modo:","s":"ic:cube"},{"t":"Protones y neutrones están hechos de quarks, y parecen no dividirse más.","s":"ic:cube"}]},{"id":"tunel","t":"Incertidumbre 2: atravesar paredes","res":"Una partícula muy pequeña a veces cruza una barrera que no debería poder cruzar.","g":[{"t":"Incertidumbre 2: atravesar paredes"},{"t":"Un electrón llega a un muro, y aparece del otro lado.","s":"@tunel"},{"t":"Hola, amigo. ¿Cómo cruzaste?","s":"@tunel"},{"t":"Parte de mi onda pasó, amigo. Es el efecto túnel.","s":"@tunel"},{"t":"Sin mí, el Sol no brillaría igual.","s":"ic:sun"},{"t":"Y también ocurro en la memoria de tu celular.","s":"ic:device-mobile"},{"tipo":"barra","b":"tunel","o":"Haces el muro más delgado.","pasos":[[20,"Grueso, casi nadie cruza."],[60,"Más delgado, algunos."],[100,"Muy delgado, muchos."]]},{"t":"Gracias, amigo electrón.","s":"ic:device-mobile"},{"t":"Dicho de otro modo:","s":"ic:device-mobile"},{"t":"El efecto túnel permite a una partícula cruzar barreras, con cierta probabilidad.","s":"ic:device-mobile"}]},{"id":"antimateria","t":"Antimateria","res":"Cada partícula tiene una gemela opuesta, y juntas se vuelven energía.","g":[{"t":"Antimateria"},{"t":"Te encuentras al electrón con su gemela, el positrón.","s":"@carga"},{"t":"Hola, amigos. ¿Se llevan bien?","s":"@carga"},{"t":"Si nos tocamos, amigo, nos volvemos pura energía.","s":"@carga"},{"t":"Un estudio llamado PET usa positrones en el hospital.","s":"ic:heartbeat"},{"t":"Y un plátano suelta alguno de vez en cuando, sin ningún peligro.","s":"p:nada;x:platano .5 .55 .5"},{"t":"Gracias, amigos.","s":"p:nada;x:platano .5 .55 .5"},{"t":"Dicho de otro modo:","s":"p:nada;x:platano .5 .55 .5"},{"t":"Materia y antimateria se aniquilan en energía. No se sabe por qué domina la materia.","s":"p:nada;x:platano .5 .55 .5"}]},{"id":"estrellas","t":"La vida de las estrellas","res":"Las estrellas nacen, brillan millones de años y mueren según su tamaño.","g":[{"t":"La vida de las estrellas"},{"t":"Ves una nube de gas, y la gravedad la aprieta.","s":"ic:cloud"},{"t":"Se calienta y se enciende.","s":"ic:sun"},{"t":"Hola, amigo Sol. ¿Cuánto llevas?","s":"ic:sun"},{"t":"Unos cinco mil millones de años, amigo, y me quedan otros tantos.","s":"ic:sun"},{"t":"Las estrellas muy grandes viven menos, y explotan.","s":"@hoyo"},{"t":"Lo que sale forma nuevos planetas.","s":"@hoyo"},{"t":"Gracias, amigo Sol.","s":"@hoyo"},{"t":"Dicho de otro modo:","s":"@hoyo"},{"t":"La vida de una estrella depende de su masa, y las grandes acaban en supernova.","s":"@hoyo"}]},{"id":"oscura","t":"Materia oscura","res":"Hay algo que no vemos pero que jala a las galaxias con su gravedad.","g":[{"t":"Materia oscura"},{"t":"Ves una galaxia, girando demasiado rápido.","s":"@curva"},{"t":"Hola, amiga galaxia. ¿Por qué no te deshaces?","s":"@curva"},{"t":"Algo invisible me sostiene, amigo.","s":"@curva"},{"t":"Como el viento: no se ve, pero notas cómo mueve las hojas.","s":"ic:wind"},{"t":"Todavía nadie sabe qué es.","s":"ic:wind"},{"t":"Gracias, amiga galaxia.","s":"ic:wind"},{"t":"Dicho de otro modo:","s":"ic:wind"},{"t":"La materia oscura no emite luz, y se detecta por su gravedad.","s":"ic:wind"}]},{"id":"entrelazamiento","t":"Entrelazamiento","res":"Dos partículas pueden compartir un estado, aunque estén lejos.","g":[{"t":"Entrelazamiento"},{"t":"Guardas dos guantes en dos cajas.","s":"ic:hand-palm"},{"t":"Abres una, y sabes qué mano hay en la otra.","s":"ic:hand-palm"},{"t":"Hola, amigas partículas. ¿Ustedes también?","s":"ic:hand-palm"},{"t":"Algo así, amigo. Pero en nosotras, ni siquiera estaba decidido antes.","s":"ic:hand-palm"},{"t":"Y no sirve para mandar mensajes más rápido que la luz.","s":"ic:hand-palm"},{"t":"Gracias, amigas.","s":"ic:hand-palm"},{"t":"Dicho de otro modo:","s":"ic:hand-palm"},{"t":"Las partículas entrelazadas comparten un estado, sin importar la distancia.","s":"ic:hand-palm"}]},{"id":"schrodinger","t":"El gato de Schrödinger","res":"Un ejemplo imaginado para mostrar lo raro de la superposición.","g":[{"t":"El gato de Schrödinger"},{"t":"Tienes una caja cerrada, y adentro un gato imaginario.","s":"caja"},{"t":"Hola, amigo gato. ¿Estás bien?","s":"caja"},{"t":"Solo soy un ejemplo, amigo. Tranquilo.","s":"caja"},{"t":"Como una moneda girando, ni cara ni cruz, hasta caer.","s":"ic:coin"},{"t":"Un átomo sí puede estar en dos estados a la vez.","s":"ic:coin"},{"t":"Gracias, amigo gato.","s":"ic:coin"},{"t":"Dicho de otro modo:","s":"ic:coin"},{"t":"La superposición es estar en varios estados hasta medir, y el gato muestra lo raro de esa idea.","s":"ic:coin"}]},{"id":"cuantica","t":"Computación cuántica","res":"Un qubit puede ser cero y uno a la vez, y eso permite ciertos cálculos enormes.","g":[{"t":"Computación cuántica"},{"t":"Un bit normal es cero o uno.","s":"potencias"},{"t":"Hola, amigo qubit. ¿Y tú?","s":"@qubits"},{"t":"Yo puedo estar en los dos a la vez, amigo.","s":"@qubits"},{"t":"Y juntos, crecemos muy rápido.","s":"@qubits"},{"t":"Hay que enfriarnos casi al cero absoluto, y no servimos para todo.","s":"@super"},{"tipo":"barra","b":"qubits","o":"Agregas qubits.","pasos":[[3,"Con tres, ocho combinaciones."],[10,"Con diez, mil."],[50,"Con cincuenta, muchísimas."]]},{"t":"Gracias, amigo qubit.","s":"@super"},{"t":"Dicho de otro modo:","s":"@super"},{"t":"Con superposición y entrelazamiento, los qubits resuelven ciertos problemas mucho más rápido.","s":"@super"}]},{"id":"modelo","t":"El modelo estándar","res":"Toda la materia conocida sale de unas pocas partículas y fuerzas.","g":[{"t":"El modelo estándar"},{"t":"Abres una caja de bloques con muy pocas piezas distintas.","s":"@zoom"},{"t":"Hola, amigos quarks y electrones. ¿Con ustedes se arma todo?","s":"@zoom"},{"t":"Casi, amigo.","s":"@zoom"},{"t":"Y la luz lleva la fuerza eléctrica.","s":"@carga"},{"t":"Falta la gravedad, que no entra aquí.","s":"@carga"},{"t":"Gracias, amigos.","s":"@carga"},{"t":"Dicho de otro modo:","s":"@carga"},{"t":"El modelo estándar describe las partículas y tres fuerzas, con enorme precisión, sin la gravedad.","s":"@carga"}]},{"id":"neutrinos","t":"Neutrinos","res":"Billones atraviesan tu cuerpo cada segundo, casi sin chocar.","g":[{"t":"Neutrinos"},{"t":"Estás acostado, y pasan unos amigos muy discretos.","s":"radia"},{"t":"Hola, amigos neutrinos. ¿De dónde vienen?","s":"radia"},{"t":"Del Sol, amigo. Billones te cruzan cada segundo.","s":"radia"},{"t":"Y cruzamos la Tierra entera.","s":"giro"},{"t":"Solo uno que otro choca, en tanques enormes de agua bajo tierra.","s":"ic:drop"},{"t":"Gracias, amigos.","s":"ic:drop"},{"t":"Dicho de otro modo:","s":"ic:drop"},{"t":"Los neutrinos casi no interactúan con la materia, y por eso les dicen partículas fantasma.","s":"ic:drop"}]},{"id":"higgs","t":"El bosón de Higgs","res":"Un campo en todo el espacio da masa a ciertas partículas.","g":[{"t":"El bosón de Higgs"},{"t":"Caminas en una alberca, y algo te frena.","s":"@viscoso"},{"t":"Hola, amigo campo de Higgs. ¿Tú haces algo así?","s":"@viscoso"},{"t":"Algo parecido, amigo: lleno el espacio, y le doy masa a las partículas.","s":"@viscoso"},{"t":"Es solo una imagen, no es literal.","s":"@viscoso"},{"t":"Mi bosón se detectó en 2012, en un acelerador gigante.","s":"@zoom"},{"t":"Gracias, amigo.","s":"@zoom"},{"t":"Dicho de otro modo:","s":"@zoom"},{"t":"El campo de Higgs da masa a ciertas partículas, y su bosón se detectó en 2012.","s":"@zoom"}]},{"id":"fuerzas","t":"Las cuatro fuerzas","res":"Todo se explica por gravedad, electromagnetismo y dos fuerzas nucleares.","g":[{"t":"Las cuatro fuerzas"},{"t":"Levantas un clip con un imán chiquito.","s":"@iman"},{"t":"Le gana a toda la Tierra.","s":"@iman"},{"t":"Hola, amiga gravedad. ¿Eres débil?","s":"@iman"},{"t":"La más débil, amigo. Pero alcanzo muy lejos.","s":"@iman"},{"t":"Hay otras dos, que viven en el núcleo: la fuerte lo une, y la débil deshace átomos.","s":"@zoom"},{"t":"Gracias, amigas.","s":"@zoom"},{"t":"Dicho de otro modo:","s":"@zoom"},{"t":"Las cuatro fuerzas son gravedad, electromagnetismo, nuclear fuerte y nuclear débil.","s":"@zoom"}]},{"id":"ondasgrav","t":"Ondas gravitacionales","res":"Dos hoyos negros al chocar hacen temblar el espacio.","g":[{"t":"Ondas gravitacionales"},{"t":"Dos hoyos negros chocan, muy lejos, y el espacio tiembla.","s":"@ondag"},{"t":"Hola, amiga onda. ¿Llegaste aquí?","s":"@ondag"},{"t":"Sí, amigo, en 2015. Moví las cosas menos que un protón.","s":"@ondag"},{"t":"Como una piedra en un estanque, pero con el espacio.","s":"oido"},{"tipo":"barra","b":"ondag","o":"Pasa la onda más fuerte.","pasos":[[20
