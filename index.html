cibo.","s":"@watts"},{"t":"Otro ejemplo: una regadera eléctrica o un aire acondicionado.","s":"@watts"},{"t":"Usan cientos de veces más.","s":"@watts"},{"t":"Lo que más gasta es lo que calienta o enfría.","s":"@watts"},{"t":"Mira distintos aparatos, una hora prendidos."},{"tipo":"barra","b":"watts","o":"Fíjate: el mismo tiempo, y mucho más gasto en el recibo."},{"t":"Lo que pagas es potencia por tiempo, los kilowatts hora."}]},{"id":"rayos","t":"Carga 2: los rayos","res":"Un rayo es una chispa gigante entre las nubes y el suelo.","g":[{"t":"Carga 2: los rayos"},{"t":"Ya vimos que las cargas se atraen.","s":"@carga"},{"t":"En una tormenta, el hielo choca dentro de las nubes.","s":"@carga"},{"t":"Y se separan las cargas.","s":"@carga"},{"t":"Cuando hay demasiadas, salta una chispa enorme.","s":"rayo"},{"t":"Eso es un rayo.","s":"rayo"},{"t":"Por ejemplo, el toque de una perilla, pero mil millones de veces más.","s":"rayo"},{"t":"Otro ejemplo: los pararrayos en lo alto de los edificios.","s":"rayo"},{"t":"Le dan al rayo un camino seguro al suelo.","s":"rayo"},{"t":"El trueno es el aire, calentado de golpe.","s":"oido"},{"t":"Por eso, dentro de un carro, estás protegido."},{"t":"Un rayo es una chispa gigante entre las nubes y el suelo."}]},{"id":"campo","t":"Imanes 2: la Tierra es un imán","res":"La Tierra tiene un campo magnético que nos protege y orienta las brújulas.","g":[{"t":"Imanes 2: la Tierra es un imán"},{"t":"Ya vimos que los imanes tienen dos polos.","s":"@iman"},{"t":"La Tierra también.","s":"@iman"},{"t":"Tiene hierro líquido moviéndose adentro."},{"t":"Eso crea un campo magnético gigante.","s":"@iman"},{"t":"Por ejemplo, una brújula apunta hacia el norte.","s":"@iman"},{"t":"Otro ejemplo: las auroras en los polos."},{"t":"Partículas del Sol chocan con el aire, y el cielo brilla."},{"t":"Ese campo nos protege de muchas de esas partículas."},{"t":"Las aves también lo sienten, y lo usan para viajar."},{"t":"La Tierra tiene un campo magnético que nos protege y orienta las brújulas."}]},{"id":"radio","t":"Ondas de radio","res":"Radio, wifi y luz son lo mismo: ondas, de distinto tamaño.","g":[{"t":"Ondas de radio"},{"t":"La luz es una onda.","s":"@luz"},{"t":"Hay ondas iguales que no vemos.","s":"@luz"},{"t":"Las de radio son muy, muy largas.","s":"@luz"},{"t":"Por ejemplo, tu celular manda ondas a la antena."},{"t":"Atraviesan paredes, sin que las notes."},{"t":"Otro ejemplo: el horno de microondas."},{"t":"Sus ondas agitan el agua de la comida, y la calientan.","s":"agita"},{"t":"Y los rayos X son ondas muy cortas, que pasan por la piel.","s":"@luz"},{"t":"Mira moverse por las ondas."},{"tipo":"barra","b":"luz","o":"Fíjate cómo cambia el color al cambiar el tamaño de la onda."},{"t":"Es la misma familia de ondas."},{"t":"Radio, wifi y luz son lo mismo: ondas, de distinto tamaño."}]},{"id":"chips","t":"Cómo piensa un chip","res":"Un chip tiene miles de millones de interruptores que se prenden y se apagan.","g":[{"t":"Cómo piensa un chip"},{"t":"Un apagador tiene dos posiciones.","s":"circuito"},{"t":"Prendido, o apagado.","s":"circuito"},{"t":"Un chip tiene miles de millones de apagadores diminutos.","s":"circuito"},{"t":"Se llaman transistores.","s":"circuito"},{"t":"Por ejemplo, un número se puede guardar en prendidos y apagados.","s":"potencias"},{"t":"Otro ejemplo: una foto en tu celular.","s":"potencias"},{"t":"Son millones de ceros y unos.","s":"potencias"},{"t":"Cada transistor es más chico que un virus.","s":"@escala"},{"t":"Y cambian miles de millones de veces por segundo."},{"t":"Un chip tiene miles de millones de interruptores que se prenden y se apagan."}]},{"id":"ohm2","t":"Corriente 3: la ley de Ohm","res":"Con más voltaje hay más corriente, y con más resistencia hay menos.","g":[{"t":"Corriente 3: la ley de Ohm"},{"t":"Ya vimos voltaje, corriente y resistencia.","s":"circuito"},{"t":"Se relacionan de una forma muy simple.","s":"circuito"},{"t":"Corriente es voltaje entre resistencia.","s":"@voltaje"},{"t":"Por ejemplo, un foco de carro con doce voltios.","s":"@voltaje"},{"t":"Si la resistencia es de seis, pasan dos amperes.","s":"@voltaje"},{"t":"Otro ejemplo: una extensión muy larga y delgada.","s":"circuito"},{"t":"Tiene más resistencia, y el cable se calienta.","s":"circuito"},{"t":"Mira subir el voltaje."},{"tipo":"barra","b":"voltaje","o":"Fíjate en el foco y en los puntitos: van más rápido con más voltaje."},{"t":"Con más voltaje hay más corriente, y con más resistencia hay menos."}]},{"id":"paralelo","t":"Circuitos 2: en paralelo","res":"En paralelo, cada aparato recibe todo el voltaje.","g":[{"t":"Circuitos 2: en paralelo"},{"t":"Ya vimos focos en fila.","s":"@serie"},{"t":"En paralelo, cada foco tiene su propio camino.","s":"@paralelo"},{"t":"Todos reciben el voltaje completo.","s":"@paralelo"},{"t":"Por ejemplo, los contactos de tu casa.","s":"@paralelo"},{"t":"Conectas algo más, y los demás siguen igual.","s":"@paralelo"},{"t":"Otro ejemplo: una carretera con más carriles.","s":"@paralelo"},{"t":"Pasan más carros en total, y cada carril sigue igual.","s":"@paralelo"},{"t":"Pero también pasa más corriente en total.","s":"@paralelo"},{"t":"Mira agregar focos."},{"tipo":"barra","b":"paralelo","o":"Fíjate: en paralelo, cada foco brilla igual aunque agregues más."},{"t":"En paralelo, cada aparato recibe todo el voltaje."}]},{"id":"fusibles","t":"Fusibles y pastillas","res":"Un fusible corta la corriente antes de que se incendie algo.","g":[{"t":"Fusibles y pastillas"},{"t":"Si pasa demasiada corriente, un cable se calienta.","s":"@fusible"},{"t":"Puede hasta incendiarse.","s":"@fusible"},{"t":"El fusible es un hilito que se funde primero.","s":"@fusible"},{"t":"Y abre el camino.","s":"@fusible"},{"t":"Por ejemplo, conectar muchas cosas a una sola extensión.","s":"@fusible"},{"t":"Se baja la pastilla de tu casa.","s":"@fusible"},{"t":"Otro ejemplo: un cortocircuito.","s":"circuito"},{"t":"Dos cables se tocan, y la corriente casi no tiene freno.","s":"circuito"},{"t":"Mira subir la corriente."},{"tipo":"barra","b":"fusible","o":"Fíjate: si pasa demasiada corriente, el fusible se abre."},{"t":"Un fusible corta la corriente antes de que se incendie algo."}]},{"id":"tierra","t":"La tierra física","res":"El tercer cable de un enchufe da un camino seguro a la corriente.","g":[{"t":"La tierra física"},{"t":"Un enchufe puede tener tres patitas.","s":"circuito"},{"t":"La tercera es la tierra.","s":"circuito"},{"t":"Si algo falla, la corriente se va por ahí.","s":"circuito"},{"t":"Y no por tu cuerpo.","s":"circuito"},{"t":"Por ejemplo, una lavadora con un cable pelado.","s":"circuito"},{"t":"Sin tierra, te daría toque al tocarla.","s":"circuito"},{"t":"Otro ejemplo: un pararrayos.","s":"rayo"},{"t":"Funciona igual: lleva la electricidad al suelo.","s":"rayo"},{"t":"No le quites esa patita a tus enchufes."},{"t":"El tercer cable de un enchufe da un camino seguro a la corriente."}]},{"id":"pilas","t":"Pilas y baterías","res":"Una pila convierte reacciones químicas en corriente eléctrica.","g":[{"t":"Pilas y baterías"},{"t":"Una pila guarda energía en químicos.","s":"@pila"},{"t":"Al conectarla, esos químicos reaccionan.","s":"@pila"},{"t":"Y empujan a los electrones por el cable.","s":"circuito"},{"t":"Por ejemplo, una pila común se agota, y ya.","s":"@pila"},{"t":"Otro ejemplo: la batería del celular.","s":"@pila"},{"t":"Se recarga, porque esa reacción se puede revertir.","s":"@pila"},{"t":"Por eso se calienta un poquito al cargar.","s":"calienta"},{"t":"Con el tiempo, cada vez guarda menos.","s":"@pila"},{"t":"Mira usar la pila."},{"tipo":"barra","b":"pila","o":"Fíjate cómo baja la carga de la pila con el uso."},{"t":"Una pila convierte reacciones químicas en corriente eléctrica."}]},{"id":"capacitor","t":"Capacitores","res":"Un capacitor guarda carga y la suelta de golpe.","g":[{"t":"Capacitores"},{"t":"Una pila suelta energía poco a poco.","s":"@pila"},{"t":"Un capacitor la suelta de golpe.","s":"@carga"},{"t":"Guarda cargas separadas, muy cerca.","s":"@carga"},{"t":"Por ejemplo, el flash de una cámara.","s":"rayo"},{"t":"Se carga unos segundos, y destella al instante.","s":"rayo"},{"t":"Otro ejemplo: un desfibrilador.","s":"rayo"},{"t":"Da una descarga fuerte al corazón.","s":"rayo"},{"t":"Por eso a veces un aparato sigue con luz un rato al desconectarlo."},{"t":"Un capacitor guarda carga y la suelta de golpe."}]},{"id":"electroiman","t":"Electroimanes","res":"Una corriente en un cable enrollado se vuelve un imán.","g":[{"t":"Electroimanes"},{"t":"Por un cable pasa corriente.","s":"@electroiman"},{"t":"Alrededor se forma magnetismo.","s":"@electroiman"},{"t":"Enróllalo, y se hace un imán fuerte.","s":"@electroiman"},{"t":"Lo apagas, y deja de serlo.","s":"@electroiman"},{"t":"Por ejemplo, las grúas que levantan chatarra.","s":"@electroiman"},{"t":"Otro ejemplo: una bocina.","s":"oido"},{"t":"Un electroimán empuja una tela, y hace sonido.","s":"oido"},{"t":"También un timbre, y hasta las resonancias de los hospitales."},{"t":"Mira agregar vueltas."},{"tipo":"barra","b":"electroiman","o":"Fíjate: con más vueltas de cable, la flecha del imán crece."},{"t":"Una corriente en un cable enrollado se vuelve un imán."}]},{"id":"transformador","t":"Transformadores","res":"Cambian el voltaje usando imanes y dos bobinas.","g":[{"t":"Transformadores"},{"t":"La luz viaja a voltajes altísimos por las torres.","s":"rayo"},{"t":"En tu calle, se baja a lo que usas en casa.","s":"@transformador"},{"t":"Eso hace un transformador.","s":"@transformador"},{"t":"Son dos bobinas de cable.","s":"@transformador"},{"t":"Por ejemplo, ese bote gris en lo alto de un poste.","s":"@transformador"},{"t":"Otro ejemplo: el cargador de tu celular.","s":"@transformador"},{"t":"Baja de 127 a unos cinco voltios.","s":"@transformador","v":"Baja de ciento veintisiete a unos cinco voltios."},{"t":"Mira cambiar las vueltas."},{"tipo":"barra","b":"transformador","o":"Fíjate: más vueltas a la salida dan más voltaje."},{"t":"Cambian el voltaje usando imanes y dos bobinas."}]},{"id":"alterna","t":"Corriente alterna","res":"En tu casa, la corriente cambia de sentido 60 veces por segundo.","g":[{"t":"Corriente alterna"},{"t":"Una pila empuja siempre hacia un lado.","s":"circuito"},{"t":"Eso es corriente directa.","s":"circuito"},{"t":"En tu casa, va y viene.","s":"@alterna"},{"t":"Sesenta veces cada segundo.","s":"@alterna"},{"t":"Eso es corriente alterna.","s":"@alterna"},{"t":"Por ejemplo, un foco parpadea, pero muy rápido para verlo.","s":"@alterna"},{"t":"Otro ejemplo: el zumbido de algunos transformadores.","s":"@alterna"},{"t":"Vibran a ese mismo ritmo.","s":"@alterna"},{"t":"Se usa porque viaja mejor por cables largos."},{"t":"Mira cambiar el ritmo."},{"tipo":"barra","b":"alterna","o":"Fíjate cómo la corriente va y viene."},{"t":"En tu casa, la corriente cambia de sentido 60 veces por segundo."}]},{"id":"generador","t":"Generadores","res":"Un generador convierte giro en electricidad, usando imanes.","g":[{"t":"Generadores"},{"t":"Ya vimos que un imán en movimiento crea corriente.","s":"@induccion"},{"t":"Haz girar imanes junto a bobinas.","s":"@induccion"},{"t":"Sale electricidad.","s":"@induccion"},{"t":"Por ejemplo, el dinamo de una bici.","s":"@induccion"},{"t":"Pedaleas, y se prende una luz.","s":"@induccion"},{"t":"Otro ejemplo: una planta de vapor.","s":"@maquina"},{"t":"El vapor gira una turbina, y la turbina el generador.","s":"@maquina"},{"t":"Casi toda la luz del mundo se genera así."},{"t":"Mira más rápido."},{"tipo":"barra","b":"induccion","o":"Fíjate en el foco: brilla más si el imán se mueve más rápido."},{"t":"Un generador convierte giro en electricidad, usando imanes."}]},{"id":"hidro","t":"Presas","res":"El agua de una presa cae, gira turbinas y produce electricidad.","g":[{"t":"Presas"},{"t":"Una presa guarda agua en alto.","s":"@rampa"},{"t":"Esa agua tiene energía guardada.","s":"@rampa"},{"t":"Al caer, hace girar turbinas.","s":"@rampa"},{"t":"Y las turbinas, un generador.","s":"@induccion"},{"t":"Por ejemplo, un molino antiguo junto a un río.","s":"@rampa"},{"t":"Otro ejemplo: una llave de agua moviendo una rueda de juguete.","s":"@rampa"},{"t":"Más altura, más fuerza.","s":"@rampa"},{"t":"Mira bajar el agua."},{"tipo":"barra","b":"rampa","o":"Fíjate en las barras: una baja mientras la otra sube."},{"t":"El agua de una presa cae, gira turbinas y produce electricidad."}]},{"id":"eolica","t":"Energía eólica","res":"Un molino convierte viento en electricidad, y crece muchísimo con la velocidad.","g":[{"t":"Energía eólica"},{"t":"El viento hace girar las aspas.","s":"@eolica"},{"t":"Las aspas giran un generador.","s":"@eolica"},{"t":"El doble de viento da ocho veces más energía.","s":"@eolica"},{"t":"Por ejemplo, unos molinos en una zona muy ventosa.","s":"@eolica"},{"t":"Otro ejemplo: unos pocos kilómetros por hora más cambian mucho el recibo.","s":"@eolica"},{"t":"Por eso se ponen en lo alto, donde el viento es más fuerte.","s":"@eolica"},{"t":"Mira subir el viento."},{"tipo":"barra","b":"eolica","o":"Fíjate: un poco más de viento da muchísima más energía."},{"t":"Un molino convierte viento en electricidad, y crece muchísimo con la velocidad."}]},{"id":"panel","t":"Paneles solares","res":"La luz saca electrones en un material especial, y eso es corriente.","g":[{"t":"Paneles solares"},{"t":"Ya vimos que la luz puede sacar electrones.","s":"@foton"},{"t":"En un panel, esos electrones se juntan en un cable.","s":"@solar"},{"t":"Por ejemplo, una calculadora con su celdita.","s":"@solar"},{"t":"Otro ejemplo: un panel en el techo.","s":"@solar"},{"t":"Rinde más si el Sol le da de frente.","s":"@solar"},{"t":"Por eso muchos están inclinados hacia el sur, aquí en México.","s":"@solar"},{"t":"Mira moverse el Sol."},{"tipo":"barra","b":"solar","o":"Fíjate: el panel da más si el Sol le pega de frente."},{"t":"La luz saca electrones en un material especial, y eso es corriente."}]},{"id":"led","t":"Focos LED","res":"Un LED brilla cuando los electrones caen a un nivel más bajo en un material especial.","g":[{"t":"Focos LED"},{"t":"Un foco antiguo calienta un hilo hasta que brilla.","s":"@watts"},{"t":"Casi toda esa energía se va en calor.","s":"@watts"},{"t":"Un LED hace otra cosa.","s":"@foton"},{"t":"Los electrones saltan en un material, y sueltan luz directamente.","s":"@foton"},{"t":"Por ejemplo, el foquito de un control remoto.","s":"@foton"},{"t":"Otro ejemplo: tu televisión.","s":"@rgb"},{"t":"Tiene millones de LED, o algo muy parecido.","s":"@rgb"},{"t":"Por eso gastan muchísimo menos que antes."},{"t":"Un LED brilla cuando los electrones caen a un nivel más bajo en un material especial."}]},{"id":"diodo","t":"Semiconductores","res":"Un semiconductor conduce a veces sí y a veces no, y por eso existe la electrónica.","g":[{"t":"Semiconductores"},{"t":"El cobre conduce muy bien.","s":"circuito"},{"t":"El vidrio, casi nada.","s":"circuito"},{"t":"El silicio está en medio.","s":"circuito"},{"t":"Se le puede ordenar cuándo dejar pasar.","s":"circuito"},{"t":"Por ejemplo, una puerta con un solo sentido.","s":"circuito"},{"t":"Eso hace un diodo.","s":"circuito"},{"t":"Otro ejemplo: un transistor.","s":"circuito"},{"t":"Una corriente chica controla otra más grande.","s":"circuito"},{"t":"Con eso se hizo toda la electrónica moderna."},{"t":"Un semiconductor conduce a veces sí y a veces no, y por eso existe la electrónica."}]},{"id":"microondas2","t":"Ondas 3: microondas","res":"Las microondas sacuden las moléculas de agua y calientan la comida.","g":[{"t":"Ondas 3: microondas"},{"t":"Ya vimos las ondas invisibles.","s":"@luz"},{"t":"Las microondas son ondas de radio cortas.","s":"@luz"},{"t":"Sacuden las moléculas de agua.","s":"agita"},{"t":"Se agitan, y se calientan.","s":"agita"},{"t":"Por ejemplo, un plato seco casi no se calienta.","s":"agita"},{"t":"La sopa sí.","s":"agita"},{"t":"Otro ejemplo: si está congelada, tarda más.","s":"agita"},{"t":"En el hielo, las moléculas no se mueven tan libres.","s":"agita"},{"t":"Por eso tiene una rejilla en la puerta: esas ondas no salen."},{"t":"Las microondas sacuden las moléculas de agua y calientan la comida."}]},{"id":"wifi","t":"Wifi y antenas","res":"El wifi manda ceros y unos en ondas de radio, a través del aire.","g":[{"t":"Wifi y antenas"},{"t":"Tu wifi es radio, en una frecuencia alta.","s":"@luz"},{"t":"Prende y apaga ondas millones de veces.","s":"@luz"},{"t":"Eso son ceros y unos.","s":"potencias"},{"t":"Por ejemplo, las paredes gruesas debilitan la señal.","s":"pared"},{"t":"El concreto absorbe parte de la onda.","s":"pared"},{"t":"Otro ejemplo: por eso es mejor poner el módem en un lugar abierto y alto."},{"t":"Una antena simplemente manda y recibe esas ondas."},{"t":"El wifi manda ceros y unos en ondas de radio, a través del aire."}]},{"id":"rayosx","t":"Rayos X","res":"Son luz de muchísima energía que atraviesa la piel, pero no tanto los huesos.","g":[{"t":"Rayos X"},{"t":"Son como luz, pero con muchísima más energía.","s":"@foton"},{"t":"Atraviesan la piel.","s":"@foton"},{"t":"En el hueso se detienen más.","s":"@foton"},{"t":"Por eso se ve su sombra.","s":"@sombra"},{"t":"Por ejemplo, la radiografía de un brazo.","s":"@sombra"},{"t":"Otro ejemplo: los escáneres de maletas en el aeropuerto.","s":"@foton"},{"t":"Se usan poco tiempo, porque en exceso hacen daño.","s":"@foton"},{"t":"Los descubrió Röntgen en 1895.","v":"Los descubrió Röntgen en mil ochocientos noventa y cinco."},{"t":"Son luz de muchísima energía que atraviesa la piel, pero no tanto los huesos."}]},{"id":"laser","t":"El láser","res":"Un láser es luz ordenada: un solo color y todas las ondas juntas.","g":[{"t":"El láser"},{"t":"Un foco da luz de muchos colores, hacia todos lados.","s":"mezcla"},{"t":"Un láser da un solo color, en una sola dirección.","s":"@luz"},{"t":"Y sus ondas van al paso.","s":"@interfer"},{"t":"Por ejemplo, un puntero.","s":"@luz"},{"t":"Se ve lejísimos, porque la luz no se abre.","s":"@luz"},{"t":"Otro ejemplo: el lector de la caja del súper.","s":"@luz"},{"t":"Lee el código de barras con un láser."},{"t":"Nunca apuntes uno a los ojos."},{"t":"Un láser es luz ordenada: un solo color y todas las ondas juntas."}]},{"id":"radio2","t":"Radio 2: AM y FM","res":"La música viaja en una onda que cambia de tamaño o de ritmo.","g":[{"t":"Radio 2: AM y FM"},{"t":"Ya vimos que la radio es una onda.","s":"@luz"},{"t":"La música se monta encima de ella.","s":"agudo"},{"t":"En AM, cambia el tamaño.","s":"onda"},{"t":"En FM, cambia el ritmo.","s":"agudo"},{"t":"Por ejemplo, la FM suena más limpia.","s":"agudo"},{"t":"Otro ejemplo: la AM llega más lejos de noche.","s":"onda"},{"t":"Rebota en capas altas del aire."},{"t":"Al girar la perilla, eliges a qué frecuencia escuchar.","s":"agudo"},{"t":"La música viaja en una onda que cambia de tamaño o de ritmo."}]},{"id":"neuronas","t":"Electricidad en tu cuerpo","res":"Tus nervios mandan señales eléctricas muy pequeñas.","g":[{"t":"Electricidad en tu cuerpo"},{"t":"Tus nervios usan electricidad.","s":"@alterna"},{"t":"Son señales pequeñísimas, que viajan muy rápido.","s":"@alterna"},{"t":"Por ejemplo, tocar algo caliente.","s":"cuchara"},{"t":"Tu mano se mueve antes de que pienses.","s":"cuchara"},{"t":"Otro ejemplo: tu corazón.","s":"@alterna"},{"t":"Una chispita le dice cuándo latir.","s":"@alterna"},{"t":"Por eso un electrocardiograma mide tu corazón."},{"t":"Por eso también la corriente fuerte es peligrosa: confunde esas señales."},{"t":"Tus nervios mandan señales eléctricas muy pequeñas."}]},{"id":"autoel","t":"Carros eléctricos","res":"Un motor eléctrico aprovecha mucho más la energía y la recupera al frenar.","g":[{"t":"Carros eléctricos"},{"t":"Un carro eléctrico tiene baterías y motor.","s":"@motor"},{"t":"Su motor aprovecha casi toda la energía.","s":"@motor"},{"t":"Y al frenar, funciona como generador.","s":"@induccion"},{"t":"Por ejemplo, en una bajada, carga un poquito su batería.","s":"@induccion"},{"t":"Otro ejemplo: arrancan rapidísimo.","s":"acelera"},{"t":"Su fuerza está lista desde el primer instante.","s":"acelera"},{"t":"Su límite está en cuánta energía caben en sus baterías.","s":"@pila"},{"t":"Un motor eléctrico aprovecha mucho más la energía y la recupera al frenar."}]}],"mat":"f","et":"B1"},{"id":"B2","nom":"Ondas y termodinámica","lec":[{"id":"entropia","t":"Entropía","res":"Lo desordenado es mucho más probable que lo ordenado.","g":[{"t":"Entropía"},{"t":"Un vaso roto no se arregla solo.","s":"vaso"},{"t":"Hay muchas formas de estar roto.","s":"vaso"},{"t":"Y muy pocas de estar entero.","s":"vaso"},{"t":"Por ejemplo, tu cuarto.","s":"vaso"},{"t":"Hay pocas formas de tenerlo ordenado.","s":"vaso"},{"t":"Y muchísimas de tenerlo tirado.","s":"vaso"},{"t":"Otro ejemplo: una gota de tinta en un vaso de agua.","s":"agita"},{"t":"Se reparte sola.","s":"agita"},{"t":"Nunca se vuelve a juntar en una gota.","s":"agita"},{"t":"Mira lanzar monedas."},{"t":"¿Que todas caigan igual?"},{"tipo":"barra","b":"monedas","o":"Fíjate: con más monedas, es más difícil que caigan igual."},{"t":"No es imposible."},{"t":"Solo es muy improbable."},{"t":"Lo desordenado es mucho más probable que lo ordenado."}]},{"id":"interferencia","t":"Interferencia","res":"Dos ondas pueden sumarse o borrarse.","g":[{"t":"Interferencia"},{"t":"Avienta dos piedras en un charco.","s":"@interfer"},{"t":"Las olas se encuentran.","s":"@interfer"},{"t":"Donde dos crestas coinciden, se hace una ola más alta.","s":"@interfer"},{"t":"Donde una cresta cae en un valle, se borran.","s":"@interfer"},{"t":"Por ejemplo, los audífonos que cancelan ruido.","s":"@interfer"},{"t":"Escuchan el ruido y producen la onda contraria.","s":"@interfer"},{"t":"Se borran, y oyes silencio.","s":"@interfer"},{"t":"Otro ejemplo: los colores de una burbuja de jabón.","s":"@interfer"},{"t":"La luz se suma en unos lugares y se borra en otros.","s":"@interfer"},{"t":"Mira dos ondas, moviendo una."},{"tipo":"barra","b":"interfer","o":"Fíjate en la onda de abajo: es la suma de las dos de arriba."},{"t":"Juntas, se suman."},{"t":"Desfasadas, se borran."},{"t":"Dos ondas pueden sumarse o borrarse."}]},{"id":"lentes","t":"Lentes","res":"Una lente dobla la luz, y puede hacer las cosas más grandes o más chicas.","g":[{"t":"Lentes"},{"t":"La luz va en línea recta.","s":"@lente"},{"t":"Pero al pasar por un vidrio curvo, se dobla.","s":"@lente"},{"t":"Eso es una lente.","s":"@lente"},{"t":"Por ejemplo, una lupa.","s":"@lente"},{"t":"Junta la luz, y ves las cosas más grandes.","s":"@lente"},{"t":"Otro ejemplo: tu propio ojo.","s":"@lente"},{"t":"Dentro tiene una lente que enfoca lo que miras.","s":"@lente"},{"t":"Si no enfoca bien, los lentes ayudan.","s":"@lente"},{"t":"Mira un objeto acercándose a la lente."},{"tipo":"barra","b":"lente","o":"Fíjate en la flecha roja: es lo que ves a través de la lente."},{"t":"Cambia el tamaño de la imagen."},{"t":"Y si está muy cerca, se ve de otra forma."},{"t":"Una lente dobla la luz, y puede hacer las cosas más grandes o más chicas."}]},{"id":"doppler","t":"Efecto Doppler","res":"Un sonido que se acerca suena más agudo, y al alejarse, más grave.","g":[{"t":"Efecto Doppler"},{"t":"Pasa una ambulancia.","s":"@doppler"},{"t":"Al acercarse, su sirena suena más aguda.","s":"@doppler"},{"t":"Al alejarse, más grave.","s":"@doppler"},{"t":"La sirena no cambió.","s":"@doppler"},{"t":"Lo que cambió son las ondas que te llegan.","s":"@doppler"},{"t":"Por delante se aprietan.","s":"@doppler"},{"t":"Por detrás se estiran.","s":"@doppler"},{"t":"Otro ejemplo: una moto de carreras.","s":"@doppler"},{"t":"Se oye agudo, y luego grave.","s":"@doppler"},{"t":"Con la luz pasa igual.","s":"@doppler"},{"t":"Por eso sabemos que las galaxias se alejan."},{"t":"Mira una fuente de sonido cada vez más rápida."},{"tipo":"barra","b":"doppler","o":"Fíjate: los círculos se aprietan adelante de la sirena."},{"t":"Más rápido, más se aprietan las ondas."},{"t":"Un sonido que se acerca suena más agudo, y al alejarse, más grave."}]},{"id":"resonancia","t":"Resonancia","res":"Empujar al ritmo natural de algo lo hace moverse cada vez más.","g":[{"t":"Resonancia"},{"t":"Empuja a alguien en un columpio.","s":"@resonancia"},{"t":"Si empujas en el momento justo, sube más y más.","s":"@resonancia"},{"t":"Si empujas a destiempo, casi no sube.","s":"@resonancia"},{"t":"Eso es la resonancia.","s":"@resonancia"},{"t":"Todo tiene su ritmo natural.","s":"@resonancia"},{"t":"Por ejemplo, una copa de vidrio.","s":"@resonancia"},{"t":"Con la nota justa, puede vibrar hasta romperse.","s":"@resonancia"},{"t":"Otro ejemplo: una guitarra.","s":"@resonancia"},{"t":"Su caja resuena, y el sonido se hace grande.","s":"@resonancia"},{"t":"Mira empujar a distintos ritmos."},{"tipo":"barra","b":"resonancia","o":"Fíjate cuándo el columpio se mueve más."},{"t":"Justo a su ritmo,"},{"t":"se mueve muchísimo."},{"t":"Empujar al ritmo natural de algo lo hace moverse cada vez más."}]},{"id":"maquinas","t":"Máquinas de calor","res":"Un motor convierte calor en movimiento, pero nunca todo.","g":[{"t":"Máquinas de calor"},{"t":"Hierve agua en una olla con tapa.","s":"@maquina"},{"t":"El vapor empuja la tapa.","s":"@maquina"},{"t":"Calor convertido en movimiento.","s":"@maquina"},{"t":"Por ejemplo, las locomotoras de vapor.","s":"@maquina"},{"t":"Quemaban carbón para mover un tren entero.","s":"@maquina"},{"t":"Otro ejemplo: el motor de un carro.","s":"@maquina"},{"t":"Pequeñas explosiones empujan unos pistones.","s":"@maquina"},{"t":"Pero siempre se pierde calor.","s":"@maquina"},{"t":"Por eso el cofre se calienta.","s":"@maquina"},{"t":"Ningún motor aprovecha toda la energía."},{"t":"Mira qué tanto se puede aprovechar, según el calor."},{"tipo":"barra","b":"maquina","o":"Fíjate en el número: con más calor, se aprovecha más."},{"t":"Más caliente, mejor."},{"t":"Pero nunca llega al cien por ciento."},{"t":"Un motor convierte calor en movimiento, pero nunca todo."}]},{"id":"entropia2","t":"Entropía 2: el calor no regresa","res":"El calor pasa solo de lo caliente a lo frío, y nunca al revés.","g":[{"t":"Entropía 2: el calor no regresa"},{"t":"Ya vimos que el desorden es lo más probable.","s":"vaso"},{"t":"Con el calor pasa igual.","s":"cuchara"},{"t":"Un café caliente se enfría.","s":"cuchara"},{"t":"Nunca se calienta solo, tomando calor del cuarto.","s":"cuchara"},{"t":"Por ejemplo, un hielo en un vaso de agua caliente."},{"t":"Se derrite. El agua nunca se separa sola."},{"t":"Otro ejemplo: el refri."},{"t":"Sí saca calor de adentro, pero gasta electricidad para hacerlo."},{"t":"Por eso el tiempo parece ir en un solo sentido.","s":"reloj"},{"t":"El calor pasa solo de lo caliente a lo frío, y nunca al revés."}]},{"id":"invernadero","t":"Efecto invernadero","res":"Ciertos gases dejan entrar la luz del Sol, y atrapan parte del calor que sale.","g":[{"t":"Efecto invernadero"},{"t":"La luz del Sol entra por el aire, y calienta el suelo.","s":"radia"},{"t":"El suelo devuelve ese calor, como luz invisible.","s":"radia"},{"t":"Algunos gases del aire detienen parte de ese calor.","s":"cobija"},{"t":"Es como una cobija para la Tierra.","s":"cobija"},{"t":"Por ejemplo, un carro al Sol con las ventanas cerradas.","s":"radia"},{"t":"Por dentro se pone muchísimo más caliente.","s":"radia"},{"t":"Otro ejemplo: la Luna no tiene aire, y sus noches son heladas.","s":"cobija"},{"t":"Sin ningún efecto invernadero, la Tierra estaría congelada.","s":"cobija"},{"t":"Más de esos gases, y atrapa más calor."},{"t":"Ciertos gases dejan entrar la luz del Sol, y atrapan parte del calor que sale."}]},{"id":"arcoiris","t":"El arcoíris","res":"Las gotas de agua separan los colores de la luz del Sol.","g":[{"t":"El arcoíris"},{"t":"Cada color de luz se dobla un poquito distinto.","s":"mezcla"},{"t":"Al entrar a una gota de agua, se separan.","s":"mezcla"},{"t":"Rebota por dentro, y sale de regreso.","s":"mezcla"},{"t":"Por eso el Sol siempre está a tu espalda.","s":"mezcla"},{"t":"Por ejemplo, riega con manguera en la mañana.","s":"mezcla"},{"t":"Con el Sol atrás de ti, ves un arcoíris chiquito.","s":"mezcla"},{"t":"Otro ejemplo: un CD refleja colores de otro modo, por sus rayitas.","s":"@interfer"},{"t":"Mira los colores."},{"tipo":"barra","b":"luz","o":"Fíjate cómo cambia el color al cambiar el tamaño de la onda."},{"t":"El arcoíris en realidad es un círculo, y el suelo tapa una parte."},{"t":"Las gotas de agua separan los colores de la luz del Sol."}]},{"id":"atmosfera","t":"La presión del aire","res":"El aire pesa, y empuja todo lo que tiene alrededor.","g":[{"t":"La presión del aire"},{"t":"Encima de ti hay kilómetros de aire.","s":"jalon"},{"t":"Y ese aire pesa.","s":"jalon"},{"t":"Empuja desde todos lados, por eso no lo sientes."},{"t":"Por ejemplo, un popote."},{"t":"Quitas el aire de adentro, y la presión de afuera sube el refresco."},{"t":"Otro ejemplo: tus oídos en un avión.","s":"oido"},{"t":"Se tapan porque cambia la presión.","s":"oido"},{"t":"Mientras más arriba, menos aire."},{"t":"Por eso en Chihuahua el agua hierve a menos de 100 grados.","s":"olla","v":"Por eso en Chihuahua el agua hierve a menos de cien grados."},{"t":"El aire pesa, y empuja todo lo que tiene alrededor."}]},{"id":"olas2","t":"Interferencia 2: sumar y borrar","res":"Con ondas iguales al revés se puede borrar un sonido.","g":[{"t":"Interferencia 2: sumar y borrar"},{"t":"Ya vimos que dos ondas se pueden sumar.","s":"@interfer"},{"t":"O borrar.","s":"@interfer"},{"t":"Por ejemplo, unos audífonos con cancelación de ruido.","s":"@interfer"},{"t":"Escuchan el avión, y mandan la onda al revés.","s":"@interfer"},{"t":"Cresta contra valle, y queda casi silencio.","s":"@interfer"},{"t":"Otro ejemplo: una burbuja de jabón.","s":"@interfer"},{"t":"Sus colores salen de ondas de luz que se suman y se borran.","s":"@interfer"},{"t":"Mira una onda moverse respecto a la otra."},{"tipo":"barra","b":"interfer","o":"Fíjate en la onda de abajo: es la suma de las dos de arriba."},{"t":"Con ondas iguales al revés se puede borrar un sonido."}]},{"id":"termo1","t":"La ley cero: lo que se iguala","res":"Dos cosas en contacto acaban a la misma temperatura.","g":[{"t":"Termodinámica: se igualan"},{"t":"Pon algo caliente junto a algo frío.","s":"cuchara"},{"t":"Con el tiempo, quedan iguales.","s":"cuchara"},{"t":"Por ejemplo, un refresco frío sobre la mesa.","s":"cuchara"},{"t":"Se va calentando hasta igualar el cuarto.","s":"cuchara"},{"t":"Otro ejemplo: un termómetro.","s":"cuchara"},{"t":"Toma la temperatura de lo que toca.","s":"cuchara"},{"t":"Por eso necesita un rato para medir.","s":"cuchara"},{"t":"Dos cosas en contacto acaban a la misma temperatura."}]},{"id":"termo2","t":"Termodinámica 2: la energía total","res":"El calor y el trabajo son dos formas de pasar energía.","g":[{"t":"Termodinámica 2: calor y trabajo"},{"t":"Puedes calentar algo de dos formas.","s":"calienta"},{"t":"Con fuego, o frotándolo.","s":"calienta"},{"t":"Por ejemplo, inflar una llanta con bomba.","s":"@jeringa"},{"t":"La bomba se calienta.","s":"@jeringa"},{"t":"Al apretar el aire, le das energía.","s":"@jeringa"},{"t":"Otro ejemplo: un aerosol, al usarlo, se enfría.","s":"@jeringa"},{"t":"El gas empuja hacia afuera, y gasta su energía.","s":"@jeringa"},{"t":"Mira apretar el aire."},{"tipo":"barra","b":"jeringa","o":"Fíjate: al apretar el aire en menos espacio, la presión sube."},{"t":"El calor y el trabajo son dos formas de pasar energía."}]},{"id":"gases","t":"Gases y presión","res":"Si aprietas un gas o lo calientas, su presión sube.","g":[{"t":"Gases y presión"},{"t":"Un gas son partículas golpeando las paredes.","s":"agita"},{"t":"Esos golpes son la presión.","s":"agita"},{"t":"Menos espacio, más golpes.","s":"@jeringa"},{"t":"Más calor, golpes más fuertes.","s":"agita"},{"t":"Por ejemplo, una jeringa tapada.","s":"@jeringa"},{"t":"Al apretarla, cuesta más y más.","s":"@jeringa"},{"t":"Otro ejemplo: las llantas en verano tienen más presión.","s":"agita"},{"t":"Por eso se revisan en frío."},{"t":"Mira reducir el espacio."},{"tipo":"barra","b":"jeringa","o":"Fíjate: al apretar el aire en menos espacio, la presión sube."},{"t":"Si aprietas un gas o lo calientas, su presión sube."}]},{"id":"olla2","t":"La olla exprés","res":"Con más presión, el agua hierve a más temperatura y la comida se cuece antes.","g":[{"t":"La olla exprés"},{"t":"La tapa cerrada no deja salir el vapor.","s":"@ollapresion"},{"t":"La presión sube.","s":"@ollapresion"},{"t":"Con más presión, el agua aguanta más calor.","s":"@ollapresion"},{"t":"Por ejemplo, frijoles que tardan horas.","s":"@ollapresion"},{"t":"En olla exprés, mucho menos.","s":"@ollapresion"},{"t":"Otro ejemplo: a gran altura pasa al revés.","s":"@ollapresion"},{"t":"El agua hierve antes, y cocina más lento.","s":"@ollapresion"},{"t":"Mira subir la presión."},{"tipo":"barra","b":"ollapresion","o":"Fíjate: con más presión, el agua hierve más caliente."},{"t":"Con más presión, el agua hierve a más temperatura y la comida se cuece antes."}]},{"id":"nubes","t":"Nubes y lluvia","res":"El vapor sube, se enfría y se vuelve gotitas.","g":[{"t":"Nubes y lluvia"},{"t":"El Sol evapora agua.","s":"olla"},{"t":"Ese vapor sube.","s":"olla"},{"t":"Arriba hace frío.","s":"agita"},{"t":"Y se vuelve gotitas pequeñas.","s":"agita"},{"t":"Una nube son millones de gotas.","s":"agita"},{"t":"Por ejemplo, tu aliento en un día frío.","s":"agita"},{"t":"Es una nubecita.","s":"agita"},{"t":"Otro ejemplo: un vaso frío se moja por fuera.","s":"agita"},{"t":"Cuando las gotas se juntan y pesan mucho, llueve."},{"t":"El vapor sube, se enfría y se vuelve gotitas."}]},{"id":"clima","t":"Clima y corrientes","res":"Las diferencias de calor mueven el aire y el mar por todo el planeta.","g":[{"t":"Clima y corrientes"},{"t":"El ecuador recibe más Sol que los polos.","s":"@estaciones"},{"t":"Ese calor sube, y se mueve hacia los polos.","s":"olla"},{"t":"Así se forman los vientos del planeta.","s":"@viento"},{"t":"Por ejemplo, las corrientes de mar.","s":"olla"},{"t":"Llevan calor a lugares muy lejanos.","s":"olla"},{"t":"Otro ejemplo: los huracanes.","s":"@viento"},{"t":"Se forman con agua de mar muy caliente.","s":"@viento"},{"t":"Y giran por la rotación de la Tierra.","s":"giro"},{"t":"Las diferencias de calor mueven el aire y el mar por todo el planeta."}]},{"id":"estacionaria","t":"Ondas estacionarias","res":"Una cuerda vibra solo en ciertas formas, y eso da sus notas.","g":[{"t":"Ondas estacionarias"},{"t":"Agita una cuerda fija en los dos extremos.","s":"@armonico"},{"t":"Solo ciertas formas se quedan quietas.","s":"@armonico"},{"t":"Y cada una da una nota distinta.","s":"@armonico"},{"t":"Por ejemplo, un guitarrista toca una cuerda ligeramente con el dedo.","s":"@armonico"},{"t":"Suena una nota más aguda, muy limpia.","s":"@armonico"},{"t":"Otro ejemplo: soplar en una botella.","s":"oido"},{"t":"El aire vibra, y da una nota.","s":"oido"},{"t":"Mira cambiar la forma."},{"tipo":"barra","b":"armonico","o":"Fíjate: la cuerda vibra en partes iguales, y cada vez más agudo."},{"t":"Una cuerda vibra solo en ciertas formas, y eso da sus notas."}]},{"id":"tubos","t":"Flautas y tubos","res":"Un tubo más largo da una nota más grave.","g":[{"t":"Flautas y tubos"},{"t":"En una flauta, vibra el aire de adentro.","s":"@armonico"},{"t":"Con un tubo largo, suena grave.","s":"agudo"},{"t":"Con uno corto, agudo.","s":"agudo"},{"t":"Por ejemplo, una botella con menos agua.","s":"oido"},{"t":"Con más aire, suena más grave.","s":"oido"},{"t":"Otro ejemplo: un órgano de iglesia.","s":"agudo"},{"t":"Sus tubos más grandes hacen las notas más graves.","s":"agudo"},{"t":"Tu garganta hace lo mismo al cantar.","s":"cuerda"},{"t":"Un tubo más largo da una nota más grave."}]},{"id":"resonancia2","t":"Resonancia 2: el puente","res":"A veces un puente o un edificio entra en resonancia.","g":[{"t":"Resonancia 2: puentes y edificios"},{"t":"Ya vimos la resonancia en un columpio.","s":"@resonancia"},{"t":"Todo tiene su ritmo natural.","s":"@resonancia"},{"t":"Por ejemplo, un puente famoso en Estados Unidos, Tacoma.","s":"@resonancia"},{"t":"El viento lo hizo ondular hasta caer.","s":"@resonancia"},{"t":"Otro ejemplo: los sismos.","s":"@resonancia"},{"t":"Ciertos edificios entran más en vibración que otros.","s":"@resonancia"},{"t":"Por eso se diseñan para no empatar con ese ritmo.","s":"@resonancia"},{"t":"Mira cambiar el ritmo."},{"tipo":"barra","b":"resonancia","o":"Fíjate cuándo el columpio se mueve más."},{"t":"A veces un puente o un edificio entra en resonancia."}]},{"id":"polariza","t":"Lentes polarizados","res":"Un filtro deja pasar la luz que vibra en una sola dirección.","g":[{"t":"Lentes polarizados"},{"t":"La luz vibra en muchas direcciones.","s":"@luz"},{"t":"Un polarizador solo deja una.","s":"@luz"},{"t":"Por ejemplo, unos lentes de Sol polarizados.","s":"@luz"},{"t":"Quitan el brillo de un charco.","s":"@luz"},{"t":"Esa luz rebotada vibra casi toda en una dirección.","s":"@espejo"},{"t":"Otro ejemplo: gira dos de esos filtros uno sobre otro.","s":"@luz"},{"t":"En cierto ángulo, se ponen negros."},{"t":"Algunas pantallas de celular usan lo mismo."},{"t":"Un filtro deja pasar la luz que vibra en una sola dirección."}]},{"id":"fibra","t":"Fibra óptica","res":"La luz rebota dentro de un hilo de vidrio sin salirse.","g":[{"t":"Fibra óptica"},{"t":"A cierto ángulo, la luz no sale del vidrio.","s":"@fibra"},{"t":"Rebota por dentro.","s":"@fibra"},{"t":"Así viaja por un hilo delgadísimo.","s":"@fibra"},{"t":"Por ejemplo, tu internet de fibra.","s":"@fibra"},{"t":"Son pulsos de luz, ceros y unos.","s":"@fibra"},{"t":"Otro ejemplo: los endoscopios en los hospitales.","s":"@fibra"},{"t":"Permiten ver dentro del cuerpo.","s":"@fibra"},{"t":"Mira cambiar el ángulo."},{"tipo":"barra","b":"fibra","o":"Fíjate: a cierto ángulo, la luz ya no sale y rebota adentro."},{"t":"La luz rebota dentro de un hilo de vidrio sin salirse."}]},{"id":"espejismo","t":"Espejismos","res":"El aire caliente dobla la luz y hace parecer que hay agua.","g":[{"t":"Espejismos"},{"t":"En carretera, a veces parece que hay agua.","s":"radia"},{"t":"No hay nada.","s":"radia"},{"t":"El aire caliente del suelo dobla la luz.","s":"mezcla"},{"t":"Lo que ves es cielo, doblado hacia ti.","s":"mezcla"},{"t":"Por ejemplo, el aire temblando sobre un carro caliente.","s":"agita"},{"t":"Otro ejemplo: el desierto, con lagos que no existen.","s":"radia"},{"t":"También las estrellas titilan por el aire."},{"t":"El aire caliente dobla la luz y hace parecer que hay agua."}]},{"id":"telescopio","t":"Telescopios","res":"Junta mucha luz y la concentra, para ver lo que está lejos.","g":[{"t":"Telescopios"},{"t":"Una lente junta la luz.","s":"@lente"},{"t":"Una más grande junta mucha más.","s":"@lente"},{"t":"Eso es un telescopio.","s":"@lente"},{"t":"Por ejemplo, Galileo vio las lunas de Júpiter.","s":"@lente"},{"t":"Otro ejemplo: los grandes telescopios usan espejos.","s":"@espejo"},{"t":"El Webb tiene un espejo de unos seis metros.","s":"@espejo"},{"t":"Mirar lejos es mirar al pasado.","s":"pasado"},{"t":"Por eso vemos galaxias de hace miles de millones de años.","s":"pasado"},{"t":"Junta mucha luz y la concentra, para ver lo que está lejos."}]},{"id":"microscopio","t":"Microscopios","res":"Dos lentes aumentan muchísimo lo pequeño.","g":[{"t":"Microscopios"},{"t":"Una lupa aumenta unas pocas veces.","s":"@lente"},{"t":"Dos lentes juntas aumentan muchísimo más.","s":"@lente"},{"t":"Por ejemplo, una gota de agua.","s":"agita"},{"t":"Con microscopio, ves seres diminutos.","s":"agita"},{"t":"Otro ejemplo: los glóbulos rojos.","s":"@escala"},{"t":"Para ver un virus, hacen falta electrones, no luz.","s":"@escala"},{"t":"Porque un virus es más chico que la onda de luz.","s":"@escala"},{"t":"Dos lentes aumentan muchísimo lo pequeño."}]},{"id":"ojo","t":"Tu ojo","res":"El ojo enfoca la luz en el fondo, y unos lentes corrigen si no llega bien.","g":[{"t":"Tu ojo"},{"t":"Tu ojo funciona como una cámara.","s":"@lente"},{"t":"La córnea y el cristalino enfocan la luz.","s":"@lente"},{"t":"Por ejemplo, en la miopía, se enfoca antes de tiempo.","s":"@lente"},{"t":"Lo lejano se ve borroso.","s":"@lente"},{"t":"Otro ejemplo: unos lentes doblan la luz antes de entrar.","s":"@lente"},{"t":"La imagen llega de cabeza, y tu cerebro la voltea."},{"t":"Mira cambiar la distancia."},{"tipo":"barra","b":"lente","o":"Fíjate en la flecha roja: es lo que ves a través de la lente."},{"t":"El ojo enfoca la luz en el fondo, y unos lentes corrigen si no llega bien."}]},{"id":"color","t":"Mezclar luz","res":"La pantalla mezcla rojo, verde y azul para formar todos los colores.","g":[{"t":"Mezclar luz"},{"t":"Tu ojo tiene sensores para tres colores.","s":"@rgb"},{"t":"Rojo, verde y azul.","s":"@rgb"},{"t":"Mezclándolos, ves todos los demás.","s":"@rgb"},{"t":"Por ejemplo, una pantalla de celular.","s":"@rgb"},{"t":"Rojo y verde juntos se ven amarillo.","s":"@rgb"},{"t":"Otro ejemplo: los tres juntos dan blanco.","s":"@rgb"},{"t":"Con pintura, es al revés: se va oscureciendo."},{"t":"Mira mezclar."},{"tipo":"barra","b":"rgb","o":"Fíjate cómo cambia el color al mezclar más rojo y más verde."},{"t":"La pantalla mezcla rojo, verde y azul para formar todos los colores."}]},{"id":"colorcalor","t":"El color del calor","res":"Mientras más caliente está algo, su luz va de rojo a azul.","g":[{"t":"El color del calor"},{"t":"Todo lo caliente da luz.","s":"@colorT"},{"t":"Un metal al rojo vivo.","s":"@colorT"},{"t":"Más caliente, se pone amarillo.","s":"@colorT"},{"t":"Más todavía, blanco azulado.","s":"@colorT"},{"t":"Por ejemplo, las estrellas.","s":"@colorT"},{"t":"Las rojas son más frías que las azules.","s":"@colorT"},{"t":"Otro ejemplo: tu cuerpo.","s":"@colorT"},{"t":"Da luz infrarroja, que se ve con cámaras térmicas."},{"t":"Mira subir la temperatura."},{"tipo":"barra","b":"colorT","o":"Fíjate: con más temperatura, el color pasa de rojo a azul."},{"t":"Mientras más caliente está algo, su luz va de rojo a azul."}]},{"id":"ceroabs","t":"El cero absoluto","res":"Hay un frío máximo: las partículas casi dejan de moverse.","g":[{"t":"El cero absoluto"},{"t":"Calor es agitación.","s":"agita"},{"t":"Si se enfría, se agita menos.","s":"agita"},{"t":"Hay un límite: unos −273 grados.","s":"agita","v":"Hay un límite: unos doscientos setenta y tres grados bajo cero."},{"t":"Por ejemplo, el espacio ronda los −270.","v":"Por ejemplo, el espacio ronda los doscientos setenta bajo cero."},{"t":"Otro ejemplo: los laboratorios llegan casi hasta el límite."},{"t":"A esas temperaturas, algunos materiales se vuelven muy raros."},{"t":"Conducen sin resistencia, o fluyen por las paredes."},{"t":"Hay un frío máximo: las partículas casi dejan de moverse."}]},{"id":"tension","t":"Tensión superficial","res":"Las moléculas del agua se jalan entre sí y forman una especie de piel.","g":[{"t":"Tensión superficial"},{"t":"El agua se jala a sí misma.","s":"agita"},{"t":"En la superficie, forma una piel.","s":"agita"},{"t":"Por ejemplo, un insecto caminando en el agua.","s":"agita"},{"t":"Otro ejemplo: una gota redonda.","s":"agita"},{"t":"Por eso una aguja bien puesta puede flotar.","s":"@flota"},{"t":"El jabón rompe esa piel.","s":"agita"},{"t":"Por eso limpia mejor.","s":"agita"},{"t":"Las moléculas del agua se jalan entre sí y forman una especie de piel."}]},{"id":"viscosidad","t":"Lo espeso","res":"Algunos líquidos fluyen lento porque sus moléculas rozan entre sí.","g":[{"t":"Lo espeso"},{"t":"El agua corre rápido.","s":"@viscoso"},{"t":"La miel, despacio.","s":"@viscoso"},{"t":"Eso es la viscosidad.","s":"@viscoso"},{"t":"Es como una fricción dentro del líquido.","s":"@viscoso"},{"t":"Por ejemplo, la miel caliente corre más.","s":"@viscoso"},{"t":"Otro ejemplo: el aceite de motor.","s":"@viscoso"},{"t":"Si es muy espeso, el motor batalla al arrancar en frío.","s":"@viscoso"},{"t":"Mira un líquido cada vez más espeso."},{"tipo":"barra","b":"viscoso","o":"Fíjate: la bolita baja más despacio en líquido espeso."},{"t":"Algunos líquidos fluyen lento porque sus moléculas rozan entre sí."}]},{"id":"entropia3","t":"Entropía 3: el universo","res":"El desorden total del universo siempre crece.","g":[{"t":"Entropía 3: el universo"},{"t":"Ya vimos el desorden de un vaso roto.","s":"vaso"},{"t":"En el universo entero pasa igual.","s":"@monedas"},{"t":"El orden en un lugar cuesta desorden en otro.","s":"@monedas"},{"t":"Por ejemplo, tú comes y creces, más ordenado.","s":"calienta"},{"t":"Pero sueltas calor y desorden alrededor.","s":"calienta"},{"t":"Otro ejemplo: una planta usa la luz del Sol.","s":"radia"},{"t":"Por eso la vida no rompe las reglas."},{"t":"Es una flecha del tiempo."},{"t":"El desorden total del universo siempre crece."}]},{"id":"refri","t":"El refri","res":"Un refri saca calor de adentro y lo tira por detrás, gastando energía.","g":[{"t":"El refri"},{"t":"El calor no pasa solo de frío a caliente.","s":"cuchara"},{"t":"Pero se puede obligar, gastando energía.","s":"@jeringa"},{"t":"Un refri aprieta y suelta un gas.","s":"@jeringa"},{"t":"Por ejemplo, un líquido al evaporarse enfría.","s":"@jeringa"},{"t":"Eso pasa dentro del refri.","s":"@jeringa"},{"t":"Otro ejemplo: toca la parte de atrás de un refri.","s":"cuchara"},{"t":"Está caliente: ese es el calor que sacó."},{"t":"Por eso, dejar la puerta abierta no enfría tu cuarto."},{"t":"Un refri saca calor de adentro y lo tira por detrás, gastando energía."}]}],"mat":"f","et":"B2"},{"id":"C1","nom":"Relatividad y el átomo","lec":[{"id":"relatividad","t":"El tiempo se estira","res":"Mientras más rápido te mueves, más lento pasa tu tiempo.","g":[{"t":"El tiempo se estira"},{"t":"La luz va igual de rápido para todos.","s":"reloj"},{"t":"Para que eso funcione, algo tiene que ceder.","s":"reloj"},{"t":"El tiempo.","s":"reloj"},{"t":"Por ejemplo, dos gemelos.","s":"reloj"},{"t":"Uno viaja en una nave casi a la velocidad de la luz.","s":"reloj"},{"t":"Cuando regresa, su hermano está más viejo que él.","s":"reloj"},{"t":"Otro ejemplo: los satélites del GPS.","s":"reloj"},{"t":"Sus relojes no van igual que los de aquí.","s":"reloj"},{"t":"Si no los corrigieran, el mapa de tu celular fallaría.","s":"reloj"},{"t":"Mira una nave cada vez más rápida."},{"tipo":"barra","b":"gamma","o":"Fíjate en los dos relojes: el de aquí corre cada vez más."},{"t":"A velocidades normales, casi nada."},{"t":"Cerca de la luz, muchísimo."},{"t":"Mientras más rápido te mueves, más lento pasa tu tiempo."}]},{"id":"emc","t":"E = mc²","res":"Un poquito de masa guarda muchísima energía.","g":[{"t":"E = mc²","v":"E igual a m por c al cuadrado."},{"t":"La fórmula más famosa de Einstein.","s":"@emc"},{"t":"Dice que masa y energía son la misma cosa.","s":"@emc"},{"t":"Y c es la velocidad de la luz, un número enorme.","s":"@emc"},{"t":"Por eso, un poquito de masa guarda muchísima energía.","s":"@emc"},{"t":"Por ejemplo, el Sol.","s":"@emc"},{"t":"Cada segundo convierte millones de toneladas de masa en luz.","s":"@emc"},{"t":"Otro ejemplo: una planta nuclear.","s":"@emc"},{"t":"Con un poquito de uranio, da luz a una ciudad.","s":"@emc"},{"t":"Mira cuánta energía hay en cada cantidad de masa."},{"tipo":"barra","b":"emc","o":"Fíjate en el número: es cuánta energía sale de tan poquita masa."},{"t":"Un gramo alcanza para muchísimos hogares."},{"t":"Un poquito de masa guarda muchísima energía."}]},{"id":"atomo","t":"El átomo","res":"Un átomo tiene un centro chiquito con electrones alrededor.","g":[{"t":"El átomo"},{"t":"Todo está hecho de átomos.","s":"@atomo"},{"t":"En el centro hay un núcleo muy chiquito.","s":"@atomo"},{"t":"Alrededor van unos electrones.","s":"@atomo"},{"t":"Por ejemplo, imagina un estadio.","s":"@atomo"},{"t":"El núcleo sería una canica en el centro.","s":"@atomo"},{"t":"Y los electrones, muy lejos, en las gradas.","s":"@atomo"},{"t":"Casi todo es espacio vacío.","s":"@atomo"},{"t":"Otro ejemplo: el carbono y el oro.","s":"@atomo"},{"t":"Son distintos solo por cuántos protones tienen.","s":"@atomo"},{"t":"Mira agregar protones, uno por uno."},{"tipo":"barra","b":"atomo","o":"Fíjate: en cada elemento hay un protón más en el centro."},{"t":"Cada protón extra es un elemento distinto."},{"t":"Un átomo tiene un centro chiquito con electrones alrededor."}]},{"id":"fotones","t":"Fotones","res":"La luz viene en paquetitos de energía, y el color decide cuánta trae cada uno.","g":[{"t":"Fotones"},{"t":"La luz viene en paquetitos, llamados fotones.","s":"@foton"},{"t":"Cada color trae una energía distinta.","s":"@foton"},{"t":"El azul trae más que el rojo.","s":"@foton"},{"t":"Por ejemplo, el Sol te quema con ultravioleta.","s":"@foton"},{"t":"Sus fotones traen mucha energía.","s":"@foton"},{"t":"La luz roja de un foco no te quema, por más tiempo que estés.","s":"@foton"},{"t":"Otro ejemplo: los paneles solares.","s":"@foton"},{"t":"Los fotones sacan electrones, y eso es electricidad.","s":"@foton"},{"t":"Mira la luz golpeando un metal."},{"tipo":"barra","b":"foton","o":"Fíjate: solo con luz de mucha energía salen los electrones."},{"t":"Con poca energía, no sale nada."},{"t":"Con suficiente, salen los electrones."},{"t":"La luz viene en paquetitos de energía, y el color decide cuánta trae cada uno."}]},{"id":"radiactividad","t":"Radiactividad","res":"Algunos átomos se deshacen solos, a un ritmo que se puede medir.","g":[{"t":"Radiactividad"},{"t":"Hay átomos que no son estables.","s":"@semivida"},{"t":"Se deshacen solos, soltando energía.","s":"@semivida"},{"t":"No sabes cuándo se deshará uno.","s":"@semivida"},{"t":"Pero con muchos, sí sabes cuántos.","s":"@semivida"},{"t":"Por ejemplo, palomitas en el micro.","s":"@semivida"},{"t":"No sabes cuál truena, pero sabes que en un rato truenan casi todas.","s":"@semivida"},{"t":"Otro ejemplo: los fósiles.","s":"@semivida"},{"t":"El carbono de un hueso se va deshaciendo, y eso dice su edad.","s":"@semivida"},{"t":"Mira cómo pasan las semividas."},{"tipo":"barra","b":"semivida","o":"Fíjate cómo se apagan los puntos, la mitad cada vez."},{"t":"Cada semivida, se deshace la mitad."},{"t":"Algunos átomos se deshacen solos, a un ritmo que se puede medir."}]},{"id":"relatividad2","t":"El tiempo se estira 2: nada alcanza a la luz","res":"Por más que aceleres, nada con masa alcanza la velocidad de la luz.","g":[{"t":"El tiempo se estira 2: el límite"},{"t":"Ya vimos que el tiempo se estira.","s":"reloj"},{"t":"Ahora, una pregunta.","s":"@sumav"},{"t":"Si corres dentro de un tren muy rápido, ¿vas más rápido que la luz?","s":"@sumav"},{"t":"No. Las velocidades no se suman igual a esa escala.","s":"@sumav"},{"t":"Por ejemplo, una nave a la mitad de la velocidad de la luz.","s":"@sumav"},{"t":"Lanza otra nave a la mitad, hacia adelante.","s":"@sumav"},{"t":"Desde aquí, no va a la velocidad de la luz: va al ochenta por ciento.","s":"@sumav"},{"t":"Otro ejemplo: mientras más rápido vas, más difícil es acelerar.","s":"fma"},{"t":"Cerca de la luz, haría falta una energía infinita.","s":"fma"},{"t":"Mira acelerar."},{"tipo":"barra","b":"sumav","o":"Fíjate: por más que aceleras, nunca pasas la raya de la luz."},{"t":"Por más que aceleres, nada con masa alcanza la velocidad de la luz."}]},{"id":"brillar","t":"El átomo 2: por qué brillan las cosas","res":"Cuando un electrón baja de nivel, suelta luz de un color exacto.","g":[{"t":"El átomo 2: por qué brillan las cosas"},{"t":"Ya vimos que los electrones rodean al núcleo.","s":"@atomo"},{"t":"Viven en niveles, como escalones.","s":"@atomo"},{"t":"No pueden quedarse a la mitad de un escalón.","s":"@atomo"},{"t":"Si reciben energía, suben.","s":"@atomo"},{"t":"Y al bajar, sueltan luz.","s":"@atomo"},{"t":"Por ejemplo, un letrero de neón."},{"t":"Cada gas brilla con su propio color.","s":"mezcla"},{"t":"Otro ejemplo: los fuegos artificiales."},{"t":"El estroncio da rojo, y el cobre da azul."},{"t":"Así sabemos de qué están hechas las estrellas, por su luz.","s":"pasado"},{"t":"Cuando un electrón baja de nivel, suelta luz de un color exacto."}]},{"id":"fusion","t":"Las estrellas: fusión","res":"El Sol brilla juntando hidrógeno para formar helio.","g":[{"t":"Las estrellas: fusión"},{"t":"¿Por qué brilla el Sol?","s":"radia"},{"t":"Por dentro, es tan caliente y apretado que los átomos se juntan.","s":"@atomo"},{"t":"El hidrógeno se vuelve helio.","s":"@atomo"},{"t":"Y un poquito de masa se vuelve energía.","s":"@emc"},{"t":"Por ejemplo, como dos imanes que se resisten, hasta que los juntas a la fuerza.","s":"@carga"},{"t":"Y de golpe se pegan, soltando energía.","s":"@carga"},{"t":"Otro ejemplo: tus átomos de calcio y de hierro.","s":"@atomo"},{"t":"Se hicieron dentro de estrellas antiguas.","s":"@atomo"},{"t":"Estás hecho de restos de estrellas.","s":"materia"},{"t":"El Sol brilla juntando hidrógeno para formar helio."}]},{"id":"fision","t":"Plantas nucleares","res":"Al partir un átomo muy grande se libera muchísima energía.","g":[{"t":"Plantas nucleares"},{"t":"Hay átomos enormes, como el uranio.","s":"@semivida"},{"t":"Casi no aguantan juntos.","s":"@semivida"},{"t":"Si le pegas con una partícula, se parte.","s":"@semivida"},{"t":"Suelta energía, y más partículas.","s":"@semivida"},{"t":"Por ejemplo, fichas de dominó en fila.","s":"@semivida"},{"t":"Cae una, y tumba a las demás.","s":"@semivida"},{"t":"Otro ejemplo: una pastilla de uranio del tamaño de un dedal.","s":"@emc"},{"t":"Da tanta energía como una tonelada de carbón.","s":"@emc"},{"t":"Esa energía calienta agua, y el vapor mueve el generador.","s":"olla"},{"t":"Al partir un átomo muy grande se libera muchísima energía."}]},{"id":"contraccion","t":"Relatividad 3: lo que se encoge","res":"A velocidades enormes, las cosas se miden más cortas.","g":[{"t":"Relatividad 3: lo que se encoge"},{"t":"Ya vimos que el tiempo se estira.","s":"reloj"},{"t":"También cambia el largo.","s":"@contraccion"},{"t":"Algo muy rápido se mide más corto, en su dirección.","s":"@contraccion"},{"t":"Por ejemplo, una nave casi a la velocidad de la luz.","s":"@contraccion"},{"t":"Desde aquí, se ve aplastada.","s":"@contraccion"},{"t":"Otro ejemplo: unas partículas llamadas muones.","s":"reloj"},{"t":"Se crean arriba, y viven muy poco.","s":"reloj"},{"t":"Aun así llegan al suelo, por este efecto.","s":"reloj"},{"t":"Mira acelerar."},{"tipo":"barra","b":"contraccion","o":"Fíjate: la nave se ve más corta mientras más rápido va."},{"t":"A velocidades enormes, las cosas se miden más cortas."}]},{"id":"simultaneo","t":"Relatividad 4: ¿al mismo tiempo?","res":"Dos cosas al mismo tiempo para ti pueden no serlo para otro.","g":[{"t":"Relatividad 4: ¿al mismo tiempo?"},{"t":"Dos rayos caen en los extremos de un tren.","s":"rayo"},{"t":"Alguien en el andén los ve al mismo tiempo.","s":"rayo"},{"t":"Alguien en el tren, avanzando, ve primero el de adelante.","s":"tren"},{"t":"Los dos tienen razón.","s":"tren"},{"t":"Por ejemplo, una luz en medio de un vagón.","s":"tren"},{"t":"Para ti, llega a los dos extremos a la vez.","s":"tren"},{"t":"Otro ejemplo: por eso el ahora no es igual para todos.","s":"reloj"},{"t":"Solo se nota a velocidades enormes.","s":"reloj"},{"t":"Dos cosas al mismo tiempo para ti pueden no serlo para otro."}]},{"id":"gps","t":"Relatividad en tu celular","res":"El GPS tiene que corregir el tiempo por la velocidad y la gravedad.","g":[{"t":"Relatividad en tu celular"},{"t":"Tu celular usa relojes en satélites.","s":"@orbita"},{"t":"Esos relojes van muy rápido.","s":"reloj"},{"t":"Eso los atrasa un poquito.","s":"reloj"},{"t":"Pero también están lejos de la Tierra.","s":"@tiempog"},{"t":"Eso los adelanta.","s":"@tiempog"},{"t":"Por ejemplo, sin corregir, tu mapa fallaría kilómetros por día.","s":"@orbita"},{"t":"Otro ejemplo: los aviones también usan estos satélites.","s":"@orbita"},{"t":"Es física muy rara, en tu bolsillo."},{"t":"El GPS tiene que corregir el tiempo por la velocidad y la gravedad."}]},{"id":"emc2","t":"E = mc² 2: el Sol pierde peso","res":"Lo que brilla pierde masa, muy poquito.","g":[{"t":"E = mc² 2: el Sol pierde peso"},{"t":"Ya vimos que masa y energía son lo mismo.","s":"@emc"},{"t":"Cada segundo, el Sol pierde millones de toneladas.","s":"@emc"},{"t":"Se le van como luz.","s":"radia"},{"t":"Por ejemplo, una pila cargada pesa un poquitito más.","s":"@pila"},{"t":"Una diferencia imposible de medir en casa.","s":"@pila"},{"t":"Otro ejemplo: un carro con velocidad.","s":"reloj"},{"t":"Tiene un poquito más de energía, y por eso de masa.","s":"reloj"},{"t":"Mira cuánta energía sale."},{"tipo":"barra","b":"emc","o":"Fíjate en el número: es cuánta energía sale de tan poquita masa."},{"t":"Lo que brilla pierde masa, muy poquito."}]},{"id":"tabla","t":"La tabla periódica","res":"Los elementos se ordenan por cuántos protones tienen, y se parecen en familias.","g":[{"t":"La tabla periódica"},{"t":"Cada elemento se define por sus protones.","s":"@atomo"},{"t":"Se pueden ordenar en una tabla.","s":"@atomo"},{"t":"Las columnas son familias parecidas.","s":"@atomo"},{"t":"Por ejemplo, el helio y el neón casi no reaccionan.","s":"@atomo"},{"t":"Otro ejemplo: el sodio reacciona fuerte con el agua.","s":"@atomo"},{"t":"Lo que más importa son los electrones de afuera.","s":"@atomo"},{"t":"Hoy se conocen 118 elementos.","v":"Hoy se conocen ciento dieciocho elementos."},{"t":"Mira agregar protones."},{"tipo":"barra","b":"atomo","o":"Fíjate: en cada elemento hay un protón más en el centro."},{"t":"Los elementos se ordenan por cuántos protones tienen, y se parecen en familias."}]},{"id":"isotopos","t":"Isótopos","res":"Un mismo elemento puede tener distintos neutrones.","g":[{"t":"Isótopos"},{"t":"El núcleo también tiene neutrones.","s":"@zoom"},{"t":"No cambian el elemento.","s":"@zoom"},{"t":"Pero sí su peso y su estabilidad.","s":"@semivida"},{"t":"Por ejemplo, el agua pesada, con un neutrón extra en el hidrógeno.","s":"@zoom"},{"t":"Otro ejemplo: el carbono normal y el carbono catorce.","s":"@datacion"},{"t":"El segundo se deshace poco a poco.","s":"@datacion"},{"t":"Por eso sirve para saber edades.","s":"@datacion"},{"t":"Un mismo elemento puede tener distintos neutrones."}]},{"id":"moleculas","t":"Moléculas","res":"Los átomos comparten electrones y forman moléculas.","g":[{"t":"Moléculas"},{"t":"Los átomos se pueden unir.","s":"@atomo"},{"t":"Comparten electrones.","s":"@atomo"},{"t":"Forman moléculas.","s":"agita"},{"t":"Por ejemplo, el agua: un oxígeno y dos hidrógenos.","s":"agita"},{"t":"Otro ejemplo: el oxígeno que respiras: dos átomos juntos.","s":"agita"},{"t":"Algunos enlaces guardan mucha energía.","s":"calienta"},{"t":"Eso es lo que usas al comer.","s":"calienta"},{"t":"Los átomos comparten electrones y forman moléculas."}]},{"id":"bohr","t":"Átomo 3: niveles de energía","res":"Los electrones solo pueden estar en ciertos niveles.","g":[{"t":"Átomo 3: niveles de energía"},{"t":"Ya vimos que los electrones están en escalones.","s":"@bohr"},{"t":"No hay escalón a la mitad.","s":"@bohr"},{"t":"Por ejemplo, una escalera.","s":"@bohr"},{"t":"Puedes estar en un escalón, no entre dos.","s":"@bohr"},{"t":"Otro ejemplo: un rayo de luz de cierto color.","s":"@foton"},{"t":"Solo lo absorbe si coincide con el salto.","s":"@foton"},{"t":"Por eso cada elemento tiene su propio código de colores.","s":"mezcla"},{"t":"Mira subir de nivel."},{"tipo":"barra","b":"bohr","o":"Fíjate: cada nivel queda más lejos del centro."},{"t":"Los electrones solo pueden estar en ciertos niveles."}]},{"id":"fotoelectrico2","t":"Fotones 2: el premio de Einstein","res":"Einstein explicó por qué solo cierta luz saca electrones.","g":[{"t":"Fotones 2: el premio de Einstein"},{"t":"Ya vimos los fotones.","s":"@foton"},{"t":"Luz roja muy fuerte no saca electrones.","s":"@foton"},{"t":"Luz azul débil, sí.","s":"@foton"},{"t":"Por ejemplo, muchos niños pequeños contra una puerta.","s":"@foton"},{"t":"Por más que sean, si son débiles, no la tiran.","s":"@foton"},{"t":"Otro ejemplo: el Sol quema por su ultravioleta.","s":"radia"},{"t":"Einstein ganó el Nobel por explicarlo.","s":"@foton"},{"t":"Mira con más energía."},{"tipo":"barra","b":"foton","o":"Fíjate: solo con luz de mucha energía salen los electrones."},{"t":"Einstein explicó por qué solo cierta luz saca electrones."}]},{"id":"laser2","t":"El láser 2: cómo funciona","res":"Un fotón puede provocar que otro átomo suelte otro igual.","g":[{"t":"El láser 2: cómo funciona"},{"t":"Ya vimos que un láser es luz ordenada.","s":"@interfer"},{"t":"Un fotón pasa junto a un átomo excitado.","s":"@bohr"},{"t":"Le hace soltar otro fotón, idéntico.","s":"@bohr"},{"t":"Por ejemplo, un grito que hace gritar igual a los demás.","s":"@bohr"},{"t":"Otro ejemplo: dos espejos en el láser.","s":"@espejo"},{"t":"La luz va y viene, y se multiplica.","s":"@espejo"},{"t":"Se usa hasta en cirugías de los ojos.","s":"@lente"},{"t":"Un fotón puede provocar que otro átomo suelte otro igual."}]},{"id":"dualidad","t":"Onda y partícula","res":"La luz y los electrones se portan como onda y también como partícula.","g":[{"t":"Onda y partícula"},{"t":"A veces la luz es una onda.","s":"@interfer"},{"t":"A veces un paquetito.","s":"@foton"},{"t":"Es las dos cosas.","s":"@rendija"},{"t":"Por ejemplo, una moneda.","s":"@monedas"},{"t":"Según de dónde la mires, ves cara o canto.","s":"@monedas"},{"t":"Otro ejemplo: un electrón.","s":"@rendija"},{"t":"También hace dibujos de onda.","s":"@rendija"},{"t":"A esa escala, nuestras ideas diarias no alcanzan.","s":"@rendija"},{"t":"La luz y los electrones se portan como onda y también como partícula."}]},{"id":"datacion","t":"Fechar con carbono","res":"El carbono catorce se reduce a la mitad cada 5,730 años.","g":[{"t":"Fechar con carbono"},{"t":"Los seres vivos tienen carbono catorce.","s":"@datacion"},{"t":"Al morir, deja de entrar.","s":"@datacion"},{"t":"Y se deshace poco a poco.","s":"@datacion"},{"t":"Por ejemplo, un hueso muy antiguo.","s":"@datacion"},{"t":"Tiene menos que uno reciente.","s":"@datacion"},{"t":"Otro ejemplo: una tela o carbón de una fogata prehistórica.","s":"@datacion"},{"t":"Así se sabe qué tan antigua es.","s":"@datacion"},{"t":"Mira pasar el tiempo."},{"tipo":"barra","b":"datacion","o":"Fíjate cuánto carbono queda, al pasar los miles de años."},{"t":"El carbono catorce se reduce a la mitad cada 5,730 años."}]},{"id":"alfabeta","t":"Tres tipos de radiación","res":"Alfa, beta y gamma atraviesan cosas de forma muy distinta.","g":[{"t":"Tres tipos de radiación"},{"t":"Un átomo inestable suelta tres tipos de cosa.","s":"@semivida"},{"t":"La alfa se detiene con una hoja.","s":"@semivida"},{"t":"La beta, con aluminio.","s":"@semivida"},{"t":"La gamma necesita plomo grueso.","s":"@semivida"},{"t":"Por ejemplo, tu piel detiene alfa.","s":"@semivida"},{"t":"Otro ejemplo: un detector de humo usa una fuente mínima de alfa.","s":"@semivida"},{"t":"Lo peligroso es dosis y exposición.","s":"@semivida"},{"t":"Mira pasar el tiempo."},{"tipo":"barra","b":"semivida","o":"Fíjate cómo se apagan los puntos, la mitad cada vez."},{"t":"Alfa, beta y gamma atraviesan cosas de forma muy distinta."}]},{"id":"reactor","t":"Reactores nucleares","res":"Un reactor controla la cadena de partición de átomos.","g":[{"t":"Reactores nucleares"},{"t":"Ya vimos que el uranio se parte.","s":"@emc"},{"t":"Cada átomo suelta energía.","s":"@emc"},{"t":"Y partículas que parten a otros.","s":"@semivida"},{"t":"En un reactor, unas barras absorben las de sobra.","s":"@semivida"},{"t":"Por ejemplo, un acelerador con un freno a mano.","s":"@maquina"},{"t":"Otro ejemplo: el calor hace vapor, y el vapor gira turbinas.","s":"@maquina"},{"t":"Sus desechos duran muchísimo, y hay que guardarlos bien.","s":"@semivida"},{"t":"Un reactor controla la cadena de partición de átomos."}]},{"id":"fusion2","t":"Fusión 2: una estrella en la Tierra","res":"Se intenta crear fusión en la Tierra, pero mantenerla es muy difícil.","g":[{"t":"Fusión 2: una estrella en la Tierra"},{"t":"Ya vimos que el Sol junta átomos.","s":"radia"},{"t":"Aquí no hay su gravedad.","s":"@curva"},{"t":"Se usan temperaturas de millones de grados.","s":"@colorT"},{"t":"Y imanes enormes que sostienen el gas.","s":"@electroiman"},{"t":"Por ejemplo, un reactor en forma de dona.","s":"@electroiman"},{"t":"Otro ejemplo: en 2022 un experimento sacó más energía del láser usado.","s":"@emc","v":"Otro ejemplo: en dos mil veintidós un experimento sacó más energía de la que le dio su láser."},{"t":"Pero todavía falta para usarla en casa.","s":"@emc"},{"t":"Se intenta crear fusión en la Tierra, pero mantenerla es muy difícil."}]},{"id":"rayoscosmicos","t":"Rayos cósmicos","res":"Partículas veloces del espacio chocan con el aire todo el tiempo.","g":[{"t":"Rayos cósmicos"},{"t":"Del espacio llegan partículas rapidísimas.","s":"radia"},{"t":"Chocan arriba, con el aire.","s":"radia"},{"t":"Y salen muchas partículas más.","s":"radia"},{"t":"Por ejemplo, ahora mismo unas pasan por tu cuerpo.","s":"materia"},{"t":"Sin que las sientas.","s":"materia"},{"t":"Otro ejemplo: en un avión recibes un poquito más.","s":"radia"},{"t":"Por eso los astronautas están más expuestos.","s":"astro"},{"t":"Partículas veloces del espacio chocan con el aire todo el tiempo."}]},{"id":"resonanciamag","t":"La resonancia magnética","res":"Un imán gigante hace girar el agua del cuerpo para ver por dentro.","g":[{"t":"La resonancia magnética"},{"t":"Los núcleos de hidrógeno son como imancitos.","s":"@iman"},{"t":"Un imán gigante los alinea.","s":"@iman"},{"t":"Una señal de radio los mueve.","s":"@luz"},{"t":"Al volver, dan otra señal.","s":"@luz"},{"t":"Por ejemplo, una imagen de tu rodilla.","s":"materia"},{"t":"Otro ejemplo: el ruido que hace es por los imanes vibrando.","s":"oido"},{"t":"No usa rayos X.","s":"@luz"},{"t":"Un imán gigante hace girar el agua del cuerpo para ver por dentro."}]},{"id":"superconductor","t":"Superconductores","res":"Algunos materiales muy fríos conducen sin nada de resistencia.","g":[{"t":"Superconductores"},{"t":"Un cable normal se calienta.","s":"calienta"},{"t":"Enfríalo muchísimo, y a veces desaparece toda resistencia.","s":"@super"},{"t":"Una corriente puede dar vueltas sin apagarse.","s":"@super"},{"t":"Por ejemplo, un imán que flota sobre él.","s":"@iman"},{"t":"Otro ejemplo: los imanes de un hospital.","s":"@electroiman"},{"t":"Sin eso, no alcanzarían esa fuerza.","s":"@electroiman"},{"t":"Mira enfriar."},{"tipo":"barra","b":"super","o":"Fíjate: al bajar de cierta temperatura, la resistencia desaparece."},{"t":"Algunos materiales muy fríos conducen sin nada de resistencia."}]},{"id":"plasma","t":"Plasma","res":"Es gas tan caliente que sus electrones se separan.","g":[{"t":"Plasma"},{"t":"Sólido, líquido, gas.","s":"@calor"},{"t":"Calienta más, y sale un cuarto estado.","s":"agita"},{"t":"Los átomos pierden electrones.","s":"@atomo"},{"t":"Eso es plasma.","s":"agita"},{"t":"Por ejemplo, un rayo.","s":"rayo"},{"t":"Otro ejemplo: el Sol, casi entero, es plasma.","s":"radia"},{"t":"Las lámparas de neón también lo usan.","s":"mezcla"},{"t":"Casi toda la materia visible del universo está así."},{"t":"Es gas tan caliente que sus electrones se separan."}]},{"id":"viento_solar","t":"Viento solar","res":"El Sol lanza partículas todo el tiempo, y a veces afecta a la Tierra.","g":[{"t":"Viento solar"},{"t":"Del Sol salen partículas sin parar.","s":"radia"},{"t":"Viajan por todo el sistema solar.","s":"radia"},{"t":"La Tierra las desvía con su imán.","s":"@iman"},{"t":"Por ejemplo, las auroras en los polos.","s":"@iman"},{"t":"Otro ejemplo: una tormenta solar fuerte.","s":"radia"},{"t":"Puede afectar satélites y redes eléctricas.","s":"@induccion"},{"t":"Por eso hay quienes vigilan al Sol todos los días."},{"t":"El Sol lanza partículas todo el tiempo, y a veces afecta a la Tierra."}]},{"id":"estados","t":"Estados raros de la materia","res":"A temperaturas extremas, la materia se porta muy distinto.","g":[{"t":"Estados raros de la materia"},{"t":"Ya vimos el plasma.","s":"agita"},{"t":"Y si se enfría casi al cero absoluto.","s":"agita"},{"t":"Hay átomos que se portan como uno solo.","s":"@rendija"},{"t":"Por ejemplo, el helio líquido, que sube por las paredes del vaso."},{"t":"Otro ejemplo: un material que solo fluye muy despacio."},{"t":"Parece sólido, pero es líquido: la brea."},{"t":"Hay experimentos que llevan décadas viendo caer gotas."},{"t":"A temperaturas extremas, la materia se porta muy distinto."}]},{"id":"nanotec","t":"Lo muy pequeño","res":"A escala de átomos, las cosas cambian de color y de propiedades.","g":[{"t":"Lo muy pequeño"},{"t":"Algo muy pequeño no se porta igual.","s":"@escala"},{"t":"Por ejemplo, el oro en partículas diminutas.","s":"@escala"},{"t":"Se ve rojo, no dorado.","s":"@escala"},{"t":"Otro ejemplo: una pantalla con puntos cuánticos.","s":"@rgb"},{"t":"El tamaño de cada punto define su color.","s":"@rgb"},{"t":"Con esto se hacen chips y medicinas nuevas.","s":"circuito"},{"t":"Muchos ya usan esta física todos los días."},{"t":"A escala de átomos, las cosas cambian de color y de propiedades."}]},{"id":"transistor2","t":"Transistor 2: cada vez más chicos","res":"Los transistores se acercan al tamaño de unos pocos átomos.","g":[{"t":"Transistor 2: cada vez más chicos"},{"t":"Ya vimos los transistores.","s":"circuito"},{"t":"Cada vez caben más en un chip.","s":"potencias"},{"t":"Ya miden muy pocas decenas de átomos.","s":"@escala"},{"t":"Por ejemplo, un chip del tamaño de una uña.","s":"potencias"},{"t":"Tiene miles de millones.","s":"potencias"},{"t":"Otro ejemplo: a ese tamaño, un electrón puede cruzar sin querer.","s":"@tunel"},{"t":"Por eso hacerlos más chicos es tan difícil.","s":"@tunel"},{"t":"Los transistores se acercan al tamaño de unos pocos átomos."}]},{"id":"medicina","t":"Física en hospitales","res":"Rayos, imanes y sonido ayudan a ver dentro del cuerpo.","g":[{"t":"Física en hospitales"},{"t":"Los doctores usan mucha física.","s":"@sombra"},{"t":"Rayos X para los huesos.","s":"@sombra"},{"t":"Imanes para los tejidos.","s":"@iman"},{"t":"Sonido para ver a un bebé.","s":"@eco"},{"t":"Por ejemplo, un ultrasonido.","s":"@eco"},{"t":"Manda sonido y escucha el eco.","s":"@eco"},{"t":"Otro ejemplo: la radioterapia.","s":"@semivida"},{"t":"Apunta radiación al tumor, cuidando lo demás.","s":"@semivida"},{"t":"Rayos, imanes y sonido ayudan a ver dentro del cuerpo."}]}],"mat":"f","et":"C1"},{"id":"C2","nom":"Física moderna","lec":[{"id":"incertidumbre","t":"Incertidumbre","res":"Mientras mejor sabes dónde está, menos sabes qué tan rápido va.","g":[{"t":"Incertidumbre"},{"t":"Un electrón no es una bolita.","s":"caja"},{"t":"Mientras mejor sabes dónde está,","s":"caja"},{"t":"menos sabes qué tan rápido va.","s":"caja"},{"t":"No es culpa de los instrumentos.","s":"caja"},{"t":"Así funciona la naturaleza.","s":"caja"},{"t":"Por ejemplo, una foto de un carro con poca velocidad de cámara.","s":"caja"},{"t":"Se ve qué tan rápido va, pero no dónde está.","s":"caja"},{"t":"Otro ejemplo: una foto muy rápida.","s":"caja"},{"t":"Sabes dónde está, pero no qué tan rápido va.","s":"caja"},{"t":"Mira encerrar al electrón."},{"tipo":"barra","b":"incert","o":"Fíjate: con menos espacio, el electrón se agita más rápido."},{"t":"Menos espacio,"},{"t":"más agitado."},{"t":"Mientras mejor sabes dónde está, menos sabes qué tan rápido va."}]},{"id":"rendija","t":"Doble rendija","res":"Las partículas muy pequeñas se comportan también como ondas.","g":[{"t":"Doble rendija"},{"t":"Lanza pelotas a una pared con dos ranuras.","s":"@rendija"},{"t":"Detrás, salen dos marcas.","s":"@rendija"},{"t":"Eso esperas.","s":"@rendija"},{"t":"Ahora lanza electrones, uno por uno.","s":"@rendija"},{"t":"Salen muchas rayas.","s":"@rendija"},{"t":"Como si cada uno pasara por las dos ranuras.","s":"@rendija"},{"t":"Por ejemplo, las olas en un muelle con dos entradas.","s":"@rendija"},{"t":"Se cruzan, y hacen ese mismo dibujo.","s":"@rendija"},{"t":"Otro ejemplo: los colores de un disco.","s":"@rendija"},{"t":"Son luz, pasando por rayitas muy finas.","s":"@rendija"},{"t":"Mira llegar un electrón tras otro."},{"tipo":"barra","b":"rendija","o":"Fíjate a la derecha: los puntos van formando rayas."},{"t":"Poco a poco, aparece el dibujo."},{"t":"Las partículas muy pequeñas se comportan también como ondas."}]},{"id":"curvatura","t":"Gravedad y espacio","res":"La masa curva el espacio, y las cosas siguen esa curva.","g":[{"t":"Gravedad y espacio"},{"t":"Imagina una cama elástica.","s":"@curva"},{"t":"Pones una bola de boliche.","s":"@curva"},{"t":"Se hunde.","s":"@curva"},{"t":"Lanza una canica, y da vueltas alrededor.","s":"@curva"},{"t":"Así hace el Sol con el espacio.","s":"@curva"},{"t":"Y la Tierra lo rodea, como la canica.","s":"@curva"},{"t":"Por ejemplo, la luz también se dobla al pasar cerca del Sol.","s":"@curva"},{"t":"Se midió en un eclipse, en 1919.","s":"@curva","v":"Se midió en un eclipse, en mil novecientos diecinueve."},{"t":"Otro ejemplo: el reloj en lo alto de una torre va un poquito más rápido.","s":"@curva"},{"t":"Mira con más masa."},{"tipo":"barra","b":"curva","o":"Fíjate cómo se hunde la red, y la bolita se acerca."},{"t":"Más masa,"},{"t":"más se curva."},{"t":"La masa curva el espacio, y las cosas siguen esa curva."}]},{"id":"hoyos","t":"Hoyos negros","res":"Un hoyo negro es tanta masa junta que ni la luz puede salir.","g":[{"t":"Hoyos negros"},{"t":"Lanza una piedra hacia arriba. Regresa.","s":"@hoyo"},{"t":"Lánzala rapidísimo, y se escapa de la Tierra.","s":"@hoyo"},{"t":"Ahora aprieta mucho un planeta.","s":"@hoyo"},{"t":"Escapar se vuelve cada vez más difícil.","s":"@hoyo"},{"t":"Si lo aprietas demasiado, ni la luz se escapa.","s":"@hoyo"},{"t":"Eso es un hoyo negro.","s":"@hoyo"},{"t":"Por ejemplo, si la Tierra fuera uno, cabría en tu mano.","s":"@hoyo"},{"t":"Otro ejemplo: el centro de nuestra galaxia.","s":"@hoyo"},{"t":"Ahí hay uno, de millones de soles.","s":"@hoyo"},{"t":"Mira qué tan grande sería, según su masa."},{"tipo":"barra","b":"hoyo","o":"Fíjate: con más masa, el círculo negro crece."},{"t":"Más masa,"},{"t":"más grande."},{"t":"Un hoyo negro es tanta masa junta que ni la luz puede salir."}]},{"id":"expansion","t":"El universo se expande","res":"Las galaxias se alejan unas de otras porque el espacio crece.","g":[{"t":"El universo se expande"},{"t":"Las galaxias se están alejando.","s":"@expansion"},{"t":"No porque viajen por el espacio.","s":"@expansion"},{"t":"Es el espacio el que crece.","s":"@expansion"},{"t":"Por ejemplo, un globo con puntos pintados.","s":"@expansion"},{"t":"Lo inflas, y todos los puntos se alejan.","s":"@expansion"},{"t":"Otro ejemplo: un pan con pasas en el horno.","s":"@expansion"},{"t":"El pan crece, y cada pasa se aleja de las demás.","s":"@expansion"},{"t":"Si retrocedes el tiempo, todo estaba junto.","s":"@expansion"},{"t":"Eso es lo que llamamos el Big Bang.","s":"@expansion"},{"t":"Mira avanzar el tiempo."},{"tipo":"barra","b":"expansion","o":"Fíjate: los puntos se separan, todos de todos."},{"t":"Hace unos 14 mil millones de años,","v":"Hace unos catorce mil millones de años,"},{"t":"empezó todo esto."},{"t":"Las galaxias se alejan unas de otras porque el espacio crece."}]},{"id":"particulas","t":"Partículas","res":"Dentro del átomo hay piezas cada vez más pequeñas.","g":[{"t":"Partículas"},{"t":"Abre un átomo.","s":"@zoom"},{"t":"Dentro hay electrones y un núcleo.","s":"@zoom"},{"t":"Abre el núcleo.","s":"@zoom"},{"t":"Hay protones y neutrones.","s":"@zoom"},{"t":"Abre un protón.","s":"@zoom"},{"t":"Hay tres quarks.","s":"@zoom"},{"t":"Por ejemplo, como una casa de ladrillos.","s":"@zoom"},{"t":"Y cada ladrillo, de granos de arena.","s":"@zoom"},{"t":"Otro ejemplo: un LEGO.","s":"@zoom"},{"t":"Con pocas piezas distintas, armas casi todo.","s":"@zoom"},{"t":"Con unas pocas partículas, se arma todo lo que ves.","s":"@zoom"},{"t":"Mira acercarte cada vez más."},{"tipo":"barra","b":"zoom","o":"Fíjate: cada vez ves lo que hay más adentro."},{"t":"Hasta donde sabemos, esas últimas piezas no se dividen."},{"t":"Dentro del átomo hay piezas cada vez más pequeñas."}]},{"id":"tunel","t":"Incertidumbre 2: atravesar paredes","res":"Una partícula muy pequeña a veces cruza una barrera que no debería poder cruzar.","g":[{"t":"Incertidumbre 2: atravesar paredes"},{"t":"Ya vimos que un electrón no tiene lugar fijo.","s":"caja"},{"t":"Parte de su onda puede pasar al otro lado de un muro.","s":"@tunel"},{"t":"A veces aparece del otro lado.","s":"@tunel"},{"t":"Es el efecto túnel.","s":"@tunel"},{"t":"Por ejemplo, una pelota contra una pared jamás la cruza.","s":"@tunel"},{"t":"Es demasiado grande.","s":"@tunel"},{"t":"Otro ejemplo: el Sol.","s":"radia"},{"t":"Sin efecto túnel, sus átomos casi no se juntarían, y no brillaría igual.","s":"radia"},{"t":"También ocurre dentro de la memoria de tu celular."},{"t":"Mira cambiar el grosor del muro."},{"tipo":"barra","b":"tunel","o":"Fíjate cuántas bolitas cruzan el muro cuando es más delgado."},{"t":"Una partícula muy pequeña a veces cruza una barrera que no debería poder cruzar."}]},{"id":"antimateria","t":"Antimateria","res":"Cada partícula tiene una gemela opuesta, y juntas se vuelven energía.","g":[{"t":"Antimateria"},{"t":"Cada partícula tiene una gemela con carga opuesta.","s":"@carga"},{"t":"El electrón tiene al positrón.","s":"@carga"},{"t":"Si se encuentran, las dos desaparecen.","s":"@emc"},{"t":"Y se vuelven pura energía.","s":"@emc"},{"t":"Por ejemplo, ciertos estudios de hospital usan positrones.","s":"@emc"},{"t":"Se llaman PET, y muestran cómo funciona tu cuerpo.","s":"@emc"},{"t":"Otro ejemplo: los plátanos sueltan algún positrón de vez en cuando."},{"t":"Por su potasio, sin ningún peligro."},{"t":"El misterio: casi todo el universo es materia, y no sabemos por qué.","s":"@expansion"},{"t":"Cada partícula tiene una gemela opuesta, y juntas se vuelven energía."}]},{"id":"estrellas","t":"La vida de las estrellas","res":"Las estrellas nacen, brillan millones de años y mueren según su tamaño.","g":[{"t":"La vida de las estrellas"},{"t":"Una estrella nace de una nube de gas."},{"t":"La gravedad la va apretando."},{"t":"Se calienta, y se enciende.","s":"radia"},{"t":"Por ejemplo, el Sol lleva unos cinco mil millones de años brillando.","s":"radia"},{"t":"Le quedan otros tantos.","s":"radia"},{"t":"Otro ejemplo: una estrella muy grande vive menos, y explota.","s":"@emc"},{"t":"Esa explosión es una supernova.","s":"@emc"},{"t":"Y lo que queda puede volverse un hoyo negro.","s":"@hoyo"},{"t":"Lo que sale de la explosión forma nuevos planetas.","s":"materia"},{"t":"Las estrellas nacen, brillan millones de años y mueren según su tamaño."}]},{"id":"oscura","t":"Materia oscura","res":"Hay algo que no vemos pero que jala a las galaxias con su gravedad.","g":[{"t":"Materia oscura"},{"t":"Las galaxias giran demasiado rápido.","s":"@expansion"},{"t":"Con lo que vemos, deberían deshacerse.","s":"@expansion"},{"t":"Algo invisible las sostiene con su gravedad.","s":"@curva"},{"t":"Lo llamamos materia oscura.","s":"@curva"},{"t":"Por ejemplo, imagina un carrusel en plena noche.","s":"astro"},{"t":"Ves luces girando, pero no los soportes que las unen.","s":"astro"},{"t":"Otro ejemplo: el viento no se ve."},{"t":"Lo notas por cómo mueve las hojas."},{"t":"Todavía no sabemos de qué está hecha. Es uno de los grandes misterios."},{"t":"Hay algo que no vemos pero que jala a las galaxias con su gravedad."}]},{"id":"entrelazamiento","t":"Entrelazamiento","res":"Dos partículas pueden compartir un estado, aunque estén lejos.","g":[{"t":"Entrelazamiento"},{"t":"Dos partículas pueden quedar unidas de forma rara.","s":"@rendija"},{"t":"Mides una, y sabes de la otra.","s":"@rendija"},{"t":"Aunque estén muy lejos.","s":"@rendija"},{"t":"Por ejemplo, dos guantes en dos cajas.","s":"@monedas"},{"t":"Abres una, y sabes qué mano hay en la otra.","s":"@monedas"},{"t":"Pero en lo cuántico, ni siquiera estaba decidido antes.","s":"@monedas"},{"t":"Otro ejemplo: esto no sirve para mandar mensajes más rápido que la luz.","s":"@sumav"},{"t":"Einstein lo llamó acción fantasmal a distancia."},{"t":"Dos partículas pued
