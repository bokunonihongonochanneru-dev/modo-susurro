<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F3F6EE"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icono-192.png"><title>Modo Susurro</title><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Modo Susurro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500&display=swap">
<style>
/* Diseño: una frase a la vez, iconos en vez de texto y controles casi invisibles arriba. Claro por defecto; oscuro suave a elección. */
:root{
  color-scheme:light;
  --papel:#E9EFE4; --hoja:#F2F5EC; --linea:#BFCDBB;
  --tinta:#26352F; --suave:#5A6A62; --azul:#2B4A92; --sobre-azul:#F5F7FC;
  --bien:#1B6E47; --bien-fondo:#D5E8D9; --tibio:rgba(214,178,110,.13);
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --texto:"Atkinson Hyperlegible",Verdana,sans-serif;
  --lento:1.5s;
}
:root[data-tema=oscuro]{
  color-scheme:dark;
  --papel:#1F2723; --hoja:#2A342F; --linea:#47554D;
  --tinta:#D5DDD3; --suave:#9BA99F; --azul:#A5BAE6; --sobre-azul:#17201C;
  --bien:#86CDA5; --bien-fondo:#27402F; --tibio:rgba(170,120,50,.07);
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;touch-action:none;background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:1.05rem;overflow:hidden;transition:background-color .5s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
svg{display:block;fill:currentColor}
#tibio{position:fixed;inset:0;background:var(--tibio);opacity:0;pointer-events:none;transition:opacity 180s linear}
#tibio.on{opacity:1}
#escena{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding-block:3.5rem 2rem;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
#marco{width:100%;max-width:44rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1rem;opacity:0;transition:opacity var(--lento) ease}
#marco.ve{opacity:1}
#marco:not(.ve){pointer-events:none}
#controles{position:fixed;z-index:3;top:env(safe-area-inset-top,0px);right:max(8px,env(safe-area-inset-right,0px));left:max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:flex-end;gap:.15rem;pointer-events:none}
#controles button{pointer-events:auto;width:2.9rem;height:2.9rem;display:grid;place-items:center;color:var(--suave);opacity:.75}
#controles svg{width:1.5rem;height:1.5rem}
#brillo-zona{position:fixed;z-index:3;left:0;top:0;bottom:0;width:calc(3.1rem + env(safe-area-inset-left,0px));padding-left:env(safe-area-inset-left,0px);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding-block:.6rem .9rem;color:var(--suave)}
#brillo-zona span{width:1.45rem;height:1.45rem;opacity:.6;display:block}
#brillo-zona #br-bajo{width:1.1rem;height:1.1rem;opacity:.35}
#brillo-velo{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}
.obs{font-family:var(--display);font-weight:500;font-size:1.05rem;line-height:1.25;color:var(--azul);margin:0;text-wrap:balance}
.toca{display:flex;align-items:center;gap:.5rem;color:var(--azul);height:2.1rem}
.mano{width:1.9rem;height:1.9rem;display:block}
.luzita{width:.7rem;height:.7rem;border-radius:50%;background:var(--azul);animation:parpadea 1.1s ease-in-out infinite}
@keyframes parpadea{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
#pista{position:fixed;left:0;right:0;bottom:calc(.9rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));color:var(--suave);font-size:.92rem;opacity:0;transition:opacity 1s;pointer-events:none}
#pista.ve{opacity:1}
.frase{font-family:var(--display);font-weight:500;font-size:clamp(2rem,8.5vmin,3.6rem);line-height:1.15;letter-spacing:-.015em;text-wrap:balance;margin:0}
.chica{color:var(--suave);font-size:1.1rem;margin:0;font-variant-numeric:tabular-nums}
.dato{font-family:var(--display);font-weight:500;font-size:clamp(2.4rem,11vmin,4.4rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vis{display:block;width:100%;height:clamp(11rem,36vh,19rem)}
.lado{display:flex;flex-direction:column;align-items:center;gap:.6rem;min-width:0;width:100%}
.linea{width:min(100%,14rem);height:.2rem;border-radius:1rem;background:var(--linea);overflow:hidden}
.linea i{display:block;height:100%;background:var(--azul);border-radius:1rem}
.ayuda{font-size:.92rem;transition:opacity .6s}
#b-r.sr{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3.25rem;background:transparent;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:.3rem;background:var(--linea);border-radius:1rem}
input[type=range]::-moz-range-track{height:.3rem;background:var(--linea);border-radius:1rem}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2.1rem;height:2.1rem;margin-top:-.9rem;border-radius:50%;background:var(--azul);border:4px solid var(--hoja)}
input[type=range]::-moz-range-thumb{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--azul);border:4px solid var(--hoja)}
.primario{min-height:3.5rem;padding:.5rem 2.5rem;border-radius:2rem;background:var(--azul);color:var(--sobre-azul);font-weight:700;font-size:1.1rem;text-align:center}
.quieto{min-height:2.75rem;padding:.3rem 1rem;color:var(--azul);text-align:center}
.hoja{touch-action:pan-y;position:fixed;left:0;right:0;bottom:0;background:var(--hoja);border-radius:1.2rem 1.2rem 0 0;padding-top:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-height:92%;overflow:auto;z-index:5}
.hoja-in{width:100%;max-width:42rem;margin-inline:auto;display:flex;flex-direction:column;gap:.8rem;padding-right:2.5rem}
.ctl-t{display:flex;justify-content:space-between;color:var(--suave);font-size:.95rem}
.ajuste{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.ajuste>span{color:var(--suave);font-size:.95rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{min-height:2.75rem;min-width:2.75rem;padding:.25rem .9rem;border-radius:2rem;background:var(--papel);font-size:.95rem;text-align:center}
#aviso-mano,#aviso-marco{position:fixed;pointer-events:none;opacity:0}
#aviso-marco{inset:0;z-index:5;box-shadow:inset 0 0 2.2rem .4rem #e0b45c}
#aviso-marco.va{animation:marcoB 3.2s ease-in-out 1 both}
#aviso-mano{left:50%;top:50%;width:min(38vmin,12rem);height:min(38vmin,12rem);margin:calc(min(38vmin,12rem)/-2);z-index:6;color:var(--azul)}
#aviso-mano svg{width:100%;height:100%;fill:currentColor}
#aviso-mano.va{animation:manoD 1.6s ease-in-out 2 both}
@keyframes marcoB{0%,100%{opacity:0}25%{opacity:.28}50%{opacity:0}75%{opacity:.28}}
@keyframes manoD{0%{opacity:0;transform:translateX(-16vmin)}20%{opacity:.55}75%{opacity:.55}100%{opacity:0;transform:translateX(16vmin)}}
@media (prefers-reduced-motion:reduce){#aviso-mano.va{animation:manoQ 3.2s ease-in-out 1 both}@keyframes manoQ{0%,100%{opacity:0}50%{opacity:.5}}}
#controles,#br-alto,#br-bajo{transition:opacity .6s}
body.limpio #controles{opacity:0}
body.limpio #controles button{pointer-events:none}
body.limpio #brillo-zona span{opacity:0!important;transition:opacity .6s}
body.limpio.ajusta-brillo #brillo-zona span{opacity:.6!important}
.menu-ini.raiz{display:flex!important;flex-direction:column!important;align-items:center}
.menu-ini.raiz .mi small{display:block;margin:0}
.mi.inicia{font-size:clamp(2rem,10vmin,3rem);min-height:4rem}
.elegir{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.mat-et{flex-basis:100%;font-size:.8rem;color:var(--suave);margin-top:.25rem}
.chip[aria-pressed=true]{background:var(--azul);color:var(--sobre-azul)}
.lista{display:grid;grid-template-columns:1fr;gap:.1rem}
.fila{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:3rem;padding:.3rem .2rem;width:100%}
.fila .check{width:1.2rem;height:1.2rem;color:var(--bien);flex:none}
.nota{color:var(--suave);font-size:.92rem;margin:0}
.menu-ini{display:flex;flex-direction:column;align-items:center;gap:.15rem;width:100%}
.mi{min-height:3.1rem;min-width:13rem;padding:.3rem 1rem;font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,5.5vmin,2.1rem);line-height:1.15;text-align:center;border-radius:1rem;color:var(--tinta)}
.mi[disabled]{opacity:.4;cursor:default}
.niveles-sel{justify-content:center}
.niveles-sel .chip:not([aria-pressed=true]){background:var(--hoja)}
.mi small{display:block;font-family:var(--texto);font-weight:400;font-size:.9rem;color:var(--suave)}
.cierra{position:absolute;top:.35rem;right:max(.5rem,env(safe-area-inset-right,0px));width:2.75rem;height:2.75rem;display:grid;place-items:center;color:var(--suave);z-index:1}
.cierra svg{width:1.3rem;height:1.3rem}
.fila[disabled]{color:var(--suave);cursor:default}
.puntos{display:flex;gap:.4rem;padding-block:.15rem .35rem}
.puntos i{width:.6rem;height:.6rem;border-radius:50%;background:var(--linea)}
.puntos i.h{background:var(--bien)}
.puntos i.a{background:var(--azul)}
@media (orientation:landscape) and (max-height:560px){
  #escena{padding-block:.75rem;padding-right:max(3.75rem,env(safe-area-inset-right,0px));padding-left:max(3.75rem,env(safe-area-inset-left,0px))}
  #controles{bottom:0;left:auto;flex-direction:column;justify-content:flex-start}
  #marco{gap:.35rem}
  .menu-ini{gap:0}
  .raiz{display:grid;grid-template-columns:1fr 1fr;justify-items:center;gap:.2rem 1rem}
  .mi{min-height:2.55rem;font-size:clamp(1.25rem,6.5vmin,1.6rem);padding-block:.1rem}
  .mi small{display:inline;margin-left:.5rem;font-size:.8rem}
  .frase{font-size:clamp(1.8rem,11vmin,3rem)}
  #marco.con-vis{flex-direction:row;max-width:none;gap:1.5rem;height:100%}
  .con-vis .vis{flex:1.15 1 0;width:auto;min-width:0;height:100%}
  .con-vis .lado{flex:1 1 0}
  .con-vis .frase{font-size:clamp(1.5rem,8.5vmin,2.3rem)}
  .obs{font-size:.92rem}
  .lado{gap:.25rem}
  .toca{height:1.7rem}
  .mano{width:1.5rem;height:1.5rem}
  .dato{font-size:clamp(2rem,12vmin,3.2rem)}
  input[type=range]{height:2.75rem}
  .lista{grid-template-columns:1fr 1fr;column-gap:1.5rem}
  .hoja{right:3.5rem;left:max(0px,env(safe-area-inset-left,0px));border-radius:1.2rem 1.2rem 0 0;padding-top:.6rem}
  .hoja-in{gap:.45rem}
}
@media (prefers-reduced-motion:reduce){:root{--lento:.01s}#tibio,body{transition:none}}
</style>

<div id="tibio"></div>
<div id="escena"><div id="marco" class="ve"></div></div>
<div id="controles">
  <button id="b-menu" aria-label="Niveles y lecciones"></button>
  <button id="b-pausa" aria-label="Pausar"></button>
  <button id="b-tema" aria-label="Cambiar entre modo claro y oscuro"></button>
  <button id="b-ajustes" aria-label="Configuración"></button>
  <button id="b-completa" aria-label="Pantalla completa" hidden></button>
</div>
<div id="brillo-zona" aria-hidden="true"><span id="br-alto"></span><span id="br-bajo"></span></div>
<div id="brillo-velo"></div>
<div id="aviso-marco" aria-hidden="true"></div><div id="aviso-mano" aria-hidden="true"></div>
<div id="pista"><span>← atrás</span><span>panel</span><span>sigue →</span></div>

<div id="s-ajustes" class="hoja" hidden><button class="cierra" aria-label="Cerrar"></button><div class="hoja-in">
  <div>
    <div class="ctl-t"><label for="ritmo">Ritmo</label><span id="ritmo-v"></span></div>
    <input type="range" id="ritmo" min="0.7" max="1.4" step="0.05" value="1">
  </div>
    <div>
    <div class="ctl-t"><label for="lluvia">Volumen de la lluvia</label><span id="lluvia-v"></span></div>
    <input type="range" id="lluvia" min="0" max="1" step="0.02" value="0">
  </div>
  <div id="c-voz" hidden><div class="ctl-t"><span>Voz sin internet</span><span id="voz-v"></span></div><button class="chip" id="b-voz" style="margin-top:.35rem">Descargar toda la voz</button></div>
  <p class="nota" id="av-audio" hidden>Este navegador no reproduce la voz; verás solo el texto.</p>
</div></div>

<div id="s-menu" class="hoja" hidden><button class="cierra" aria-label="Cerrar"></button><div class="hoja-in">
  <div class="chips" id="niveles"></div>
  <p class="chica" id="n-nombre"></p>
  <div class="lista" id="lecs"></div>
    <button class="fila" id="a-inicio"><span>Volver al inicio</span></button>

const NIVELES=[{"id":"A1","nom":"Lo cotidiano","lec":[{"id":"medir","t":"Medir","res":"Medir es decir cuánto, con números.","g":[{"t":"Medir"},{"t":"Alguien te dice: está lejos."},{"t":"¿Lejos como la tienda?"},{"t":"¿O lejos como la Luna?"},{"t":"La palabra lejos no dice cuánto."},{"t":"Por eso la física mide."},{"t":"Usamos tres medidas.","s":"tres"},{"t":"El metro, para saber qué tan largo es algo.","s":"tres"},{"t":"El segundo, para saber cuánto tarda algo.","s":"tres"},{"t":"El kilogramo, para saber cuánta cosa hay.","s":"tres"},{"t":"Por ejemplo, una puerta mide unos dos metros de alto."},{"t":"Son como dos pasos grandes, uno encima del otro."},{"t":"Otro ejemplo: un litro de leche pesa como un kilo."},{"t":"Y un segundo dura más o menos un latido tranquilo."},{"t":"Hay cosas muy chicas y muy grandes."},{"t":"Para no escribir tantos ceros, hay un truco.","s":"potencias"},{"t":"10³ es un uno con tres ceros.","s":"potencias","v":"Diez al cubo es un uno con tres ceros."},{"t":"O sea, mil.","s":"potencias"},{"t":"Mira del átomo al universo."},{"tipo":"barra","b":"escala","o":"Fíjate: cada dibujo es muchísimo más grande que el anterior."},{"t":"Cada paso es muchísimo más grande que el anterior."},{"t":"Medir es decir cuánto, con números."}]},{"id":"moverse","t":"Moverse","res":"Velocidad es cuánto camino recorres, en cuánto tiempo.","g":[{"t":"Moverse"},{"t":"Imagina que vas en bici."},{"t":"Si recorres más camino en el mismo tiempo,","s":"vdt"},{"t":"vas más rápido.","s":"vdt"},{"t":"Eso es la velocidad.","s":"vdt"},{"t":"Cuánto camino, en cuánto tiempo.","s":"vdt"},{"t":"Por ejemplo, un carro a cien kilómetros por hora.","s":"vdt"},{"t":"En una hora, recorre cien kilómetros.","s":"vdt"},{"t":"En dos horas, doscientos.","s":"vdt"},{"t":"Otro ejemplo: tú caminando, en una hora recorres unos cinco.","s":"vdt"},{"t":"Ahora, un viaje de Chihuahua a Juárez."},{"t":"370 km","v":"Son unos trescientos setenta kilómetros."},{"t":"Mira lo que tarda cada vehículo."},{"tipo":"barra","b":"viaje","o":"Fíjate en el tiempo: baja cuando el vehículo es más rápido."},{"t":"Más velocidad,"},{"t":"menos tiempo."},{"t":"Acostado en tu cama, también te mueves.","s":"giro"},{"t":"La Tierra gira, y te lleva con ella.","s":"giro"},{"t":"No lo sientes, porque todo va contigo.","s":"giro"},{"t":"Acelerar es cambiar de velocidad.","s":"acelera"},{"t":"Pisar el pedal es acelerar.","s":"acelera"},{"t":"Frenar, también.","s":"acelera"},{"t":"Dar vuelta, también.","s":"curva"},{"t":"Porque cambias de dirección.","s":"curva"},{"t":"Velocidad es cuánto camino recorres, en cuánto tiempo."}]},{"id":"inercia","t":"Inercia","res":"Las cosas siguen como van, hasta que algo las cambia.","g":[{"t":"Inercia"},{"t":"Vas de pie en un camión.","s":"frenazo"},{"t":"Frena de golpe.","s":"frenazo"},{"t":"Tu cuerpo se va para adelante.","s":"frenazo"},{"t":"Nadie te empujó.","s":"frenazo"},{"t":"Tu cuerpo solo quería seguir como iba.","s":"frenazo"},{"t":"Eso es la inercia."},{"t":"Lo que está quieto quiere seguir quieto."},{"t":"Lo que se mueve quiere seguir moviéndose.","s":"sigue"},{"t":"Otro ejemplo: jala rápido un mantel de la mesa."},{"t":"Los platos casi no se mueven."},{"t":"Querían seguir quietos."},{"t":"¿Por qué se detiene una pelota?","s":"frena"},{"t":"Porque el piso la va frenando.","s":"friccion"},{"t":"Eso se llama fricción.","s":"friccion"},{"t":"Mira un disco en distintos pisos."},{"tipo":"barra","b":"inercia","o":"Fíjate hasta dónde llega el disco en cada piso."},{"t":"En una alfombra, frena pronto."},{"t":"En hielo, casi no frena."},{"t":"Sin nada que lo frene, no para nunca.","s":"sigue"},{"t":"Por eso sirve el cinturón.","s":"frenazo"},{"t":"Frena tu cuerpo junto con el carro.","s":"frenazo"},{"t":"Las cosas siguen como van, hasta que algo las cambia."}]},{"id":"fuerza","t":"Fuerza","res":"Más fuerza, arranca más rápido. Más masa, arranca más lento.","g":[{"t":"Fuerza"},{"t":"Una fuerza es un empujón,","s":"empuja"},{"t":"o un jalón.","s":"jala"},{"t":"Por ejemplo, un carrito del súper vacío.","s":"carrito"},{"t":"Lo empujas, y arranca fácil.","s":"carrito"},{"t":"Ahora llénalo.","s":"carritos"},{"t":"Con el mismo empujón, arranca mucho más lento.","s":"carritos"},{"t":"Tiene más masa.","s":"carritos"},{"t":"Otro ejemplo: patea un balón. Sale volando."},{"t":"Patea una piedra grande. No se mueve, y te duele el pie."},{"t":"Mira la misma fuerza con distintas cosas."},{"tipo":"barra","b":"fuerza","o":"Fíjate: la flecha es igual, pero lo pesado arranca más lento."},{"t":"Una mochila sale disparada."},{"t":"Un carro casi no se mueve."},{"t":"Otra cosa curiosa."},{"t":"Empuja una pared con la mano.","s":"pared"},{"t":"Sientes que la pared te empuja también.","s":"pared"},{"t":"Las fuerzas siempre vienen en pareja.","s":"pared"},{"t":"Así vuela un cohete.","s":"cohete"},{"t":"Lanza gas hacia abajo.","s":"cohete"},{"t":"Y el gas lo empuja hacia arriba.","s":"cohete"},{"t":"Más fuerza, arranca más rápido. Más masa, arranca más lento."}]},{"id":"caida","t":"Caída libre","res":"Sin aire, todo cae igual de rápido.","g":[{"t":"Caída libre"},{"t":"Suelta una mancuerna y una pluma.","s":"aire"},{"t":"Gana la mancuerna.","s":"aire"},{"t":"¿Pesa más, y por eso cae más rápido?","s":"aire"},{"t":"No. A la pluma la frena el aire.","s":"aire"},{"t":"Quita el aire.","s":"igual"},{"t":"Las dos caen juntas.","s":"igual"},{"t":"Por ejemplo, un astronauta lo hizo en la Luna, donde no hay aire.","s":"igual"},{"t":"Soltó un martillo y una pluma.","s":"igual"},{"t":"Llegaron al mismo tiempo.","s":"igual"},{"t":"Otro ejemplo: suelta una hoja de papel. Cae despacito.","s":"aire"},{"t":"Hazla bolita y suéltala. Cae rápido.","s":"igual"},{"t":"Es la misma hoja. Solo cambió el aire que la frena."},{"t":"Mira cuánto tarda en caer desde cada altura."},{"tipo":"barra","b":"caida","o":"Fíjate cuánto tarda la bolita en llegar al suelo."},{"t":"Al caer, cada segundo vas más rápido."},{"t":"El doble de altura no es el doble de tiempo."},{"t":"El aire también pone un límite.","s":"terminal"},{"t":"Mientras más rápido caes, más te empuja.","s":"terminal"},{"t":"Llega un punto en que ya no aceleras.","s":"terminal"},{"t":"Sin aire, todo cae igual de rápido."}]},{"id":"peso","t":"Masa y peso","res":"Tu masa no cambia. Tu peso depende de dónde estés.","g":[{"t":"Masa y peso"},{"t":"Tu cuerpo tiene cierta cantidad de materia.","s":"materia"},{"t":"Eso es tu masa.","s":"materia"},{"t":"No cambia, aunque viajes.","s":"materia"},{"t":"Tu peso es otra cosa.","s":"jalon"},{"t":"Es cuánto te jala un planeta.","s":"jalon"},{"t":"Por ejemplo, una mochila de diez kilos en la Tierra.","s":"jalon"},{"t":"En la Luna, se siente como de menos de dos.","s":"jalon"},{"t":"Es la misma mochila, con las mismas cosas."},{"t":"Mira tu báscula en otros mundos."},{"tipo":"barra","b":"peso","o":"Fíjate cómo cambia la flecha del jalón en cada mundo."},{"t":"Otro ejemplo: en la Luna saltarías muy alto."},{"t":"En Júpiter, te costaría levantarte."},{"t":"Tu cuerpo es el mismo. Lo que cambia es el jalón."},{"t":"Todo atrae a todo.","s":"atrae"},{"t":"Tú también jalas a la Tierra.","s":"atrae"},{"t":"Pero es tan grande, que ni se nota.","s":"atrae"},{"t":"Los astronautas flotan porque van cayendo.","s":"astro"},{"t":"Caen alrededor de la Tierra, sin tocarla.","s":"astro"},{"t":"Tu masa no cambia. Tu peso depende de dónde estés."}]},{"id":"energia","t":"Energía","res":"La energía no se gasta: cambia de forma.","g":[{"t":"Energía"},{"t":"La energía es lo que hace que pasen cosas."},{"t":"Que algo se mueva, se caliente o se ilumine."},{"t":"Por ejemplo, sube una pelota a lo alto.","s":"alto"},{"t":"Ahí guarda energía.","s":"alto"},{"t":"Suéltala.","s":"alto"},{"t":"Esa energía se vuelve movimiento.","s":"alto"},{"t":"Cuando frena, se vuelve calor.","s":"calienta"},{"t":"Otro ejemplo: frota tus manos."},{"t":"Se calientan, ¿verdad?","s":"calienta"},{"t":"Movimiento convertido en calor.","s":"calienta"},{"t":"Otro más: la comida es energía guardada."},{"t":"Por eso, después de comer, puedes correr."},{"t":"La energía nunca se acaba. Solo cambia de forma."},{"t":"Ahora, mira a un carro frenar."},{"tipo":"barra","b":"energia","o":"Fíjate en la barra roja: es el camino que necesita para frenar."},{"t":"El doble de velocidad,"},{"t":"necesita cuatro veces más camino para frenar."},{"t":"La energía no se gasta: cambia de forma."}]},{"id":"calor","t":"Calor","res":"Temperatura es qué tan rápido se mueven las partículas.","g":[{"t":"Calor"},{"t":"Todo está hecho de bolitas muy chiquitas.","s":"agita"},{"t":"Se llaman partículas.","s":"agita"},{"t":"Y nunca se quedan quietas.","s":"agita"},{"t":"Frío: se mueven despacio.","s":"agita"},{"t":"Caliente: se mueven rápido.","s":"agita"},{"t":"Mira el agua por dentro."},{"tipo":"barra","b":"calor","o":"Fíjate cómo se mueven las bolitas con más temperatura."},{"t":"En el hielo, apenas tiemblan en su lugar."},{"t":"En el agua, se resbalan unas con otras."},{"t":"En el vapor, salen volando."},{"t":"El calor pasa de lo caliente a lo frío.","s":"cuchara"},{"t":"Por ejemplo, una cuchara en la sopa.","s":"cuchara"},{"t":"El calor sube por el metal, hasta tu mano.","s":"cuchara"},{"t":"Otro ejemplo: el agua caliente sube en la olla.","s":"olla"},{"t":"Y el Sol nos calienta como luz invisible.","s":"radia"},{"t":"Tu cobija no da calor.","s":"cobija"},{"t":"El calor lo das tú.","s":"cobija"},{"t":"La cobija solo lo guarda.","s":"cobija"},{"t":"Temperatura es qué tan rápido se mueven las partículas."}]},{"id":"sonido","t":"Sonido","res":"El sonido es algo que vibra y empuja el aire hasta tu oído.","g":[{"t":"Sonido"},{"t":"Pon los dedos en tu garganta y tararea."},{"t":"Sientes que vibra.","s":"cuerda"},{"t":"Eso es el sonido: algo que vibra.","s":"cuerda"},{"t":"La vibración empuja el aire.","s":"aireS"},{"t":"Y el aire empuja tu oído.","s":"oido"},{"t":"Por ejemplo, tira una piedra en un charco.","s":"oido"},{"t":"Salen olas en círculo. El sonido viaja así.","s":"oido"},{"t":"Sin aire, no hay sonido.","s":"vacio"},{"t":"Por eso en el espacio no se oye nada.","s":"vacio"},{"t":"Vibra despacio: suena grave.","s":"agudo"},{"t":"Como un tambor grande.","s":"agudo"},{"t":"Vibra rápido: suena agudo.","s":"agudo"},{"t":"Como un silbato.","s":"agudo"},{"t":"Mira cómo cambia la onda."},{"tipo":"barra","b":"sonido","o":"Fíjate: la onda se aprieta cuando la nota sube."},{"t":"Si vibra el doble de rápido,"},{"t":"es la misma nota, más arriba."},{"t":"Vibra más grande: suena más fuerte.","s":"onda"},{"t":"Primero ves el rayo, y luego oyes el trueno.","s":"rayo"},{"t":"Porque la luz es mucho más rápida.","s":"rayo"},{"t":"El sonido es algo que vibra y empuja el aire hasta tu oído."}]},{"id":"luz","t":"Luz","res":"La luz es lo más rápido que hay, y cada color es una onda distinta.","g":[{"t":"Luz"},{"t":"Nada conocido va más rápido que la luz."},{"t":"Le da siete vueltas a la Tierra,","s":"vueltas"},{"t":"en un solo segundo.","s":"vueltas"},{"t":"Por ejemplo, prende un foco en el cuarto."},{"t":"Te llega tan rápido que parece instantáneo."},{"t":"La luz viaja como una onda."},{"t":"Y cada color es una onda distinta."},{"tipo":"barra","b":"luz","o":"Fíjate cómo cambia el color al cambiar el tamaño de la onda."},{"t":"El ojo solo ve una parte."},{"t":"La luz blanca es una mezcla de colores.","s":"mezcla"},{"t":"Otro ejemplo: el arcoíris.","s":"mezcla"},{"t":"Es esa mezcla, separada por las gotas de agua.","s":"mezcla"},{"t":"¿Por qué el cielo es azul?","s":"cielo"},{"t":"El aire rebota más la luz azul.","s":"cielo"},{"t":"Y ese azul nos llega de todos lados.","s":"cielo"},{"t":"Mirar lejos es ver el pasado.","s":"pasado"},{"t":"La luz del Sol tarda ocho minutos.","s":"pasado"},{"t":"La luz es lo más rápido que hay, y cada color es una onda distinta."}]},{"id":"gravedad","t":"Caída 2: la gravedad","res":"La gravedad es el jalón que une a todo lo que tiene masa.","g":[{"t":"Caída 2: la gravedad"},{"t":"Ya vimos cómo caen las cosas.","s":"igual"},{"t":"Ahora, ¿por qué caen?"},{"t":"La Tierra jala todo hacia su centro.","s":"jalon"},{"t":"Por ejemplo, en Australia, abajo es su suelo.","s":"giro"},{"t":"Nadie se cae al espacio.","s":"giro"},{"t":"Otro ejemplo: lanza una pelota hacia arriba.","s":"@caida"},{"t":"La gravedad la frena, y la regresa.","s":"@caida"},{"t":"Mientras más masa, más jala."},{"t":"Por eso la Luna jala menos que la Tierra."},{"t":"Mira cuánto tarda en caer desde cada altura."},{"tipo":"barra","b":"caida","o":"Fíjate cuánto tarda la bolita en llegar al suelo."},{"t":"Lo mismo que sostiene tu cama sostiene a la Luna en su lugar."},{"t":"La gravedad es el jalón que une a todo lo que tiene masa."}]},{"id":"friccion","t":"Fuerza 2: la fricción","res":"La fricción es el roce que frena las cosas, y también nos permite caminar.","g":[{"t":"Fuerza 2: la fricción"},{"t":"Ya vimos que una fuerza empuja o jala.","s":"empuja"},{"t":"Hay una que frena casi todo: la fricción.","s":"friccion"},{"t":"Es el roce entre dos cosas.","s":"friccion"},{"t":"Por ejemplo, frena en bici sobre el pavimento.","s":"friccion"},{"t":"Ahora frena sobre hielo. Te resbalas.","s":"@inercia"},{"t":"Hay muy poca fricción.","s":"@inercia"},{"t":"Pero sin fricción, tampoco podrías caminar."},{"t":"Otro ejemplo: unos tenis nuevos agarran mejor el suelo."},{"t":"Y un cerillo prende por la fricción con la caja."},{"t":"Mira un disco en distintos pisos."},{"tipo":"barra","b":"inercia","o":"Fíjate hasta dónde llega el disco en cada piso."},{"t":"Menos fricción, más lejos llega."},{"t":"La fricción es el roce que frena las cosas, y también nos permite caminar."}]},{"id":"palanca","t":"Palancas","res":"Con un brazo más largo, levantas lo mismo con mucha menos fuerza.","g":[{"t":"Palancas"},{"t":"Imagina un sube y baja.","s":"@palanca"},{"t":"De un lado, un niño. Del otro, un adulto.","s":"@palanca"},{"t":"Si el niño se sienta más lejos, puede levantar al adulto.","s":"@palanca"},{"t":"Eso es una palanca.","s":"@palanca"},{"t":"Por ejemplo, abrir una puerta.","s":"@palanca"},{"t":"Empujar cerca de las bisagras cuesta mucho.","s":"@palanca"},{"t":"Empujar lejos, en la perilla, es fácil.","s":"@palanca"},{"t":"Otro ejemplo: unas tijeras o un destapador.","s":"@palanca"},{"t":"Mira levantar una piedra con un palo cada vez más largo."},{"tipo":"barra","b":"palanca","o":"Fíjate: con el brazo más largo, la fuerza que necesitas baja."},{"t":"Más largo el brazo,"},{"t":"menos fuerza necesitas."},{"t":"Con un brazo más largo, levantas lo mismo con mucha menos fuerza."}]},{"id":"energia2","t":"Energía 2: de dónde viene","res":"Casi toda la energía que usamos empezó como luz del Sol.","g":[{"t":"Energía 2: de dónde viene"},{"t":"Ya vimos que la energía cambia de forma.","s":"alto"},{"t":"Ahora, ¿de dónde sale?","s":"radia"},{"t":"Casi toda empieza en el Sol.","s":"radia"},{"t":"Por ejemplo, una planta guarda luz del Sol.","s":"radia"},{"t":"Una vaca se come la planta."},{"t":"Tú comes, y esa energía te mueve."},{"t":"Otro ejemplo: la gasolina."},{"t":"Son plantas y animalitos de hace millones de años."},{"t":"Es luz del Sol antigua, guardada bajo tierra."},{"t":"Y el viento también: el Sol calienta el aire, y el aire se mueve.","s":"radia"},{"t":"La próxima vez que comas, piensa en eso."},{"t":"Casi toda la energía que usamos empezó como luz del Sol."}]},{"id":"calor2","t":"Calor 2: derretir y hervir","res":"Al calentar algo, llega un punto en que cambia de sólido a líquido, o a gas.","g":[{"t":"Calor 2: derretir y hervir"},{"t":"Ya vimos que el calor agita las partículas.","s":"agita"},{"t":"Si se agitan mucho, se sueltan.","s":"agita"},{"t":"Por ejemplo, un hielo sacado del congelador.","s":"@calor"},{"t":"Se calienta, y se vuelve agua.","s":"@calor"},{"t":"Otro ejemplo: una olla al fuego.","s":"olla"},{"t":"Al hervir, el agua se va como vapor.","s":"olla"},{"t":"Mientras hierve, el agua no se calienta más.","s":"olla"},{"t":"Toda esa energía se usa en escapar.","s":"olla"},{"t":"Mira el agua por dentro, de hielo a vapor."},{"tipo":"barra","b":"calor","o":"Fíjate cómo se mueven las bolitas con más temperatura."},{"t":"Y al revés también: el vapor se enfría,"},{"t":"y salen gotitas en el espejo del baño."},{"t":"Al calentar algo, llega un punto en que cambia de sólido a líquido, o a gas."}]},{"id":"luz2","t":"Luz 2: sombras","res":"La luz va en línea recta, y lo que le estorba hace sombra.","g":[{"t":"Luz 2: sombras"},{"t":"La luz viaja en línea recta.","s":"@sombra"},{"t":"Lo que le estorba deja una sombra.","s":"@sombra"},{"t":"Por ejemplo, pon tu mano frente a una lámpara.","s":"@sombra"},{"t":"Si la acercas a la lámpara, la sombra crece.","s":"@sombra"},{"t":"Otro ejemplo: tu sombra en la calle.","s":"@sombra"},{"t":"Al mediodía es cortita.","s":"@sombra"},{"t":"En la tarde es larguísima.","s":"@sombra"},{"t":"Mira moverse el Sol."},{"tipo":"barra","b":"sombra","o":"Fíjate: con el Sol más bajo, la sombra se alarga."},{"t":"Antes de los relojes, así se medía la hora."},{"t":"La luz va en línea recta, y lo que le estorba hace sombra."}]},{"id":"sonido2","t":"Sonido 2: la música","res":"Una nota es una vibración, y las octavas duplican la frecuencia.","g":[{"t":"Sonido 2: la música"},{"t":"Ya vimos que el sonido es vibración.","s":"cuerda"},{"t":"Una nota es una vibración muy pareja.","s":"agudo"},{"t":"El ruido no es parejo."},{"t":"Por ejemplo, una cuerda de guitarra.","s":"cuerda"},{"t":"Cuerda corta: agudo. Cuerda larga: grave.","s":"cuerda"},{"t":"Otro ejemplo: aprieta una cuerda con el dedo.","s":"cuerda"},{"t":"La acortas, y la nota sube.","s":"cuerda"},{"t":"Si la frecuencia se duplica, suena la misma nota, más arriba.","s":"agudo"},{"t":"Mira cómo cambia la nota."},{"tipo":"barra","b":"sonido","o":"Fíjate: la onda se aprieta cuando la nota sube."},{"t":"Por eso un piano repite sus notas, de grave a agudo."},{"t":"Una nota es una vibración, y las octavas duplican la frecuencia."}]},{"id":"diaynoche","t":"Día y noche","res":"Es de día de un lado de la Tierra, porque gira frente al Sol.","g":[{"t":"Día y noche"},{"t":"El Sol parece moverse por el cielo.","s":"pasado"},{"t":"Pero la que gira es la Tierra.","s":"giro"},{"t":"Da una vuelta cada día.","s":"giro"},{"t":"Por ejemplo, gira sobre ti mismo frente a una lámpara.","s":"giro"},{"t":"A veces te da la luz en la cara.","s":"giro"},{"t":"A veces, en la espalda.","s":"giro"},{"t":"Otro ejemplo: cuando aquí es de noche, en Japón es de día.","s":"giro"},{"t":"Es el otro lado de la pelota.","s":"giro"},{"t":"Por eso existen las zonas horarias."},{"t":"Es de día de un lado de la Tierra, porque gira frente al Sol."}]},{"id":"estaciones","t":"Las estaciones","res":"Hay verano e invierno porque la Tierra está inclinada.","g":[{"t":"Las estaciones"},{"t":"Muchos creen que en verano estamos más cerca del Sol."},{"t":"No es por eso.","s":"@estaciones"},{"t":"La Tierra está inclinada, como un trompo ladeado.","s":"@estaciones"},{"t":"Por eso, a ratos el norte recibe más Sol.","s":"@estaciones"},{"t":"Y a ratos, menos.","s":"@estaciones"},{"t":"Por ejemplo, una linterna apuntando directo al piso.","s":"@estaciones"},{"t":"Hace un círculo chico y fuerte. Eso es verano.","s":"@estaciones"},{"t":"Otro ejemplo: esa misma linterna, de ladito.","s":"@estaciones"},{"t":"La luz se reparte y calienta menos. Eso es invierno.","s":"@estaciones"},{"t":"Mira el año pasar."},{"tipo":"barra","b":"estaciones","o":"Fíjate en la raya: es la inclinación que da verano o invierno."},{"t":"Cuando aquí es invierno, en Argentina es verano."},{"t":"Hay verano e invierno porque la Tierra está inclinada."}]},{"id":"fases","t":"Fases de la Luna","res":"La Luna cambia de forma porque vemos distintas partes iluminadas.","g":[{"t":"Fases de la Luna"},{"t":"La Luna no tiene luz propia.","s":"@fases"},{"t":"Brilla porque el Sol la ilumina.","s":"@fases"},{"t":"Siempre tiene una mitad iluminada.","s":"@fases"},{"t":"Pero desde aquí, vemos distintas partes de esa mitad.","s":"@fases"},{"t":"Por ejemplo, una pelota blanca junto a una lámpara.","s":"@fases"},{"t":"Camina a su alrededor.","s":"@fases"},{"t":"A veces la ves entera iluminada, y a veces solo una rebanadita.","s":"@fases"},{"t":"Otro ejemplo: si está llena, sale cuando el Sol se mete.","s":"@fases"},{"t":"Mira pasar los días."},{"tipo":"barra","b":"fases","o":"Fíjate cómo cambia la parte iluminada de la Luna."},{"t":"El ciclo completo tarda casi un mes."},{"t":"La Luna cambia de forma porque vemos distintas partes iluminadas."}]},{"id":"aire","t":"El aire existe","res":"El aire no se ve, pero es materia y ocupa lugar.","g":[{"t":"El aire existe"},{"t":"No vemos el aire, pero está aquí."},{"t":"Es una mezcla de gases, sobre todo nitrógeno y oxígeno.","s":"agita"},{"t":"Por ejemplo, infla un globo."},{"t":"Lo que lo llena es aire, empujando las paredes."},{"t":"Otro ejemplo: mete un vaso boca abajo al agua."},{"t":"El agua no sube, porque adentro hay aire."},{"t":"El aire también pesa."},{"t":"Sobre tu cuerpo hay una columna de aire de muchos kilómetros.","s":"jalon"},{"t":"No la sientes, porque empuja por todos lados."},{"t":"El aire no se ve, pero es materia y ocupa lugar."}]},{"id":"viento","t":"El viento","res":"El viento es aire que se mueve de donde hay más presión a donde hay menos.","g":[{"t":"El viento"},{"t":"El Sol no calienta parejo."},{"t":"El aire caliente sube, y el aire frío llega a ocupar su lugar.","s":"olla"},{"t":"Eso es el viento.","s":"@viento"},{"t":"Por ejemplo, en la playa, de día.","s":"@viento"},{"t":"La tierra se calienta más que el mar.","s":"@viento"},{"t":"Por eso la brisa viene del mar.","s":"@viento"},{"t":"Otro ejemplo: abre una puerta en invierno."},{"t":"Sientes cómo entra el aire frío por abajo."},{"t":"Mira con más diferencia de calor."},{"tipo":"barra","b":"viento","o":"Fíjate: más diferencia de calor, más fuerte el viento."},{"t":"El viento es aire que se mueve de donde hay más presión a donde hay menos."}]},{"id":"espejos","t":"Espejos","res":"La luz rebota en un espejo con el mismo ángulo con el que llega.","g":[{"t":"Espejos"},{"t":"Una superficie lisa rebota la luz ordenadamente.","s":"@espejo"},{"t":"Por eso te ves en un espejo.","s":"@espejo"},{"t":"Es como una pelota contra una pared.","s":"@espejo"},{"t":"Llega inclinada, y sale inclinada igual.","s":"@espejo"},{"t":"Por ejemplo, el espejo de un carro."},{"t":"Ves atrás, porque la luz da una vuelta en él."},{"t":"Otro ejemplo: un charco quieto refleja el cielo."},{"t":"Si se agita, el reflejo se rompe."},{"t":"Mira cambiar el ángulo."},{"tipo":"barra","b":"espejo","o":"Fíjate: la luz rebota con el mismo ángulo con el que llega."},{"t":"La luz rebota en un espejo con el mismo ángulo con el que llega."}]},{"id":"popote","t":"El popote doblado","res":"La luz cambia de dirección al pasar del agua al aire.","g":[{"t":"El popote doblado"},{"t":"Mete un popote en un vaso con agua."},{"t":"Parece que se dobla."},{"t":"No se dobla. Es la luz."},{"t":"La luz va más lenta en el agua que en el aire.","s":"mezcla"},{"t":"Al cambiar de velocidad, cambia de dirección.","s":"mezcla"},{"t":"Por ejemplo, un carrito que entra de lado a la arena.","s":"mezcla"},{"t":"Una rueda frena primero, y el carrito gira.","s":"mezcla"},{"t":"Otro ejemplo: una alberca se ve menos honda de lo que es."},{"t":"Por eso las lentes funcionan.","s":"@lente"},{"t":"La luz cambia de dirección al pasar del agua al aire."}]},{"id":"eco","t":"El eco","res":"El eco es tu sonido que rebota en una pared lejana y regresa.","g":[{"t":"El eco"},{"t":"Grita frente a una montaña.","s":"@eco"},{"t":"Tu voz viaja, rebota y regresa.","s":"@eco"},{"t":"Eso es el eco.","s":"@eco"},{"t":"Por ejemplo, en un cuarto vacío, tu voz suena distinta.","s":"@eco"},{"t":"Los muebles y la ropa absorben el sonido."},{"t":"Otro ejemplo: los murciélagos.","s":"@eco"},{"t":"Hacen ruiditos, y escuchan el rebote para no chocar.","s":"@eco"},{"t":"El sonido viaja a unos 340 metros por segundo.","v":"El sonido viaja a unos trescientos cuarenta metros por segundo."},{"t":"Mira con la pared más lejos."},{"tipo":"barra","b":"eco","o":"Fíjate: mientras más lejos está la pared, más tarda el eco."},{"t":"El eco es tu sonido que rebota en una pared lejana y regresa."}]},{"id":"rueda","t":"La rueda","res":"Rodar evita casi toda la fricción de arrastrar algo.","g":[{"t":"La rueda"},{"t":"Arrastra una caja por el piso.","s":"friccion"},{"t":"Cuesta, porque hay mucho roce.","s":"friccion"},{"t":"Ponle ruedas, y se mueve con un dedo.","s":"carrito"},{"t":"La rueda no se resbala sobre el piso."},{"t":"Solo va apoyando un punto tras otro."},{"t":"Por ejemplo, una maleta con rueditas.","s":"carrito"},{"t":"Otro ejemplo: un tronco bajo una piedra enorme.","s":"@palanca"},{"t":"Así se pudieron mover grandes bloques en la antigüedad."},{"t":"Por eso la rueda cambió el mundo."},{"t":"Rodar evita casi toda la fricción de arrastrar algo."}]},{"id":"equilibrio","t":"Equilibrio","res":"Algo se mantiene en equilibrio si su centro de masa queda sobre su apoyo.","g":[{"t":"Equilibrio"},{"t":"Todo tiene un punto donde se reparte su peso.","s":"@palanca"},{"t":"Se llama centro de masa.","s":"@palanca"},{"t":"Si queda sobre el apoyo, no se cae.","s":"@palanca"},{"t":"Por ejemplo, un lápiz sobre tu dedo.","s":"@palanca"},{"t":"Si lo apoyas en su mitad, se queda.","s":"@palanca"},{"t":"Otro ejemplo: cargar una mochila pesada."},{"t":"Te inclinas al otro lado, sin pensarlo."},{"t":"Mueves tu centro de masa sobre tus pies."},{"t":"Por eso los camiones altos se voltean más fácil."},{"t":"Algo se mantiene en equilibrio si su centro de masa queda sobre su apoyo."}]},{"id":"resortes","t":"Resortes","res":"Un resorte se estira más mientras más lo jalas, y regresa a su forma.","g":[{"t":"Resortes"},{"t":"Jala un resorte.","s":"@resorte"},{"t":"Se estira, y empuja de regreso.","s":"@resorte"},{"t":"Guarda energía, y la devuelve.","s":"@resorte"},{"t":"Por ejemplo, un colchón.","s":"@resorte"},{"t":"Sus resortes se hunden con tu peso.","s":"@resorte"},{"t":"Otro ejemplo: una liga en un resortera.","s":"@resorte"},{"t":"La estiras, y lanza la piedrita.","s":"@tiro"},{"t":"Por eso una báscula de resorte sirve para pesar."},{"t":"Mira colgar más peso."},{"tipo":"barra","b":"resorte","o":"Fíjate: el doble de peso estira el doble."},{"t":"Un resorte se estira más mientras más lo jalas, y regresa a su forma."}]},{"id":"pendulos","t":"Péndulos","res":"Un péndulo tarda lo mismo en ir y venir, sin importar qué tanto abra.","g":[{"t":"Péndulos"},{"t":"Cuelga una piedra de un hilo.","s":"@pendulo"},{"t":"Se mueve de ida y de regreso.","s":"@pendulo"},{"t":"Lo curioso: casi tarda lo mismo si abre poco o mucho.","s":"@pendulo"},{"t":"Eso lo notó Galileo mirando una lámpara.","s":"@pendulo"},{"t":"Por eso sirvió para los relojes antiguos."},{"t":"Por ejemplo, un reloj de pared con su péndulo.","s":"@pendulo"},{"t":"Otro ejemplo: un columpio.","s":"@pendulo"},{"t":"Con cadenas más largas, va más despacio.","s":"@pendulo"},{"t":"Mira con hilos de distinto largo."},{"tipo":"barra","b":"pendulo","o":"Fíjate: con el hilo más largo, va más despacio."},{"t":"Un péndulo tarda lo mismo en ir y venir, sin importar qué tanto abra."}]},{"id":"densidad","t":"Densidad","res":"Densidad es cuánta masa hay en cierto espacio.","g":[{"t":"Densidad"},{"t":"Una bolsa de plumas y una de arena, del mismo tamaño.","s":"materia"},{"t":"La de arena pesa muchísimo más.","s":"materia"},{"t":"Tiene más masa en el mismo espacio.","s":"materia"},{"t":"Eso es la densidad.","s":"materia"},{"t":"Por ejemplo, el aceite flota sobre el agua.","s":"@flota"},{"t":"Es menos denso.","s":"@flota"},{"t":"Otro ejemplo: un globo de helio sube.","s":"@flota"},{"t":"El helio es menos denso que el aire.","s":"@flota"},{"t":"Mira distintos materiales."},{"tipo":"barra","b":"flota","o":"Fíjate si el cuadro se queda arriba o se va al fondo."},{"t":"Densidad es cuánta masa hay en cierto espacio."}]},{"id":"eclipses","t":"Eclipses","res":"Un eclipse es cuando la Luna o la Tierra hacen sombra sobre la otra.","g":[{"t":"Eclipses"},{"t":"La Luna da vueltas alrededor de la Tierra.","s":"@eclipse"},{"t":"A veces queda justo entre la Tierra y el Sol.","s":"@eclipse"},{"t":"Y nos tapa el Sol.","s":"@eclipse"},{"t":"Es un eclipse de Sol.","s":"@eclipse"},{"t":"Por ejemplo, tapa una lámpara con tu pulgar.","s":"@eclipse"},{"t":"Tu dedo es chico, pero está cerca.","s":"@eclipse"},{"t":"Otro ejemplo: el eclipse de Luna.","s":"@eclipse"},{"t":"La Tierra le hace sombra, y la Luna se ve rojiza.","s":"@eclipse"},{"t":"Nunca veas el Sol directo sin protección especial."},{"t":"Mira pasar la Luna."},{"tipo":"barra","b":"eclipse","o":"Fíjate cuando la Luna tapa al Sol."},{"t":"Un eclipse es cuando la Luna o la Tierra hacen sombra sobre la otra."}]},{"id":"evaporar","t":"Soplarle a la sopa","res":"Las partículas más rápidas escapan, y lo que queda se enfría.","g":[{"t":"Soplarle a la sopa"},{"t":"La sopa caliente tiene partículas muy agitadas.","s":"agita"},{"t":"Las más rápidas se escapan al aire.","s":"agita"},{"t":"Se llevan su energía, y la sopa queda más fría.","s":"agita"},{"t":"Al soplar, quitas el vapor de encima.","s":"agita"},{"t":"Y escapan más."},{"t":"Por ejemplo, sales de la alberca y sientes frío."},{"t":"El agua se evapora, llevándose tu calor."},{"t":"Otro ejemplo: el sudor."},{"t":"Así se enfría tu cuerpo."},{"t":"Las partículas más rápidas escapan, y lo que queda se enfría."}]},{"id":"aislantes","t":"Termos y aislantes","res":"Un aislante hace muy lento el paso del calor.","g":[{"t":"Termos y aislantes"},{"t":"El calor siempre quiere pasar a lo frío.","s":"cuchara"},{"t":"Un aislante no lo detiene, solo lo hace más lento.","s":"cobija"},{"t":"Por ejemplo, un termo.","s":"cobija"},{"t":"Tiene vacío entre sus paredes, y casi no deja pasar calor.","s":"cobija"},{"t":"Por eso el café dura caliente.","s":"cobija"},{"t":"Otro ejemplo: una hielera."},{"t":"Guarda lo frío igual, porque tampoco entra calor."},{"t":"El aire quieto es muy buen aislante."},{"t":"Por eso el suéter abriga: atrapa aire."},{"t":"Un aislante hace muy lento el paso del calor."}]},{"id":"luna","t":"Por qué no cae la Luna","res":"La Luna sí cae, pero avanza tan rápido que nunca llega.","g":[{"t":"Por qué no cae la Luna"},{"t":"La Tierra jala a la Luna.","s":"astro"},{"t":"Entonces, ¿por qué no cae?","s":"astro"},{"t":"Sí cae, pero también avanza de lado.","s":"orbita_n"},{"t":"Se pasa de largo una y otra vez.","s":"orbita_n"},{"t":"Por ejemplo, gira una cubeta con agua, atada a una cuerda.","s":"astro"},{"t":"La cuerda jala, pero la cubeta sigue dando vueltas.","s":"astro"},{"t":"Otro ejemplo: una piedra lanzada muy, muy fuerte.","s":"mas_lejos"},{"t":"Su camino se curva junto con la Tierra.","s":"orbita_n"},{"t":"Cada año, la Luna se aleja unos cuatro centímetros."},{"t":"La Luna sí cae, pero avanza tan rápido que nunca llega."}]}],"mat":"f","et":"A1"},{"id":"A2","nom":"Mecánica con números","lec":[{"id":"orbitas","t":"Órbitas","res":"Una órbita es caer, sin llegar nunca al suelo.","g":[{"t":"Órbitas"},{"t":"Lanza una piedra.","s":"piedra"},{"t":"Cae.","s":"piedra"},{"t":"Lánzala más fuerte.","s":"mas_lejos"},{"t":"Cae más lejos.","s":"mas_lejos"},{"t":"Ahora imagina un cañón gigante, en una montaña.","s":"orbita_n"},{"t":"La Tierra es redonda.","s":"orbita_n"},{"t":"Con suficiente velocidad,","s":"orbita_n"},{"t":"el suelo se curva antes de que caiga.","s":"orbita_n"},{"t":"Eso es una órbita. Caer sin llegar.","s":"orbita_n"},{"t":"Por ejemplo, la Luna. Lleva miles de millones de años cayendo así.","s":"astro"},{"t":"Otro ejemplo: gira una pelota atada a un hilo.","s":"astro"},{"t":"El hilo la jala hacia ti, y ella sigue dando vueltas.","s":"astro"},{"t":"Para la Luna, ese hilo es la gravedad.","s":"astro"},{"t":"Sube el satélite."},{"tipo":"barra","b":"orbita","o":"Fíjate: mientras más lejos, más lento da la vuelta."},{"t":"Más lejos, la vuelta tarda más."},{"t":"Una órbita es caer, sin llegar nunca al suelo."}]},{"id":"tiro","t":"Tiro parabólico","res":"Lo que lanzas avanza y cae al mismo tiempo, y dibuja una curva.","g":[{"t":"Tiro parabólico"},{"t":"Lanza una pelota hacia adelante.","s":"@tiro"},{"t":"Hace dos cosas a la vez.","s":"@tiro"},{"t":"Avanza, y al mismo tiempo cae.","s":"@tiro"},{"t":"Por eso dibuja una curva.","s":"@tiro"},{"t":"Por ejemplo, el chorro de una manguera.","s":"@tiro"},{"t":"Cada gotita sale hacia adelante y va cayendo.","s":"@tiro"},{"t":"Otro ejemplo: un balón de básquet rumbo a la canasta.","s":"@tiro"},{"t":"Sube, se frena, y baja.","s":"@tiro"},{"t":"¿En qué ángulo llega más lejos?"},{"t":"Mira, con la misma fuerza, cambiando el ángulo."},{"tipo":"barra","b":"tiro","o":"Fíjate hasta dónde llega la pelota en cada ángulo."},{"t":"Muy bajo, toca el suelo pronto."},{"t":"Muy alto, solo sube y baja."},{"t":"A cuarenta y cinco grados, llega lo más lejos."},{"t":"Lo que lanzas avanza y cae al mismo tiempo, y dibuja una curva."}]},{"id":"trabajo","t":"Trabajo y potencia","res":"Potencia es qué tan rápido usas la energía.","g":[{"t":"Trabajo y potencia"},{"t":"Sube una escalera con una mochila.","s":"@trabajo"},{"t":"Levantar peso cuesta energía.","s":"@trabajo"},{"t":"A eso le llamamos trabajo.","s":"@trabajo"},{"t":"No importa si subes despacio o corriendo.","s":"@trabajo"},{"t":"La energía para subir es la misma."},{"t":"Pero correr cansa más. ¿Por qué?"},{"t":"Porque usas la energía más rápido."},{"t":"Eso es la potencia."},{"t":"Por ejemplo, un foco. Cuanta más potencia, más energía usa cada segundo."},{"t":"Se mide en watts."},{"t":"Otro ejemplo: dos personas llenan una alberca."},{"t":"Con cubeta o con bomba, es la misma agua."},{"t":"La bomba tiene más potencia, y acaba antes."},{"t":"Mira subir la misma escalera, más rápido."},{"tipo":"barra","b":"trabajo","o":"Fíjate: la misma escalera, cada vez en menos tiempo."},{"t":"Menos tiempo, más potencia."},{"t":"Potencia es qué tan rápido usas la energía."}]},{"id":"choques","t":"Momento y choques","res":"Lo que pesa más y va más rápido, es más difícil de detener.","g":[{"t":"Momento y choques"},{"t":"¿Qué es más difícil de detener?"},{"t":"¿Una bicicleta, o un camión a la misma velocidad?","s":"@choque"},{"t":"El camión, claro.","s":"@choque"},{"t":"Eso se llama momento.","s":"@choque"},{"t":"Es masa por velocidad.","s":"@choque"},{"t":"Por ejemplo, una bola de boliche contra un pino.","s":"@choque"},{"t":"El pino sale volando, y la bola casi ni se frena.","s":"@choque"},{"t":"Otro ejemplo: las canicas.","s":"@choque"},{"t":"Una canica le pega a otra igual.","s":"@choque"},{"t":"La primera se queda, y la segunda sale.","s":"@choque"},{"t":"Le pasó todo su movimiento."},{"t":"Mira una bola cada vez más pesada, chocando a una chica."},{"tipo":"barra","b":"choque","o":"Fíjate qué tan rápido sale la bolita roja."},{"t":"Más masa, más rápido sale la chica."},{"t":"En un choque, el momento total no se pierde."},{"t":"Solo se reparte."},{"t":"Lo que pesa más y va más rápido, es más difícil de detener."}]},{"id":"presion","t":"Presión","res":"La misma fuerza, en menos espacio, presiona mucho más.","g":[{"t":"Presión"},{"t":"Presión es fuerza repartida en un espacio.","s":"@presion"},{"t":"Por ejemplo, camina en la nieve con tenis.","s":"@presion"},{"t":"Te hundes.","s":"@presion"},{"t":"Con raquetas o esquís, no te hundes.","s":"@presion"},{"t":"Tu peso es igual, pero se reparte en más espacio.","s":"@presion"},{"t":"Otro ejemplo: un tacón delgado deja marca en el piso.","s":"@presion"},{"t":"Un zapato ancho, no.","s":"@presion"},{"t":"Y por eso los cuchillos cortan.","s":"@presion"},{"t":"Su filo es muy delgado, y toda la fuerza va ahí.","s":"@presion"},{"t":"Mira a la misma persona, parada en distintas cosas."},{"tipo":"barra","b":"presion","o":"Fíjate en la raya azul: si es más chica, las flechas son más fuertes."},{"t":"Menos espacio,"},{"t":"más presión."},{"t":"La misma fuerza, en menos espacio, presiona mucho más."}]},{"id":"flotar","t":"Flotar","res":"Lo que es menos denso que el agua flota. Lo más denso se hunde.","g":[{"t":"Flotar"},{"t":"Un barco de metal flota.","s":"@flota"},{"t":"Un clavo chiquito se hunde.","s":"@flota"},{"t":"¿Por qué?","s":"@flota"},{"t":"El agua empuja todo lo que metes en ella.","s":"@flota"},{"t":"Empuja tanto como pesa el agua que quitaste.","s":"@flota"},{"t":"Por ejemplo, métete a la alberca.","s":"@flota"},{"t":"Te sientes más ligero, porque el agua te empuja.","s":"@flota"},{"t":"Un barco tiene mucho aire adentro.","s":"@flota"},{"t":"Por eso, en promedio, es más ligero que el agua.","s":"@flota"},{"t":"Otro ejemplo: un corcho y una piedra del mismo tamaño.","s":"@flota"},{"t":"El corcho pesa poco, y flota.","s":"@flota"},{"t":"La piedra pesa más que su agua, y se hunde.","s":"@flota"},{"t":"Mira qué pasa con distintos materiales."},{"tipo":"barra","b":"flota","o":"Fíjate si el cuadro se queda arriba o se va al fondo."},{"t":"Menos denso que el agua, flota."},{"t":"Más denso, se hunde."},{"t":"Lo que es menos denso que el agua flota. Lo más denso se hunde."}]},{"id":"energia3","t":"Energía 3: se conserva","res":"La energía total no cambia: lo que pierdes de altura lo ganas de velocidad.","g":[{"t":"Energía 3: se conserva"},{"t":"Ya vimos de dónde viene la energía.","s":"radia"},{"t":"Ahora, una regla muy importante.","s":"@rampa"},{"t":"La energía total siempre es la misma.","s":"@rampa"},{"t":"Por ejemplo, un carrito de montaña rusa.","s":"@rampa"},{"t":"Arriba, va lento, con mucha energía guardada.","s":"@rampa"},{"t":"Abajo, va rápido, con esa energía en movimiento.","s":"@rampa"},{"t":"Por eso la siguiente subida nunca es más alta que la primera.","s":"@rampa"},{"t":"Otro ejemplo: un columpio.","s":"@rampa"},{"t":"Sube, baja, sube, y se frena poco a poco por el aire.","s":"@rampa"},{"t":"Esa energía no se pierde. Se vuelve calor.","s":"calienta"},{"t":"Mira cómo se cambia de una forma a otra."},{"tipo":"barra","b":"rampa","o":"Fíjate en las barras: una baja mientras la otra sube."},{"t":"Una barra baja, la otra sube."},{"t":"La energía total no cambia: lo que pierdes de altura lo ganas de velocidad."}]},{"id":"ondas","t":"Ondas","res":"Una onda lleva energía sin llevarse el agua ni el aire.","g":[{"t":"Ondas"},{"t":"Tira una piedra a un lago.","s":"oido"},{"t":"Salen círculos.","s":"oido"},{"t":"Un barquito sube y baja, pero no se va con la ola.","s":"onda"},{"t":"La onda lleva energía, no agua.","s":"onda"},{"t":"Por ejemplo, la ola en un estadio."},{"t":"La ola da la vuelta, y la gente se queda en su asiento."},{"t":"Otro ejemplo: agita una cuerda.","s":"cuerda"},{"t":"La vibración viaja, pero la cuerda se queda ahí.","s":"cuerda"},{"t":"Luz y sonido también son ondas.","s":"agudo"},{"t":"Mira una onda cambiar."},{"tipo":"barra","b":"sonido","o":"Fíjate: la onda se aprieta cuando la nota sube."},{"t":"Una onda lleva energía sin llevarse el agua ni el aire."}]},{"id":"orbitas2","t":"Órbitas 2: más lejos, más lento","res":"Los planetas lejanos van más lento y tardan mucho más en dar la vuelta.","g":[{"t":"Órbitas 2: más lejos, más lento"},{"t":"Ya vimos que orbitar es caer sin llegar.","s":"orbita_n"},{"t":"Ahora, ¿qué pasa si estás más lejos?","s":"astro"},{"t":"Hay menos jalón, y vas más lento.","s":"astro"},{"t":"Por ejemplo, Mercurio da la vuelta al Sol en 88 días.","s":"astro","v":"Por ejemplo, Mercurio da la vuelta al Sol en ochenta y ocho días."},{"t":"Otro ejemplo: Neptuno tarda casi 165 años.","s":"astro","v":"Otro ejemplo: Neptuno tarda casi ciento sesenta y cinco años."},{"t":"Desde que se descubrió, apenas ha dado poco más de una vuelta.","s":"astro"},{"t":"Los satélites de televisión van a una altura muy especial.","s":"@orbita"},{"t":"Tardan un día, igual que la Tierra.","s":"@orbita"},{"t":"Por eso se ven siempre en el mismo punto."},{"t":"Mira subir un satélite."},{"tipo":"barra","b":"orbita","o":"Fíjate: mientras más lejos, más lento da la vuelta."},{"t":"Los planetas lejanos van más lento y tardan mucho más en dar la vuelta."}]},{"id":"mareas","t":"Mareas","res":"La Luna jala el agua del mar, y por eso sube y baja.","g":[{"t":"Mareas"},{"t":"En la playa, el mar sube y baja dos veces al día.","s":"marea"},{"t":"Lo hace la Luna.","s":"marea"},{"t":"Jala más fuerte el agua que le queda cerca.","s":"marea"},{"t":"Se forma una loma de agua.","s":"marea"},{"t":"La Tierra gira por debajo de esas lomas.","s":"marea"},{"t":"Por ejemplo, un castillo de arena en la orilla.","s":"marea"},{"t":"En unas horas, el mar lo alcanza.","s":"marea"},{"t":"Otro ejemplo: los barcos que esperan la marea alta para entrar a puerto.","s":"marea"},{"t":"En algunos lugares el mar sube más que un edificio de cuatro pisos.","s":"marea"},{"t":"La Luna jala el agua del mar, y por eso sube y baja."}]},{"id":"poleas","t":"Poleas y rampas","res":"Una rampa o una polea reparten el esfuerzo a lo largo de más camino.","g":[{"t":"Poleas y rampas"},{"t":"Sube una caja pesada a un camión.","s":"@palanca"},{"t":"Levantarla directo cuesta mucho.","s":"@palanca"},{"t":"Con una rampa, recorres más camino, pero con menos fuerza.","s":"@palanca"},{"t":"Por ejemplo, una carretera en zigzag por una montaña.","s":"@palanca"},{"t":"Es más larga, pero el carro sube sin batallar.","s":"@palanca"},{"t":"Otro ejemplo: una polea en un pozo.","s":"@palanca"},{"t":"Jalas hacia abajo, con tu propio peso.","s":"@palanca"},{"t":"No te ahorras energía. Solo la repartes mejor.","s":"calienta"},{"t":"Mira con un brazo más largo."},{"tipo":"barra","b":"palanca","o":"Fíjate: con el brazo más largo, la fuerza que necesitas baja."},{"t":"Una rampa o una polea reparten el esfuerzo a lo largo de más camino."}]},{"id":"bernoulli","t":"Cómo vuelan los aviones","res":"El ala empuja el aire hacia abajo, y el aire empuja el ala hacia arriba.","g":[{"t":"Cómo vuelan los aviones"},{"t":"Un avión pesa muchísimo.","s":"ala"},{"t":"¿Cómo se queda en el aire?","s":"ala"},{"t":"Sus alas empujan el aire hacia abajo.","s":"ala"},{"t":"Y el aire empuja al ala hacia arriba.","s":"ala"},{"t":"Por ejemplo, saca la mano por la ventana del carro.","s":"ala"},{"t":"Inclínala, y sientes que sube.","s":"ala"},{"t":"Otro ejemplo: una cometa.","s":"ala"},{"t":"Si el viento le pega de lado, se eleva.","s":"ala"},{"t":"Por eso un avión necesita correr por la pista.","s":"ala"},{"t":"Sin velocidad, el aire no lo sostiene."},{"t":"El ala empuja el aire hacia abajo, y el aire empuja el ala hacia arriba."}]},{"id":"vectores","t":"Vectores","res":"Una flecha dice cuánto y hacia dónde, y dos flechas se pueden sumar.","g":[{"t":"Vectores"},{"t":"Dos personas jalan una caja.","s":"@vector"},{"t":"Una hacia el norte, otra hacia el este.","s":"@vector"},{"t":"La caja no va a ninguno de los dos lados.","s":"@vector"},{"t":"Se va en diagonal.","s":"@vector"},{"t":"Por eso en física usamos flechas.","s":"@vector"},{"t":"Dicen cuánto, y hacia dónde."},{"t":"Por ejemplo, nadar cruzando un río.","s":"@vector"},{"t":"La corriente te lleva, y sales río abajo.","s":"@vector"},{"t":"Otro ejemplo: un avión con viento de lado."},{"t":"Tiene que apuntar un poco en contra para llegar derecho."},{"t":"Mira cambiar el ángulo entre las flechas."},{"tipo":"barra","b":"vector","o":"Fíjate en la flecha roja: es el resultado de las dos azules."},{"t":"Una flecha dice cuánto y hacia dónde, y dos flechas se pueden sumar."}]},{"id":"relativa","t":"Velocidad relativa","res":"La velocidad depende de quién la mida.","g":[{"t":"Velocidad relativa"},{"t":"Dos carros en la misma dirección, casi igual de rápido.","s":"tren"},{"t":"Entre ellos, parecen casi quietos.","s":"tren"},{"t":"Por ejemplo, dos trenes juntos en una estación.","s":"tren"},{"t":"A veces no sabes cuál de los dos arrancó.","s":"tren"},{"t":"Otro ejemplo: dos carros de frente, a cien cada uno."},{"t":"Es como si chocaran a doscientos."},{"t":"Por eso los choques de frente son tan peligrosos."},{"t":"Toda velocidad se mide respecto a algo."},{"t":"Hasta la Tierra se mueve respecto al Sol.","s":"pasado"},{"t":"La velocidad depende de quién la mida."}]},{"id":"aceleracion2","t":"Aceleración 2: frenar","res":"Frenar también es acelerar, y la distancia crece con la velocidad.","g":[{"t":"Aceleración 2: frenar"},{"t":"Ya vimos que acelerar es cambiar de velocidad.","s":"acelera"},{"t":"Frenar es acelerar hacia atrás.","s":"@energia"},{"t":"Por ejemplo, un carro que frena fuerte.","s":"@energia"},{"t":"Te vas hacia adelante, por tu inercia.","s":"frenazo"},{"t":"Otro ejemplo: un elevador."},{"t":"Al arrancar hacia arriba te sientes pesado."},{"t":"Al frenar arriba, más ligero."},{"t":"Tu cuerpo siente la aceleración, no la velocidad."},{"t":"Mira frenar un carro."},{"tipo":"barra","b":"energia","o":"Fíjate en la barra roja: es el camino que necesita para frenar."},{"t":"Frenar también es acelerar, y la distancia crece con la velocidad."}]},{"id":"segunda2","t":"Fuerza 3: la fórmula en la vida real","res":"F = m × a permite calcular cuánto acelera algo.","g":[{"t":"Fuerza 3: la fórmula en la vida real"},{"t":"Ya vimos que fuerza es masa por aceleración.","s":"fma"},{"t":"Por ejemplo, un auto de mil kilos.","s":"@fuerza"},{"t":"Si lo empujas con cien newtons, acelera muy poco.","s":"@fuerza"},{"t":"Por eso empujar un carro cuesta tanto al inicio.","s":"@fuerza"},{"t":"Otro ejemplo: un balón de un kilo.","s":"@fuerza"},{"t":"Con esos mismos cien newtons, sale volando.","s":"@fuerza"},{"t":"Un newton es como el peso de una manzana chica."},{"t":"Mira con cada objeto."},{"tipo":"barra","b":"fuerza","o":"Fíjate: la flecha es igual, pero lo pesado arranca más lento."},{"t":"F = m × a permite calcular cuánto acelera algo."}]},{"id":"calorias","t":"Trabajo 2: calorías","res":"Una caloría de comida es energía, y moverse usa mucha menos de lo que parece.","g":[{"t":"Trabajo 2: calorías"},{"t":"Ya vimos que subir escaleras usa energía.","s":"@trabajo"},{"t":"La comida guarda esa energía en calorías.","s":"@trabajo"},{"t":"Una galleta tiene más energía de la que parece.","s":"calienta"},{"t":"Por ejemplo, subir diez pisos usa menos que una galleta chica.","s":"@trabajo"},{"t":"Otro ejemplo: casi toda la energía se vuelve calor.","s":"calienta"},{"t":"Por eso sudas al hacer ejercicio.","s":"calienta"},{"t":"Tu cuerpo es como un motor: aprovecha solo una parte."},{"t":"Mira distintas velocidades de subida."},{"tipo":"barra","b":"trabajo","o":"Fíjate: la misma escalera, cada vez en menos tiempo."},{"t":"Una caloría de comida es energía, y moverse usa mucha menos de lo que parece."}]},{"id":"engranes","t":"Engranes y marchas","res":"Los engranes cambian fuerza por velocidad.","g":[{"t":"Engranes y marchas"},{"t":"Un engrane grande mueve a uno chico.","s":"@engrane"},{"t":"El chico da muchas más vueltas.","s":"@engrane"},{"t":"Pero hace menos fuerza.","s":"@engrane"},{"t":"Por ejemplo, las velocidades de una bici.","s":"@engrane"},{"t":"En una subida usas una marcha suave.","s":"@engrane"},{"t":"Pedaleas mucho, pero con poca fuerza.","s":"@engrane"},{"t":"Otro ejemplo: un reloj de manecillas.","s":"@engrane"},{"t":"Sus engranes hacen que una gire doce veces más que otra.","s":"@engrane"},{"t":"Mira cambiar el tamaño."},{"tipo":"barra","b":"engrane","o":"Fíjate: con un engrane más chico, da más vueltas."},{"t":"Los engranes cambian fuerza por velocidad."}]},{"id":"centrifuga","t":"Girar","res":"Al girar, algo debe jalarte hacia el centro o saldrías derecho.","g":[{"t":"Girar"},{"t":"En una curva, tu cuerpo se va hacia afuera.","s":"curva"},{"t":"Lo que pasa es que quieres seguir derecho.","s":"curva"},{"t":"El carro te empuja hacia adentro.","s":"@giro"},{"t":"Por ejemplo, una lavadora.","s":"@giro"},{"t":"Gira rapidísimo, y el agua sale por los hoyitos.","s":"@giro"},{"t":"Otro ejemplo: juegos mecánicos que dan vueltas.","s":"@giro"},{"t":"Sientes que algo te pega al asiento.","s":"@giro"},{"t":"Con el doble de velocidad, se necesita cuatro veces más jalón."},{"t":"Mira girar más rápido."},{"tipo":"barra","b":"giro","o":"Fíjate cómo crece la flecha que te jala hacia afuera."},{"t":"Al girar, algo debe jalarte hacia el centro o saldrías derecho."}]},{"id":"arrastre","t":"El aire frena","res":"Mientras más rápido vas, muchísimo más te frena el aire.","g":[{"t":"El aire frena"},{"t":"Saca la mano por la ventana del carro.","s":"@aireres"},{"t":"A más velocidad, más empuja el aire.","s":"@aireres"},{"t":"Y crece muy rápido.","s":"@aireres"},{"t":"Por ejemplo, un ciclista de carreras se agacha.","s":"@aireres"},{"t":"Con menos área, hay menos aire que empuja.","s":"@aireres"},{"t":"Otro ejemplo: un paracaídas.","s":"terminal"},{"t":"Es enorme, justo para frenar con el aire.","s":"terminal"},{"t":"Por eso correr en carretera gasta tanta gasolina."},{"t":"Mira ir más rápido."},{"tipo":"barra","b":"aireres","o":"Fíjate cómo crece la flecha del aire con la velocidad."},{"t":"Mientras más rápido vas, muchísimo más te frena el aire."}]},{"id":"hidraulica","t":"Gatos hidráulicos","res":"Un líquido transmite la presión, y con poca fuerza se levanta mucho.","g":[{"t":"Gatos hidráulicos"},{"t":"Un líquido casi no se puede apretar.","s":"@prensa"},{"t":"Si lo empujas de un lado, empuja del otro.","s":"@prensa"},{"t":"Por ejemplo, un gato de taller.","s":"@prensa"},{"t":"Con tu brazo, levantas un carro.","s":"@prensa"},{"t":"Tu pistón es chico, el otro es grande.","s":"@prensa"},{"t":"La misma presión en más área da más fuerza.","s":"@prensa"},{"t":"Otro ejemplo: los frenos de un carro.","s":"@prensa"},{"t":"Tu pie aprieta poquito, y frena toneladas.","s":"@prensa"},{"t":"Mira con un émbolo cada vez mayor."},{"tipo":"barra","b":"prensa","o":"Fíjate: un émbolo más grande levanta mucho más."},{"t":"Un líquido transmite la presión, y con poca fuerza se levanta mucho."}]},{"id":"profundo","t":"Bajo el agua","res":"Mientras más bajas, más agua tienes encima y más te aprieta.","g":[{"t":"Bajo el agua"},{"t":"En una alberca, al bajar, te duelen los oídos.","s":"@profund"},{"t":"Tienes más agua encima, empujando.","s":"@profund"},{"t":"Cada diez metros, se suma como otra atmósfera.","s":"@profund"},{"t":"Por ejemplo, un submarino necesita paredes gruesísimas.","s":"@profund"},{"t":"Otro ejemplo: una lata vacía en el fondo del mar.","s":"@profund"},{"t":"Se aplasta sola.","s":"@profund"},{"t":"Y los peces de lo profundo aguantan, porque por dentro empujan igual.","s":"@profund"},{"t":"Mira bajar."},{"tipo":"barra","b":"profund","o":"Fíjate cuánto aprieta el agua al bajar."},{"t":"Mientras más bajas, más agua tienes encima y más te aprieta."}]},{"id":"globos","t":"Globos de aire caliente","res":"El aire caliente es más ligero, y por eso sube.","g":[{"t":"Globos de aire caliente"},{"t":"Calienta aire, y sus partículas se separan.","s":"agita"},{"t":"Hay menos masa en el mismo espacio.","s":"@globo"},{"t":"Es menos denso, y flota en el aire frío.","s":"@globo"},{"t":"Por ejemplo, un globo de Cantoya.","s":"@globo"},{"t":"La llama calienta el aire de adentro, y sube.","s":"@globo"},{"t":"Otro ejemplo: el humo de una fogata.","s":"olla"},{"t":"Sube, porque el aire está caliente.","s":"olla"},{"t":"Para bajar, dejan enfriar el aire.","s":"@globo"},{"t":"Mira con más temperatura."},{"tipo":"barra","b":"globo","o":"Fíjate: con el aire más caliente, el globo sube más."},{"t":"El aire caliente es más ligero, y por eso sube."}]},{"id":"patinador","t":"El truco del patinador","res":"Al acercar los brazos, un cuerpo que gira gira más rápido.","g":[{"t":"El truco del patinador"},{"t":"Una patinadora gira con los brazos abiertos.","s":"@patin"},{"t":"Los cierra, y gira mucho más rápido.","s":"@patin"},{"t":"Nadie la empujó.","s":"@patin"},{"t":"Se conserva algo llamado momento angular.","s":"@patin"},{"t":"Por ejemplo, siéntate en una silla que gira.","s":"@patin"},{"t":"Abre los brazos, y luego ciérralos.","s":"@patin"},{"t":"Otro ejemplo: un gato al caer.","s":"@patin"},{"t":"Gira su cuerpo en el aire, y cae de pie.","s":"@patin"},{"t":"Mira cerrar los brazos."},{"tipo":"barra","b":"patin","o":"Fíjate: al cerrar los brazos, gira más rápido."},{"t":"Al acercar los brazos, un cuerpo que gira gira más rápido."}]},{"id":"bici","t":"Por qué no se cae una bici","res":"Moverse y girar el manubrio mantiene la bici debajo de ti.","g":[{"t":"Por qué no se cae una bici"},{"t":"Una bici parada se cae.","s":"friccion"},{"t":"En movimiento, casi no se cae.","s":"sigue"},{"t":"Cuando se inclina, el manubrio gira hacia ese lado.","s":"curva"},{"t":"Y las ruedas vuelven a quedar bajo tu cuerpo.","s":"curva"},{"t":"Por ejemplo, una moneda rodando se mantiene de pie.","s":"sigue"},{"t":"Cuando se detiene, cae.","s":"frena"},{"t":"Otro ejemplo: un trompo.","s":"@patin"},{"t":"Mientras gira, no se cae.","s":"@patin"},{"t":"Por eso es más fácil equilibrarse yendo rápido."},{"t":"Moverse y girar el manubrio mantiene la bici debajo de ti."}]},{"id":"tiro2","t":"Tiro 2: el aire cambia todo","res":"En la vida real, el aire frena y acorta los tiros.","g":[{"t":"Tiro 2: el aire cambia todo"},{"t":"Ya vimos la curva de un tiro.","s":"@tiro"},{"t":"Sin aire, cuarenta y cinco grados es lo mejor.","s":"@tiro"},{"t":"Con aire, la pelota se frena.","s":"@aireres"},{"t":"Por ejemplo, un tiro de golf.","s":"@tiro"},{"t":"Va con mucho efecto, y sigue en el aire más tiempo.","s":"@tiro"},{"t":"Otro ejemplo: un balón de fútbol con efecto.","s":"curva"},{"t":"Gira, y el aire lo desvía en curva.","s":"curva"},{"t":"Mira otra vez el ángulo."},{"tipo":"barra","b":"tiro","o":"Fíjate hasta dónde llega la pelota en cada ángulo."},{"t":"En la vida real, el aire frena y acorta los tiros."}]},{"id":"paracaidas","t":"Caída 3: el paracaídas","res":"El aire crece con la velocidad hasta igualar el peso.","g":[{"t":"Caída 3: el paracaídas"},{"t":"Ya vimos que el aire pone un límite.","s":"terminal"},{"t":"Un paracaidista cae a unos doscientos kilómetros por hora.","s":"terminal"},{"t":"Abre el paracaídas, y tiene mucha más área.","s":"@aireres"},{"t":"El aire lo frena de golpe.","s":"@aireres"},{"t":"Baja a unos veinte.","s":"terminal"},{"t":"Por ejemplo, un dron cae suave si abre un paracaídas chico.","s":"terminal"},{"t":"Otro ejemplo: una hoja cae despacio.","s":"aire"},{"t":"Su forma atrapa mucho aire.","s":"aire"},{"t":"Mira a distintas velocidades."},{"tipo":"barra","b":"aireres","o":"Fíjate cómo crece la flecha del aire con la velocidad."},{"t":"El aire crece con la velocidad hasta igualar el peso."}]},{"id":"eficiencia","t":"Energía 4: lo que se pierde","res":"Ninguna máquina aprovecha toda la energía: siempre se pierde algo como calor.","g":[{"t":"Energía 4: lo que se pierde"},{"t":"Ya vimos que la energía se conserva.","s":"@rampa"},{"t":"Pero no toda se aprovecha.","s":"calienta"},{"t":"Por ejemplo, un foco antiguo.","s":"@watts"},{"t":"Casi toda su energía salía como calor.","s":"@watts"},{"t":"Un foco LED da la misma luz con mucho menos.","s":"@watts"},{"t":"Otro ejemplo: un carro de gasolina.","s":"@maquina"},{"t":"Aprovecha cerca de una cuarta parte.","s":"@maquina"},{"t":"Lo demás se va por el escape y el radiador.","s":"@maquina"},{"t":"Por eso cuidar la energía importa."},{"t":"Ninguna máquina aprovecha toda la energía: siempre se pierde algo como calor."}]},{"id":"momento2","t":"Choques 2: retroceso","res":"Lo que lanzas te empuja de regreso, porque el momento se conserva.","g":[{"t":"Choques 2: retroceso"},{"t":"Ya vimos el momento en los choques.","s":"@choque"},{"t":"Súbete a un patín y lanza una pelota.","s":"@choque"},{"t":"Tú retrocedes.","s":"@choque"},{"t":"Por ejemplo, un globo que suelta el aire.","s":"cohete"},{"t":"El aire sale hacia atrás, y el globo sale hacia adelante.","s":"cohete"},{"t":"Otro ejemplo: una manguera con mucha presión.","s":"cohete"},{"t":"Te empuja hacia atrás, por eso se sacude sola.","s":"cohete"},{"t":"Mira un choque."},{"tipo":"barra","b":"choque","o":"Fíjate qué tan rápido sale la bolita roja."},{"t":"Lo que lanzas te empuja de regreso, porque el momento se conserva."}]},{"id":"mareas2","t":"Mareas 2: frenando a la Tierra","res":"Las mareas frenan muy poco a poco el giro de la Tierra.","g":[{"t":"Mareas 2: frenando a la Tierra"},{"t":"Ya vimos que la Luna jala el mar.","s":"marea"},{"t":"Esa agua roza contra el fondo.","s":"marea"},{"t":"Y eso frena muy poco a poco a la Tierra.","s":"marea"},{"t":"Por ejemplo, un carro con los frenos apenas rozando.","s":"friccion"},{"t":"Los días eran más cortos hace millones de años.","s":"reloj"},{"t":"Otro ejemplo: por eso vemos siempre la misma cara de la Luna.","s":"@fases"},{"t":"Ella ya se frenó por lo mismo.","s":"@fases"},{"t":"Y la Luna se sigue alejando un poquito."},{"t":"Las mareas frenan muy poco a poco el giro de la Tierra."}]},{"id":"presion2","t":"Presión 2: agua en tu casa","res":"El agua sale con más presión si el tinaco está más alto.","g":[{"t":"Presión 2: agua en tu casa"},{"t":"Ya vimos la presión del agua.","s":"@profund"},{"t":"Por eso los tinacos están en la azotea.","s":"@profund"},{"t":"La altura del agua da la presión en la llave.","s":"@profund"},{"t":"Por ejemplo, un tinaco muy bajo.","s":"@profund"},{"t":"La regadera sale débil.","s":"@profund"},{"t":"Otro ejemplo: una torre de agua en un pueblo.","s":"@profund"},{"t":"Es alta, para llegar a todas las casas.","s":"@profund"},{"t":"Mira bajar por el agua."},{"tipo":"barra","b":"profund","o":"Fíjate cuánto aprieta el agua al bajar."},{"t":"El agua sale con más presión si el tinaco está más alto."}]},{"id":"sobrevuelo","t":"Vuelo 2: los pájaros","res":"Las aves empujan el aire con las alas y aprovechan corrientes calientes.","g":[{"t":"Vuelo 2: los pájaros"},{"t":"Ya vimos cómo empuja un ala al aire.","s":"ala"},{"t":"Las aves baten hacia abajo para subir.","s":"ala"},{"t":"Y también planean, sin moverlas.","s":"ala"},{"t":"Por ejemplo, un zopilote dando vueltas sin aletear.","s":"@globo"},{"t":"Aprovecha aire caliente que sube.","s":"@globo"},{"t":"Otro ejemplo: un colibrí.","s":"ala"},{"t":"Bate las alas tan rápido que se queda en un punto.","s":"ala"},{"t":"Y hasta puede volar hacia atrás.","s":"ala"},{"t":"Las aves empujan el aire con las alas y aprovechan corrientes calientes."}]},{"id":"ruedas2","t":"Rozamiento 3: curvas y llantas","res":"Las llantas giran gracias a la fricción con el suelo, y sin ella derrapan.","g":[{"t":"Rozamiento 3: curvas y llantas"},{"t":"Ya vimos que la fricción frena.","s":"friccion"},{"t":"También te permite dar vuelta.","s":"curva"},{"t":"Las llantas empujan el piso de lado.","s":"curva"},{"t":"Por ejemplo, un carro en una curva con hielo.","s":"@inercia"},{"t":"Sigue derecho, porque no hay fricción.","s":"@inercia"},{"t":"Otro ejemplo: las curvas de una pista de carreras.","s":"curva"},{"t":"Están inclinadas para ayudar a dar la vuelta.","s":"curva"},{"t":"Las llantas lisas aguantan menos, sobre todo con agua."},{"t":"Mira los pisos otra vez."},{"tipo":"barra","b":"inercia","o":"Fíjate hasta dónde llega el disco en cada piso."},{"t":"Las llantas giran gracias a la fricción con el suelo, y sin ella derrapan."}]},{"id":"elevador","t":"El elevador","res":"Tu peso parece cambiar cuando un elevador acelera.","g":[{"t":"El elevador"},{"t":"Súbete a una báscula, dentro de un elevador.","s":"jalon"},{"t":"Al subir de golpe, marca más.","s":"jalon"},{"t":"Al frenar arriba, marca menos.","s":"jalon"},{"t":"Si cayera libre, marcaría cero.","s":"astro"},{"t":"Por ejemplo, un juego mecánico que te deja caer.","s":"astro"},{"t":"Sientes que flotas.","s":"astro"},{"t":"Otro ejemplo: los astronautas al despegar.","s":"cohete"},{"t":"Se sienten varias veces más pesados.","s":"cohete"},{"t":"Tu peso real es el mismo, lo que cambia es lo que te sostiene."},{"t":"Tu peso parece cambiar cuando un elevador acelera."}]}],"mat":"f","et":"A2"},{"id":"B1","nom":"Electricidad y magnetismo","lec":[{"id":"corriente","t":"Corriente","res":"El voltaje empuja, la corriente fluye y la resistencia frena.","g":[{"t":"Corriente"},{"t":"Imagina una manguera."},{"t":"El voltaje es la presión del agua.","s":"circuito"},{"t":"La corriente es el agua que pasa.","s":"circuito"},{"t":"Una manguera angosta deja pasar menos.","s":"circuito"},{"t":"Eso es la resistencia.","s":"circuito"},{"t":"Por ejemplo, una pila empuja las cargas por un cable.","s":"circuito"},{"t":"Si llegan al foco, se prende.","s":"circuito"},{"t":"Otro ejemplo: un contacto de la casa empuja mucho más que una pila.","s":"circuito"},{"t":"Por eso una pila no te hace nada, y un contacto es peligroso.","s":"circuito"},{"t":"Mira cómo cambia con más voltaje."},{"tipo":"barra","b":"voltaje","o":"Fíjate en el foco y en los puntitos: van más rápido con más voltaje."},{"t":"Más voltaje,"},{"t":"más corriente."},{"t":"El voltaje empuja, la corriente fluye y la resistencia frena."}]},{"id":"carga","t":"Carga eléctrica","res":"Cargas iguales se separan. Cargas opuestas se juntan.","g":[{"t":"Carga eléctrica"},{"t":"Frota un globo en tu pelo.","s":"@carga"},{"t":"Tu pelo se levanta y se pega al globo.","s":"@carga"},{"t":"Eso es electricidad, quietecita.","s":"@carga"},{"t":"Hay dos tipos de carga: positiva y negativa.","s":"@carga"},{"t":"Iguales se separan.","s":"@carga"},{"t":"Opuestas se juntan.","s":"@carga"},{"t":"Por ejemplo, ese toque que sientes al tocar una perilla.","s":"@carga"},{"t":"Tus zapatos juntaron cargas, y saltan a la perilla.","s":"@carga"},{"t":"Otro ejemplo, muy grande: un rayo.","s":"@carga"},{"t":"Las nubes juntan tanta carga que salta hasta el suelo.","s":"@carga"},{"t":"Mira dos cargas acercándose."},{"tipo":"barra","b":"carga","o":"Fíjate: al acercarse, las flechas de fuerza crecen."},{"t":"Más cerca, mucho más fuerza."},{"t":"Si la distancia se reduce a la mitad, la fuerza es cuatro veces mayor."},{"t":"Cargas iguales se separan. Cargas opuestas se juntan."}]},{"id":"imanes","t":"Imanes","res":"Un imán jala ciertos metales y siempre tiene dos polos.","g":[{"t":"Imanes"},{"t":"Un imán tiene dos lados: norte y sur.","s":"@iman"},{"t":"Polos iguales se empujan.","s":"@iman"},{"t":"Polos opuestos se jalan.","s":"@iman"},{"t":"Por ejemplo, los imanes del refri.","s":"@iman"},{"t":"Se pegan al metal, sin pegamento.","s":"@iman"},{"t":"Otro ejemplo: una brújula.","s":"@iman"},{"t":"Su aguja es un imancito.","s":"@iman"},{"t":"La Tierra misma es como un imán gigante, y la jala.","s":"@iman"},{"t":"Por eso la aguja apunta al norte.","s":"@iman"},{"t":"Parte un imán a la mitad.","s":"@iman"},{"t":"Tienes dos imanes, cada uno con norte y sur.","s":"@iman"},{"t":"Mira un clip acercándose."},{"tipo":"barra","b":"iman","o":"Fíjate: cerca del imán, la flecha roja crece mucho."},{"t":"Muy cerca, el jalón crece muchísimo."},{"t":"Un imán jala ciertos metales y siempre tiene dos polos."}]},{"id":"induccion","t":"Inducción","res":"Mover un imán cerca de un cable produce electricidad.","g":[{"t":"Inducción"},{"t":"Ten un cable enrollado, y un imán.","s":"@induccion"},{"t":"Mete y saca el imán.","s":"@induccion"},{"t":"Por el cable pasa electricidad.","s":"@induccion"},{"t":"Pero solo mientras se mueve.","s":"@induccion"},{"t":"Quieto, no pasa nada.","s":"@induccion"},{"t":"Por ejemplo, la lámpara de manivela.","s":"@induccion"},{"t":"Le das vueltas, y prende, sin pilas.","s":"@induccion"},{"t":"Otro ejemplo: las presas.","s":"@induccion"},{"t":"El agua hace girar imanes enormes.","s":"@induccion"},{"t":"Y de ahí sale la luz de tu casa.","s":"@induccion"},{"t":"Mira el imán moverse más rápido."},{"tipo":"barra","b":"induccion","o":"Fíjate en el foco: brilla más si el imán se mueve más rápido."},{"t":"Más rápido,"},{"t":"más electricidad."},{"t":"Mover un imán cerca de un cable produce electricidad."}]},{"id":"serie","t":"Circuitos","res":"Si conectas focos uno tras otro, se reparten el voltaje.","g":[{"t":"Circuitos"},{"t":"Un circuito es un camino cerrado.","s":"circuito"},{"t":"Si se corta, deja de pasar la corriente.","s":"circuito"},{"t":"Por eso un apagador prende y apaga.","s":"circuito"},{"t":"Solo abre o cierra el camino.","s":"circuito"},{"t":"Conecta focos uno tras otro.","s":"@serie"},{"t":"Se tienen que repartir la pila.","s":"@serie"},{"t":"Por ejemplo, las series de Navidad antiguas.","s":"@serie"},{"t":"Se fundía un foquito, y se apagaban todos.","s":"@serie"},{"t":"Otro ejemplo: tu casa.","s":"@serie"},{"t":"Cada aparato tiene su propio camino.","s":"@serie"},{"t":"Por eso puedes apagar uno, y los demás siguen.","s":"@serie"},{"t":"Mira cuántos focos enciende una pila."},{"tipo":"barra","b":"serie","o":"Fíjate: más focos en la misma pila, y cada uno brilla menos."},{"t":"Más focos en fila,"},{"t":"menos brilla cada uno."},{"t":"Si conectas focos uno tras otro, se reparten el voltaje."}]},{"id":"motor","t":"Motores","res":"Un motor usa electricidad e imanes para hacer girar algo.","g":[{"t":"Motores"},{"t":"La electricidad también crea magnetismo.","s":"@motor"},{"t":"Un cable con corriente se vuelve un imán.","s":"@motor"},{"t":"Si lo pones cerca de otro imán, se empujan.","s":"@motor"},{"t":"Y puede empezar a girar.","s":"@motor"},{"t":"Eso es un motor.","s":"@motor"},{"t":"Por ejemplo, un ventilador.","s":"@motor"},{"t":"Le llega corriente, y sus aspas dan vueltas.","s":"@motor"},{"t":"Otro ejemplo: un carrito de juguete con pila.","s":"@motor"},{"t":"Es lo mismo, pero chiquito.","s":"@motor"},{"t":"Mira con más voltaje."},{"tipo":"barra","b":"motor","o":"Fíjate: con más voltaje, las aspas giran más rápido."},{"t":"Más voltaje,"},{"t":"gira más rápido."},{"t":"Un motor al revés es un generador."},{"t":"Giras tú, y sale electricidad."},{"t":"Un motor usa electricidad e imanes para hacer girar algo."}]},{"id":"watts","t":"Corriente 2: el recibo de luz","res":"Lo que pagas es potencia por tiempo, los kilowatts hora.","g":[{"t":"Corriente 2: el recibo de luz"},{"t":"Ya vimos voltaje y corriente.","s":"circuito"},{"t":"Ahora, ¿qué es lo que te cobran?","s":"@watts"},{"t":"Te cobran energía: potencia por tiempo.","s":"@watts"},{"t":"Por ejemplo, un foco LED de 10 watts, prendido toda la noche.","s":"@watts","v":"Por ejemplo, un foco LED de diez watts, prendido toda la noche."},{"t":"Casi no se nota en el re
